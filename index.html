],2,""],["Where did the Y.M.C.A. start in 1844?",["England","America","Germany","Scotland"],0,"QP 2025"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Which is the oldest tradition in the Pentateuch?","o":["The Elohist (E) tradition","The Priestly (P) tradition","The Deuteronomic (D) tradition","The Yahwist (J) tradition"],"a":3},{"q":"Which is the biggest book in the Holy Bible?","o":["Proverbs","Psalms","Genesis","Isaiah"],"a":1},{"q":"In the Jewish Holy Bible, the Book of Ecclesiastes is named","o":["Ketuvim","Kohalath (Qoheleth)","Torah","Mishnah"],"a":1},{"q":"Which is the longest letter written by St. Paul?","o":["1 Corinthians","Hebrews","Galatians","Romans"],"a":3},{"q":"Which beautiful city in Macedonia is now known as Salonika?","o":["Corinth","Antioch","Thessalonica","Ephesus"],"a":2},{"q":"On which island was St. John when he was shown the revelation?","o":["Malta","Crete","Cyprus","Padmos"],"a":3},{"q":"Which is the highest order (choir) of angels?","o":["Seraphim","Archangels","Cherubim","Thrones"],"a":0},{"q":"In which year was the Edict of Milan proclaimed?","o":["A.D. 451","A.D. 325","A.D. 381","A.D. 313"],"a":3},{"q":"Which missionaries laid the foundation of the Ethiopian Church?","o":["St. Thaddeus and St. Bartholomew","Frumentius and Edesius","Mark and Peter","Paul and Silas"],"a":1},{"q":"In 1948, the first World Council of Churches meeting was held at","o":["London","Geneva","Amsterdam","New Delhi"],"a":2}],"name":[{"q":"The tradition of the Pentateuch that refers to God as 'Elohim'","a":"The Elohist (E) tradition"},{"q":"The pious widow who killed Holofernes, the enemy captain","a":"Judith"},{"q":"The smallest letter written by St. Paul","a":"The letter to Philemon"},{"q":"To whom was the Letter to the Hebrews written?","a":"The Jewish Christians in Palestine"},{"q":"The apostle known as the 'Apostle of Love'","a":"St. John"},{"q":"The prophet who said that those with impure lips are not holy","a":"Prophet Isaiah"},{"q":"The nation to which the Old Testament church belonged","a":"Israel"},{"q":"The place where the followers of Jesus Christ were called Christians for the first time","a":"Antioch"},{"q":"The language used in the liturgy of the Church of Egypt, which gives the Church its name","a":"Coptic"},{"q":"The first country to accept Christianity as its official religion","a":"Armenia"}],"tf":[{"q":"The Psalms are prayer songs that came out of the life of the people of Israel.","a":true},{"q":"In the Song of Songs, the bride is from Egypt.","a":false},{"q":"Tobias was a member of the tribe of Judah.","a":false},{"q":"St. Paul is the one who used the word 'gospel' the most number of times in the New Testament.","a":true},{"q":"Timothy was the son of a Jewish father and a Greek mother.","a":false},{"q":"St. John was exiled to Padmos during the reign of Emperor Nero.","a":false},{"q":"The New Testament church was established by Jesus Christ and nurtured by the apostles.","a":true},{"q":"Angels are heavenly beings who have no death once they are created.","a":true},{"q":"Our Church accepts the decisions of the Council of Chalcedon.","a":false},{"q":"Saturday is the Sabbath day for the Ethiopian Church.","a":true}],"fill":[{"q":"It took some ______ years to collect, arrange and compile the traditions into the books now known as the Pentateuch.","a":"500"},{"q":"In Malayalam, the Book of Ecclesiastes is known as ______.","a":"Sabhaprasangi"},{"q":"St. Paul sent the letter to the Romans through ______, a deaconess of the church.","a":"Phoebe"},{"q":"The church in ______ is the first church established by St. Paul in Europe.","a":"Philippi"},{"q":"The first epistle of St. Peter was written by ______ along with Mark, as directed by St. Peter.","a":"Silvanus (Sylvanos)"},{"q":"The third letter of St. John is addressed to a person called ______.","a":"Gaius (Gaos)"},{"q":"______ feared John the Baptist, knowing that he was a righteous and holy man.","a":"Herod"},{"q":"During a war, Constantine saw the sign of the cross in the sky while crossing the ______ Bridge.","a":"Milvian"},{"q":"Unlike our Church, the Coptic Church celebrates Christmas on ______.","a":"January 7th"},{"q":"The English word 'ecumenical' comes from the Greek word ______.","a":"oikoumenikos"}],"match":{"l":["Psalm 90","Kedar","Baruch","Onesimus","Melchizedek","Kyria","Raphael","Tome","Caliph Abdul Malik","Catholic"],"r":["Banned the Coptic language","Universal","Greek word for 'Lady'","Assistant of Jeremiah","Slave of Philemon","Prayer of Moses","A place in the Song of Songs","Pope Leo","Order of Christ's priesthood","Angel in the Book of Tobit"],"key":[5,6,3,4,8,2,9,7,0,1]},"who":[{"q":"\"Upon this rock I will build my church; and the gates of hell shall not prevail against it.\"","a":"Jesus to St. Peter – said at Caesarea Philippi after Peter, on behalf of all the disciples, confessed Jesus as the Son of the living God (St. Matthew 16:18).","ref":"Class X textbook, Lesson 20 – The Holy Church"},{"q":"\"Go from your country and your kindred and your father's house to the land that I will show you.\"","a":"The Lord (God) to Abraham – God's call to Abraham, promising to make him a great nation and a blessing to others (Genesis 12:1-3).","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"\"Rejoice in the Lord always; again I will say, Rejoice.\"","a":"St. Paul to the Philippians (the church at Philippi) – written from prison in Rome; the words 'joy' and 'rejoice' are repeated many times in this letter (Philippians 4:4).","ref":"Class X textbook, Lesson 10 – Letters from Prison"}],"short":[{"q":"What is a 'doublet' in the Pentateuch? Give one example.","a":"A doublet is the repetition of the same incident in more than one tradition of the Pentateuch; the accounts vary in style and presentation but not in the central idea. Example: the flight of Hagar is told in Genesis 16 and again in Genesis 21:8-21, where she flees with her son.","ref":"Class X textbook, Lesson 1 – Compilation of the Pentateuch"},{"q":"What are the Catholic (Universal) letters? Who wrote them?","a":"The 7 epistles of the New Testament not written by St. Paul are not written to a particular place or person but to the Church in general, so they are called Catholic or Universal epistles. They were written by St. James, St. Peter, St. John and St. Jude.","ref":"Class X textbook, Lesson 13 – Universal Epistles"},{"q":"What are the services of angels to the faithful, as shown in the Holy Bible?","a":"Angels guide the faithful in the right path – God sent his angel before Abraham's servant to find a wife for Isaac (Gen 24:7). They safeguard the faithful (Ps 34:7) and release them from danger, as the angel closed the mouths of the lions for Daniel (Dan 6:22). They also appear to encourage, as the angel stood by St. Paul (Acts 27:23-24).","ref":"Class X textbook, Lesson 19 – Angels"},{"q":"What is the significance of 'Sleeba Perunnal'?","a":"Under the leadership of Queen Helena, mother of Emperor Constantine, a group of people went to Jerusalem, searched for the cross on which Jesus Christ was crucified and found it. The Church commemorates this event on September 14th as 'Sleeba Perunnal'.","ref":"Class X textbook, Lesson 21 – The Early Christian Church"}],"para":[{"q":"What are the four different interpretations (view points) of the Book of Revelation? Explain them briefly.","a":"For centuries the Book of Revelation has been interpreted in four different ways; Preterist view: all the prophecies are already fulfilled, St. John wrote to give courage to those persecuted in the Roman empire; Futurist view: the prophecies are not yet fulfilled, they are still to be fulfilled; Historic view: the book gives a historic account from the period of St. John to the advent of Christ and what followed; Idealist view: it has nothing to do with reality or history, it is an allegory of the conflict between good and evil; Each school has many followers, but none of them alone is sufficient to interpret the book","ref":"Class X textbook, Lesson 15 – The Book of Revelation"},{"q":"Write your understanding of the Holy Trinity with examples.","a":"We believe in one true God in three persons (Knumos) – the Father, the Son and the Holy Spirit; The three are equal in every respect – none is bigger or smaller, more or less powerful – with the same nature and essence; It is a mysterious union beyond the human mind, it can be understood only by faith; Example: in an equilateral triangle (3 cm each side) no side is longer or shorter; When we say 'Father', the Son and the Holy Spirit are also understood, we cannot single out one of the three; The word 'Trinity' is not in the Bible, but it is indicated – 'Let us make man in our image' (Genesis 1:26), baptising 'in the name of the Father, and of the Son, and of the Holy Ghost' (St. Matthew 28:19), and the baptism of Jesus (St. Matthew 3:16-17)","ref":"Class X textbook, Lesson 17 – Trinity"},{"q":"Explain the spiritual dimension of the Song of Songs.","a":"In the Old Testament, Israel is depicted as the bride of the Lord (Hosea 2:19-20); The book describes the bride's intense desire to be one with her beloved, and the obstacles, torments and temptations she faces; If she is faithful and true in love, she will overcome all obstacles and be united with him forever; Likewise the Church is the most beautiful and chaste bride of Christ, she belongs to him and to him only; She should wait prayerfully for her beloved, keeping herself chaste and resisting all temptations; The bride and bridegroom represent the Church and Christ, so the book exhorts believers to remain pure and faithful","ref":"Class X textbook, Lesson 5 – Song of Songs"},{"q":"What were the heretical teachings of Arius and Macedonius? How did the Church reject them?","a":"Arius denied the divinity of Jesus Christ; His heresy was declared accursed at the first ecumenical council at Nicaea (A.D. 325), convened by Emperor Constantine, attended by 318 bishops, with Mar Osthathevos of Antioch presiding; Nicaea taught that God the Father and God the Son are of the same essence; Macedonius, bishop of Constantinople, taught that the Holy Spirit was not equal to the Father and the Son; The second council at Constantinople (A.D. 381), convened by Emperor Theodosius and presided by Mar Milithios (later St. Nectarius), rejected this heresy; The true faith about the Holy Spirit was added to the Nicene Creed","ref":"Class X textbook, Lesson 21 – The Early Christian Church"}],"essay":[{"q":"The Dayara movement in the Syrian Orthodox Church","a":"The Dayara (monastery) movement existed in the Syrian Orthodox Church at least from the 3rd century, dayaras were centres of spirituality, knowledge and service; Dayara of Mor Mathai near Mosul (Iraq), founded in the 4th century, was a famous centre of learning, Bar Hebraya lived there and wrote many books, and from the 10th century it was the headquarters of the Maphriyanos; Most books of its famous library are now in places like the British Library and the Vatican library; Dayara of Mar Barsouma (died A.D. 457): he was the only non-Metropolitan at the Ephesus council of 449, and his name is in the 5th diptych; Our Patriarchs lived in the Dayara of Mar Barsouma till 1293, Michael the Syrian wrote church history there, the Kurds destroyed it in the 14th century; Dayara of Mar Hananiya, founded by the Metropolitan of Mardin in A.D. 800, is famous for its library, from 1293 the Patriarchs lived there, and it gave 21 Patriarchs, 9 Maphriyanos and over 110 bishops; There were also dayaras for nuns, ascetics in caves, and pillar ascetics (Destuno) – Mar Semavoon Destuno (389-459) meditated on a 60-foot pillar","ref":"Class X textbook, Lesson 23 – The Syrian Orthodox Church of Antioch"},{"q":"How do we divide the Book of Proverbs for the sake of study? Explain the divisions.","a":"Proverbs has 31 chapters and is divided into 7 parts for study; Hymns to Wisdom (1:1-9:18): wisdom is personified as a noble lady, warnings against immorality and the adulteress; Proverbs of Solomon (10:1-22:16): no common idea, many references to justice, a code of conduct for daily life, and doublets; Words of the Wise (22:17-24:22): similar to the Egyptian 'Wisdom of Amenope', teaches justice and concern for the poor; Words of the Wise, Part II (24:23-34): a life of integrity, kings should be impartial in judgement; Proverbs of Solomon written by the friends of King Hezekiah (chapter 25 onwards): moral lessons; Words of Agur son of Jakeh (chapter 30) gives moral lessons through riddles, Teachings of Lemuel (chapter 31) describes the ideal king and the ideal, clever wife","ref":"Class X textbook, Lesson 3 – Proverbs"},{"q":"How should we prepare for the second coming of Jesus Christ?","a":"The second coming (Parousia) will be sudden and unexpected, like a thief; Nobody knows the day and hour, not even the angels, the Father alone knows it; Signs: the gospel will be preached in all the world, the Antichrist will appear, and it will be as in the days of Noah; Wait anxiously for the coming of our Lord (1 Corinthians 1:7); Be prepared, for the Son of Man comes at an hour we do not expect (St. Matthew 24:44); Be active and diligent, like the faithful servants who traded with their master's money in the parable (St. Luke 19:13-27); Pray ardently for his coming – 'Even so, come, Lord Jesus' (Revelation 22:20); Watch, for we know neither the day nor the hour (St. Matthew 25:13)","ref":"Class X textbook, Lesson 16 – The Second Coming of the Lord"}]}},{"no":2,"s":{"mcq":[{"q":"Hagar, who fled from the presence of Sara, was Sara's","o":["neighbour from Canaan","sister","Egyptian house-maid","daughter-in-law"],"a":2},{"q":"The second book of Psalms is generally known as","o":["Hymns of National Interest","Songs of Ascent","Hymns of Praise","Hymns of Wisdom"],"a":0},{"q":"Thoughts and ideas found in the 'Wisdom of Amenope' are similar to which book in the Bible?","o":["Song of Songs","Psalms","Ecclesiastes","Proverbs"],"a":3},{"q":"Letters written by St. Paul while he was in prison are also called","o":["Early letters","Major letters","Captivity letters","Common letters"],"a":2},{"q":"Because it contains many pieces of advice and instruction, the epistle of St. James is called","o":["The Letter of Hope","The Song of the Church","The Proverbs of the New Testament","The Gospel of Love"],"a":2},{"q":"According to the lesson, how many persons named Jude (Judas) are found in the Holy Bible?","o":["2","3","5","7"],"a":2},{"q":"'Therefore be ye also ready, for in such an hour as ye think not the Son of Man cometh' teaches the faithful to","o":["be prepared","go to Jerusalem","pray ardently","wait anxiously"],"a":0},{"q":"'Now ye are the body of Christ, and members in particular' is from","o":["1 Corinthians 12:27","1 Peter 2:5","Colossians 1:18","Ephesians 5:30"],"a":0},{"q":"Mar Barsouma was specially invited to the Ephesus council of A.D. 449. What was special about him there?","o":["He was the only one who was not a Metropolitan","He was the youngest Patriarch","He was the president of the council","He came from Rome"],"a":0},{"q":"The land called 'Mizraim' in the Bible is","o":["Babylon","Palestine","Egypt","Ethiopia"],"a":2}],"name":[{"q":"The tradition of the Pentateuch found only in Deuteronomy (chapters 1-30)","a":"The Deuteronomic (D) tradition"},{"q":"The prophetic book in which the covenant relationship between Israel and God is compared to a marriage","a":"Hosea"},{"q":"The place where the Lamb of God offered his body as a sacrifice for the absolution of sins","a":"Calvary"},{"q":"The co-worker who went back to Thessalonica and sent St. Paul a detailed report about the church there","a":"Timothy"},{"q":"The town in Asia Minor where Timothy lived","a":"Lystra"},{"q":"The person who translated the Epistle to the Hebrews into Greek","a":"St. Luke"},{"q":"The Roman emperor during whose reign St. John was exiled to Padmos","a":"Domitian"},{"q":"The name by which the three persons in God are otherwise known","a":"Knumos"},{"q":"The person whose heresy, which denied the divinity of Jesus Christ, was declared accursed at the council of Nicaea","a":"Arius"},{"q":"The ancient language of Ethiopia used only as the language of the liturgy","a":"Geez"}],"tf":[{"q":"Psalm 4 is an evening prayer.","a":true},{"q":"The Book of Proverbs was wholly written by Solomon.","a":false},{"q":"There is no direct reference to Christ in the Book of Ecclesiastes.","a":true},{"q":"Epaphras, a disciple of St. Paul, established the church in Colossae.","a":true},{"q":"St. Paul's theology stresses the incarnation of Christ more than his passion, death and resurrection.","a":false},{"q":"The first letter of St. John is addressed to a particular individual.","a":false},{"q":"The angels Gabriel and Michael are named in the book of Daniel.","a":true},{"q":"For the gentiles, holiness meant purity of heart.","a":false},{"q":"The Y.M.C.A. started in America in 1844.","a":false},{"q":"The Armenian Orthodox Church celebrates Christmas on January 6th.","a":true}],"fill":[{"q":"The letter 'J' used for the Yahwist tradition comes from the German word ______.","a":"Jehova"},{"q":"The Protestants call the other canonical books ______ books.","a":"Apocryphal"},{"q":"St. Paul wrote both letters to the Thessalonians in A.D. ______.","a":"52"},{"q":"The letter to the Philippians does not contain even a single quotation from the ______.","a":"Old Testament"},{"q":"St. John sent the Book of Revelation to ______ churches in Asia Minor.","a":"seven"},{"q":"The coming of the Son of Man will be as it was in the days of ______.","a":"Noah"},{"q":"Mor ______, who wrote the Holy Qurbono, described the different groups of angels in his vision.","a":"Dionysius (Diamesious)"},{"q":"In 1982, a common proclamation on Christology was made by the Pope and the ______.","a":"Patriarch of Antioch"},{"q":"The Dayara of Mar Hananiya is globally famous because of its ______.","a":"library"},{"q":"A group of people called ______ dance during processions of the Ethiopian Orthodox Church.","a":"Debteras"}],"match":{"l":["Psalms 107-150","Lemuel","\"Vanity of vanities\"","Tychicus","Titus","Thubden","Equilateral triangle","Queen Helena","Cairo","Menelik I"],"r":["Consecrated bishop by St. Paul","Carried the letter to the Ephesians","Jews came with him to Ethiopia","Example of the Holy Trinity","Diptychs","Proverbs chapter 31","Finding of the Holy Cross","Fifth book of Psalms","Ecclesiastes","Headquarters of the Coptic Church"],"key":[7,5,8,1,0,4,3,6,9,2]},"who":[{"q":"\"Holy Father, keep them in thy name, which thou hast given me, that they may be one, even as we are one.\"","a":"Jesus to God the Father – from Jesus' prayer in St. John 17:11, which shows God's call to holiness being fulfilled through Christ.","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"\"Fear not, I know that you are searching for the crucified Jesus. He is not here; he has risen, as he said.\"","a":"The angel to the women at the tomb – the angel proclaimed the resurrection of Jesus (St. Matthew 28:6-7).","ref":"Class X textbook, Lesson 19 – Angels"},{"q":"\"Let no man despise thy youth; but be thou an example of the believers.\"","a":"St. Paul to Timothy – in his first epistle, Paul encourages young Timothy to be an example to the believers in word, conduct, love, faith and purity (1 Timothy 4:12).","ref":"Class X textbook, Lesson 11 – Pastoral Epistles"}],"short":[{"q":"What is 'Selah' in the Psalms?","a":"'Selah' is a word that appears 71 times in the Psalms; it is an instruction to those who sing the psalms and is not meant to be read. At the end of a verse it means either to sing loudly or to sing with musical instruments, so while reading the psalms one need not read 'Selah'.","ref":"Class X textbook, Lesson 2 – Psalms"},{"q":"How does St. Paul portray Christ in the letter to the Philippians?","a":"Christ, though equal to God, emptied himself and took the likeness of man; Paul presents him as the model of humility (2:5). In the third chapter Christ transforms our humble body into the likeness of his glorious body, and in the fourth he is the unfailing source of strength who grants us victory (4:13).","ref":"Class X textbook, Lesson 10 – Letters from Prison"},{"q":"What are the duties of the Church?","a":"The duties of the Church are proclamation of the gospel, worshipping God, spreading the true faith in the world, celebrating the Holy Sacraments (ways of receiving grace from God) and helping the poor with alms. We call these the evangelical, liturgical, doctrinal and pastoral duties.","ref":"Class X textbook, Lesson 20 – The Holy Church"},{"q":"What is the importance of Antioch in the history of the Church?","a":"The See of Antioch is the most ancient of the Patriarchal Sees; at Antioch the followers of Jesus were first called Christians, and St. Peter established his Apostolic See there. Antioch was the third biggest town of the Roman Empire, a centre of Greek culture, learning and trade, and it remained a centre of Christian culture till the Persians and Arabs destroyed it.","ref":"Class X textbook, Lesson 23 – The Syrian Orthodox Church of Antioch"}],"para":[{"q":"How will you divide the Psalms that contain references to Christ? Explain.","a":"The psalms that refer to Christ can be divided into 5 groups; Psalms with direct reference to Christ – Christ is symbolically presented, e.g. Ps 34:20, 69:9; Psalms that directly prophesy about Christ – the psalmist's own experiences are fulfilled in Christ, e.g. Ps 22:1, 22:16-18, 110:4; Psalms that figuratively tell about Christ – they seem to speak of rulers like King David but are fulfilled in the Messiah, e.g. Ps 2:1-2, 45, 72:11; Psalms that indicate the second coming – the last judgement and the new heaven and new earth, e.g. Ps 96, 98; Psalms that are fulfilled in Christ – e.g. Ps 2:6 in St. Matthew 3:17, and Ps 69:21 in St. Matthew 27:34","ref":"Class X textbook, Lesson 2 – Psalms"},{"q":"What are the six key points for Christian living given by St. Peter in his first epistle?","a":"St. Peter wrote to encourage believers who began to backslide, fearing the persecution of Emperor Nero, he reminds them the ordeals are only temporary; Be an ideal to others (2:11-12), and be submissive to authorities (2:13); Keep a noble husband–wife relationship (3:1-7); Lead a holy life, believing that suffering in the name of Christ is a blessing; Duties of the priests (5:1-4) and duties of the young men (5:5-8); Those who stand steadfast in faith, ignoring temporary ordeals, will enter eternal glory","ref":"Class X textbook, Lesson 13 – Universal Epistles"},{"q":"Write the differences between the Old Testament Church and the New Testament Church.","a":"The Church is the congregation of the redeemed faithful with Jesus Christ as the head; The Old Testament church includes all the faithful from Adam till Christ, its clear beginning is the call of Abraham, and it grew through the 12 tribes of Jacob's sons; The New Testament church was established by Jesus Christ and nurtured by the apostles; The OT church pertained to the body, but the NT church is spiritual; The OT church was only for one nation, Israel, but the NT church is for all the nations of the earth; The OT church was under the commandments and their discipline, but the NT church is joined to Christ and filled with the grace of the Holy Spirit, the OT church is the shadow, the NT church the reality","ref":"Class X textbook, Lesson 20 – The Holy Church"},{"q":"What did Nestorius and Eutyches teach about the nature of Jesus Christ? What is the faith of our Church?","a":"Nestorius, Patriarch of Constantinople, taught that Jesus had two natures and two persons – one man and one God – and that the sufferings on the cross were of the man Jesus; He also said it was wrong to call St. Mary the Mother of God, this was rejected at the council of Ephesus (A.D. 431), presided by Mar Koorilose; Eutyches taught that the human nature merges into the divine nature to become one nature, our Church has not accepted this; Our faith: the divine nature in completeness and the human nature in completeness (except sin) are inseparably united, without mixing, merging or one destroying the other – 'one nature of the incarnate Word' (Mar Koorilose); So Christ is complete God and complete man, his actions cannot be divided into human and divine – it is wrong to say his divine nature raised Lazarus and his human nature lamented on the cross","ref":"Class X textbook, Lesson 22 – The Divided Church"}],"essay":[{"q":"The Evangelical (Major) Epistles of St. Paul - Romans, Corinthians and Galatians","a":"Romans, 1 and 2 Corinthians and Galatians are called Epistles of Gospel Teaching (Major Epistles) because Paul's main aim in them is to convey the gospel message; Romans: the longest letter of St. Paul, written to a church he neither founded nor visited, written from Corinth during his third missionary journey and sent through Phoebe, a deaconess; In Romans Paul introduces himself as the apostle of the gentiles, its central idea is justification by faith – not by observing the Mosaic law, but only through Christ; 1 Corinthians: Corinth was a rich trading and university centre in Greece with much moral decay, Paul wrote after receiving a letter from Corinth brought by Stephanas and his group; It deals with divisions, immorality, lawsuits before gentile judges, food offered to idols, disorder in worship, and doubts about marriage, divorce and remarriage; 2 Corinthians: written against false teachers and sent through Titus, it explains Paul's service, the collection of alms (ch. 8-9) and his apostolic authority (ch. 10-13), ending with a blessing in the name of the Triune God; Galatians: written to the churches of Galatia against Jewish Christians who questioned Paul's authority and insisted that converts be circumcised; Paul asserts that his apostleship is from God and teaches salvation through grace and justification by faith, this freedom should produce the fruits of the Spirit","ref":"Class X textbook, Lesson 9 – Epistles of Gospel Teaching (Romans, Corinthians and Galatians)"},{"q":"The Ecumenical Movement","a":"The movement was inspired by John 17:21, 'That all of them may be one' – the prayer of the High Priest for the universal church; 'Ecumenical' comes from the Greek 'oikoumenikos', 'the whole inhabited world', its root 'oikos' means house, spiritual house, temple, by the mid-19th century it meant 'Christian fellowship worldwide'; Its aim is universal Christian unity and witness to Jesus to the ends of the earth (Acts 1:8), while respecting each church's differences in faith, liturgy and rituals; Translation of the Bible helped: the British and Foreign Bible Society (started by the Anglican Church, with half its director board from other churches) and the American Bible Society (1816); The Y.M.C.A. (1844, England), Y.W.C.A. (1872, America) and S.C.A. (1895) did not consider differences between churches and got international recognition; The first World Council of Churches meeting was held at Amsterdam in 1948 with 147 churches, all major churches except the Roman Catholic Church took part; For the first time an official independent association of churches came into existence, a meeting was held in New Delhi in 1961, a matter of pride for us","ref":"Class X textbook, Lesson 27 – The Ecumenical Movement"},{"q":"Based on the books of Tobit (Tobias) and Judith, explain the importance of fasting and prayer.","a":"Tobias, of the tribe of Naphthali, exiled to Nineveh in 721 B.C., is presented as a model of staunch faith and virtuous life; The book teaches that strong faith in God and God's blessing are essential for a blessed family life; It teaches care of parents, compassion to the poor and the dead, unshakable faith and devout, heart-broken prayer, husband and wife should pray together; God helps such people in distress – the angel Raphael helped Tobit and Tobias; Judith: Holofernes besieged Bethulia with a huge army, Judith, a pious widow, prevented the surrender of the Jews, went to his tent and killed him, and the enemy fled; The book points out that the victory was due to her fasting and prayer; It assures the faithful that God will miraculously save his people even in great difficulties; Queen Esther too said she would fast and pray for 3 days (Esther chapter 4, her prayer is in chapter 14)","ref":"Class X textbook, Lesson 6 – Other Canonical Books"}]}},{"no":3,"s":{"mcq":[{"q":"Which is the only account in Deuteronomy that belongs to the 'J' (Yahwist) tradition?","o":["The call of Abraham","The death of Moses","The crossing of the Red Sea","The giving of the Ten Commandments"],"a":1},{"q":"According to ancient tradition, who arranged the first book of Psalms?","o":["Ezra and Nehemiah","Moses","King Hezekiah","King David"],"a":3},{"q":"For the early Christians, the Song of Songs symbolised the spiritual relationship between","o":["Abraham and Sara","Moses and Israel","Christ and the Church","David and Jonathan"],"a":2},{"q":"Which major Church did not send representatives to the first World Council of Churches meeting?","o":["The Syrian Orthodox Church","The Eastern Orthodox Church","The Anglican Church","The Roman Catholic Church"],"a":3},{"q":"According to the letter to the Galatians, salvation is not based on the Mosaic law but on","o":["circumcision","offering sacrifices","keeping the Sabbath","faith"],"a":3},{"q":"Which false teaching spread in the church at Colossae?","o":["That everything was created through angels","That Christ will never come again","That there is no God","That Jesus was not a Jew"],"a":0},{"q":"The first epistle of St. Peter was written to believers who began to backslide fearing the persecution of which emperor?","o":["Marcian","Nero","Domitian","Constantine"],"a":1},{"q":"The second coming of Jesus Christ is referred to in Greek as","o":["Oikos","Parousia","Kohalath","Apocalypse"],"a":1},{"q":"Psalm 34:7 is given as an example of which service of angels to the faithful?","o":["Release","Punishment","Guidance in the right path","Safeguarding"],"a":3},{"q":"The ascetics who lived an ascetic life on high pillars were called","o":["Dyophysites","Maphriyano","Debteras","Destuno (Stylites)"],"a":3}],"name":[{"q":"The promised land 'where milk and honey flows'","a":"Canaan"},{"q":"The part of Proverbs which got its name from Proverbs 22:17","a":"The Words of the Wise"},{"q":"The Roman emperor who convened the council of Chalcedon in A.D. 451","a":"Emperor Marcian"},{"q":"What did the rich man in the parable (St. Luke 19) go to a foreign country to acquire?","a":"Kingship"},{"q":"The city in Greece where St. Paul stayed for one and a half years during his second missionary journey","a":"Corinth"},{"q":"The person who became the first Patriarch of Ethiopia in 1959","a":"Baselius"},{"q":"The Greek word, meaning 'to unveil', used in the title of the Book of Revelation","a":"Apocalypse"},{"q":"The saint who saw, in his vision, the angels worshipping God in two groups","a":"Mar Ignatius Nooroono"},{"q":"The president of the ecumenical council held at Ephesus in A.D. 431","a":"Mar Koorilose (Cyril), Patriarch of Alexandria"},{"q":"The evangelist who established the Church in Egypt as instructed by St. Peter","a":"Mark the Evangelist"}],"tf":[{"q":"The Priestly tradition starts with the history of creation.","a":true},{"q":"It is a custom among the Jews to sing the Song of Songs on the 8th day of the Passover.","a":true},{"q":"Mar Marutha was the first Maphriyano.","a":true},{"q":"The New Testament has 27 books, of which 21 are epistles.","a":true},{"q":"The name 'Pastoral Epistles' came into general use from the 1st century.","a":false},{"q":"According to the Futurist view, all the prophecies in the Book of Revelation are already fulfilled.","a":false},{"q":"According to the Holy Bible, the angels were not created by God.","a":false},{"q":"The Old Testament church was meant for all the nations of the earth.","a":false},{"q":"Eutyches taught that the human nature of Christ merges into the divine nature to become one nature.","a":true},{"q":"The Ethiopian Church celebrates Christmas on 25th December.","a":false}],"fill":[{"q":"The third book of Psalms (Psalms 73-89) has ______ psalms.","a":"17"},{"q":"The Egyptian book 'Wisdom of Amenope' is preserved in the ______.","a":"British Museum"},{"q":"Leviticus chapters 17 to ______ describe the laws regarding holiness.","a":"26"},{"q":"The Corinthian representatives who handed over the letter to St. Paul were led by ______.","a":"Stephanas"},{"q":"In Ephesians, when the church is compared to a temple, Christ is the ______.","a":"cornerstone"},{"q":"St. Peter compares the false teachers to wells without ______ and clouds driven by a hurricane.","a":"water"},{"q":"According to 1 Thessalonians 4:16, the ______ in Christ shall rise first.","a":"dead"},{"q":"At the baptism of Jesus, the Spirit of God descended like a ______.","a":"dove"},{"q":"When Mar Milithios died during the council of Constantinople, the rest of the meetings were presided over by ______.","a":"St. Nectarius"},{"q":"In 1961, a meeting of the World Council of Churches was held in ______.","a":"New Delhi"}],"match":{"l":["Psalm 1","Agur, son of Jakeh","Emperor Theodosius","Epaphroditus","Diotrephes","Alpha and Omega","St. John chapter 17","1 Corinthians 3:16","Michael the Syrian","Addis Ababa"],"r":["Prayer of Jesus for his disciples","Wrote our church history","Headquarters of the Ethiopian Church","Brought the Philippians' gift to Paul","Way of the righteous and the wicked","Over-ambitious man in 3 John","The first and the last","Convener of the council of Constantinople (A.D. 381)","Church as the temple of God","Proverbs chapter 30"],"key":[4,9,7,3,5,6,0,8,1,2]},"who":[{"q":"\"God will send his angel before you so that you can find a wife for my son.\"","a":"Abraham to his servant – Abraham sent his servant to find a wife for his son Isaac; it shows how angels guide the faithful in the right path (Genesis 24:7).","ref":"Class X textbook, Lesson 19 – Angels"},{"q":"\"For the grace of God that bringeth salvation hath appeared to all men.\"","a":"St. Paul to Titus – in his letter to Titus, whom he had consecrated as a bishop, Paul reminds him of God's saving grace (Titus 2:11).","ref":"Class X textbook, Lesson 11 – Pastoral Epistles"},{"q":"\"Fear not, Paul; thou must be brought before Caesar: and God hath given thee all them that sail with thee.\"","a":"The angel of God to St. Paul – the angel stood by Paul at night to encourage him; it shows how angels appear to help the faithful (Acts 27:23-24).","ref":"Class X textbook, Lesson 19 – Angels"}],"short":[{"q":"How did a group of Jews get the name 'Maccabeans'?","a":"Antiochus Epiphanes, who succeeded Alexander the Great in 175 B.C., cruelly persecuted the Jews, forcing them to eat the flesh of swine and worship idols. Judas Maccabeus, son of the priest Mattathias, led the Jews who resisted, and those who followed him came to be known as Maccabeans.","ref":"Class X textbook, Lesson 6 – Other Canonical Books"},{"q":"What lesson do we learn from the letter to Philemon?","a":"St. Paul asked Philemon to pardon his runaway slave Onesimus, who had become a Christian, and to accept him as Paul's beloved son, offering to repay anything he owed. As Paul interceded for Onesimus, Christ intercedes with God for us; Onesimus deserved punishment under the Mosaic law but was redeemed through grace – so we receive absolution of sins through Christ.","ref":"Class X textbook, Lesson 10 – Letters from Prison"},{"q":"What are the groups (categories) of angels?","a":"Mor Dionysius, in his vision, described the angels in 3 grades with 3 groups each – 9 groups in all. Grade I: Seraphim, Cherubim and Thrones; Grade II: Lords, Strengths and Powers; Grade III: Rulers, Archangels and Angels (messengers).","ref":"Class X textbook, Lesson 19 – Angels"},{"q":"Why was Pope Leo angry with Mar Dioscorus?","a":"When the second council of Ephesus (A.D. 449) met to discuss the heresy of Eutyches, Pope Leo sent his essay, the 'Tome', to be read there. Mar Dioscorus, the president, did not allow it because many of its ideas were similar to those of Nestorius, already declared accursed at Ephesus in 431. This was a big blow to Leo's aim of establishing the supremacy of Rome, so he was angry with Dioscorus.","ref":"Class X textbook, Lesson 22 – The Divided Church"}],"para":[{"q":"What does 'prophetic holiness' mean?","a":"During the prophetic period, holiness acquired a deeper meaning; The prophets were not interested in cult and rituals, they stressed purity of heart and of life above everything; They insisted that man should be as holy as God himself, God's saints should be morally perfect; Those who commit injustice and violence are ungodly and unholy; Prophet Isaiah said that those with impure lips are not holy (Isaiah 6:5); From the time of the prophets, holiness means purity of heart, external purity alone does not make a person holy","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"How is Christ portrayed in the Letter to the Hebrews? How is the letter divided?","a":"Christ is a high priest of the order of Melchizedek, and is portrayed as prophet, priest and king; Equal importance is given to his divine and human natures; He is called 'heir of all things' (1:2), 'apostle of faith' (3:1), 'priest' (7:20), 'mediator' of the new covenant (8:6) and 'leader and perfecter of faith' (12:2); Part 1 – The personality of Christ (1:1-4:13): greater than the prophets, the angels and Moses; Part 2 – The mission of Christ (4:14-10:18): priesthood, covenant, the holy place and sacrifice; Part 3 – Faith life in Christ (10:19-13:25): surety of faith, steadfastness in belief, exhortation to love, and conclusion","ref":"Class X textbook, Lesson 12 – Epistle to the Hebrews"},{"q":"Explain the central idea of Ecclesiastes, 'All is vanity', in a spiritual sense.","a":"The central idea is that everything under the sun is vanity and one should fear God; From personal experience the author (Solomon) shows that worldly wisdom is vanity – greater the knowledge, greater the sorrow; Worldly pleasures, wealth and great deeds are also vanity and fruitless striving; Hard toil to amass wealth is vain, because everything must be left to someone who has not toiled for it; There is a time for everything and God judges all, so one should fear God and keep his commandments; Spiritually, a life without communion with God is vain, real happiness and eternal life, the most valuable asset, come only through Christ","ref":"Class X textbook, Lesson 4 – Ecclesiastes (Kohalath)"},{"q":"What role did Emperor Constantine play in the growth of the early Church?","a":"Christians were persecuted for about two and a half centuries, from Nero (A.D. 55) till the Edict of Milan; During a war, while crossing the Milvian Bridge, Constantine saw the sign of the cross in the sky and heard, 'With this you will win', he marked the cross on all weapons and flags and won; He became emperor of the whole Roman Empire and issued the Edict of Milan (A.D. 313), giving complete religious freedom, all Sundays became public holidays; He became a Christian, and the best thing he did for the Church was to convene the first ecumenical council at Nicaea in A.D. 325; He built a beautiful church at Antioch, and renamed Byzantium as Constantinople, making it his capital; Under his mother Queen Helena, the cross on which Jesus was crucified was found (Sleeba Perunnal)","ref":"Class X textbook, Lesson 21 – The Early Christian Church"}],"essay":[{"q":"The characteristics of the Holy Church","a":"The characteristic nature of the Church is defined in the third part of the Creed: it is Catholic, Apostolic, One and Holy; Catholic – the word means universal; Apostolic – Christ built his Church on the rock of St. Peter's immutable faith, the Lord planted it, and the apostles and the fathers who succeeded them nurtured it; The Lord's teachings not recorded in the Bible were handed down orally to successors – this is called tradition, the Church dates from the age of the apostles and has been led by them till today; One – God is one, Jesus Christ is one and the Holy Spirit is one, St. Peter's confession at Caesarea Philippi was made on behalf of all the disciples; The same Creed is used in every apostolic church, though the language differs, the Church is the body of Christ and all the faithful are its members, so it is one; Holy – God, who is holy, established the Church, Christ its head is holy, so his body is holy, and the Spirit of God dwells in it; The Church will exist on earth till the second coming – 'the gates of hell shall not prevail against it' (St. Matthew 16:18)","ref":"Class X textbook, Lesson 20 – The Holy Church"},{"q":"St. Paul's letters can be classified under how many heads? Which are they?","a":"Of the 21 epistles, St. Paul wrote 14, for study they are classified under five heads; Early Letters – 1 and 2 Thessalonians, written to a church in its infancy, earlier than his other letters; Evangelical (Major) Epistles – Romans, 1 and 2 Corinthians and Galatians; Letters from Prison (captivity letters) – Ephesians, Philippians, Colossians and Philemon; Pastoral Epistles – 1 and 2 Timothy and Titus, addressed to the heads of churches he had established; Epistle to the Hebrews – different from the other letters: Paul's name is not found and the style is different, but it expresses his own ideas; His letters follow a pattern: names of sender and receiver, thanksgiving, a message fitting the occasion, and a greeting or prayerful wish; His theology is Christ-centred, stressing the passion, death and resurrection of Christ","ref":"Class X textbook, Lesson 7 – The Epistles of St. Paul"},{"q":"The Armenian Orthodox Church","a":"Armenia was the first country to accept Christianity as its official religion, in A.D. 301 – before Emperor Constantine became a Christian (313); According to tradition, the apostles St. Thaddeus and St. Bartholomew spread the gospel there; They suffered great persecution, in World War I about 12 lakh out of 35 lakh Armenians were massacred; Armenian had no script till the 4th century, St. Isaac (Sahak), as Catholicos, had a script made and the Bible and worship books translated into Armenian; Armenia was not a Roman province, it attended only the Council of Nicaea but accepts Constantinople and Ephesus, and rejects Chalcedon (451); Rome tried to bring it under its control, in 1742 Pope Benedict XIV ordained a Catholic Patriarch, but very few accepted him; Its liturgy is based on St. Basil, Mar Ivanios (St. John Chrysostom) and the Syrian Church, unleavened bread is used, no water is mixed with wine, and priests wear black robes and caps; There are 157 fasting days in a year, Christmas is on January 6th, Qurbana is held on Sundays and maranaya feast days","ref":"Class X textbook, Lesson 25 – The Armenian Orthodox Church"}]}},{"no":4,"s":{"mcq":[{"q":"The Pentateuch is a combination of how many major traditions?","o":["Two","Three","Four","Five"],"a":2},{"q":"For the sake of study, the Book of Proverbs is divided into how many parts?","o":["Three","Seven","Five","Six"],"a":1},{"q":"What is the central idea of the Book of Ecclesiastes?","o":["Love is stronger than death","Wisdom is a noble lady","Everything is vanity and one should fear God","God redeems Israel from slavery"],"a":2},{"q":"In the letter to the Romans, who introduces himself as the apostle of the Gentiles?","o":["St. Paul","St. Peter","St. John","St. James"],"a":0},{"q":"Who was the first Bishop (high priest) of Jerusalem?","o":["St. John","St. Peter","James, the son of Zebedee","James, the brother of the Lord"],"a":3},{"q":"How does the Book of Revelation conclude?","o":["With a list of the twelve tribes","With a psalm of David","Like a covenant","With a letter to Rome"],"a":2},{"q":"'I go and prepare a place for you, I will come again and receive you unto myself' (St. John 14:3) shows which aim of the second coming?","o":["To reward everyone","The fulfilment of the promise","To raise the dead","To judge the nations"],"a":1},{"q":"Which group of angels is described as glorifying God and also keeping watch?","o":["Archangels","Cherubim","Thrones","Seraphim"],"a":1},{"q":"What was the strongest driving force behind Christianity?","o":["The Edict of Milan","The council of Nicaea","The crucifixion of Jesus Christ","The resurrection of Jesus Christ"],"a":3},{"q":"What kind of bread does the Armenian Orthodox Church use for the Holy Qurbana?","o":["Unleavened bread","Barley bread","Leavened bread","Bread with salt"],"a":0}],"name":[{"q":"The bridegroom in the Song of Songs","a":"Solomon"},{"q":"The city besieged by the huge army in the Book of Judith","a":"Bethulia"},{"q":"The person through whom St. Paul sent the second letter to the Corinthians","a":"Titus"},{"q":"The new name Constantine gave to Byzantium when he made it his capital","a":"Constantinople"},{"q":"The letter which differs from St. Paul's other letters and does not carry his name","a":"The letter (epistle) to the Hebrews"},{"q":"The sea in which the island of Padmos is situated","a":"The Aegean Sea"},{"q":"The service of the Church whose prayers fully explain the teaching of the Trinity","a":"The service of Pentecost"},{"q":"The Gospel verse that commands to baptise 'in the name of the Father, and of the Son, and of the Holy Ghost'","a":"St. Matthew 28:19"},{"q":"The famous Maphriyano scholar who lived for a long time in the Dayara of Mor Mathai and wrote many books","a":"Bar Hebraya (Bar Hebraeus)"},{"q":"The country where the Y.M.C.A. started in 1844","a":"England"}],"tf":[{"q":"The Deuteronomic tradition is found in all the five books of the Pentateuch.","a":false},{"q":"According to Ecclesiastes, greater the knowledge, greater will be the sorrow.","a":true},{"q":"When we say 'Holy Father', the Holy Son and the Holy Spirit are also included.","a":true},{"q":"St. Paul wrote all his letters personally with his own hand.","a":false},{"q":"St. Paul wrote the second letter to Timothy knowing that his death was approaching.","a":true},{"q":"The third letter of St. John is addressed to Diotrephes.","a":false},{"q":"The first epistle of St. Peter deals with problems arising inside the Church.","a":false},{"q":"The New Testament church is joined to Jesus Christ and filled with the grace of the Holy Spirit.","a":true},{"q":"After Chalcedon, the Roman and Eastern Orthodox Churches wrongly considered the Oriental Churches to be 'monophysites'.","a":true},{"q":"About 150 bishops attended the council of Nicaea.","a":false}],"fill":[{"q":"In the Yahwist ('J') tradition, the central character is ______.","a":"Abraham"},{"q":"The bride in the Song of Songs declares, \"I am my beloved's and my beloved is ______.\"","a":"mine"},{"q":"In the letter to the Galatians, Paul says freedom should enable a person to produce the fruits of the ______.","a":"Spirit"},{"q":"St. James warns the believers to beware of the ______ (James 3:2-12).","a":"tongue"},{"q":"Moses is inferior to Christ, for Christ is the ______ of all.","a":"creator"},{"q":"Regarding the day and hour of the second coming, nobody knows except the ______ alone.","a":"Father"},{"q":"According to Daniel 6:22, God sent his angel and closed the mouths of the ______.","a":"lions"},{"q":"The Church commemorates the finding of the Holy Cross (Sleeba Perunnal) on ______.","a":"September 14th"},{"q":"Mar ______, the Metropolitan of Mardin, established a Dayara in A.D. 800.","a":"Hananiya"},{"q":"In one year, ______ days are for fasting in the Armenian Church.","a":"157"}],"match":{"l":["Sixth song","Proverbs chapter 8","Sodom","Pontus, Galatia, Cappadocia","Hebrews 1:2","Lion of the tribe of Judah","Ephesians 5:23-25","Mar Koorilose","Aboona","Acts 1:8"],"r":["Heir of all things","Witnesses to the ends of the earth","Metropolitan of the Ethiopian Church","Angels sent to destroy it","Wisdom","Church as the bride of Christ","Readers of St. Peter's first epistle","Revelation 5:5","Union of the bride and the bridegroom","'One nature of the incarnate Word'"],"key":[8,4,3,6,0,7,5,9,2,1]},"who":[{"q":"\"Humble yourselves in the sight of the Lord, and he shall lift you up.\"","a":"St. James to the Christians (addressed to the twelve tribes scattered abroad, but meant for Christians in general) – his epistle stresses practical Christian life, including humility (James 4:10).","ref":"Class X textbook, Lesson 13 – Universal Epistles"},{"q":"\"If the first part is holy, the whole mass will be holy; and if the root is holy, so are the branches.\"","a":"St. Paul to the Romans – from his letter to the church in Rome, a church he had neither founded nor visited (Romans 11:16).","ref":"Class X textbook, Lesson 9 – Epistles of Gospel Teaching (Romans, Corinthians and Galatians)"},{"q":"\"Whom do people say that the Son of Man is?\"","a":"Jesus to his disciples – asked at Caesarea Philippi; Simon Peter answered on behalf of all the disciples (St. Matthew 16:13-20).","ref":"Class X textbook, Lesson 20 – The Holy Church"}],"short":[{"q":"What are the 'Other Canonical Books'? Why do the Protestants call them 'Apocryphal'?","a":"The other canonical books (Deuterocanonical texts) are eleven books such as Tobit, Judith, Esther Part II, Profound Wisdom, Esm bar Asira, the Epistle of Jeremiah, Baruch, the second part of Daniel and Maccabees I and II, which the Catholic and Syrian Churches accept as Holy Scripture. The Protestants call them Apocryphal books because they consider them to be of doubtful authority.","ref":"Class X textbook, Lesson 6 – Other Canonical Books"},{"q":"Why did St. Paul write the second letter to the Thessalonians soon after the first?","a":"Paul's teaching about the second coming of Christ in the first letter was misunderstood and caused problems; some people even began to circulate fake letters. So Paul wrote again soon to strengthen their faith, assure them that their persecutors would be punished, and correct their misunderstanding about the second coming (2:1-12).","ref":"Class X textbook, Lesson 8 – Early Letters of St. Paul (Letters to the Thessalonians)"},{"q":"Though God alone is holy, how do believers become holy ones?","a":"Except the one true God no one is holy, for all have sinned; but the lost glory is regained through Jesus Christ, whose blood cleanses us from all sin (1 John 1:7). When we become one with Christ we receive God's holiness by his grace; like a twig thrown into a blazing fire we are transformed, and those who receive holiness from the only Holy One become holy ones.","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"Which years are known as the 'apostolic period' and the 'apostolic disciple period'?","a":"A.D. 30 to A.D. 70 is called the 'apostolic period'; St. Luke wrote about it in the Acts of the Apostles. A.D. 70 (when the Romans destroyed the temple of Jerusalem) to A.D. 110 is the 'apostolic disciple period', when those who learnt directly from the apostles led the Church.","ref":"Class X textbook, Lesson 21 – The Early Christian Church"}],"para":[{"q":"Write a note on Apocalyptic literature.","a":"God reveals mysteries known only to Him, by Himself or through a messenger – this is revelation; Those who receive it record it and inform others, mostly in symbols – this is apocalyptic literature ('Apocalypse' means to unveil); It began to flourish at the end of the prophetic period; Examples: the concluding chapters of Ezekiel, chapters 7-12 of Daniel and the whole Book of Revelation; Persons, places, animals, numbers, stars and colours have symbolic meaning, so it cannot be read literally; It must be interpreted with great care, relating it to similar Bible passages","ref":"Class X textbook, Lesson 15 – The Book of Revelation"},{"q":"What is the central idea of the first letter of St. John? How does he explain it?","a":"St. John, the apostle of love, wrote it to the churches in Asia Minor against false teachers who denied that Jesus is the Messiah, denied the Father and the Son, and called the incarnation an illusion, he calls them fake Messiahs; Its purpose (5:13): that those who believe in the Son of God may know they have eternal life; The central idea is union with God, explained through three attributes of God; God is light – those who walk in light are in union with God; God is righteous – those who practise justice are from God; God is love – those who love are born of God, the letter is very similar to St. John's Gospel","ref":"Class X textbook, Lesson 14 – Universal Letters – 2"},{"q":"Explain God's call to holiness, beginning with the calling of Abraham.","a":"God chose Israel with a purpose, revealed in the call of Abraham – to be blessed and to be a blessing to others (Genesis 12:1-3); Man was created pure and righteous, but through Satan he was alienated from God and came under the curse; God calls all to share his holiness – 'You shall be holy, for I am holy' (Leviticus 11:44-45, 19:2); The call has seven points: God is holy, God sanctifies, the people should be holy, not defile themselves, consecrate themselves, observe his statutes and strive to be holy; God carries out this sanctification through Jesus Christ, as seen in his prayer in St. John 17; God's promise to Abraham that all the families of the earth will be blessed is fulfilled through Jesus, the son of Abraham","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"Describe the faith and practices of the Ethiopian Orthodox Church.","a":"Founded by Coptic missionaries, it follows the Coptic tradition in faith and liturgy, accepts only the three ecumenical councils, and is one in faith with the Syrian, Armenian and Coptic Churches about the Trinity and the nature of Christ; It has many Jewish rituals, probably due to the connection with Solomon: Saturday is the Sabbath, and circumcision, purification and avoiding forbidden food are practised; Debteras dance during processions holding a T-shaped stick and a musical instrument; About 250 days a year are fasting days – only vegetarian food, and no food till 3 PM except on Saturday and Sunday; Geez is the language of the liturgy, while Amharic is spoken today; There are 53 ascetic groups, the headquarters is Addis Ababa, and Christmas is celebrated on 7th January","ref":"Class X textbook, Lesson 26 – Ethiopian Orthodox Church"}],"essay":[{"q":"The five books of the Psalms and their relation to the Pentateuch","a":"The 150 psalms are divided into five books, each similar to a book of the Pentateuch; Book 1 (Ps 1-41): arranged by King David (1020-970 B.C.), like Genesis, it refers to the creation of the universe and of man (Ps 8, 19); Book 2 (Ps 42-72): 'Hymns of National Interest', like Exodus, it is a cry for liberation, with God as Redeemer, compiled under King Hezekiah or Josiah (790-597 B.C.); Book 3 (Ps 73-89, 17 psalms): also 'Hymns of National Interest', like Leviticus, its themes are sanctification and worship, compiled under Hezekiah or Josiah; Book 4 (Ps 90-106): anonymous hymns of praise (Ps 90 is a prayer of Moses), like Numbers, it compares the believer's life to Israel's desert journey; Book 5 (Ps 107-150): hymns of praise, like Deuteronomy, it repeatedly affirms faith in God who chose and redeemed his people; Books 4 and 5 were compiled by Ezra and Nehemiah (457-425 B.C.)","ref":"Class X textbook, Lesson 2 – Psalms"},{"q":"The letters of St. Paul from prison","a":"Ephesians, Philippians, Colossians and Philemon are called letters from prison because Paul wrote them while imprisoned in Rome; Ephesians: Ephesus was an important city in Asia Minor where Paul stayed over 2 years and Timothy was head of the church, the letter was sent through Tychicus to strengthen the church; In Ephesians the church is compared to a temple (Christ the cornerstone), a body (Christ the head) and a bride (Christ the bridegroom), it explains the status, life and duties of a Christian and the fight against Satan; Philippians: Philippi was the first church Paul established in Europe, the Philippians sent help through Epaphroditus, and Paul sent this letter back with him; Philippians repeats 'joy' and 'rejoice', has no Old Testament quotation, and presents Christ as the model of humility; Colossians: the church was founded by Epaphras, Paul wrote to refute false teaching (a mixture of Gnosticism and Jewish faith) that angels created the world, which led to angel worship; Colossians presents Christ above everything – image of God, first born of all creation, head of the church – and is similar to Ephesians; Philemon: the smallest letter (25 verses), Paul asks Philemon to pardon his runaway slave Onesimus and accept him as Paul's beloved son","ref":"Class X textbook, Lesson 10 – Letters from Prison"},{"q":"The Coptic Church","a":"The Coptic Church comes under the Patriarchal See of Alexandria, one of the three organised at Nicaea, most members are Egyptians; It is called Coptic because the Coptic language is used in the liturgy, Caliph Abdul Malik banned it in A.D. 705, and by the 13th century it ceased to be spoken; Egypt (Mizraim) is linked with the Bible – Abraham lived there for a while, Israel grew there, and it was a refuge for the Holy Family; Tradition says Mark the Evangelist founded the Church in Egypt as instructed by St. Peter; The theological school of Alexandria made it the theological capital of the world for centuries, it became weak due to Arab persecution; It stood firm in faith and in the Dayara movement despite persecution by idol-worshipping kings, dyophysites and Muslim rulers; From the 13th century Rome tried to bring it under its control, in 1899 Pope Leo XIII ordained a Patriarch, but very few follow him; The Patriarchs moved from Alexandria to the Dayara of Macarius (6th century) and to Cairo (11th century), it has about a million members, Christmas is on January 7th and Easter on the Sunday after the Jewish Passover","ref":"Class X textbook, Lesson 24 – The Coptic Church"}]}},{"no":5,"s":{"mcq":[{"q":"The fifth book of Psalms (Psalms 107-150) has close resemblance with which book of the Pentateuch?","o":["Deuteronomy","Numbers","Leviticus","Genesis"],"a":0},{"q":"In the fourth song of the Song of Songs, who found the bride wandering in the city and beat her?","o":["The soldiers of Solomon","The shepherds","The daughters of Jerusalem","The watchmen"],"a":3},{"q":"According to the Book of Tobias, in married life the husband and wife should","o":["fast for 40 days","go on pilgrimage every year","pray in unison","live in separate houses"],"a":2},{"q":"Corinth was a flourishing trading centre and a renowned university centre in","o":["Italy","Greece","Egypt","Asia Minor"],"a":1},{"q":"Why did the Jewish Christians in Palestine want to return to their old faith?","o":["Because of a famine","Because of persecution","Because Paul asked them to","Because the temple was rebuilt"],"a":1},{"q":"According to the second letter of St. John, those who do not confess that Christ has come in the flesh are","o":["the elect","prophets","deceivers and antichrists","weak believers"],"a":2},{"q":"The second epistle of St. Peter refutes people who refused to believe in","o":["the resurrection of Lazarus","the second coming of our Lord","the creation of the world","the Holy Scriptures"],"a":1},{"q":"How can the mysterious character of the Three in one God be comprehended?","o":["Only by argument","Only by faith","Only by science","Only by counting"],"a":1},{"q":"Which universal synod (ecumenical council) rejected the heresy of Nestorius?","o":["Chalcedon","Nicaea","Constantinople","Ephesus"],"a":3},{"q":"About how many days in a year are fasting days in the Ethiopian Church?","o":["About 50","About 100","About 157","About 250"],"a":3}],"name":[{"q":"The king whose friends wrote the fifth part of the Book of Proverbs (Proverbs 25:1)","a":"King Hezekiah"},{"q":"The teachings handed down to the successors through verbal teaching, not recorded in the Bible","a":"Tradition"},{"q":"The Greek ruler who severely persecuted the Jews after succeeding Alexander the Great in 175 B.C.","a":"Antiochus Epiphanes"},{"q":"The city where St. Paul was imprisoned when he wrote the letters from prison","a":"Rome"},{"q":"The two companions whose names appear with St. Paul's at the beginning of the letters to the Thessalonians","a":"Silas and Timothy"},{"q":"The letter of St. Paul in which the words 'joy' and 'rejoice' are repeated many times","a":"Philippians"},{"q":"The epistle that refers to a set of angels ousted from the kingdom of God for struggling against God","a":"The epistle of St. Jude"},{"q":"The event from which the Old Testament church considers its clear beginning","a":"The call of Abraham"},{"q":"The Pope who ordained a Catholic Patriarch for the Armenian Church in 1742","a":"Pope Benedict XIV"},{"q":"The apostles who, according to tradition, spread the Gospel in Armenia","a":"St. Thaddeus and St. Bartholomew"}],"tf":[{"q":"Psalm 41 says that those who are kind and compassionate to the poor are the blessed ones.","a":true},{"q":"In the Book of Proverbs, wisdom is personified as a noble lady.","a":true},{"q":"The Dayara of Mor Mathai is situated near Damascus in Syria.","a":false},{"q":"St. Paul's earlier letter to the Corinthians mentioned in 1 Corinthians 5:9 is included in the Bible.","a":false},{"q":"Philemon was a native of Colossae and his house was a meeting place for Christians.","a":true},{"q":"Our Syrian Church believes that St. Paul wrote the Epistle to the Hebrews.","a":true},{"q":"St. Peter indicates his impending death in his second epistle.","a":true},{"q":"In the Holy Trinity, the Son is greater than the Holy Spirit.","a":false},{"q":"The council of Nicaea decided that Easter would be celebrated based on the date alone.","a":false},{"q":"Coptic is still the spoken language of the people of Egypt.","a":false}],"fill":[{"q":"The Pentateuch as a book is incomplete, but it contains a number of ______.","a":"promises"},{"q":"A Greek translation of the Old Testament dating back to ______ B.C. contains all the 150 psalms.","a":"200"},{"q":"Mar Michael meditated from a pillar till his death at the age of ______.","a":"105"},{"q":"St. Paul's theology is ______-centred.","a":"Christ"},{"q":"Union with God is the central idea of the ______ letter of St. John.","a":"first"},{"q":"According to Ephesians, a Christian is chosen by God the Father, redeemed by Jesus Christ and sealed by the ______.","a":"Holy Spirit"},{"q":"Because of a misunderstanding about the second coming, some people in Thessalonica began to circulate ______ letters.","a":"fake"},{"q":"The characteristic nature of the Church is defined in the ______ part of the Creed.","a":"third"},{"q":"Instead of AD and BC, present-day authors prefer to use the terms CE (______) and BCE.","a":"Christian Era"},{"q":"The spoken language of Ethiopia today is ______.","a":"Amharic"}],"match":{"l":["Daughters of Jerusalem","Y.W.C.A.","Ezra and Nehemiah","Acts 20:32","Jude verse 9","Hebrews 1:1-4:13","1 John 1:7","Meroz","Mar Osthathevos (Eustathius)","Pope Leo XIII"],"r":["Ordained a Patriarch for Coptic Catholics (1899)","President at the council of Nicaea","The personality of Christ","The blood of Jesus cleanses us from all sin","Started in America in 1872","Assumption of Moses","Maids of the bride","Cursed by the angel of the Lord","Compiled the 4th and 5th books of Psalms","\"I commend you to God and the word of his grace\""],"key":[6,4,8,9,5,2,3,7,1,0]},"who":[{"q":"\"Thou art the Christ, the Son of the living God.\"","a":"St. Peter (Simon Peter) to Jesus – at Caesarea Philippi, Peter answered on behalf of all the disciples when Jesus asked, 'What do you say about me?' (St. Matthew 16:16).","ref":"Class X textbook, Lesson 20 – The Holy Church"},{"q":"\"With this you will win.\"","a":"A voice to Emperor Constantine – heard in a vision when he saw the sign of the cross in the sky while crossing the Milvian Bridge during a war; he marked the cross on his weapons and flags and won.","ref":"Class X textbook, Lesson 21 – The Early Christian Church"},{"q":"\"Beloved, do not imitate evil but imitate good. He who does good is of God.\"","a":"St. John to Gaius (Gaos) – in his third letter, St. John praises Gaius for welcoming the missionaries and urges him to walk in truth (3 John 11).","ref":"Class X textbook, Lesson 14 – Universal Letters – 2"}],"short":[{"q":"What are the Pastoral Epistles? Why are they so called?","a":"The two epistles to Timothy and the one to Titus are called Pastoral Epistles; the name came into general use from the 18th century. They contain directions and instructions for the good administration of the Church, addressed to the heads of churches St. Paul had established.","ref":"Class X textbook, Lesson 11 – Pastoral Epistles"},{"q":"What are the main thoughts in the epistle of St. James?","a":"The epistle of St. James stresses practical Christian life and is called the 'Proverbs of the New Testament'. Its main thoughts are: treat the poor in the same faith with brotherly affection; hear the word and act on it; beware of the tongue; be humble; be forgiving; and trust in the unbeatable power of prayer.","ref":"Class X textbook, Lesson 13 – Universal Epistles"},{"q":"What were the reasons for the decline of Antioch?","a":"From the 5th century Antioch began to decline, first because of persecution by the dyophysite group after the council of Chalcedon and the earthquake in the first half of the 6th century. Then came the Persian attack in A.D. 538, which nearly destroyed the city, and the Arab conquest in A.D. 638, which isolated it from the Christian world.","ref":"Class X textbook, Lesson 23 – The Syrian Orthodox Church of Antioch"},{"q":"When did Christians start getting recognised as a separate group? Why did the Sadducees become their enemies?","a":"At first the Romans and gentiles saw the Church as a modified form of the Jewish religion, and the apostles still prayed in the temple; but after Stephen became a martyr, Christians were recognised as a separate group. The resurrection of Jesus was the strongest driving force of Christianity, so the Sadducees, who did not believe in resurrection, became their enemies.","ref":"Class X textbook, Lesson 21 – The Early Christian Church"}],"para":[{"q":"What are the main teachings in the letter to the Galatians? Why was it written?","a":"It was written to the churches of Galatia, founded during Paul's first missionary journey; Jewish Christians questioned Paul's authority because he was not one of the Twelve, and insisted that converts be circumcised and follow Jewish customs, causing great confusion; Paul strongly criticises false preachers of the gospel (1:8) and asserts that his apostleship is from God, approved by the apostles in Jerusalem; The main teachings are salvation through grace and justification by faith, not by the Mosaic law; The law condemns people as sinners, but faith in Christ frees them from the bondage of sin; This freedom should produce the fruits of the Spirit (chapter 5), the letter ends with instructions useful for daily life","ref":"Class X textbook, Lesson 9 – Epistles of Gospel Teaching (Romans, Corinthians and Galatians)"},{"q":"What are the aims of the second coming of the Lord?","a":"The Lord's second coming has five aims; To fulfil his promise – 'I will come again and receive you unto myself' (St. John 14:3); To unite the chosen people – his angels will gather his elect from the four winds (St. Matthew 24:31); To judge the nations – he will separate them as a shepherd divides the sheep from the goats (St. Matthew 25:31-32); To reward everyone according to his work (St. Matthew 16:27); To raise the dead – the dead in Christ shall rise first (1 Thessalonians 4:13-17)","ref":"Class X textbook, Lesson 16 – The Second Coming of the Lord"},{"q":"How does the New Testament speak about the holiness of Jesus, the Church and the believers?","a":"The New Testament teaches that Christians should be holy as Jesus Christ is holy; Jesus: before his birth the Holy Spirit foretold that he would be holy (St. Luke 1:35), and unclean spirits called him 'the Holy One of God' (St. Mark 1:24); John the Baptist: Herod feared him, knowing he was a righteous and holy man (St. Mark 6:20); The prophets are called holy (Acts 3:21); The Church: Christ gave himself for her to sanctify her and present her without spot or wrinkle (Ephesians 5:26-27); Believers are holy when their thoughts, desires and deeds agree with God's will – 'Be holy, for I am holy' (1 Peter 1:15-16)","ref":"Class X textbook, Lesson 18 – One and Only Holy God"},{"q":"Why was the council of Chalcedon convened, and how did it divide the Church?","a":"After Mar Dioscorus refused to read the Tome at Ephesus (449), Pope Leo wanted revenge and Rome's supremacy; At Leo's demand, Emperor Marcian convened the council at Chalcedon in A.D. 451, its aims were to defeat Dioscorus, to accept the Tome of Leo and to establish Rome's supremacy in theology; Dioscorus was publicly condemned and the Tome accepted, bringing back the Nestorian two-nature idea in a modified form; The churches of Antioch and Alexandria rejected it, while Rome and Constantinople accepted it; So the Church was divided into those accepting the Chalcedon faith and those not accepting it; Those not accepting it are the Oriental Orthodox Churches (Syrian, Coptic, Armenian and Ethiopian), which stand firm in the faith of Nicaea, Constantinople and Ephesus","ref":"Class X textbook, Lesson 22 – The Divided Church"}],"essay":[{"q":"Explain the four traditions (JEDP) in the compilation of the Pentateuch.","a":"The Pentateuch was compiled over some 500 years (10th to 5th century B.C.) from four major oral and written traditions, their joining caused doublets; J (Yahwist): the oldest tradition, God is called Yahweh, and 'J' comes from the German 'Jehova', mostly in Genesis, also in Exodus and Numbers, only the death of Moses in Deuteronomy, none in Leviticus; J was written in Jerusalem in the 10th-9th centuries B.C., it tells of the promises to the forefathers, with Abraham as the central character; E (Elohist): God is called Elohim, mostly in Genesis, none in Leviticus, very similar to J in narrating history from Abraham's call to Moses' death; D (Deuteronomic): found only in Deuteronomy 1-30, mainly about the order of worship, written in the northern kingdom, tells of Israel's election and the eternal covenant, with Moses as the central character; P (Priestly): a code of conduct formulated by the priests after the return from the Babylonian captivity, it starts with the history of creation; P was written in the 6th-5th centuries B.C. and aims at a devotional life, its main personalities are Adam, Noah, Abraham and Moses; J was the first written document, E was added later, then D, and finally P – the Pentateuch is a combination of all four","ref":"Class X textbook, Lesson 1 – Compilation of the Pentateuch"},{"q":"The Book of Revelation","a":"The author is John, the disciple of Jesus (1:1, 4, 9 and 22:8), who calls himself servant and brother; During the reign of Emperor Domitian (A.D. 90-95) he was exiled to Padmos, a volcanic island in the Aegean Sea, where Jesus Christ showed him the revelation; After his release he reached Ephesus (A.D. 96), wrote the book there and sent it to seven churches in Asia Minor; Its title is 'The Apocalypse of St. John', 'Apocalypse' is a Greek word meaning to unveil; Purpose: to reveal Christ fully and to strengthen the faith of Christians persecuted for their belief; It is written in symbolic apocalyptic style and has been interpreted in four ways – Preterist, Futurist, Historic and Idealist; Christ is called faithful witness, Alpha and Omega, Son of Man, the Lion of the tribe of Judah, the Lamb that was slain, Word of God, King of Kings and Lord of Lords, and Shining Morning Star; It ends like a covenant with three testimonies – the angel, Christ and St. John – and a curse on anyone who alters the book","ref":"Class X textbook, Lesson 15 – The Book of Revelation"},{"q":"The Syrian Christians under Arab (Muslim) rule","a":"Syria and nearby regions came under Arab rule in the 7th century, persecution by the Chalcedonians (dyophysites) ended and there was peace in the Church; The only condition was that Christians should not work against Islam or its rulers; Non-Muslims paid a tax in place of compulsory military service, which was not a burden, priests and ascetics were exempt; The rulers were keen to use the Christians' knowledge, and the political union of Syria, Persia and Mesopotamia helped the gospel spread to new places; The dyophysites lost royal support, so the Church no longer faced their hostility; Syrian Christians made important contributions in science, medicine, astronomy, history and theology, Mar Marutha (the first Maphriyano), Muse bar Keepa and Mar Yacoob of Edessa lived at this time; Being more educated than the Arabs, Christians held important posts under the Caliphs and prospered in trade; Till the Crusades it was a time of peace and progress, though a few rulers were against the Christians","ref":"Class X textbook, Lesson 23 – The Syrian Orthodox Church of Antioch"}]}}]}]</script>

const DATA = JSON.parse(document.getElementById('data').textContent);
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- storage (per device) ---------- */
const KEY = 'stignatius.examprep.v1';
let mem = { current: null, students: {} };
function load() { try { const s = localStorage.getItem(KEY); if (s) mem = JSON.parse(s); } catch (e) {} if (!mem.students) mem.students = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
load();
const me = () => mem.students[mem.current];
function setLast(last) { if (me()) { me().last = last; save(); } }

/* ---------- helpers ---------- */
const clsData = c => DATA.find(x => x.c === c);
const unitKey = (c, si, ui) => `${c}|${si}|${ui}`;
function unitProgress(c, si, ui) {
  const u = clsData(c).sections[si].units[ui]; const a = (me()?.answers || {});
  let done = 0; u.q.forEach((q, i) => { const p = a[`${unitKey(c, si, ui)}|${i}`]; if (p && p.includes(q[2])) done++; });
  return { done, total: u.q.length };
}
function classProgress(c) {
  let d = 0, t = 0; clsData(c).sections.forEach((s, si) => s.units.forEach((u, ui) => { const p = unitProgress(c, si, ui); d += p.done; t += p.total; }));
  return { done: d, total: t };
}
const ICON = {
  reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

function topbar(title, sub, backFn) {
  return `<header class="top"><div class="wrap top-in">
    ${backFn ? `<button class="icon-btn" id="tb-back" aria-label="Back">${ICON.back}</button>` : `<img src="${LOGO}" alt="">`}
    <div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
    <button class="icon-btn" id="tb-reset" aria-label="Start fresh">${ICON.reset}</button>
    <button class="icon-btn" id="tb-user" aria-label="Switch student">${ICON.user}</button>
  </div></header>`;
}
function wireTop(backFn) {
  const b = document.getElementById('tb-back'); if (b) b.onclick = backFn;
  document.getElementById('tb-user').onclick = () => showWelcome('choose');
  document.getElementById('tb-reset').onclick = () => askReset();
}

function askReset() {
  if (document.getElementById('rs')) return;
  const m = document.createElement('div'); m.id = 'rs'; m.className = 'modal';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rs-h">
    <h2 id="rs-h" style="font-size:22px">Start fresh?</h2>
    <p class="muted" style="margin:6px 0 16px">This clears all of your answers in every class on this phone (other students are not affected), so you can practise again from the beginning.</p>
    <div class="row"><button class="btn btn-primary" id="rs-yes">Yes, start fresh</button><button class="btn btn-ghost" id="rs-no">Cancel</button></div>
  </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  document.getElementById('rs-no').onclick = close;

function sparks(canvas) {
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, P = [];
  const size = () => { const r = canvas.getBoundingClientRect(); W = canvas.width = r.width * devicePixelRatio; H = canvas.height = r.height * devicePixelRatio; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 46; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, s: Math.random() * .0012 + .0004, a: Math.random() });
  const draw = () => {
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      if (!reduce) { p.y -= p.s; p.a += .02; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); } }
      ctx.globalAlpha = .25 + .35 * Math.abs(Math.sin(p.a));
      ctx.fillStyle = '#F2CB72'; ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r * devicePixelRatio, 0, 7); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  };
  draw();
}

function showQuiz(c, si, ui, qi) {

  const [text, opts, ans, src] = u.q[qi];
  const k = `${unitKey(c, si, ui)}|${qi}`;
  const picked = me().answers[k] || [];
  const solved = picked.includes(ans);
  const last = qi === u.q.length - 1;
  const dots = u.q.map((q, i) => { const p = me().answers[`${unitKey(c, si, ui)}|${i}`] || []; const cl = p.includes(q[2]) ? 'g' : (p.length ? 'r' : ''); return `<button class="dot ${cl} ${i === qi ? 'cur' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`; }).join('');
  $app.innerHTML = topbar(u.t, `Class ${c} · ${sec.n}`, () => showHub(c, 'ch')) + `

        return `<button class="opt ${st} ${solved ? 'locked' : ''} ${solved && !st ? 'dim' : ''}" data-i="${i}" ${solved ? 'aria-disabled="true"' : ''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span>${st === 'ok' ? ICON.ok : st === 'bad' ? ICON.bad : '<span></span>'}</button>`;
      }).join('')}</div>
      <div class="fb ${solved ? 'ok' : picked.length ? 'bad' : ''}" aria-live="polite">${solved ? 'Correct! Well done.' : picked.length ? 'Not quite. Try another answer.' : ''}</div>
    </article>
    ${last && solved ? `<div class="card finish"><span class="big">Chapter complete</span><p class="muted" style="margin:0">You answered ${unitProgress(c, si, ui).done} of ${u.q.length} questions correctly.</p>${nextUnitBtn(c, si, ui)}</div>` : ''}
  </main>
  <nav class="bottom"><div class="wrap">
    <button class="btn btn-ghost" id="q-prev" ${qi === 0 ? 'disabled' : ''}>← Back</button>

  </div></nav>`;

    if (solved) return;

function nextUnitBtn(c, si, ui) {
