d prayers","Building monasteries","Missionary journeys","Teaching languages"],0,""],["Who was the first teacher of St. Gregorius of Nyssa?",["His mother Emmelia","His grandmother Makrina","St. Gregorius Nazianzen","His eldest brother, St. Baselius"],3,""],["St. Gregorius of Nyssa succeeded in retaining the believers in which creed?",["The Creed of Ephesus","The Apostles' Creed","The Creed of Arius","The Nicene Creed"],3,""],["In which year is St. Gregorius of Nyssa believed to have died?",["379 A.D.","381 A.D.","390 A.D.","394 A.D."],3,""],["Which Cappadocian Father wrote more books than any other?",["St. Athanasius","St. Gregorius of Nazianzus","St. Gregorius of Nyssa","St. Baselius of Caesarea"],2,"QP 2013 (Kerala), QP 2016"],["St. Gregorius of Nyssa believed that Christian life was an imitation of divine character for what reason?",["Because the Synod decided it","Because the saints commanded it","Because it was the Law of Moses","Because man was made in God's image"],3,""],["Who was appointed as the Episcopa of Nyssa in A.D. 372?",["St. Gregorius Nazianzen","St. Gregorius, the Miracle Worker","St. Gregorius, the brother of St. Baselius","St. Baselius of Caesarea"],2,"QP 2015"],["Which of the Cappadocian Fathers took an active part in the Holy Synod of Constantinople in 381 A.D.?",["St. Cyril of Alexandria","St. Athanasius","St. Gregorius of Nyssa","St. Baselius of Caesarea"],2,"QP 2017"],["St. Gregorius of Nazianzus and St. Gregorius of Nyssa belong to which group of spiritual scholars?",["The Apostolic Fathers","The Cappadocian Fathers","The Desert Fathers","The Maccabees"],1,"QP 2017"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"The Bronze Basin (Brazen Laver) was part of the","o":["Furnishings at the Most Holy Place","Furnishings at the Court","Furnishings at the Holy Place","Tabernacle coverings"],"a":1},{"q":"Which king put St. Peter in jail during the Festival of Unleavened Bread?","o":["Herod Agrippa","Herod the Great","Herod II","Herod Antipas"],"a":0},{"q":"In which town did the old priest Mattathias, the father of the Maccabees, live?","o":["Gaza","Modein","Ashdod","Ekron"],"a":1},{"q":"Where did John Mark leave Paul and Barnabas and go back to Jerusalem?","o":["Perga","Derbe","Paphos","Lystra"],"a":0},{"q":"\"Promeon\" means","o":["Propitiatory prayer","Let us stand well","Introduction (preface)","Row"],"a":2},{"q":"In which year was St. Gregorius Nazianzen elected Bishop of Constantinople?","o":["330 A.D.","372 A.D.","381 A.D.","394 A.D."],"a":2}],"name":[{"q":"The Roman Emperor who was persecuting Christians when St. Peter was arrested","a":"Nero"},{"q":"Who is addressed as \"The Light House of Malankara\"?","a":"H.B. Arch Catholicose Baselius Paulose II"},{"q":"Through which side should a person enter the sanctuary?","a":"The south side (and leave through the north)"},{"q":"The other name of the Burnt Offering","a":"Sweet savour offering"},{"q":"The departed saints who talked with Jesus on the mount of transfiguration","a":"Moses and Elijah"},{"q":"The young man at Troas who fell from the third storey and was brought back to life by St. Paul","a":"Eutychus"}],"tf":[{"q":"St. Paul was crucified upside down.","a":false},{"q":"The main sacrifices of the Old Testament brought permanent salvation and forgiveness of sin.","a":false},{"q":"According to the lesson on saints, death is not an end; it is a change from one state to another.","a":true},{"q":"Ringing of church bells is not permitted under any circumstances after the public commencement of the Holy Mass.","a":true}],"fill":[{"q":"The first Christian to be baptized in Europe was ______.","a":"Lydia"},{"q":"It was at ______ that the believers were called 'Christians' for the first time.","a":"Antioch"},{"q":"______ was the king who persecuted the Jews and installed an idol in the Temple during the time of the first generation of Maccabees.","a":"Antiochus Epiphanes"},{"q":"H.H. Moran Mor Ignatius Zakka I summoned a meeting of the Universal Synod of the Syrian Orthodox Church between 17th and 24th ______ 1981.","a":"November"},{"q":"The Mass Communion of 101 priests and prelates on 2nd November 2002 was held in connection with the 100th memorial anniversary of ______.","a":"St. Gregorius (Parumala Thirumeni)"}],"match":{"l":["Sin offering","Peace offering","Simon, son of Mattathias","Aeneas","Elymas","Catechumens","Barekmore"],"r":["Those yet to receive baptism","The offerer is entitled to a portion","Made blind for a short time by St. Paul","Paralytic cured by St. Peter at Lydda","Grant us O Lord","Only male members of the priests' family can eat the rest","Killed by his son-in-law Ptolemy"],"key":[5,1,6,3,2,0,4]},"short":[{"q":"Explain the Meat Offering.","a":"The Meat Offering was made of fine flour, pure olive oil and frankincense; the priest burnt a handful of the flour and oil and all the incense on the altar as a token that all was offered to the Lord, and its smell is pleasing to the Lord. There are five kinds: fine flour with oil and frankincense, unleavened baked cakes, unleavened baked pancakes, unleavened fried pancakes and first fruits of crops.","ref":"Class IX textbook, Chapter 5 – Sacrifices of Israelites (Meat Offering)"},{"q":"Explain how St. Peter went to Caesarea and what happened there.","a":"St. Peter went to Caesarea to preach to Cornelius, a captain in the Roman army, and through his preaching the Gentiles also received the grace of God, as the Jews did. When Peter returned to Jerusalem he was accused of admitting believers without circumcision. He explained everything and convinced them it was God's will, and they praised God for giving repentance and salvation to the Gentiles.","ref":"Class IX textbook, Chapter 11 – Activities of Peter"},{"q":"Write a short note on the secret prayers on the knees.","a":"After asking for absolution, the celebrant kneels on the steps (Durgo) in front of the altar and says secret prayers. He prays that the Lord accept the Eucharist offered for the absolution of his sins and the sins of the congregation, and asks for the intercession of St. Mary and all the saints. Then he remembers all the names to be remembered in that day's communion.","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Secret prayers on the knees)"},{"q":"Write about the third Malankara visit of H.H. Moran Mor Ignatius Zakka I.","a":"His Holiness visited Malankara a third time in connection with the inauguration of the Silver Jubilee celebrations of his consecration as Patriarch. The important events were the consecration of Chrism (Mooron) at St. Thomas Church (Cheriyapally), Kothamangalam, the inauguration of the Patriarchate centre at Puthencruz and the Episcopal Synod at St. George's Church, Karingachira.","ref":"Class IX textbook, Chapter 21 – Malankara Visit of H.H. Moran Mor Ignatius Zakka I"}],"para":[{"q":"Why was the Jerusalem Synod convened and what decisions were taken there?","a":"The main disagreement was about Gentile believers - one group said they must be circumcised and follow all the Jewish Laws before baptism, the other said believers in Christ could join without circumcision; To decide this, the elders and apostles met in Jerusalem in 51 A.D., after Paul's first missionary journey; St. Peter told from his own experience how the Gentiles received the Holy Spirit even before they were baptized; St. James, the brother of Jesus, explained from the scriptures that it was God's will that the Gentiles were turning to God; Decision: Gentile believers need not be circumcised but must keep the moral laws, and Judas and Silas were sent with Paul and Barnabas with a letter to Antioch; It was also decided that Paul and Barnabas would work among the Gentiles and Peter, James and John among the Jews","ref":"Class IX textbook, Chapter 13 – Jerusalem Synod"},{"q":"Explain the furnishings at the Most Holy Place of the Tabernacle.","a":"Covenant Box (Ark): held the two stone tablets of the commandments, and later the golden jar of manna and Aaron's staff that sprouted leaves; Mercy Seat: a rectangular plate of pure gold on top of the Covenant Box - God came down to the Most Holy Place and spoke to Moses from it; Cherubim: two cherubim of pure gold at the two ends of the Mercy Seat, facing each other, with wings stretched to cover it; Golden censer: used to carry coals and incense from the altar into the Most Holy Place when the high priest entered once a year on the Day of Atonement","ref":"Class IX textbook, Chapter 4 – Tabernacle (Furnishings at the Most Holy Place)"},{"q":"Write about St. Baselius of Caesarea and his contributions.","a":"St. Baselius, the foremost Cappadocian Father, called the 2nd Athanasius, was born in Caesarea in 330 A.D., and his mother Emmelia was the daughter of a Christian martyr; He gave up his job as a language teacher, sold his properties, gave the money to the poor and started the first monastery at Annase, making rules for it; He became Bishop of Caesarea in 372 A.D. and gave importance to protecting the true faith and to social service - hospitals for the sick, homes for the poor and honouring foreigners; He was a great writer of communion orders, church regulations, interpretations, essays and letters, and his Rules are still followed by Greek monastic orders; He strongly opposed the Macedonian heresy and died in 379 A.D.","ref":"Class IX textbook, Chapter 24 – Cappadocian Fathers (Baselius of Caesarea)"}],"essay":[{"q":"Blessing of the censer","a":"Only a priest authorized to say the Trinitarian doxology may put incense in the censer, and if a prelate is present he does it; The blessing of the censer follows the Sedro and is done by the celebrant (or by the prelate, if present); The priest stands on the north and the thurifer on the south so as not to hide the Eucharist from the people, and the censer is held in line with the Eucharist; The thurifer keeps his left hand on his chest and lifts the censer with three fingers of his right hand; Holding one chain, the celebrant makes the sign of the cross on the censer in the name of the Holy Father, then holding two more chains in the name of the Holy Son (two chains show the manhood and godhead of Christ), and finally all the chains in the name of the Holy Spirit; He touches the base and the lid of the censer, blesses it and makes the sign of the cross on himself; He censes the Eucharist, the sanctuary, the lectern, the other altars and the people; He kisses the altar and hands the censer to the thurifer, who receives it after kissing his hand","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Blessing of the censer)"},{"q":"Why are the prayers performed by the church for the departed ones proper and scriptural?","a":"There is no prayer in the church for the dead - all prayers are for the departed, which means a transfer from one place to another; The death of a believer is compared to sleep - Jesus said Lazarus was sleeping and \"I go, that I may awake him from sleep\" (John 11:11); Jesus said, \"I am the resurrection and the life: he that believes in me, though he were dead, yet shall he live\" (John 11:25); That is why a believer's tomb reads 'So and so sleeps in the Lord'; \"The Lord is kind to the living and to the dead\" (Ruth 2:20), and \"whether we live or die, we are the Lord's\" (Rom. 14:8-9) - so the departed are alive in the other world; St. Paul teaches that we should pray for each other, and it is the duty of every believer to pray for the spiritual welfare of others; St. Paul prayed for his departed friend Onesiphorus: \"May the Lord grant him his mercy on that day!\" (II Tim. 1:16-18); So the prayers of the church for the departed are proper and scriptural","ref":"Class IX textbook, Chapter 17 – True Creed (Prayer for the departed souls)"}]}},{"no":2,"s":{"mcq":[{"q":"Which was the first Gentile family to be baptized in Europe?","o":["The centurion's family","The servant woman's family","Lydia's family","The jailer's family"],"a":3},{"q":"In which city did St. Paul cure a man lame from birth, after which the crowd believed that Paul and Barnabas were gods in human form?","o":["Perga","Selucia","Paphos","Lystra"],"a":3},{"q":"Into how many portions was the Tabernacle complex divided?","o":["1","2","3","4"],"a":2},{"q":"\"Msamrono\" means","o":["A priest","A group of priests","A group of singers","A singer"],"a":3},{"q":"Who was elected President of the Episcopal Synod after the death of Geevarghese Mor Gregorious?","o":["Thomas Mor Athanasius","Thomas Mor Dionysius","Benjamin Mor Osthathius","Joseph Mor Gregorius"],"a":1},{"q":"According to the lesson, who are known as saints?","o":["Those who are purified through Jesus Christ","Those who have seen an angel","Those who live in the Temple","Those who are born in Israel"],"a":0}],"name":[{"q":"The Roman General who defeated the Greeks in 63 B.C. and took Jerusalem","a":"Pompey"},{"q":"The woman St. Peter raised from the dead while he was in Joppa","a":"Tabitha"},{"q":"The place where St. Peter founded the Holy See","a":"Antioch"},{"q":"Who visited Malankara in February 1982 and observed the 50th memorial day of H.H. Elias III?","a":"H.H. Moran Mor Ignatius Zakka I"},{"q":"The meaning of the word \"Evangelion\"","a":"Gospel (Good news)"},{"q":"The tribe set apart for service at the Tabernacle and for carrying it from place to place","a":"The tribe of Levy (Levi)"}],"tf":[{"q":"The Jerusalem Synod decided that Gentile believers should undergo circumcision.","a":false},{"q":"St. Peter stayed with Simon, a tanner, in Joppa.","a":true},{"q":"During the Holy Qurbono, three lections are read before the reading of the Gospel.","a":false},{"q":"St. Baselius of Caesarea started the first monastery at Annase.","a":true}],"fill":[{"q":"God came down into the Tabernacle at the Most Holy Place and spoke to Moses from the ______.","a":"Mercy Seat"},{"q":"In Thessalonica, Paul and Silas stayed in the house of ______.","a":"Jason"},{"q":"On their way back in the first missionary journey, Paul and Barnabas appointed ______ in each church.","a":"elders (priests)"},{"q":"The Malankara Association that met on 27th December 2000 at Puthencruz elected H.G. Thomas Mor Dionysius as the Catholicose ______.","a":"nominee"},{"q":"\"Sedro\" means ______ or array.","a":"row"}],"match":{"l":["Maccabees","Antipater","Lydia","Dionysus","Habibai","Emmelia","Brass snake"],"r":["Council member in Athens who accepted the faith","Mother of St. Baselius","Hammer","Dealer in purple cloth","My beloved","An Edomite","Jesus on the Cross"],"key":[2,5,3,0,4,1,6]},"short":[{"q":"Write a short note on the Altar of Burnt Offerings.","a":"The Altar of Burnt Offerings was a square altar of acacia wood with four horns, covered with bronze, and all its equipment was of bronze. It stood at the entrance of the court so that everybody could see it, and fowls and beasts were sacrificed on it regularly. It was also a refuge for a person who had killed someone unintentionally - he was safe there until the crime was proved.","ref":"Class IX textbook, Chapter 4 – Tabernacle (Furnishings at the Court)"},{"q":"Why is the Cross called the symbol of salvation?","a":"The Cross is the symbol of salvation - the symbol of the Lord who died and rose again - and on Good Friday we kneel before it and salute it. Jesus achieved salvation for our souls through the Cross. The sacrificial death of God the Son on the Cross was God's plan to save the human race, which had become slaves to sin, from death.","ref":"Class IX textbook, Chapter 17 – True Creed (The Cross)"},{"q":"What is the Anaphora? Who could attend it in the early church?","a":"The Anaphora is the holy sacrifice in which the bread and wine are transformed into the body and blood of Christ. In the early church only those who had accepted the faith and been baptized could attend it. The catechumens (those not yet baptized) could stay only up to the Nicene Creed; when the thurifer went west incensing they were sent out and the doors were closed.","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Incensing to the west)"},{"q":"Write a short note on the Mass Communion of 101 priests and prelates.","a":"It was held on 2nd November 2002 at a specially arranged altar at the Patriarchate centre, Puthencruz, in connection with the 100th memorial anniversary of St. Gregorius (Parumala Thirumeni). The chief celebrant was H.B. Arch Catholicose Baselius Thomas I. It is an event to be recorded in golden letters in the history of the Jacobite Syrian Church.","ref":"Class IX textbook, Chapter 23 – Elevation of His Beatitude Catholicose Baselius Thomas I (Mass Communion of 101 priests and prelates)"}],"para":[{"q":"Write a note on the third missionary journey of St. Paul.","a":"From Antioch Paul went through Galatia and Phrygia to Ephesus, where the believers received the Holy Spirit when he laid his hands on them; He preached three months in the synagogue and two years in the lecture hall of Tyrannus (where he wrote 1 Corinthians), and even handkerchiefs he had used cured the sick, so magicians burnt their books; Demetrius, leader of the silversmiths who made silver models of Artemis, started a riot, which the town clerk calmed down; Paul went to Macedonia (wrote 2 Corinthians) and stayed three months in Corinth, where he wrote to the Galatians, the Romans and again to the Thessalonians; At Troas he brought Eutychus back to life, and at Miletus he bid farewell to the elders of Ephesus; At Caesarea the prophet Agabus warned that he would be arrested, but Paul went on to Jerusalem and reported to James all that God had done among the Gentiles","ref":"Class IX textbook, Chapter 15 – The Third Missionary Journey of St. Paul"},{"q":"Explain the rules regarding the ringing of bells in our worship.","a":"Church bells must not be rung under any circumstances after the public commencement of the Holy Mass; Small bells and fans may be rung inside the sanctuary; Ringing bells, gun salutes and firing cannons during the elevation or procession of the holy mysteries are highly objectionable and wrong; They are petty traditions that insult the Holy Eucharist and wrong the priest and the faithful; They disturb the concentration of the priest and the faithful on the service","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Rules regarding ringing of bells)"},{"q":"Write about St. Gregorius Nazianzen.","a":"St. Gregorius was born in 330 A.D. at Arianzus near Nazianzus in Cappadocia, in an aristocratic family, and was a close friend of St. Baselius; After primary education in Caesarea he studied in Athens, staying with Baselius, and helped him codify the monastic rules; His aged father appointed him as his assistant; Invited to Constantinople, he brought back many believers who had followed the false teachings of Arius, and was elected Bishop of Constantinople in 381 A.D.; He gave up the office to avoid a split in the church and spent his time in meditation and prayer until his death in 390 A.D.; His discourses, poems and letters are of a very high standard and have been translated into many languages","ref":"Class IX textbook, Chapter 24 – Cappadocian Fathers (St. Gregorius Nazianzen)"}],"essay":[{"q":"Briefly explain the sacrifices of the Old Testament and the sacrifice of Calvary.","a":"Burnt Offering (sweet savour offering): a male animal without blemish, wholly burnt on the altar - the offerer laid his hand on its head as his atonement; Meat Offering: fine flour, pure olive oil and frankincense - a handful burnt as a token that all was offered to the Lord; Peace Offering (Thanksgiving Sacrifice): offered for fellowship - all the fat was burnt, and the priest and the offerer received portions; Sin Offering: for the atonement of a sin by a person or the whole congregation - part was burnt, and the rest eaten only by the male members of the priests' families; Trespass Offering: a ram without blemish, with repayment of the harm plus 20%; Other offerings included the continual burnt offering, the vow, voluntary, fellowship, wave and heave, and food offerings; These sacrifices brought only temporary benefits and could not bring permanent salvation or forgiveness of sin; Jesus, the Lamb of God without blemish, offered His own flesh and blood at Calvary and gave permanent salvation and forgiveness - all Old Testament sacrifices pointed to this","ref":"Class IX textbook, Chapter 5 – Sacrifices of Israelites"},{"q":"The last days of St. Paul","a":"Jews from Asia saw Paul in the Temple with Trophimus and stirred up a riot, and the Roman commander rescued him and released him when he learnt Paul was a Roman citizen; When some Jews vowed to kill him, his sister's son revealed the plot, and Paul was sent by night to Governor Felix at Caesarea; The High Priest Ananias and the lawyer Tertullus accused him before Felix, who kept him in prison for two years; Before Porcius Festus, Paul appealed to the Emperor as a Roman citizen, and he also spoke before King Herod Agrippa; He was sent to Rome under Julius, and ignoring his warning at Phoenix in Crete, the ship drifted 14 days in a storm and was wrecked at Malta; At Malta a snake fastened on his hand but he was unharmed, and through his prayers the father of Publius and many others were cured; In Rome he lived two years in a rented house, preaching freely, and wrote to the Ephesians, Colossians, Philemon and Philippians; He was set free in 63 A.D., later arrested again during Nero's persecution, and was beheaded in 67 A.D.","ref":"Class IX textbook, Chapter 16 – The Last Days of St. Paul"}]}},{"no":3,"s":{"mcq":[{"q":"The idol of which Greek god was installed by Antiochus Epiphanes in the most holy place of the Temple?","o":["Artemis","Hermes","Jupiter","Zeus"],"a":2},{"q":"Who was the lady ruler of the second generation of Maccabees?","o":["Salomi Alexandra","Herodias","Queen of Sheba","Ruth"],"a":0},{"q":"What was the name of the Gentile with whom St. Paul was seen in Jerusalem, which led to a riot?","o":["Didymus","Alexander","Trophimus","Gaius"],"a":2},{"q":"Who was Demetrius?","o":["A Roman soldier","A carpenter","A silversmith","The town clerk"],"a":2},{"q":"What are the steps in front of the altar called?","o":["Durgo","Marvahtso","Thirasheela","Sleeba"],"a":0},{"q":"The Rules of St. Baselius are still followed by which monastic orders?","o":["Egyptian desert hermits","Latin monastic orders","Greek monastic orders","Indian ashrams"],"a":2}],"name":[{"q":"The person whose name means \"Small\"","a":"Paul (Saul)"},{"q":"The husband and wife who were tent makers and with whom St. Paul stayed at Corinth","a":"Aquila and Priscilla"},{"q":"The festival celebrated every year in memory of the rededication of the Temple by the Maccabees","a":"The Festival of Dedication"},{"q":"Who helped St. Baselius to codify the monastic rules?","a":"St. Gregorius Nazianzen"},{"q":"To whom did Jesus say, \"If I do not wash you, you have no part with me\"?","a":"St. Peter"},{"q":"The name of the fans held by the altar boys","a":"Marvahtso"}],"tf":[{"q":"The entrance to the sacred tent of the Tabernacle was on the east side.","a":true},{"q":"The Golden Lamp Stand was a furnishing of the Most Holy Place.","a":false},{"q":"The second Synod of Mulanthuruthy was summoned on 25th September 2005.","a":false},{"q":"St. Paul wrote the first letter to the Thessalonians while he was at Corinth.","a":true}],"fill":[{"q":"The main point of disagreement at the Jerusalem Synod was about the ______ who accepted the faith.","a":"Gentiles"},{"q":"The Altar of Burnt Offerings was a refuge for a person who had killed another person ______.","a":"unintentionally"},{"q":"H.H. Ignatius Zakka I elevated H.G. Mar Dionysius as the ______ on 26th July 2002.","a":"Arch Catholicose of the East"},{"q":"From Thessalonica, the believers sent Paul and Silas to ______, where the people listened to the message eagerly.","a":"Berea"},{"q":"\"Stoumenkalos\" means \"______\".","a":"Let us stand well"}],"match":{"l":["Mercy Seat","Mattathias","Barnabas","Julius","Bishops","Kuriakose Mor Theophilos","Abraham"],"r":["Called Zeus by the crowd at Lystra","Roman officer who took Paul to Rome","Rejoiced to see the day of Jesus","Consecrated bishop by Baselius Thomas I in 2003","Father of the Maccabees","Always stand on the northern side of the sanctuary","Kept on top of the Covenant Box"],"key":[6,4,0,1,5,3,2]},"short":[{"q":"What is Hoosoyo? What does the priest ask God in it?","a":"Hoosoyo means 'propitiatory prayer' and it follows the Promeon. In it the priest, on behalf of the penitent congregation, begs the Lord for mercy and absolution. He asks God, who saves us by wiping out all our sins, to accept the prayers and petitions of the Sedro that follows.","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Hoosoyo)"},{"q":"Who was Timothy? How did he become St. Paul's co-worker?","a":"Paul met Timothy at Derbe and Lystra during his second missionary journey. His mother Eunice and grandmother Lois were Jews who had accepted the faith, and his father was a Greek. Timothy was known to the believers at Lystra and Iconium as a just and good man, so Paul took him as his co-worker.","ref":"Class IX textbook, Chapter 14 – The Second Missionary Journey of St. Paul"},{"q":"How was H.H. Moran Mor Ignatius Zakka I elected Patriarch? What was special about it?","a":"After H.H. Ignatius Yacob III passed away on 20th June 1980, H.G. Severios Zakka, Metropolitan of Baghdad, was elected and elevated as Patriarch of Antioch and all the East with the title Moran Mor Ignatius Zakka I. He was elevated by the bishops under the leadership of the Arch Catholicose of the East, Baselius Paulose II. It was the first time in the history of the Syrian Orthodox Church that the Catholicose of the East presided over the election and elevation of the Patriarch.","ref":"Class IX textbook, Chapter 21 – Malankara Visit of H.H. Moran Mor Ignatius Zakka I"},{"q":"Why is the death of a believer compared to sleep?","a":"When Lazarus had died, Jesus told His disciples that Lazarus was sleeping and said, \"I go, that I may awake him from sleep\" (John 11:11); because he was sleeping, he came out of the grave when Jesus called him. A sleeping person can be woken up, so the death of a believer is only a sleep in the Lord, not an end. That is why the tomb of a believer reads 'So and so sleeps in the Lord'.","ref":"Class IX textbook, Chapter 17 – True Creed (Prayer for the departed souls)"}],"para":[{"q":"Write about the works and activities of St. Peter.","a":"Peter strengthened the believers near Jerusalem - at Lydda he cured Aeneas, and at Joppa he raised Tabitha and stayed with Simon the tanner; At Caesarea he preached to Cornelius, a Roman army captain, and the Gentiles also received the grace of God; He founded the Holy See at Antioch, where the believers were first called 'Christians'; Herod Agrippa put him in jail, but an angel set him free and he went to the Mansion of Mark; He was a key person at the Jerusalem Synod (51 A.D.) and later visited Corinth and Rome; During Nero's persecution he was imprisoned, wrote two Epistles, and was crucified upside down at Rome on 29th June 67 A.D.","ref":"Class IX textbook, Chapter 11 – Activities of Peter"},{"q":"Write about the Tabernacle - how it was made and how God was present in it.","a":"The Tabernacle was the temporary place of worship during the 40-year journey to Canaan, made so that it could be carried along, and the tribe of Levy served at it and carried it; It was made under Moses exactly as per the model God revealed at Mount Sinai: \"Have them make me a sanctuary, so that I may dwell among them\"; It was called the Tent of the Lord's Presence and the Tabernacle of the Congregation, where the people received revelations from God; It had three parts - the Most Holy Place, the Holy Place and the Court; It was erected on the first day of the first month of the second year of the Exodus, and a cloud covered it by day and fire by night - Israel moved only when the cloud lifted; God spoke to Moses from the Mercy Seat, between the cherubim above the Ark of the Covenant","ref":"Class IX textbook, Chapter 4 – Tabernacle"},{"q":"Write about St. Gregorius of Nyssa.","a":"St. Gregorius of Nyssa was the second son of Baselius and Emmelia, and his eldest brother St. Baselius was his first teacher; He became a deacon and a monk, left monastic life for a while but came back to it; He was appointed Episcopa of Nyssa in 372 A.D. and, though not strong in administration, kept the believers in the Nicene Creed; He took an active part in the Holy Synod of Constantinople in 381 A.D.; He wrote more books than any other Cappadocian Father and taught that Christian life is an imitation of the divine character, as man is made in God's image; He is believed to have died in 394 A.D.","ref":"Class IX textbook, Chapter 24 – Cappadocian Fathers (St. Gregorius of Nyssa)"}],"essay":[{"q":"Why was death on the Cross selected?","a":"Man sinned through a tree (the tree of knowledge), so a tree - the Cross - was chosen to take part in the atonement; Eve, a woman, caused the fall, so a woman - Virgin Mary - was included in the plan of redemption; Man disobeyed God's command, so only a man who obeyed God - Jesus Christ - could redeem mankind; Through sin, man and the earth were accursed (Gen. 3:17), and so were their children, represented by Cain - only one not born of the accursed race could make full atonement; \"He that is hanged is accursed of God\" (Deut. 21:23) - sinless Jesus took the curse of mankind on the Cross and removed it forever; The prophet Isaiah foretold His sufferings and death (Isaiah 52-53); Jesus said, \"As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up\" (John 3:14-15) - whoever looks at Jesus on the Cross with faith escapes death; So even the most accursed can be saved through the Cross, and the Church honours it as the symbol of redemption","ref":"Class IX textbook, Chapter 17 – True Creed (Why death on the cross was selected)"},{"q":"Explain the reading of the two lections before the Gospel during the Holy Mass.","a":"There are two lections before the Gospel; After 'Bhoovilasesham', the lector stands one step down on the northern side of the sanctuary facing west and kisses the northern corner of the altar; He reads the first lection from the Acts of the Apostles or an epistle by an Apostle other than St. Paul, addressing the people 'Habibai' (my beloved) at the beginning and the end; The thurifer, with a lighted candle in his left hand, stands on the left of the lector and waves the censer; After 'Paulose Sleeho', the second lection is read from a letter of St. Paul, standing one step down at the southern corner, with the salutation 'Ahai' (my brethren); The thurifer then stands with a lighted candle on the right of the lector and waves the censer; At the end of every lection the lector kisses the book with a 'Barekmore'","ref":"Class IX textbook, Chapter 25 – Worship – A Study"}]}},{"no":4,"s":{"mcq":[{"q":"After Judas Maccabees was killed in battle, which of his brothers took up the leadership?","o":["John","Simon","Jonathan","Eleazar"],"a":2},{"q":"In which part of the Tabernacle was the Covenant Box placed?","o":["The Holy Place","The Most Holy Place","Near the entrance gate","The Court"],"a":1},{"q":"Which disciple preached in the synagogue in Athens and in the city council, Areopagus?","o":["Silas","St. Paul","Barnabas","St. Peter"],"a":1},{"q":"The first preaching of the Gospel in Europe was done at","o":["Berea","Philippi","Athens","Thessalonica"],"a":1},{"q":"Where were the holy remains of H.B. Arch Catholicose Baselius Paulose II laid to rest?","o":["Simhasana church, Perumpilly","Manjinikara","St. Mary's Church, Manarkadu","Malecruz Dayara near Puthencruz"],"a":3},{"q":"\"Thirasheela\" means","o":["Crown","Fan","Sanctuary","Veil (curtain)"],"a":3}],"name":[{"q":"The third son of Mattathias who was elected leader and accepted the name 'Maccabees'","a":"Judas"},{"q":"The lawyer who went with the High Priest Ananias to accuse Paul before Governor Felix","a":"Tertullus"},{"q":"The prophet at Caesarea who told Paul that he would be arrested in Jerusalem","a":"Agabus"},{"q":"The present Catholicos of the Malankara Jacobite Syrian Church","a":"H.B. Aboon Mor Baselios Joseph I"},{"q":"The day on which we kneel down before the Cross and salute it as the symbol of our salvation","a":"Good Friday"},{"q":"The Syriac name for deacons of the 6th order","a":"Mshamshono"}],"tf":[{"q":"The Altar of Burnt Offerings was covered with pure gold.","a":false},{"q":"During the second missionary journey, St. Paul took Barnabas and John Mark with him.","a":false},{"q":"St. Paul wrote the first letter to the Corinthians while he was preaching at the lecture hall of Tyrannus in Ephesus.","a":true},{"q":"Ringing of small bells and fans is permitted inside the sanctuary.","a":true}],"fill":[{"q":"From Troas, Paul went to Assos and sailed to ______, where the elders of the church at Ephesus met him.","a":"Miletus"},{"q":"The Meat Offering to the Lord was made of fine flour, pure olive oil and ______.","a":"frankincense"},{"q":"The Maccabean revolution started in ______ B.C.","a":"167"},{"q":"During his 1982 visit, H.H. Zakka I consecrated Rev. Fr. A.C. Abraham as Metropolitan ______ at Kothamangalam.","a":"Abraham Mor Severius"},{"q":"St. Paul says, \"Be joyful always, pray at all times, be ______ in all circumstances.\"","a":"thankful"}],"match":{"l":["Continual burnt offering","Wave offering","Publius","Apollos","Ahai","Kuriakose Mor Julius","Isaiah"],"r":["Prophesied the sufferings and death of Jesus","My brethren","Chief of the island of Malta","Two one-year-old lambs sacrificed every day","Waved towards the brazen altar","Metropolitan for Simhasana churches","Learned more about Jesus from Aquila"],"key":[3,4,2,6,1,5,0]},"short":[{"q":"Explain the Trespass Offering.","a":"If a person sinned through ignorance in regard to the holy things of the Lord, or refused to return a deposit, stole, cheated or lied about something lost, he had to make a trespass offering. He repaid the harm in full plus an additional 20%, and brought a ram (male sheep or goat) without blemish to the priest. The priest offered a sacrifice for his sin and he was forgiven.","ref":"Class IX textbook, Chapter 5 – Sacrifices of Israelites (Trespass Offering)"},{"q":"How was St. Peter set free from prison?","a":"Herod Agrippa put Peter in jail during the Festival of Unleavened Bread and planned a public trial, while the church prayed earnestly for him. The night before the trial an angel woke him as he slept between two guards; the chains fell off, and the angel led him past the two guard-posts and the Iron Gate opened by itself. Peter went to the Mansion of Mark, where people were praying for him, and told them what had happened.","ref":"Class IX textbook, Chapter 11 – Activities of Peter"},{"q":"What is the absolution? Why does the celebrant wash the tips of his fingers?","a":"After handing over the censer, the celebrant washes the tips of his fingers, kisses the altar and turns to the west asking the people to pray to the Lord for his absolution, and the people pray that the Lord accept his Communion. He washes just his fingertips to show that he enters the holy mysteries only after washing away even the slightest sins. By asking for their prayers he asks the people to pardon any wrong he has done them before he touches the body and blood of the Lord.","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Absolution)"},{"q":"Write about the Universal Synod of 1981.","a":"H.H. Zakka I summoned the Universal Synod of the Syrian Orthodox Church from 17th to 24th November 1981, attended by the Arch Catholicose and important bishops from Malankara. Its decisions aimed at the unity and peaceful progress of the Malankara Church and at keeping its strong relationship with the Holy See of Antioch from the early centuries. The decisions also reiterated the authority of the Apostolic See of Antioch over the Malankara Church.","ref":"Class IX textbook, Chapter 21 – Malankara Visit of H.H. Moran Mor Ignatius Zakka I"}],"para":[{"q":"Explain the furnishings at the Holy Place of the Tabernacle.","a":"Table for the bread offered to the Lord: made of acacia wood covered with pure gold, with golden dishes, plates, cups, jars and bowls - placed in the northern part of the Holy Place; Golden Lamp Stand: one piece of pure gold with a shaft and six branches (seven lamps), decorated with almond-blossom flowers; It stood outside the curtain in the southern part of the Holy Place, and its lamps burnt from evening to dawn every day; Altar for Burning Incense: made of acacia wood with horns at the four corners and covered with pure gold; It was placed before the Covenant Box, just outside the Most Holy Place, and sweet incense was burnt on it every morning and evening - only priests could see it","ref":"Class IX textbook, Chapter 4 – Tabernacle (Furnishings at the Holy Place)"},{"q":"Write a note on the first missionary journey of St. Paul.","a":"Inspired by the Holy Spirit, the prophets and teachers at Antioch fasted, prayed, laid hands on Barnabas and Saul and sent them out; From Selucia they sailed to Salamis in Cyprus with John Mark, and here Saul took the new name Paul ('Small'); At Paphos Paul made Elymas blind for a time, and the governor Sergius believed; At Perga John Mark left them, and at Antioch in Pisidia many believed but jealous Jews opposed them; At Lystra Paul healed a man lame from birth and the crowd called Barnabas Zeus and Paul Hermes, but later Jews stoned Paul and dragged him out as dead; They went to Derbe, then returned strengthening the believers and appointing elders in each church, and sailed from Attalia to Antioch to report how God had opened the way for the Gentiles","ref":"Class IX textbook, Chapter 12 – The Church Expands – The First Missionary Journey of St. Paul"},{"q":"Who are saints? How do we know that the departed saints are alive?","a":"Saints are those purified through Jesus Christ who stay close to the Lord, and they continue to be saints after death; God said, \"I am the God of Abraham, the God of Isaac and the God of Jacob\", and Jesus said, \"He is not a God of the dead, but of the living\" - so they are still living; Death is not an end but a change from one state to another; Jesus said that Abraham, who had died long before, rejoiced to see His day; Moses and Elijah, departed saints, talked with Jesus on the mount of transfiguration about His journey to the Cross - so departed saints are alive and know future events; The saints remain dear to the Lord, and their commemoration brings blessings to us","ref":"Class IX textbook, Chapter 17 – True Creed (Saints)"}],"essay":[{"q":"Write about the Cappadocian Fathers.","a":"The Cappadocian Fathers were spiritual scholars given by the Cappadocian Church when the church in Asia Minor was troubled by heresies; They were St. Baselius of Caesarea, his close friend St. Gregorius Nazianzen and his brother St. Gregorius of Nyssa, who excelled in work, preaching and philosophy respectively; St. Baselius (330-379 A.D.), called the 2nd Athanasius, started the first monastery at Annase, became Bishop of Caesarea in 372 A.D., did great social service and wrote Rules still followed by Greek monastic orders; Baselius also strongly opposed the Macedonian heresy; St. Gregorius Nazianzen (330-390 A.D.) helped Baselius codify the monastic rules and brought back many from the teachings of Arius; He became Bishop of Constantinople in 381 A.D. but resigned to avoid a split, and his discourses, poems and letters are of a very high standard; St. Gregorius of Nyssa became Episcopa of Nyssa in 372 A.D., kept the believers in the Nicene Creed and took part in the Synod of Constantinople (381 A.D.); He wrote more books than any other Cappadocian Father and is believed to have died in 394 A.D.","ref":"Class IX textbook, Chapter 24 – Cappadocian Fathers"},{"q":"Explain the reading of the Gospel (Evangelion) and the salutation 'Barekmore'.","a":"'Evangelion' means 'Gospel' (good news), read from one of the first four books of the New Testament; The words spoken by our Lord are read in the Evangelion, so everyone should reach the church before it; Before it the thurifer summons all except the priest to listen with calmness and reverence to the living words of the Holy Gospel - for the word of God is sharper than any two-edged sword (Heb. 4:12); The priest gives the blessing of peace before and after the Gospel, showing that one who listens to God's word gets peace and love; The thurifer stands one step down on the north side of the lectern with his left hand on his chest, and two candles are lit - if he is alone he holds the candle, the censer and the bell; 'Barekmore' means 'Grant us O Lord' - by saying it one asks permission to make special requests or perform rites; All except the extoller say Barekmore wherever it is needed, and at the end of every lection the lector kisses the book with a Barekmore","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Reading of the Gospel; Salutation by Barekmore)"}]}},{"no":5,"s":{"mcq":[{"q":"The 'Thanks Giving Sacrifice' is also called","o":["Peace Offering","Trespass Offering","Sin Offering","Meat Offering"],"a":0},{"q":"How many lamps did the Golden Lamp Stand of the Tabernacle have?","o":["Three","Twelve","Seven","Six"],"a":2},{"q":"From which place did St. Paul start his missionary journeys?","o":["Antioch","Jerusalem","Cyprus","Damascus"],"a":0},{"q":"To which Governor was St. Paul sent at night, under guard, with a letter?","o":["Pilate","Felix","Sergius","Festus"],"a":1},{"q":"St. Baselius of Caesarea was popularly called","o":["The 2nd Athanasius","The Miracle Worker","The Hammer","The Light House"],"a":0},{"q":"While blessing the censer, the celebrant holds two chains together to indicate","o":["Heaven and earth","The Old and New Testaments","The manhood and godhead of Jesus Christ","The priest and the deacon"],"a":2}],"name":[{"q":"The mountain where the model of the Tabernacle was revealed to Moses","a":"Mount Sinai"},{"q":"The island in which Phoenix, the harbour where Paul warned about the dangerous voyage, was situated","a":"Crete"},{"q":"The Governor who succeeded Felix","a":"Porcius Festus"},{"q":"The chief celebrant of the Mass Communion of 101 priests and prelates","a":"H.B. Arch Catholicose Baselius Thomas I"},{"q":"Since Eve, a woman, caused the fall, the woman God included in the plan of redemption","a":"Virgin Mary"},{"q":"Who stated in the 95th custom that those without a proper voice should not make chaos by singing liturgy songs?","a":"Mor Yacob of Urahah"}],"tf":[{"q":"The Tabernacle was made in such a way that the Israelites could carry it along when they moved from place to place.","a":true},{"q":"The Bronze Basin was kept inside the Most Holy Place.","a":false},{"q":"At the Jerusalem Synod, St. Paul explained from the scriptures that it was God's will that the Gentiles were turning to God.","a":false},{"q":"The Nicene Creed is recited by a deacon or an altar boy standing one step down on the northern side of the sanctuary.","a":true}],"fill":[{"q":"The Jerusalem Synod was convened after the ______ missionary journey of St. Paul.","a":"first"},{"q":"During the 1982 visit, H.H. Zakka I consecrated Chrism (Mooron) at St. Mary's Church, ______, Kottayam.","a":"Manarkadu"},{"q":"The Tabernacle was erected on the first day of the first month of the ______ year of the Exodus.","a":"second"},{"q":"\"The Lord is kind to the living and to the ______\" (Ruth 2:20).","a":"dead"},{"q":"The Evangelion is read from one of the first ______ books of the New Testament.","a":"four"}],"match":{"l":["Day of Atonement","Table for the bread","Judas and Silas","Son of Paul's sister","Trisagion","St. Gregorius of Nyssa","Onesiphorus"],"r":["Holy art thou O God","High priest entered the Most Holy Place","Synod of Constantinople, 381 A.D.","Northern part of the Holy Place","Paul prayed for mercy on his family","Told about the plot to kill Paul","Took the Synod's letter to Antioch"],"key":[1,3,6,5,0,2,4]},"short":[{"q":"Write about the activities of St. Peter at Lydda and Joppa.","a":"At Lydda, a village west of Jerusalem near the harbour of Joppa, Peter cured a paralytic named Aeneas. At Joppa he raised a woman named Tabitha and stayed with Simon, a tanner. Because of these works many people joined the church in these places, which were mainly Gentile.","ref":"Class IX textbook, Chapter 11 – Activities of Peter"},{"q":"Why was there a riot at Ephesus during Paul's third missionary journey?","a":"Ephesus had a great temple of the goddess Artemis, and silver models of her were sold at great profit. Paul preached that hand-made gods are not gods at all, so the demand for idols fell and their business was ruined. Demetrius, leader of the silversmiths, and his friends started a riot, which the town clerk calmed down.","ref":"Class IX textbook, Chapter 15 – The Third Missionary Journey of St. Paul"},{"q":"How is the brass snake lifted up by Moses related to the Cross?","a":"Moses lifted up a brass snake on a wooden pole in the middle of the camp, and whoever was bitten by a snake and looked at it with faith escaped death. Jesus said, \"As Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up\" (John 3:14-15). So whoever looks at Jesus on the Cross with faith escapes death and has eternal life.","ref":"Class IX textbook, Chapter 17 – True Creed (Why death on the cross was selected)"},{"q":"Write about the second Malankara visit of H.H. Zakka I and the Second Synod of Mulanthuruthy.","a":"The second Malankara visit of His Holiness was on 7th April 2000, in connection with the Golden Jubilee of the episcopal consecration of Koobar Neethe Hakkemo Abraham Mor Clemis. The Syrian Christian Association, popularly known as the Second Mulanthuruthy Synod, was summoned at St. Thomas Church, Mulanthuruthy on 27th September 2004. It was presided over by His Holiness.","ref":"Class IX textbook, Chapter 21 – Malankara Visit of H.H. Moran Mor Ignatius Zakka I"}],"para":[{"q":"Write a note on the second missionary journey of St. Paul.","a":"Paul and Barnabas separated over John Mark, so Paul took Silas, and at Lystra he took Timothy as his co-worker; The Holy Spirit led them to Troas, where Paul saw a vision of a Macedonian begging, \"Come over to Macedonia and help us!\"; At Philippi - the first preaching in Europe - Lydia became the first Christian baptized in Europe; Paul and Silas were beaten and jailed after Paul freed a servant girl from an evil spirit, but an earthquake opened the prison, and the jailer's family became the first Gentile family baptized in Europe; They preached at Thessalonica (house of Jason) and Berea, and at Athens the council member Dionysus believed; At Corinth Paul stayed 1 1/2 years with Aquila and Priscilla and wrote the first letter to the Thessalonians, then went by Ephesus and Caesarea to Jerusalem and back to Antioch","ref":"Class IX textbook, Chapter 14 – The Second Missionary Journey of St. Paul"},{"q":"Besides the five main sacrifices, explain the other offerings of the Israelites.","a":"Continual burnt offering: two one-year-old lambs every day, one in the morning and one in the evening, with fine flour, olive oil and wine; Offering in fulfilment of a vow: may be eaten on the next day, but anything left on the third day must be burnt; Voluntary offering: offered not for any particular purpose but for the blessings of the Lord; Fellowship offering: a small portion of one's abundance (grain or spoils of war) offered to the Lord; Wave and heave offerings: waved towards and away from the altar, or lifted up and down - offered to the Lord and returned to His servants; Food offering: a portion of flour, olive oil and incense burnt on the altar, and the rest belongs to the priest","ref":"Class IX textbook, Chapter 5 – Sacrifices of Israelites"},{"q":"Explain the rules about standing in the sanctuary and not walking with one's back to the priest.","a":"The priest celebrates as the envoy of Jesus, so Jesus is present in the sanctuary and no one may walk with his back to Him; While censing, only the deacon may walk across the sanctuary - others must go around the altar or step down to the other side; One must enter the sanctuary through the south and leave through the north, going around praying and kissing the altar; All except the priest and the thurifer stand according to title and seniority - if of the same title, by age, elders on the north and younger ones on the south; Bishops always stand on the northern side, and the Patriarch and the Catholicose also follow this order; The same rule is followed during the daily prayers in the church","ref":"Class IX textbook, Chapter 25 – Worship – A Study (Do not walk turning your back to the priest; Line up in the sanctuary)"}],"essay":[{"q":"Explain the role of the Maccabees in restoring the true faith of the people.","a":"Under Greek rule, King Antiochus Epiphanes plundered the Temple, stopped sacrifices and installed an idol of Jupiter in the most holy place; He burnt the holy book, stopped circumcision and the Sabbath, forced the Jews to sacrifice swine to idols and killed those who disobeyed; At Modein the old priest Mattathias refused to sacrifice to an idol, killed the officer and fled to the mountains with his five sons, starting the Maccabean revolution in 167 B.C.; Judas, his third son, was elected leader and took the name 'Maccabees' ('hammer'); After five years of struggle they captured Jerusalem, purified the Temple and rededicated it - remembered every year as the Festival of Dedication (John 10:22); After Judas was killed at Elasa, Jonathan and then Simon led them, and the first generation ended with Simon's death in 134 B.C.; In the second generation John Hyrcanus ruled well, but later rulers fought for power, and the brothers Hyrcanus II and Aristobulus II quarrelled for the throne; In 63 B.C. the Roman General Pompey took Jerusalem, ending the rule of the Maccabees, which had lasted about a century","ref":"Class IX textbook, Chapter 6 – Maccabees"},{"q":"Write about the consecration of additional bishops for the Malankara Church and the departure of the 'Light House of Malankara'.","a":"Joseph Ramban, secretary to His Holiness, was consecrated on 7th October 1984 as Benjamin Mor Osthathius for the Simhasana churches; With His Holiness' permission, Arch Catholicose Baselius Paulose II consecrated Yuhanon Mor Philexenos for Malabar (1985) and Thomas Mor Thimotheos for the Outside Kerala Diocese (1991); His Holiness consecrated Geevarghese Mor Policarpus for the Eastern Gospel Society (1990) and Joseph Mor Gregorius for Cochin Diocese (1994, at Damascus), and Kuriakose Mor Julius was consecrated for the Simhasana churches in 1998; The 'Light House of Malankara', Arch Catholicose Baselius Paulose II, departed on 1st September 1996 and was laid to rest at Malecruz Dayara near Puthencruz; The Episcopal Synod elected Geevarghese Mor Gregorious as its president, and after his death on 22nd February 1999 Thomas Mor Dionysius was elected; Thomas Mor Athanasius, Yuhanon Mor Militius and Zachariah Mor Nicholavos betrayed the mother church and crossed over to the Methran faction; His Holiness consecrated Mathews Mor Ivanius and Markose Mor Koorilose in 2001, and four more Metropolitans at Damascus on 8th December 2002","ref":"Class IX textbook, Chapter 22 – Consecration of Additional Bishops"}]}}]},{"c":"X","sections":[{"n":"Old Testament","units":[{"t":"Lesson 1 – Compilation of the Pentateuch","q":[["The first five books of the Old Testament are together known as:",["The Wisdom Books","The Prophets","The Psalms","The Pentateuch"],3,""],["The first five books of the Old Testament are also called the Books of:",["Moses","Solomon","David","Abraham"],0,"QP 2014"],["According to the lesson, which is the most sublime of all the promises in the Pentateuch?",["The promise of a king","The promise of Canaan","The promise of rain","The promise of a temple"],1,""],["Canaan, the promised land, is described as the land where ____ flows.",["gold and silver","milk and honey","water and wine","wine and oil"],1,""],["Where does the narration in the Pentateuch end?",["With the Babylonian captivity","With the building of the temple","With the death of King David","With the people at the threshold of Canaan"],3,""],["About how many years did it take to collect and compile the traditions into the Pentateuch?",["About 50 years","About 500 years","About 100 years","About 1000 years"],1,""],["During which period are the books of the Pentateuch supposed to have been formed?",["1st century B.C. to 1st century A.D.","5th century B.C. to 1st century B.C.","10th century B.C. to 5th century B.C.","15th century B.C. to 10th century B.C."],2,""],["The authorship of the books of the Pentateuch may be attributed to:",["Judges and Scribes only","Apostles and Evangelists","Moses alone","Kings, Priests and Prophets"],3,""],["The Pentateuch is a combination of how many major traditions?",["Five","Three","Two","Four"],3,"QP 2016, QP 2017, QP 2019, QP 2022"],["The repetition of the same incident or event in more than one tradition is called a:",["Doublet","Proverb","Covenant","Psalm"],0,"QP 2013, QP 2013 (Kerala), QP 2014, QP 2018, QP 2019, QP 2020, QP 2021, QP 2024"],["Hagar, who fled from the presence of Sara, was Sara's:",["Neighbour from Canaan","Sister","Daughter-in-law","Egyptian house-maid"],3,"QP 2013, QP 2016, QP 2017, QP 2020, QP 2022, QP 2024"],["The flight of Hagar is an example of a doublet found in Genesis chapters 16 and:",["12","18","21","25"],2,""],["In which passage about the birth of Isaac does God speak directly to Sara?",["Genesis 21:8-21","Genesis 18:6-15","Genesis 17:15-22","Genesis 16:4-6"],1
