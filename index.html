<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C0A12">
<title>MJSSA Exam Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lexend:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one narrow column app (max 560px) with a sticky top bar, card stack screens and a sticky bottom action bar in the quiz. Brass lamp hero on the first screen. */
:root{
  --bg:#F6F2F0; --surface:#FFFFFF; --surface-2:#F1EAE6; --line:#E4D8D2;
  --ink:#2A1418; --ink-2:#6B5157; --wine:#7A1B2B; --wine-2:#9E2A3C; --brass:#B07D22; --brass-2:#E2B04A;
  --ok:#17784A; --ok-bg:#E2F3E9; --ok-line:#7CC59E; --bad:#B42318; --bad-bg:#FCE6E3; --bad-line:#EE9C92;
  --hero-1:#5A1220; --hero-2:#2C0A12; --hero-ink:#FBEFD9; --chip:#F3E3C4; --chip-ink:#6D4B10;
  --f-display:"Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body:"Lexend", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --radius:16px; --shadow:0 1px 2px rgba(60,20,28,.06), 0 6px 20px rgba(60,20,28,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#160C0F; --surface:#22141A; --surface-2:#2C1A21; --line:#3D2730;
  --ink:#F4E8E3; --ink-2:#C4A9AF; --wine:#E07A8B; --wine-2:#F09AA8; --brass:#E2B04A; --brass-2:#F2CB72;
  --ok:#6FD39F; --ok-bg:#12321F; --ok-line:#2F7C52; --bad:#FF8E80; --bad-bg:#3A1714; --bad-line:#8E3127;
  --hero-1:#3A0C16; --hero-2:#12060A; --hero-ink:#FBEFD9; --chip:#3A2A12; --chip-ink:#F2CB72;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#160C0F; --surface:#22141A; --surface-2:#2C1A21; --line:#3D2730;
  --ink:#F4E8E3; --ink-2:#C4A9AF; --wine:#E07A8B; --wine-2:#F09AA8; --brass:#E2B04A; --brass-2:#F2CB72;
  --ok:#6FD39F; --ok-bg:#12321F; --ok-line:#2F7C52; --bad:#FF8E80; --bad-bg:#3A1714; --bad-line:#8E3127;
  --hero-1:#3A0C16; --hero-2:#12060A; --hero-ink:#FBEFD9; --chip:#3A2A12; --chip-ink:#F2CB72;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-2)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass-2);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;color:var(--hero-ink);
  background:radial-gradient(120% 70% at 50% 18%, rgba(226,176,74,.30), transparent 60%),
             linear-gradient(180deg,var(--hero-1),var(--hero-2));}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;padding-block:30px 34px;display:grid;gap:12px;justify-items:center;text-align:center}
.crest{width:78px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.school{display:grid;justify-items:center;gap:2px;text-align:center}
.school .s1{font-family:var(--f-display);font-size:clamp(40px,12.5vw,58px);line-height:1;color:#FFF3DC;letter-spacing:.01em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.school .s2{font-family:var(--f-display);font-size:clamp(22px,6.6vw,30px);line-height:1.1;color:var(--brass-2);letter-spacing:.04em}
.orn{display:flex;align-items:center;gap:10px;width:min(320px,80vw);color:var(--brass-2);margin-top:6px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(242,203,114,.8))}
.orn::after{background:linear-gradient(90deg,rgba(242,203,114,.8),transparent)}
.orn svg{width:16px;height:16px;flex:none}
.place{font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:#F7DFA9;font-weight:500;text-align:center;padding-left:.32em}
.scene{width:min(330px,86vw);height:auto;margin:6px 0 -4px}
.rays{transform-origin:160px 74px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tool{display:grid;gap:6px;justify-items:center;background:rgba(18,6,10,.35);border:1px solid rgba(226,176,74,.35);border-radius:18px;padding:14px 16px;width:100%;max-width:420px}
.tool .k{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:420px;border-top:1px solid rgba(251,239,217,.18);margin-top:2px}
.stats div{padding:10px 4px 0;display:grid;gap:0}
.stats b{font-family:var(--f-display);font-weight:400;font-size:26px;color:#FFF3DC;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#E9CFA0}
.title{font-size:clamp(26px,7.4vw,32px);line-height:1.05;letter-spacing:.01em;color:#FFF3DC}
.title em{font-style:normal;color:var(--brass-2)}
.sub{font-size:14.5px;font-weight:300;max-width:32ch;opacity:.95}
.verse{font-family:var(--f-display);font-size:14.5px;opacity:.85;max-width:34ch;border-top:1px solid rgba(251,239,217,.25);padding-top:12px;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;border:1px solid rgba(226,176,74,.55);color:#F7DFA9}

/* ---------- CARDS / FORMS ---------- */
.stack{display:grid;gap:14px;padding-block:18px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:22px;margin-bottom:4px}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:16px}
.field input:focus{outline:none;border-color:var(--brass)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:15.5px}
.btn-primary{background:var(--wine);color:#fff}
:root:not([data-theme="light"]) .btn-primary{color:#fff}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-brass{background:var(--brass);color:#1E1305}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.note{font-size:12.5px;color:var(--ink-2)}
.confirm{margin-top:12px;padding:12px;border-radius:12px;background:var(--bad-bg);border:1px solid var(--bad-line)}
.confirm p{margin:0 0 10px;font-size:14px}

/* ---------- TOP BAR ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-2);color:var(--hero-ink)}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px}
.top img{width:30px}
.top .t{flex:1;min-width:0;line-height:1.15}
.top .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(251,239,217,.25);background:transparent;color:var(--hero-ink);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* ---------- CLASS GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cls{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;box-shadow:var(--shadow);display:grid;gap:2px;min-height:96px}
.cls .n{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--wine)}
.cls .r{font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600}
.cls .m{font-size:12.5px;color:var(--ink-2)}
.cls .pbar{margin-top:8px}
.pbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-2));border-radius:99px}

/* ---------- TABS ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--wine);box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--wine);box-shadow:var(--shadow)}

/* ---------- CHAPTER LIST ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -4px}
.sec-h h3{font-size:19px;color:var(--wine)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;min-height:64px}
.item:first-child{border-top:0}
.item .tt{font-weight:500;font-size:15px;min-width:0}
.item .cc{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.item .pbar{grid-column:1/-1;height:4px}
.done-tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ok);text-transform:uppercase}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;box-shadow:var(--shadow);display:grid;gap:4px}
.set b{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--wine)}
.set span{font-size:12.5px;color:var(--ink-2)}

/* ---------- QUIZ ---------- */
.qhead{display:grid;gap:8px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.qtext{font-size:18px;line-height:1.45;font-weight:500;margin:0}
.src{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:grid;grid-template-columns:34px 1fr 22px;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:56px;font-size:15.5px;transition:background .15s,border-color .15s}
.opt .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--surface-2);color:var(--ink-2);font-size:14px}
.opt .s{width:22px;height:22px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ink)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.locked{cursor:default}
.opt.dim{opacity:.55}
.fb{min-height:24px;margin-top:12px;font-weight:600;font-size:14.5px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.dot.cur{border-color:var(--wine);color:var(--wine);font-weight:700;box-shadow:0 0 0 2px color-mix(in srgb,var(--wine) 30%,transparent)}
.dot.g{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.dot.r{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.bottom{position:sticky;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom .wrap{display:flex;gap:10px;padding-block:10px}
.bottom .btn{flex:1}
details.jump{margin-top:4px}
details.jump summary{font-size:13px;color:var(--ink-2);cursor:pointer;list-style:none}
details.jump summary::-webkit-details-marker{display:none}
.finish{text-align:center;display:grid;gap:10px;justify-items:center}
.finish .big{font-family:var(--f-display);font-size:28px;color:var(--wine)}

/* ---------- PAPER ---------- */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:18px 16px;font-size:15px}
.paper-h{text-align:center;border-bottom:2px solid var(--wine);padding-bottom:10px;display:grid;gap:4px;justify-items:center}
.paper-h img{width:44px}
.paper-h .org{font-family:var(--f-display);font-size:17px;color:var(--wine);line-height:1.15}
.paper-h .exam{font-weight:600}
.paper-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);padding-block:8px}
.paper-cls{text-align:center;font-weight:700;letter-spacing:.06em;margin:10px 0 4px}
.psec{margin-top:16px}
.psec-h{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-style:italic;font-weight:600;align-items:baseline}
.psec-h .mk{white-space:nowrap;font-size:13px;color:var(--ink-2)}
.pq{display:grid;grid-template-columns:26px 1fr;gap:2px 6px;margin-top:8px}
.pq .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.pq .po{grid-column:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:14px;color:var(--ink-2)}
.ans{grid-column:2;margin-top:4px;padding:6px 10px;border-radius:8px;background:var(--ok-bg);border-left:3px solid var(--ok);font-size:14px;color:var(--ink)}
.ans b{color:var(--ok);font-weight:700;margin-right:4px}
.mt{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.mt td,.mt th{padding:5px 6px;text-align:left;vertical-align:top;border-bottom:1px dashed var(--line)}
.mt th{font-size:12.5px;color:var(--ink-2)}
.placeholder{font-style:italic;color:var(--ink-2);margin-top:6px;font-size:14px}
.keylist{display:grid;gap:12px}
.keyblock h4{margin:0 0 6px;font-size:14px;color:var(--wine)}
.keyblock ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:14px}
.inline-key{display:flex;flex-wrap:wrap;gap:6px}
.inline-key span{background:var(--surface-2);border-radius:8px;padding:3px 8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,6,10,.55);display:grid;align-items:end;justify-items:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media (min-width:600px){.modal{align-items:center}}
.pts{margin:4px 0 0;padding-left:18px;display:grid;gap:2px}
.ref{margin-top:6px;font-size:12.5px;color:var(--ink-2);font-style:italic}
.refnote{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:var(--chip);color:var(--chip-ink);font-size:13.5px;line-height:1.45}
.disc{font-size:12.5px;line-height:1.45;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.disc b{color:var(--wine)}
.field select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:16px;color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.field select:focus{outline:none;border-color:var(--brass)}
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);min-height:62px}
.person .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:#fff;font-family:var(--f-display);font-size:20px}
.person .pi{min-width:0;display:grid}
.person .pi b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pi span{font-size:13px;color:var(--ink-2)}
.person .go{font-size:24px;color:var(--brass)}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
@media (prefers-reduced-motion: reduce){.rays{animation:none}}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>

ather not go to work that day?",["He was angry","He was very tired","It was raining","He was going to the church"],1,""],["What did the elder son first say to his father?",["“No, I will not.”","“Here I am.”","“Sure father, I will go.”","“Speak, Lord.”"],0,""],["Which son finally went to the vineyard and obeyed his father?",["The neighbour's son","The younger son","The father's servant","The elder son"],3,"QP 2022"],["What did the younger son do?",["He ran to the church","He said no, but then he went","He said he would go, but he did not go","He went with his father"],2,""],["In ‘My Pledge’, what do we promise to keep clean?",["Only our shoes","The river","The vineyard of our neighbour","Our house and surroundings"],3,""],["What was the work of Joseph, the father of Jesus?",["Shepherd","Carpenter","Fisherman","Farmer"],1,"QP 2022"],["How can we help our parents?",["By making the house dirty","By fighting with our brothers","By helping them in their works","By disobeying them"],2,"QP 2021"]]},{"t":"Chapter 10 – Jesus in the Church","q":[["How old was Jesus when he went to Jerusalem with his parents for the Passover?",["Thirty years","Twelve years","Six years","Eight years"],1,"QP 2018"],["Name the festival for which Jesus had gone to the Temple.",["Palm Sunday","Christmas","Easter","Passover (Pesaha Perunnal)"],3,"QP 2019, QP 2021, QP 2022"],["When Joseph and Mary started to return, where did they think Jesus was?",["With their relatives","In Bethlehem","At the river Jordan","In the vineyard"],0,""],["Where did Joseph and Mary find Jesus after he went missing?",["In the playground","In a shop","In a friend’s house","Inside the Temple, sitting among the priests"],3,"QP 2013 (Kerala), QP 2018"],["What was Jesus doing inside the Temple?",["Sleeping","Speaking the Word of God and answering questions","Selling doves","Playing with other children"],1,"QP 2019, QP 2021"],["What did Jesus tell his mother Mary?",["“I will be with you.”","“Let it be with me according to your word.”","“Here I am, for you called me.”","“I must be in my Father's house.”"],3,"QP 2019, QP 2022"],["Name the feast our church celebrates on February 2.",["Christmas","Feast of the Cross","Passover","Presentation of Christ in the Temple (Mayaltho)"],3,"QP 2019"],["Where should we stand during the Holy Qurbana on a church festival day?",["In front of the ice cream store","On the road","Inside the church","Near the toy shop"],2,""],["After the Temple, how did Jesus go back home?",["With the priests","As an obedient son, with his parents","Alone, without telling anyone","With the shepherds"],1,""],["Name the place where the ‘Prayer Table’ is situated inside the church.",["Varandhah","Holy Place","Bell tower","Praakaaram"],1,"QP 2021, QP 2022"],["“Child, why have you treated us like this?” Who said to whom?",["Mary to Joseph","Mary to Jesus","Joseph to Jesus","The priest to Jesus"],1,"QP 2013 (Kerala)"]]},{"t":"Chapter 11 – Jesus Endearing Children","q":[["Jesus was sitting at the bank of river ____ and teaching the Word of God to a large crowd of people.",["Nile","Euphrates","Jordan","Elah"],2,"QP 2019, QP 2021"],["Who brought little children to Jesus?",["Their mothers","The priests","The shepherds","The soldiers"],0,""],["Why did the mothers bring their children to Jesus?",["To learn to fight","To play in the river","So that he would touch and bless them","To buy grains"],2,""],["Who had stopped them, when the mothers and the children came to Jesus?",["Disciples of Jesus","Jesus","Joseph","Mary"],0,"QP 2019, QP 2021, QP 2022"],["“Let the little children come to me; do not stop them.” Who said these words?",["One of the mothers","Jesus","A disciple of Jesus","A priest"],1,"QP 2013 (Kerala), QP 2022"],["Jesus said the kingdom of God belongs to such as these. Who are ‘these’?",["Little children","Soldiers","Rich men","Giants"],0,""],["How did Jesus bless the little ones?",["He laid his hands on their heads","He gave them new dresses","He sent them away","He gave them silver"],0,""],["What was Jesus doing for the sick people there?",["Sending them away","Healing them","Selling them food","Asking them to leave"],1,""],["How did the mothers and children feel when they heard Jesus' words?",["Very angry","Very afraid","Very happy","Very sad"],2,""],["Fill in the Bible verse: “You change and become like ____.”",["giants","kings","angels","children"],3,""],["Jesus loves ____ very much.",["only kings","only rich people","only soldiers","children"],3,"QP 2021"]]},{"t":"Chapter 12 – Jesus Teaching to Pray","q":[["Fill in the Bible verse: “Pray without ____.”",["eating","ceasing","singing","sleeping"],1,""],["Who asked Jesus to teach them how to pray?",["The priests","His disciples","The mothers","The shepherds"],1,""],["While praying, we should face towards ____.",["East","West","South","North"],0,"QP 2018, QP 2022"],["How do we make the sign of the Cross?",["With all five fingers, from head to feet","With only the thumb, from right arm to left arm","Holding together the thumb, index and middle fingers; forehead to chest, then left arm to right arm","With only the little finger, from chin to nose"],2,"QP 2013 (Kerala), QP 2019"],["How does every living thing start its day?",["By playing","By eating food","By praising God the Creator","By sleeping again"],2,""],["Which of these is a time when we should pray?",["Only when we are sick","Only on our birthday","Before food","Only on Christmas"],2,""],["What will you get from your teacher if you learn by heart the prayer taught by Jesus?",["A gift","A punishment","Homework","A new book"],0,""]]}]},{"n":"True Faith","units":[{"t":"Questions 3–6","q":[["Who is Jesus Christ?",["A priest of the Temple","The Only Son of God","An angel of God","The king of Egypt"],1,"QP 2019, QP 2022"],["What is the name of our Church?",["Holy Church of Canaan","Holy Jacobite Syrian Christian Church","Church of the Valley of Elah","Church of Bethlehem"],1,"QP 2013 (Kerala)"],["What is a church?",["A school for sports"," s that one day they would have to bow down to Joseph.","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"},{"q":"What was Jesus doing inside the Temple?","a":"Jesus was sitting among the priests, speaking to them the Word of God and answering their questions.","ref":"Class I textbook, Chapter 10 – Jesus in the Church"},{"q":"How should we stand inside the church?","a":"Inside the church we should stand with awe, bowing our heads and facing towards the east.","ref":"Class I textbook, True Faith, Question 6"}],"detail":[{"q":"What were the peculiarities of Joseph?","a":"He used to pray every day; he was a person of good character; he loved everyone and respected his parents and elders; he had the ability to dream and explain its meaning.","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"},{"q":"Who were the parents of Moses? How did they save him from the order of Pharaoh?","a":"His father was Amram and his mother was Jochebed; they did not throw him into the Nile but hid him in their house; after a few months they could not hide him, so they decorated a papyrus basket; his mother put him in it and placed it on the river.","ref":"Class I textbook, Chapter 4 – Child Moses"},{"q":"What happened when the mothers brought their little children to Jesus?","a":"Jesus was teaching at the bank of river Jordan and mothers brought their little children to be blessed; the disciples stopped the mothers and spoke to them harshly; Jesus said, \"Let the little children come to me; do not stop them; for it is to such as these that the kingdom of God belongs\"; he laid his hands on their heads and blessed them.","ref":"Class I textbook, Chapter 11 – Jesus Endearing Children"}],"speech":[{"q":"Obedience to parents","a":"Jesus was obedient to his parents in everything they said; Jesus only likes obedient kids; \"To obey is better than sacrifice\" (1 Samuel 15:22); in Jesus' story, the son who said no but later went to the vineyard obeyed his father; like Jesus I will obey my parents and teachers and help them in their works; I will keep my house and surroundings clean, go to the church and live as an obedient kid.","ref":"Class I textbook, Chapter 9 – Jesus being Obedient to His Parents"},{"q":"\"The Lord is my strength and my shield\" – David and Goliath","a":"Goliath was a giant, and the army of Israel and even King Saul trembled with fear; young David, a shepherd, had no fear because \"Yahweh is with me\"; he took off Saul's armour and took his staff, his sling and five smooth stones; he told Goliath, \"I have come to you in the name of the Lord\"; his stone struck Goliath's forehead and the giant fell face down; not strength and size, but dependence on God makes us strong (\"The Lord is my strength and my shield\").","ref":"Class I textbook, Chapter 6 – David and Goliath"}]}},{"no":2,"s":{"mcq":[{"q":"How many sons did Jacob have?","o":["5","8","10","12"],"a":3},{"q":"Who were the parents of child Moses?","o":["Mary and Joseph","Amram and Jochebed","Joachim and Hannah","Elkanah and Hannah"],"a":1},{"q":"While praying, we should face towards the ______.","o":["North","East","South","West"],"a":1},{"q":"Jesus said, \"It is to such as these that the kingdom of God belongs.\" Who are \"these\"?","o":["Rich people","Soldiers","Priests","Little children"],"a":3}],"name":[{"q":"What is the meaning of the name 'Moses'?","a":"One who is drawn out of water"},{"q":"Name the priest who blessed Hannah.","a":"Eli"},{"q":"Name the feast our Church celebrates on February 2.","a":"The Presentation of Christ in the Temple"},{"q":"In the story of the two sons, which son finally went to the vineyard?","a":"The elder son"}],"tf":[{"q":"Miriam brought Moses' own mother to feed the baby.","a":true},{"q":"David wore King Saul's armour when he went to fight Goliath.","a":false},{"q":"Hannah promised God that she would submit her child before Him.","a":true},{"q":"The disciples spoke kindly to the mothers who brought their children to Jesus.","a":false}],"fill":[{"q":"\"How good and pleasant it is when brothers live together in ______!\" (Psalm 133:1)","a":"unity"},{"q":"The mothers brought their children to Jesus so that he would touch them and ______ them.","a":"bless"},{"q":"David was the youngest among the ______ sons of Jesse.","a":"eight"},{"q":"Jesus went to the ______ Temple with his parents for the festival.","a":"Jerusalem"}],"short":[{"q":"Why did Hannah spend her time weeping and praying?","a":"Hannah wept and prayed because she and Elkanah had no child even after many years of marriage.","ref":"Class I textbook, Chapter 5 – Samuel"},{"q":"In the story of the two sons, what did the younger son say and what did he do?","a":"The younger son said, \"Sure father, I will go,\" but he did not go to the vineyard.","ref":"Class I textbook, Chapter 9 – Jesus being Obedient to His Parents"},{"q":"Who is Jesus Christ?","a":"Jesus Christ is the Only Son of God.","ref":"Class I textbook, True Faith, Question 3"}],"detail":[{"q":"Explain the two dreams of Joseph.","a":"In the first dream Joseph and his brothers were binding sheaves in the field; Joseph's sheaf rose and stood upright and his brothers' sheaves gathered around and bowed down to it; in the second dream the Sun, the Moon and eleven stars bowed down to him; his brothers realised they would have to bow to Joseph and became jealous.","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"},{"q":"How did David defeat Goliath?","a":"David had no fear because the Lord was with him; he took his staff, his sling and five smooth stones in his shepherd's bag; he said, \"I have come to you in the name of the Lord\"; he slung a stone that struck Goliath's forehead and the giant fell face down and never got up.","ref":"Class I textbook, Chapter 6 – David and Goliath"},{"q":"Joseph and Mary lost Jesus on their way back from the festival. How did they find him?","a":"Joseph and Mary thought Jesus was travelling with their relatives; after a long distance they realised he was not with them; with anxiety and weeping they went back to the Temple and searched everywhere; at last they found him inside the Temple, sitting among the priests.","ref":"Class I textbook, Chapter 10 – Jesus in the Church"}],"speech":[{"q":"Prayer – how and when we pray","a":"Every living thing starts its day by praising God the Creator; we pray by folding our hands on our chest, facing towards the east and making the sign of the Cross; we pray in the morning, when we go to sleep, before food and when starting a journey; Jesus' disciples asked him to teach them how to pray; Jesus taught them the Lord's Prayer; \"Pray without ceasing\" (1 Thessalonians 5:17).","ref":"Class I textbook, Chapter 12 – Jesus Teaching to Pray"},{"q":"God protects us – the story of child Moses","a":"Cruel King Pharaoh ordered that every Israelite boy be thrown into the river Nile; Moses' parents Amram and Jochebed hid him in their house; then they put him in a decorated papyrus basket on the river, and his sister Miriam watched; Pharaoh's daughter found him and named him Moses, 'one drawn out of water'; Miriam brought his own mother, and Moses grew up in the palace with her; God protected Moses through the princess – \"I will be with you\" (Exodus 3:12).","ref":"Class I textbook, Chapter 4 – Child Moses"}]}},{"no":3,"s":{"mcq":[{"q":"What is the meaning of the name 'Samuel'?","o":["God raises","Drawn out of water","Father of faithful","Asked from God"],"a":3},{"q":"Who was the elder sister of Moses?","o":["Hannah","Jochebed","Sara","Miriam"],"a":3},{"q":"Who was the king of Israel who hid in his tent in fear of Goliath?","o":["Jesse","Saul","David","Pharaoh"],"a":1},{"q":"How old was Jesus when he went to the Temple with his parents for the Passover?","o":["Thirty","Ten","Five","Twelve"],"a":3}],"name":[{"q":"Who was the king of Egypt?","a":"Pharaoh"},{"q":"In which place did Jesse, the father of David, live?","a":"Bethlehem"},{"q":"Who brought the little children to Jesus to be blessed?","a":"Their mothers"},{"q":"Who asked Jesus to teach them how to pray?","a":"His disciples"}],"tf":[{"q":"Joseph had the ability to dream and explain its meaning.","a":true},{"q":"Jesus was ten years old when he went to the Jerusalem Temple for the Passover.","a":false},{"q":"God blessed Hannah with a child in the very next year.","a":true},{"q":"The princess of Egypt was sad when she saw the baby in the basket.","a":false}],"fill":[{"q":"In Joseph's second dream, the Sun, the Moon and ______ stars bowed down to him.","a":"eleven"},{"q":"\"The Lord is my strength and my ______.\" (Psalm 28:7)","a":"shield"},{"q":"\"You change and become like ______.\" (St. Matthew 18:3)","a":"children"},{"q":"My Pledge: \"I will keep my house and surroundings ______.\"","a":"clean"}],"short":[{"q":"What was the order of Pharaoh?","a":"Pharaoh ordered that every boy born to the Israelites should be thrown into the river Nile.","ref":"Class I textbook, Chapter 4 – Child Moses"},{"q":"What were the weapons of David when he went to fight Goliath?","a":"David's weapons were his staff, his sling and five smooth stones.","ref":"Class I textbook, Chapter 6 – David and Goliath"},{"q":"How do we make the sign of the Cross?","a":"We hold together the thumb, index finger and middle finger and draw from the forehead to the chest, and then from the left arm to the right arm.","ref":"Class I textbook, Chapter 12 – Jesus Teaching to Pray"}],"detail":[{"q":"How did God call the boy Samuel?","a":"Samuel was living in the church with priest Eli, and one night he heard a voice calling, \"Samuel, Samuel\"; he ran to Eli and said, \"Here I am, for you called me\", but Eli said he had not called; this happened three times, and Eli realised that God was calling; Eli told him to say, and Samuel replied, \"Speak, Lord, for your servant is listening.\"","ref":"Class I textbook, Chapter 5 – Samuel"},{"q":"Tell the story of the old man and his two sons.","a":"A tired old man asked his two sons to go and work in the vineyard; the elder son said, \"No, I will not,\" but later felt he should obey and went; the younger son said, \"Sure father, I will go,\" but did not go; the son who went obeyed his father, and Jesus likes obedient children.","ref":"Class I textbook, Chapter 9 – Jesus being Obedient to His Parents"},{"q":"What did Joseph's brothers do to him? How did God lift him up?","a":"His jealous brothers threw him into a pit in the wilderness; they sold him to Arabic traders (Ishmaelites) for twenty pieces of silver, who took him to Egypt; God did not want to trouble him and raised him step by step; Joseph became the Prime Minister of Egypt.","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"}],"speech":[{"q":"Jesus loves little children","a":"Jesus was teaching at the bank of river Jordan; mothers brought their little children so that he would touch and bless them; the disciples stopped them and spoke harshly; Jesus said, \"Let the little children come to me; do not stop them; for it is to such as these that the kingdom of God belongs\"; he endeared them to his heart, laid his hands on their heads and blessed them; Jesus loves you very much – go nearer to Him and He will bless you.","ref":"Class I textbook, Chapter 11 – Jesus Endearing Children"},{"q":"Our Church – the house of God","a":"Church is the house of God where God lives; our Church is the Holy Jacobite Syrian Christian Church; inside the church we stand with awe, bowing our heads and facing towards the east; Jesus said, \"I must be in my Father's house\"; we need to go to the church regularly and love our church; we need to grow in the Word of God.","ref":"Class I textbook, Chapter 10 – Jesus in the Church; True Faith, Questions 4–6"}]}},{"no":4,"s":{"mcq":[{"q":"In Joseph's first dream, what bowed down to Joseph's sheaf?","o":["The sheaves of his brothers","The trees of the field","The camels of the traders","The sheep of his father"],"a":0},{"q":"Where was Moses born?","o":["Israel","Bethlehem","Jerusalem","Egypt"],"a":3},{"q":"Against whom were the brothers of David fighting?","o":["The Philistines","The Egyptians","The Ishmaelites","The Romans"],"a":0},{"q":"In the story told by Jesus, how many sons did the old man have?","o":["Three","Two","Twelve","Five"],"a":1}],"name":[{"q":"To whom did Joseph's brothers sell him?","a":"Arabic traders (Ishmaelites)"},{"q":"What is the name of our Church?","a":"Holy Jacobite Syrian Christian Church"},{"q":"Where did the stone thrown by David hit Goliath?","a":"On his forehead"},{"q":"Who was the mother of Samuel?","a":"Hannah"}],"tf":[{"q":"After the Temple visit, Jesus went back home with his parents as an obedient son.","a":true},{"q":"Moses grew up in the palace along with his own mother.","a":true},{"q":"Jesus sent away the sick people without healing them.","a":false},{"q":"Goliath was a short and small boy.","a":false}],"fill":[{"q":"\"Speak, Lord, for your servant is ______.\" (1 Samuel 3:9)","a":"listening"},{"q":"When the mothers and children heard Jesus' words, they became very ______.","a":"happy"},{"q":"To obey is better than ______.","a":"sacrifice"},{"q":"The priests in the Temple were amazed at Jesus' ______.","a":"knowledge"}],"short":[{"q":"What did Samuel say when he ran to priest Eli at night?","a":"Samuel ran to Eli and said, \"Here I am, for you called me.\"","ref":"Class I textbook, Chapter 5 – Samuel"},{"q":"What did Jesus say when his disciples stopped the children?","a":"Jesus said, \"Let the little children come to me; do not stop them; for it is to such as these that the kingdom of God belongs.\"","ref":"Class I textbook, Chapter 11 – Jesus Endearing Children"},{"q":"What kind of children does Jesus like the most?","a":"Jesus only likes obedient children.","ref":"Class I textbook, Chapter 9 – Jesus being Obedient to His Parents"}],"detail":[{"q":"How did God protect and take care of baby Moses through the princess of Egypt?","a":"Pharaoh's daughter came to bathe in the river and saw a decorated papyrus basket with a baby inside; she was very happy, took the child and named him Moses, meaning 'one drawn out of water'; Miriam brought Moses' own mother to feed and nurse him; so Moses lived in the palace as a little prince with his own mother.","ref":"Class I textbook, Chapter 4 – Child Moses"},{"q":"How should we pray? When should we pray?","a":"We pray by folding our hands on our chest; we face towards the east and make the sign of the Cross; we pray in the morning and when we go to sleep; we pray before food and when starting a journey.","ref":"Class I textbook, Chapter 12 – Jesus Teaching to Pray"},{"q":"What did Jesse tell David? Where did David go to see his brothers?","a":"Jesse prepared a box full of eatables and called David; he said, \"Your brothers are fighting against the Philistines at the Valley of Elah; take this food and give it to them\"; David was overjoyed that he could see his elder brothers after a long time; he quickly went to the Valley of Elah.","ref":"Class I textbook, Chapter 6 – David and Goliath"}],"speech":[{"q":"Brotherly love – Joseph and his brothers","a":"Joseph was one of the twelve sons of Jacob, and his father loved him more than the others; his jealous brothers threw him into a pit and sold him for twenty pieces of silver; God raised him step by step to be the Prime Minister of Egypt; in the famine his brothers came to buy grain, and Joseph welcomed them warmly and gave them food; like Joseph we have to love our brothers – whoever hates us, God loves us; \"How good and pleasant it is when brothers live together in unity!\" (Psalm 133:1).","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"},{"q":"Going to church regularly – Jesus in the Temple","a":"When Jesus was twelve years old he went to the Jerusalem Temple with his parents for the Passover; his parents found him in the Temple, sitting among the priests and speaking the Word of God; Jesus said, \"I must be in my Father's house\"; we need to go to the church regularly; we need to love our church; we need to grow in the Word of God.","ref":"Class I textbook, Chapter 10 – Jesus in the Church"}]}},{"no":5,"s":{"mcq":[{"q":"Who called Samuel in the night?","o":["Elkanah","Eli","Hannah","God"],"a":3},{"q":"Why could the old man not go to the vineyard that day?","o":["He was building a house","He had gone on a journey","He was very tired","He had a fever"],"a":2},{"q":"Where should we stand during the Holy Qurbana on a church festival day?","o":["In front of the ice cream store","Near the toy shop","Inside the church","At the church gate"],"a":2},{"q":"Where did David go to see his brothers?","o":["Egypt","Valley of Elah","Jericho","Jerusalem"],"a":1}],"name":[{"q":"Who was the father of Moses?","a":"Amram"},{"q":"\"Let the little children come to me; do not stop them.\" Who said these words?","a":"Jesus"},{"q":"In 'My Pledge', whom do we promise to obey besides our parents?","a":"Our teachers"},{"q":"What did Jacob give Joseph because he loved him more than his other sons?","a":"New dresses and wonderful gifts"}],"tf":[{"q":"Joseph's brothers threw him into a river.","a":false},{"q":"Moses' parents hid him in their house for a few months.","a":true},{"q":"Samuel lived in the church along with priest Eli.","a":true},{"q":"Jesus did not allow the little children to come near him.","a":false}],"fill":[{"q":"God raised Joseph to the Prime Minister of ______.","a":"Egypt"},{"q":"______ was the father of David.","a":"Jesse"},{"q":"While praying, we fold our hands on our ______.","a":"chest"},{"q":"Jesus was sitting at the bank of river ______ and teaching the Word of God to a large crowd.","a":"Jordan"}],"short":[{"q":"Why did the princess of Egypt come to the river, and what did she see there?","a":"The princess came to take a bath in the river with her friends and saw a beautifully decorated papyrus basket with a small baby sleeping inside it.","ref":"Class I textbook, Chapter 4 – Child Moses"},{"q":"When should we pray? Name any three times.","a":"We should pray in the morning, when we go to sleep, before food and when starting a journey.","ref":"Class I textbook, Chapter 12 – Jesus Teaching to Pray"},{"q":"What is a church?","a":"Church is the house of God where God lives.","ref":"Class I textbook, True Faith, Question 5"}],"detail":[{"q":"When there was a great famine, why did Joseph's brothers come to Egypt? How did Joseph treat them?","a":"A great famine spread through Egypt up to the land of Canaan, and Jacob's house had no food grains; but Joseph's storehouse had plenty of grain, so his brothers came to Egypt to buy grain; Joseph recognised them and welcomed them warmly and gave them food and grains; his brothers were not able to recognise Joseph.","ref":"Class I textbook, Chapter 3 – Joseph and His Dream"},{"q":"When Mary found Jesus in the Temple, what did she say to him and what did Jesus reply?","a":"Mary said, \"Child, why have you treated us like this? Look, we have been searching for you in great anxiety\"; Jesus replied, \"Why were you searching for me?\"; he said, \"Did you not know that I must be in my Father's house?\"; being an obedient son, he went back with his parents.","ref":"Class I textbook, Chapter 10 – Jesus in the Church"},{"q":"What did Goliath say when he saw David, and what did David reply? What happened then?","a":"Goliath said, \"Am I a dog, that you come to me with sticks and stones?\"; David replied, \"I have come to you in the name of the Lord, the God of Israel; and the Lord will deliver you into my hands today\"; David slung a stone from his bag, and it struck Goliath's forehead; the giant fell face down and never got up.","ref":"Class I textbook, Chapter 6 – David and Goliath"}],"speech":[{"q":"Hannah – a mother who prayed","a":"Elkanah and his wife Hannah had no child for many years and were very sad; Hannah went to the church and spent her time weeping and praying; she promised God, \"If You give me a boy child, then I will submit him before You\"; priest Eli consoled and blessed her, and the next year God gave her a son, Samuel ('asked from God'); keeping their promise, the parents took Samuel to the church and dedicated him to God; Samuel listened to God's call and God made him a priest and prophet of Israel.","ref":"Class I textbook, Chapter 5 – Samuel"},{"q":"How can I help my parents and elders at home?","a":"Like Jesus, I will obey my parents; I will help them in their works; I will keep my house and surroundings clean; I will go to the church; I will obey my teachers; I will live as an obedient kid, because \"to obey is better than sacrifice.\"","ref":"Class I textbook, Chapter 9 – Jesus being Obedient to His Parents"}]}}]},{"c":"II","sections":[{"n":"Old Testament","units":[{"t":"Chapter 3 – The Sacrifice of Abraham (Abraham’s Sacrifice)","q":[["What was the name of Abraham’s son?",["Isaac","David","Saul","Moses"],0,""],["Which is the place where Abraham took his son Isaac to offer him as a sacrifice?",["Mount Carmel","Mount Tabor","Mount Moriah","Mount Horeb"],2,"QP 2019, QP 2021"],["Isaac asked, “Where is the lamb for burnt offering?” What did Abraham answer?",["We forgot it at home.","We will buy one.","God will provide.","There is no lamb."],2,""],["What did Abraham build on the mountain?",["An altar","A house","A tent","A tower"],0,"QP 2022"],["Whose voice did Abraham hear from heaven, saying, “Do not lay your hand on the boy”?",["The voice of Moses","The voice of Isaac","The voice of Yahweh","The voice of a shepherd"],2,""],["What did Abraham sacrifice as a burnt offering to God instead of Isaac?",["Ox","Cow","Pigeon","Ram"],3,"QP 2021"],["Who is the ‘Father of Faithful’?",["Adam","Abraham","Isaac","Abel"],1,"QP 2019, QP 2021"],["Complete the Bible verse: “Do not be doubtful, but …”",["believe.","be afraid.","be sad.","keep quiet."],0,""],["Why does God give us trials?",["To make us lazy","To make us angry","To examine our faith","To make us sad"],2,""],["In Old Testament times, what was brought as offerings to God?",["Birds and animals","Toys","Books","Gold coins"],0,"QP 2022"],["Why is Abraham known as the ‘Father of Faithful’?",["He built the ark","He showed his faith and obedience by being ready to offer his only son Isaac to God","He was the oldest man on earth","He was the first king of Israel"],1,"QP 2019"]]},{"t":"Chapter 4 – Moses at the Burning Bush","q":[["Which country was ruled by Pharaoh?",["Israel","Egypt","Midian","Jericho"],1,"QP 2021"],["To which land did Moses flee from Egypt?",["Midian","Cana","Bethlehem","Jericho"],0,"QP 2022"],["Who was the father-in-law of Moses?",["Jethro","Zachariah","Kish","Aaron"],0,"QP 2021, QP 2022"],["What was the job of Moses?",["Farmer","Carpenter","Shepherd","Cook"],2,"QP 2019, QP 2021"],["Moses found an astonishing wonder in Mount …",["Mount Moriah","Mount Tabor","Mount Horeb","Mount Zion"],2,"QP 2021, QP 2022"],["What was the astonishing wonder seen by Moses?",["A bush on fire that did not burn up","A river turning red","A star moving in the sky","A ram in a thicket"],0,"QP 2019"],["What did God tell Moses to remove from his feet?",["His belt","His robe","His socks","His sandals"],3,""],["Who was appointed by God in order to help Moses?",["Pharaoh","Jethro","Aaron","Abraham"],2,"QP 2019"],["What did God give to Moses to perform miracles or signs?",["A sceptre (staff)","A harp","A sword","A crown"],0,"QP 2019, QP 2021"],["“Remove the sandals from your feet, for the place on which you are standing is …”",["a desert","a mountain top","holy ground","Egypt"],2,"QP 2019, QP 2021"],["For what purpose did God choose Moses?",["To look after the sheep of Jethro","To liberate the people of God from the slavery of Pharaoh","To become the king of Egypt","To build a temple in Midian"],1,"QP 2019"]]},{"t":"Chapter 5 – Saul, the First King of Israel","q":[["Who was the first king of Israel?",["Solomon","Saul","Samuel","Paul"],1,"QP 2019, QP 2022"],["What was the name of Saul’s father?",["Jesse","Kish","Jethro","Abraham"],1,""],["What did Saul go out to look for?",["His father’s sheep","His father’s donkeys","His lost brother","His father’s camels"],1,""],["Who was the judge of Israel when Saul became king?",["Moses","Joel","Prophet Samuel","Aaron"],2,"QP 2021"],["What were the names of Samuel’s sons?",["Joel and Abijah","David and Jonathan","Moses and Aaron","Cain and Abel"],0,""],["Why did the Israelites request Samuel to have a king ruling over them?",["They wanted to fight Egypt","They had no food","They were sad and frustrated because of the wicked ways of their judges (Samuel’s sons)","Samuel was too young"],2,"QP 2019"],["How did Samuel anoint Saul as king?",["He poured oil from a vial on his head","He washed his feet","He put a crown on him","He gave him a sword"],0,""],["How many tribes are there in Israel?",["6","8","10","12"],3,"QP 2021"],["Complete the Bible verse: “The Lord is my shepherd, …”",["I am strong.","I will be king.","I shall not want.","I will not sleep."],2,"QP 2019, QP 2021"],["What was the name of Saul’s tribe?",["Simeon","Benjamin","Levi","Judah"],1,"QP 2019, QP 2021, QP 2022"],["Samuel was the last … of Israel.",["judge","king","Levite","shepherd"],0,"QP 2019"],["Who was the “man of God” the servant boy told Saul about?",["Eli","Elijah","Nathan","Samuel"],3,"QP 2022"]]},{"t":"Chapter 6 – David and Jonathan","q":[["Who was the son of King Saul?",["Jonathan","Goliath","David","John"],0,"QP 2019, QP 2021"],["Who was the leader of the Philistines?",["Saul","Jonathan","Goliath","David"],2,"QP 2022"],["Who pleased everyone in the palace by playing the harp?",["Saul","Samuel","David","Jonathan"],2,"QP 2021"],["Who gifted David his robe and sword?",["Jonathan","Saul","Moses","Peter"],0,"QP 2019, QP 2021"],["The people sang, “Saul had killed thousands, David killed …”",["five thousands","hundreds","twelve thousands","ten thousands"],3,""],["Why did Saul try to kill David?",["David took his crown","David did not play the harp","The people loved David more than Saul","David ran away"],2,"QP 2019"],["How did Saul try to kill David?",["By throwing his spear twice","By poisoning his food","By locking him up","By sending robbers"],0,"QP 2019, QP 2022"],["Near which stone did Jonathan ask David to hide?",["Stone Horeb","Stone Moriah","Stone Ezel","Stone Jordan"],2,"QP 2021"],["How many arrows did Jonathan say he would shoot near the stone?",["Three","Five","Two","One"],0,""],["Complete the Bible verse: “No one has greater love than this, to lay down one’s life for one’s …”",["friends","parents","country","teachers"],0,""],["Who was trying to kill David?",["Samuel","Saul","Kish","Jonathan"],1,"QP 2019"],["Which of these is a quality of a good friend?",["Helping a friend in need","Fighting with friends","Telling lies","Using bad words"],0,"QP 2019"]]}]},{"n":"New Testament","units":[{"t":"Chapter 10 – Jesus Feeding the Hungry","q":[["Which disciple did Jesus ask, “Where are we to buy bread for these people to eat?”",["Andrew","Peter","Thomas","Philip"],3,""],["“There is a boy here who has five barley loaves and two fish.” Who said to whom?",["Peter to Philip","Philip to Jesus","Andrew to Jesus","Jesus to Andrew"],2,"QP 2019"],["What did the boy have?",["Five apples and two cakes","Five barley loaves and two fish","Seven loaves and three fish","Two loaves and five fish"],1,""],["About how many people sat down for food?",["One thousand","Five thousand","Twelve thousand","Five hundred"],1,"QP 2022"],["What did Jesus do with the loaves and fish before giving them to the people?",["He blessed them","He threw them away","He sold them","He hid them"],0,""],["Why did Jesus ask his disciples to gather up the leftover pieces?",["So that nothing may be lost","To sell them later","To throw them in the river","To feed the animals"],0,""],["What did the disciples do with the leftover loaves?",["They gave them to the animals","They gathered them up and filled baskets","They threw them away","They sold them in the market"],1,"QP 2019, QP 2022"],["Complete the Bible verse: “Blessed are those who hunger and thirst for …, for they will be filled.”",["power","righteousness","praise","riches"],1,"QP 2021"],["What does this lesson teach us about food?",["We should eat alone","Food is provided by God, so it should not be wasted","We can waste extra food","We need not pray before food"],1,""]]},{"t":"Chapter 11 – Merciful Jesus","q":[["Who was the blind man sitting at the roadside of Jericho for the mercy of Jesus Christ?",["Lazarus","Bartimaeus","Zachariah","Zacchaeus"],1,"QP 2019, QP 2021, QP 2022"],["By the roadside of which town did the blind beggar sit?",["Jericho","Bethlehem","Cana","Jerusalem"],0,""],["What did the blind man cry aloud?",["“Jesus, Son of David, have mercy on me!”","“Give me some money!”","“Please give me food!”","“Take me home!”"],0,""],["Why was there a large noise on the road that day?",["There was a wedding","There was a storm","A king was passing by","The crowd was coming with Jesus"],3,""],["When Jesus asked, “What do you want me to do for you?”, what did the blind man say?",["“My teacher, let me see again.”","“Give me bread.”","“Make me rich.”","“Give me a house.”"],0,""],["How did Bartimaeus get his eyesight back?",["Jesus had mercy towards him and blessed him","He fell asleep and woke up healed","A doctor treated him","He washed his eyes in a pool"],0,"QP 2019, QP 2021"],["Complete the Bible verse: “Blessed are the merciful, for they will receive …” (St. Matthew 5:7)",["land","gold","praise","mercy"],3,"QP 2019, QP 2022"],["What is the Bible reference for this lesson?",["St. Mark 10: 46-52","St. John 2: 1-11","St. Luke 10: 30-37","St. John 6: 5-13"],0,""],["How could we show mercy towards our fellow beings?",["Go to a movie","Buy a big cake for ourselves","Visit an orphanage and give food","Stay at home"],2,"QP 2019"],["Who lead us towards heaven by giving us spiritual food?",["Our classmates","Kings","Our priests and metropolitans","Shopkeepers"],2,""]]},{"t":"Chapter 12 – Good Friend","q":[["Which friend gave his blood to save Joel?",["Andrew","Philip","Manu","Deepu"],3,""],["How did Joel get hurt?",["He fell from a tree","A dog bit him","His bicycle crashed with a motorbike","He fell into a river"],2,""],["On his way to which place had the Jewish man been attacked by robbers?",["Jerusalem","Israel","Jericho","Bethlehem"],2,"QP 2021"],["Who came first on the road and passed by without helping?",["A king","A shepherd","A priest","A Samaritan"],2,""],["Who came next, saw the wounded man and also passed by?",["A soldier","A farmer","A Levite","A Samaritan"],2,"QP 2022"],["Who helped the wounded (injured) Jewish man?",["Jewish Priest","Jesus","Levite","Samaritan"],3,"QP 2013 (Kerala), QP 2018, QP 2019"],["How did the Samaritan help the wounded man?",["He passed by on the other side","He gave him some money and went away","He called the priest to help him","He bandaged his wounds, poured oil on them and took him to an inn"],3,"QP 2019, QP 2022"],["Where did the Samaritan take the wounded man?",["To a palace","To his own house","To the temple","To an inn"],3,""],["How many denarii did the Samaritan give to the innkeeper?",["One","Ten","Two","Five"],2,""],["Who is a friend indeed?",["A busy friend","A friend for a day","A friend in need","A stranger"],2,"QP 2019, QP 2022"],["What happened to the Jewish man in the middle of his journey to Jericho?",["He fell into the hands of robbers who beat him and left him half dead","He lost his donkey and had to walk","He met Jesus on the way","He fell asleep at an inn"],0,"QP 2018"],["In the story, who was the Levite?",["The innkeeper","A robber","One who assisted in the worship","A Samaritan trader"],2,"QP 2018"]]},{"t":"Chapter 13 – Boundless Love","q":[["Which bird hews its chest to feed its hatchlings?",["Crow","Pelican","Vulture","Eagle"],1,"QP 2022"],["How many baby birds (hatchlings) did the mother bird have?",["Five","Four","Three","Two"],0,""],["What do the baby pelicans take as food in their first days?",["Fish","Seeds","Their mother’s blood","Leaves"],2,""],["How does the mother pelican feed her babies?",["She gives them fruits","She brings fish from the sea","She steals food from others","She hews her chest with her beak"],3,""],["How did our Lord Jesus Christ reveal His love towards us?",["By building a great palace","By defeating the Philistine army","By becoming a rich king","By giving even the last drop of His blood to redeem us from sins"],3,"QP 2019"],["Complete the Bible verse: “Love one another as I have … you.”",["called","taught","blessed","loved"],3,"QP 2021, QP 2022"],["What is the Bible reference for this lesson?",["St. Matthew 5: 7","St. John 2: 5","St. Luke 2: 30","St. John 15: 12"],3,""],["Complete: “God is …”",["Love","Anger","Far away","Fear"],0,""],["Where did Jesus Christ shed even the last drop of His blood to redeem us from sins?",["Calvary","Horeb","Moriah","Jericho"],0,"QP 2021, QP 2022"],["According to the lesson, what do we need to grow in?",["Anger","Laziness","Pride","Love"],3,""]]}]},{"n":"True Faith","units":[{"t":"Questions 5 – 9","q":[["Why did the Son of God become a man and come to this world?",["To become a rich king","To save us from our sins","To build a palace","To fight a war"],1,""],["Will Jesus, the Messiah, come to the world again?",["Only for one day","No, never","Yes, He will come again","Only in a dream"],2,"QP 2022"],["When Jesus comes again, whom will He join with Him?",["Only rich people","Only kings","Those who live according to His will","Only the priests"],2,""],["How did Jesus Christ redeem and save us?",["Through His baptism only","Through His birth only","Through His wedding at Cana","Through His crucifixion, death and resurrection"],3,"QP 2018"],["Which direction does the Church tell us to face while praying?",["East","West","North","South"],0,"QP 2021"],["Why does the Church instruct us to stand facing east while praying?",["Because the church door is there","Because the sun is hot","Because the Second Coming of Jesus will be from the east","Because it is easy"],2,"QP 2013 (Kerala), QP 2019, QP 2022"],["Which are the ordained positions in our Church?",["Teachers, Students and Parents","Kings, Judges and Prophets","Shepherds, Farmers and Fishermen","Metropolitans, Priests and Deacons"],3,""]]}]},{"n":"Church History","units":[{"t":"Questions 3 – 4","q":[["In which place were the followers of Christ first called ‘Christians’?",["Antioch","Jerusalem","Jericho","Bethlehem"],0,"QP 2013 (Kerala), QP 2021, QP 2022"],["How do we respectfully address the Metropolitan of our Diocese?",["Rabbi","King","His Eminence","Your Majesty"],2,""]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"How was the ram that Abraham saw caught in the thicket?","o":["By a rope","By its horns","By its tail","By its legs"],"a":1},{"q":"What was the job of Moses?","o":["Farmer","Cook","Shepherd","Carpenter"],"a":2},{"q":"What was the name of Saul's father?","o":["Samuel","Jethro","Jesse","Kish"],"a":3},{"q":"Which disciple did Jesus ask, \"Where are we to buy bread for these people to eat?\"","o":["Philip","John","Peter","Andrew"],"a":0}],"name":[{"q":"Who was the son of King Saul?","a":"Jonathan"},{"q":"By the roadside of which town did Bartimaeus sit?","a":"Jericho"},{"q":"What do the baby pelicans drink during their first days?","a":"Their mother's blood"},{"q":"In which place were the followers of Christ called 'Christians' for the first time?","a":"Antioch"}],"tf":[{"q":"A Jewish man was robbed on his way from Jerusalem to Jericho.","a":true},{"q":"Benjamin was the least of the tribes of Israel.","a":true},{"q":"Jonathan told David that he would shoot ten arrows near the stone.","a":false},{"q":"When Isaac asked about the lamb, Abraham said, \"We will buy one on the way.\"","a":false}],"fill":[{"q":"Mount Horeb is called the Mountain of ______.","a":"God"},{"q":"Jesus ______ the loaves and fish and gave them to the people.","a":"blessed"},{"q":"Joel's ______ crashed with a motorbike.","a":"bicycle"},{"q":"The people sang, \"While Saul had killed thousands, David killed ______.\"","a":"ten thousands"}],"short":[{"q":"What was the astonishing wonder seen by Moses?","a":"At Mount Horeb Moses saw a bush on fire, yet the bush was not burning up.","ref":"Class II textbook, Chapter 4 – Moses at the Burning Bush"},{"q":"How did Saul try to kill David?","a":"Saul tried to kill David twice by throwing his spear, but the Lord rescued David.","ref":"Class II textbook, Chapter 6 – David and Jonathan"},{"q":"Why does the Church instruct us to stand facing east while praying?","a":"The Church tells us to face east while praying because the Second Coming of Jesus will be from the east.","ref":"Class II textbook, True Faith, Question 8"}],"detail":[{"q":"Why is Abraham known as the 'Father of Faithful'?","a":"Abraham believed in God and submitted everything to God; when God asked, he took his only son Isaac to Mount Moriah; he was ready to offer Isaac as a burnt offering, showing his faith and obedience; hence he is known as the 'Father of Faithful'.","ref":"Class II textbook, Chapter 3 – The Sacrifice of Abraham"},{"q":"How did the Samaritan help the wounded man?","a":"With a compassionate heart he came down from his donkey, went to the man, bandaged his wounds and poured oil on them; he put him on his donkey, brought him to an inn and took care of him; the next day he gave two denarii to the innkeeper; he said, \"Take care of him; and when I come back, I will repay you whatever more you spend.\"","ref":"Class II textbook, Chapter 12 – Good Friend"},{"q":"How can we show mercy towards our fellow beings?","a":"We can visit an orphanage and give food to the residents on our birthday; we can console those who are in sorrow; we can visit the sick, take care of them, help and console them; we should respect, obey and love our priests and metropolitans.","ref":"Class II textbook, Chapter 11 – Merciful Jesus"}],"speech":[{"q":"\"The Lord is my shepherd, I shall not want.\" (Psalm 23:1)","a":"God elects according to His will and makes voids to fullness; Israel was sad because Samuel's sons, the judges, led the people in a wicked way; when they asked for a king, Samuel prayed and God answered him; God led Saul, who was searching for his father's lost donkeys, to Samuel; Samuel poured oil on Saul's head and said, \"The Lord has anointed you ruler over His heritage\"; though Saul was from the least tribe, Benjamin, God made him the first king of Israel – \"The Lord is my shepherd, I shall not want.\"","ref":"Class II textbook, Chapter 5 – Saul, the First King of Israel"},{"q":"God is Love","a":"The mother pelican hews her chest with her beak and her babies drink her blood to grow bigger; she says, \"I live only for you, my children\"; Jesus Christ gave even the last drop of his blood at Calvary to redeem us from sins; God is Love and God loves every one of us; Jesus said, \"Love one another, as I have loved you\"; we should grow in love and love our parents, teachers, elders, brothers and our environment.","ref":"Class II textbook, Chapter 13 – Boundless Love"}]}},{"no":2,"s":{"mcq":[{"q":"Complete the Bible verse: \"Do not be doubtful, but ______.\"","o":["wait","fear","believe","pray"],"a":2},{"q":"To which land did Moses flee from Egypt?","o":["Midian","Moriah","Jericho","Canaan"],"a":0},{"q":"Whom did Saul command to kill David?","o":["Goliath","Kish","Jonathan","Samuel"],"a":2},{"q":"About how many people sat down for food when Jesus fed them?","o":["Five thousand","One thousand","Ten thousand","Five hundred"],"a":0}],"name":[{"q":"On which animal did the Samaritan put the wounded man?","a":"His donkey"},{"q":"Who came next after the priest, saw the wounded man and also passed by?","a":"A Levite"},{"q":"Where did Jesus Christ shed even the last drop of His blood to redeem us from sins?","a":"Calvary"},{"q":"What did God tell Moses to remove from his feet?","a":"His sandals"}],"tf":[{"q":"Jethro was the brother of Moses.","a":false},{"q":"The ordained positions in our Church are Metropolitans, Priests and Deacons.","a":true},{"q":"Jesus was sitting in a boat when he saw a large crowd coming to him.","a":false},{"q":"Jonathan loved David as his own soul.","a":true}],"fill":[{"q":"There was a large noise on the road because of the ______ coming with Jesus.","a":"crowd"},{"q":"\"God is ______.\"","a":"Love"},{"q":"Isaac was gifted to Abraham by God in his ______ age.","a":"old"},{"q":"Samuel was the last ______ of Israel.","a":"judge"}],"short":[{"q":"Why did the Son of God become a man and come to this world?","a":"The Son of God became a man and came to this world in order to save us, the humanity, from our sins.","ref":"Class II textbook, True Faith, Question 5"},{"q":"\"There is a boy here who has five barley loaves and two fish.\" Who said this to whom?","a":"The disciple Andrew said this to Jesus.","ref":"Class II textbook, Chapter 10 – Jesus Feeding the Hungry"},{"q":"How did Samuel anoint Saul as king? What did he say?","a":"Samuel poured oil from a vial on Saul's head, kissed him and said, \"The Lord has anointed you ruler over His heritage.\"","ref":"Class II textbook, Chapter 5 – Saul, the First King of Israel"}],"detail":[{"q":"What did Abraham do after reaching Mount Moriah?","a":"Abraham built an altar and laid the wood in order; he bound Isaac, laid him on the altar and took the knife to sacrifice his son; the voice of Yahweh from heaven said, \"Abraham, Abraham! Do not lay your hand on the boy or do anything to him\"; Abraham saw a ram caught in a thicket by its horns and offered it as a burnt offering instead of his son.","ref":"Class II textbook, Chapter 3 – The Sacrifice of Abraham"},{"q":"Why did Saul try to kill David?","a":"After Goliath's death the people praised David, singing, \"While Saul had killed thousands, David killed ten thousands\"; the Israelites started to love David more than their king Saul; they were always singing praises to David; so Saul became jealous of David, hated him and decided to kill him.","ref":"Class II textbook, Chapter 6 – David and Jonathan"},{"q":"For what purpose did God choose Moses?","a":"King Pharaoh of Egypt had made the Israelites, the children of God, his slaves; the slaves had no freedom, were forced to do the most difficult jobs and were beaten with whips; God heard the cry of His people and chose Moses to liberate them from the slavery of Pharaoh; because Moses stammered, God said his brother Aaron would speak for him to the people.","ref":"Class II textbook, Chapter 4 – Moses at the Burning Bush"}],"speech":[{"q":"Jesus is merciful","a":"Jesus is merciful; blind Bartimaeus sat by the roadside of Jericho and cried, \"Jesus, Son of David, have mercy on me!\"; Jesus asked, \"What do you want me to do for you?\" and he said, \"My teacher, let me see again\"; Jesus had mercy, blessed him, and he immediately regained his sight; we also need to be merciful – visit the sick, help and console those in sorrow; \"Blessed are the merciful, for they will receive mercy\" (St. Matthew 5:7).","ref":"Class II textbook, Chapter 11 – Merciful Jesus"},{"q":"A Friend","a":"A friend in need is a friend indeed; Jonathan loved David as his own soul and saved him even when his father Saul ordered him to kill David; Deepu gave his blood and saved his friend Joel's life, but Manu refused; in Jesus' story, the Samaritan helped the wounded man when the priest and the Levite passed by; when we love our fellow beings, we love God; \"No one has greater love than this, to lay down one's life for one's friends\" (St. John 15:13).","ref":"Class II textbook, Chapter 6 – David and Jonathan; Chapter 12 – Good Friend"}]}},{"no":3,"s":{"mcq":[{"q":"What did Abraham build on Mount Moriah?","o":["A tent","An altar","A tower","A house"],"a":1},{"q":"Who was the father-in-law of Moses?","o":["Jethro","Aaron","Pharaoh","Kish"],"a":0},{"q":"To which tribe did Saul belong?","o":["Benjamin","Dan","Reuben","Levi"],"a":0},{"q":"What did the boy have with him when Jesus fed the people?","o":["Five barley loaves and two fish","Ten loaves and one fish","Two loaves and five fish","Seven loaves and three fish"],"a":0}],"name":[{"q":"Who helped the wounded Jewish man?","a":"A Samaritan"},{"q":"How do we respectfully address the Metropolitan of our Diocese?","a":"His Eminence"},{"q":"Who gifted David his robe and sword?","a":"Jonathan"},{"q":"What did God give Moses to perform miracles or signs?","a":"A sceptre (staff)"}],"tf":[{"q":"God gives us trials to examine our faith.","a":true},{"q":"Saul was very tall and handsome.","a":true},{"q":"The mother pelican had ten hatchlings.","a":false},{"q":"Jonathan was trying to kill David.","a":false}],"fill":[{"q":"\"Blessed are the merciful, for they will receive ______.\" (St. Matthew 5:7)","a":"mercy"},{"q":"\"No one has greater love than this, to lay down one's life for one's ______.\" (St. John 15:13)","a":"friends"},{"q":"The Samaritan gave two ______ to the innkeeper.","a":"denarii"},{"q":"The mother pelican hews her ______ with her beak to feed her babies.","a":"chest"}],"short":[{"q":"How did Bartimaeus get his eyesight back?","a":"Jesus had mercy on Bartimaeus and blessed him, and immediately he regained his sight.","ref":"Class II textbook, Chapter 11 – Merciful Jesus"},{"q":"What happened to the Jewish man in the middle of his journey to Jericho?","a":"He fell into the hands of robbers, who stripped him, beat him, looted him and left him half dead.","ref":"Class II textbook, Chapter 12 – Good Friend"},{"q":"How did Jesus Christ redeem and save us?","a":"Jesus Christ redeemed and saved us through His crucifixion, death and resurrection.","ref":"Class II textbook, True Faith, Question 7"}],"detail":[{"q":"What did Jesus tell his disciples after the people had eaten? What did the disciples do with the leftovers?","a":"When the people were satisfied, Jesus told his disciples, \"Gather up the fragments left over, so that nothing may be lost\"; the disciples gathered up the leftover fragments of the five barley loaves and filled baskets with them; food is provided by God, so it should not be wasted; wasting food is sin.","ref":"Class II textbook, Chapter 10 – Jesus Feeding the Hungry"},{"q":"How did Jonathan save his friend David from Saul?","a":"When Saul ordered Jonathan to kill David, Jonathan told David to hide in the field near the stone 'Ezel'; he said he would shoot three arrows and tell a boy where they were, as a sign; he shot an arrow and said, \"The arrow is beyond you\", which meant Saul still wanted to kill David; they wept together and kissed each other, and Jonathan said, \"Go in peace, the Lord shall be between me and you.\"","ref":"Class II textbook, Chapter 6 – David and Jonathan"},{"q":"How did Saul become the first king of Israel?","a":"Saul and a servant boy went to look for his father Kish's lost donkeys and could not find them; the boy took him to Samuel, the man of God, who received him gladly and said the donkeys had been found; next morning Samuel poured oil on Saul's head and said, \"The Lord has anointed you ruler over His heritage\"; Samuel announced, \"God elected this man as the King of Israel,\" and Saul began to rule as the first king.","ref":"Class II textbook, Chapter 5 – Saul, the First King of Israel"}],"speech":[{"q":"Love at Calvary","a":"The mother pelican hews her chest with her beak to feed her five hatchlings with her own blood; she is ready to die so that her children may live; our Lord and Saviour Jesus Christ gave even the last drop of his blood at Calvary to redeem us from sins; this shows his great love towards us; Jesus said, \"This is my commandment: love one another, as I have loved you\"; God is Love, so we must grow in love and share God's love with everyone.","ref":"Class II textbook, Chapter 13 – Boundless Love"},{"q":"God will protect us","a":"God gives trials to examine our faith, and we should not give up belief in God in difficult times; God protected Isaac when Abraham obeyed Him and provided a ram for the offering; God heard the cry of the Israelites who were slaves of Pharaoh; God chose Moses at the burning bush to liberate them; God helps us during the time of trials and torments; to be protected by God we should pray, obey God, believe in God and submit to God.","ref":"Class II textbook, Chapter 3 – The Sacrifice of Abraham; Chapter 4 – Moses at the Burning Bush"}]}},{"no":4,"s":{"mcq":[{"q":"What was the name of Abraham's son?","o":["Isaac","Joseph","Samuel","Jacob"],"a":0},{"q":"Who was appointed by God to help Moses?","o":["Jethro","Aaron","Pharaoh","Abraham"],"a":1},{"q":"How many tribes are there in Israel?","o":["6","8","10","12"],"a":3},{"q":"Which direction does the Church tell us to face while praying?","o":["West","East","South","North"],"a":1}],"name":[{"q":"Near which stone did Jonathan ask David to hide?","a":"The stone Ezel"},{"q":"What did Saul go out to look for?","a":"His father's donkeys"},{"q":"Which country was ruled by Pharaoh?","a":"Egypt"},{"q":"Who came first on the road and passed by without helping the wounded man?","a":"A Jewish priest"}],"tf":[{"q":"The disciples threw away the leftover loaves.","a":false},{"q":"David pleased everyone in the palace by playing the harp.","a":true},{"q":"Samuel poured water on Saul's head to anoint him as king.","a":false},{"q":"We can show mercy by visiting the sick and consoling them.","a":true}],"fill":[{"q":"\"Love one another as I have ______ you.\" (St. John 15:12)","a":"loved"},{"q":"\"Blessed are those who hunger and thirst for ______, for they will be filled.\" (St. Matthew 5:6)","a":"righteousness"},{"q":"During the Old Testament times, birds and ______ were brought as offerings to God.","a":"animals"},{"q":"A friend in ______ is a friend indeed.","a":"need"}],"short":[{"q":"Why do we remove our sandals before entering the church?","a":"We remove our sandals because the church is holy, as God told Moses, \"Remove the sandals from your feet, for the place on which you are standing is holy ground.\"","ref":"Class II textbook, Chapter 4 – Moses at the Burning Bush"},{"q":"What gifts did Jonathan give to David?","a":"Jonathan gave David his robe, sword, armour, bow and belt.","ref":"Class II textbook, Chapter 6 – David and Jonathan"},{"q":"Who was the 'man of God' that the servant boy told Saul about? What did the boy say about him?","a":"The man of God was Samuel, a man held in honour, and the boy said that whatever he says always comes true and perhaps he would help them.","ref":"Class II textbook, Chapter 5 – Saul, the First King of Israel"}],"detail":[{"q":"How did Jesus give sight to Bartimaeus?","a":"Bartimaeus was a blind beggar who sat by the roadside of Jericho; when he heard that Jesus was passing, he cried aloud, \"Jesus, Son of David, have mercy on me!\"; Jesus called him and asked, \"What do you want me to do for you?\", and he said, \"My teacher, let me see again\"; Jesus had mercy on him and blessed him, and immediately he regained his sight.","ref":"Class II textbook, Chapter 11 – Merciful Jesus"},{"q":"Tell the story of Manu, Deepu and Joel. Who was Joel's real good friend?","a":"Joel's bicycle crashed with a motorbike and the doctor said he needed blood immediately; Manu said he was tired and might feel sick, and asked them to approach someone else; Deepu said blood donation is a great donation and gave his blood, which rescued Joel's life; Deepu was Joel's real good friend – a friend in need is a friend indeed.","ref":"Class II textbook, Chapter 12 – Good Friend"},{"q":"How does the mother pelican feed her hatchlings? What does this teach us?","a":"The mother pelican hews her chest very hard with her sharp beak; her five hatchlings drink her blood in their first days and grow bigger; in the same way Jesus gave even the last drop of his blood to redeem us from sins; it teaches us that God is Love and that we must love one another.","ref":"Class II textbook, Chapter 13 – Boundless Love"}],"speech":[{"q":"Feed the hungry – do not waste food","a":"A large crowd came to Jesus on the mountain, and Jesus asked Philip where to buy bread for them; Andrew said a boy had five barley loaves and two fish; Jesus made about five thousand people sit down, blessed the food and gave them as much as they wanted; Jesus said, \"Gather up the fragments left over, so that nothing may be lost\"; food is provided by God, so wasting food is sin, and we should share our food with those in need; with our teachers we can collect our small money to feed the poor, and we should pray before and after food.","ref":"Class II textbook, Chapter 10 – Jesus Feeding the Hungry"},{"q":"\"Do not be doubtful, but believe\" – the faith of Abraham","a":"God called Abraham and told him to offer his only son Isaac on Mount Moriah; Abraham believed and submitted to God wholeheartedly and started the journey; when Isaac asked where the lamb was, Abraham said, \"God will provide\"; when Abraham took the knife, Yahweh said, \"Do not lay your hand on the boy,\" and Abraham offered a ram instead; God gives trials to examine our faith, and we should not give up belief in God even in difficult situations; \"Do not be doubtful, but believe\" (St. John 20:27).","ref":"Class II textbook, Chapter 3 – The Sacrifice of Abraham"}]}},{"no":5,"s":{"mcq":[{"q":"To which mountain did Abraham take his son Isaac to offer him as a sacrifice?","o":["Mount Sinai","Mount Ararat","Mount Horeb","Mount Moriah"],"a":3},{"q":"Who was the first king of Israel?","o":["David","Saul","Samuel","Solomon"],"a":1},{"q":"In the story of the good Samaritan, who was the Levite?","o":["One who assisted in the worship","A king","An innkeeper","A robber"],"a":0},{"q":"When Jesus asked, \"What do you want me to do for you?\", what did Bartimaeus say?","o":["\"My teacher, let me see again.\"","\"Take me to Jerusalem.\"","\"Give me some money.\"","\"Give me some bread.\""],"a":0}],"name":[{"q":"Name the mountain where Moses saw the burning bush.","a":"Mount Horeb"},{"q":"Whose voice did Abraham hear from heaven, saying, \"Do not lay your hand on the boy\"?","a":"The voice of Yahweh (God)"},{"q":"Which bird hews its chest to feed its hatchlings?","a":"Pelican"},{"q":"Who was the leader of the Philistines?","a":"Goliath"}],"tf":[{"q":"The followers of Christ were called 'Christians' for the first time in Jerusalem.","a":false},{"q":"Samuel invited Saul for dinner, and Saul stayed with him that night.","a":true},{"q":"Saul went alone to search for his father's donkeys.","a":false},{"q":"Jonathan and David wept together and kissed each other before David went away.","a":true}],"fill":[{"q":"\"The Lord is my ______, I shall not want.\" (Psalm 23:1)","a":"shepherd"},{"q":"\"Remove the sandals from your feet, for the place on which you are standing is ______.\" (Exodus 3:5)","a":"holy ground"},{"q":"My Pledge: \"I understand that wasting food is ______.\"","a":"sin"},{"q":"The Samaritan brought the wounded man to an ______ and took care of him.","a":"inn"}],"short":[{"q":"Why did the Israelites ask Samuel to appoint a king over them?","a":"Samuel's sons Joel and Abijah, the judges, did not follow his ways and led the people in a wicked way, so the sad Israelites asked Samuel for a king to govern them.","ref":"Class II textbook, Chapter 5 – Saul, the First King of Israel"},{"q":"Why does God give us trials?","a":"God gives us trials in order to examine our faith.","ref":"Class II textbook, Chapter 3 – The Sacrifice of Abraham"},{"q":"Who lead us towards heaven by giving us spiritual food? How should we treat them?","a":"Our priests and metropolitans lead us towards heaven by providing spiritual food, and we should respect, obey and love them.","ref":"Class II textbook, Chapter 11 – Merciful Jesus"}],"detail":[{"q":"Give any three qualities of a good friend.","a":"A good friend helps us when we are in need – a friend in need is a friend indeed; a good friend is patient, merciful and loving towards others; a good friend is obedient a
