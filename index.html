Holiness Elias III visit Malankara though he was a heart patient?",["To end the schism in the Malankara church","To consecrate Mooron","To build a new seminary","To meet the Maharaja of Travancore"],0,""],["On whose invitation did His Holiness Elias III visit India?",["The Viceroy Lord Irwin","Mor Dionysius VI","The Maharaja of Travancore","The British Government in Madras"],0,""],["Via which city did His Holiness reach Delhi?",["Bombay","Madras","Calcutta","Karachi"],3,""],["On which date did His Holiness reach Alwaye?",["13th February 1932","20th March 1931","22nd August 1934","24th September 1909"],1,""],["What did His Holiness readily do when Mor Dionysius VI met him at Alwaye?",["Made him Patriarch","Withdrew the suspension of Dionysius","Sent him to Antioch","Consecrated him as Catholicose"],1,""],["What did Mor Dionysius VI obstinately demand from His Holiness?",["A seat in the Holy Synod","Recognition of the establishment of the Catholicate","A new diocese","Control of the vattippanam"],1,""],["At which church did His Holiness Elias III pass away?",["St. Mary's church Manarcad","St. Georges church Karingachira","St. Thomas church Mulanthuruthi","St. Stephens church Manjanikara"],3,""],["On which date did His Holiness Elias III reach St. Stephens church Manjanikara, where he passed away?",["13th February 1932","15th December 1917","20th March 1931","25th January 1953"],0,"QP 2017"],["What was the cause of the death of His Holiness Elias III?",["An accident","A heart attack","An eye disease","A long fever"],1,""],["In which Diptych during the Holy Mass is His Holiness Elias III remembered?",["1st Diptych","3rd Diptych","5th Diptych","6th Diptych"],2,""],["In which year did Mor Dionysius VI pass away?",["1917","1931","1934","1953"],2,""],["Where was Mor Dionysius VI buried?",["Manjanikara","Akapparambu Church","The old seminary Kottayam","Pampady Church"],2,""],["Who started the litigation process which is still continuing in the church?",["Mor Koorilose","Paulose Mor Athanasius","Mor Dionysius VI","Ougen Mor Thimotheos"],2,""],["At which church was the meeting of the representatives of the Malankara church held on 22 August 1934?",["St. Stephens church Manjanikara","Old seminary Kottayam","St. Georges church Karingachira","St. Mary's church Manarcad"],2,""],["Whom did the meeting on 22 August 1934 elect as Malankara Metropolitan?",["Baselious Geevarghese II","Abraham Mar Clemis","Paulose Mor Athanasius","Michael Mor Dionysius"],2,""],["Who was the Catholicose of the other faction ('Methran Kakshi') who chaired their meeting at the old seminary?",["Geevarghese Mor Gregorius","Paulose Mor Severius","Ougen Mor Thimotheos","Baselious Geevarghese II"],3,""],["Which bishop of the Kandanad diocese crossed over to the Methran Kakshi and was suspended?",["Paulose Mar Philexinos","Ougen Mor Thimotheos","Abraham Mor Clemis","Thomas Mor Dioscorus"],1,""],["In 1946, which Patriarch consecrated Geevarghese Mor Gregorius and Paulose Mor Severius?",["H.H. Abdulla","H.H. Elias III","H.H. Peter III","H.H. Ignatius Aprem I"],3,""],["When did Paulose Mar Athanasius, the Malankara Metropolitan, pass away?",["13th February 1932","January 25, 1953","15th December 1917","21st June 1957"],1,""],["Who was elected as successor to Paulose Mar Athanasius at St. Mary's church Manarcad in 1957?",["Paulose Mor Severius","Abraham Mar Clemis","Paulose Mar Philexinos","Geevarghese Mor Gregorius"],1,""],["Which Patriarch is entombed at Manjanikara (St. Stephens church)?",["H.H. Abdedaloho","H.H. Peter III","H.H. Ignatius Aprem I","H.H. Elias III"],3,"QP 2013, QP 2013 (Kerala), QP 2018, QP 2019, QP 2021"]]},{"t":"Chapter 22 – Mar Yacoob of Sarug","q":[["Where was Mar Yacoob born?",["In Kurthom on the banks of river Prosa in Sarug","In Alexandria","In Constantinople","In Antioch"],0,"QP 2013, QP 2013 (Kerala), QP 2022"],["In which year was Mar Yacoob born?",["344 A.D.","376 A.D.","451 A.D.","521 A.D."],2,""],["At what age did the young Yacoob go to the sanctuary and bow before the Altar three times?",["One year","Twelve years","Seven years","Three years"],3,""],["During which festival did the three-year-old Yacoob bow before the Altar?",["Pentecost","Danaha","Easter","Christmas"],1,""],["At what age was Mar Yacoob ordained as a priest?",["18","22","30","33"],1,""],["What does 'Corepiscopa' mean, the office to which Mar Yacoob was raised?",["Patriarch","Deacon","Village Bishop","Monk"],2,"QP 2014"],["Mar Yacoob was consecrated as the bishop of which place?",["Antioch","Edessa","Alexandria","Batnaed Sarug"],3,""],["Who is called the flute of the Holy Spirit?",["Mor Yacoob","Mor Aphrem","Mor Daniel","Mor Elias III"],0,"QP 2021, QP 2022"],["How many poems did Mar Yacoob write?",["70","200","451","760"],3,""],["About how many people were engaged in making copies of Mar Yacoob's poems?",["12","22","70","760"],2,""],["Mar Yacoob wrote biographies of Mor Daniel and whom else?",["Mor Ephraem","Mor Ivanius","Mor Koorilose","Mor Hananiya"],3,""],["In the wealth of words and ease of expression, Mar Yacoob ranks next to whom?",["Koorilose","Moses Bar Kepho","Ephraem","Ivanius"],2,""],["On which date did Mar Yacoob pass away?",["13th February 1932","14th September 407 A.D.","27th June 444 A.D.","29th November 521 A.D."],3,""],["What does the inscription at Mar Yacoob's tomb in the Sarug church call him?",["Watchful guardian of true faith","Golden Mouthed preacher","Spiritual scholar and compiler of faith","Father of the Church"],2,""],["Besides his poems, which of these works did Mar Yacoob write for the Church's prayers?",["The Nicene Creed and the Lord's Prayer","Interpretations of the Gospels of St. Luke and St. John","Two divine Liturgies, a prayer for the kiss of peace on Christmas and a rite for Baptism","More than 200 letters from exile"],2,"QP 2019"]]},{"t":"Chapter 23 – Golden Mouthed Ivanius","q":[["Of which place was Mar Ivanius the Patriarch?",["Antioch","Constantinople","Jerusalem","Alexandria"],1,"QP 2014, QP 2019"],["Where was Mar Ivanius born?",["Alexandria","Antioch","Constantinople","Sarug"],1,""],["In which year was Mar Ivanius born?",["344 A.D.","376 A.D.","407 A.D.","451 A.D."],0,""],["What was Mar Ivanius named at birth?",["Cyril","Stephen","John","Jacob"],2,""],["Under whom did Mar Ivanius study Theology?",["Ephraem","Libanius","Theophilos","Mar Milithius, Patriarch of Antioch"],3,""],["Under whom did Mar Ivanius study law, philosophy and rhetoric?",["Nestorius","Libanius","Theophilos","Mar Milithius"],1,""],["In which year was Mar Ivanius consecrated as a bishop?",["344 A.D.","386 A.D.","398 A.D.","407 A.D."],2,""],["What is the nickname of Mar Ivanius?",["Parumala Thirumeni","Scholar in the Creed of Incarnation","Flute of the Holy Spirit","Golden Mouthed"],3,"QP 2013, QP 2013 (Kerala), QP 2018"],["What did Mar Ivanius believe about a person's wealth?",["It is entrusted to him to help others, and excess should be shared with the needy","It should be given to the king","It should be kept for his children","It is his private property"],0,""],["Which queen did Mar Ivanius oppose when she tried to erect her own statue near the church?",["Eudoxia","Claudia Procula","Theodora","Jezebel"],0,""],["By what name did Mar Ivanius refer to Queen Eudoxia?",["Jezeebel","Delilah","Pharaoh","Herodias"],0,""],["Which Patriarch of Alexandria convened a meeting of bishops and deposed Mar Ivanius?",["Koorilose","Theophilos","Milithius","Nestorius"],1,""],["Why was Mar Ivanius called back the first time after he was banished?",["The Pope ordered it","He was elected Patriarch again","Earthquakes, unpleasant incidents in the palace and fear of a mass revolt","The queen asked for forgiveness"],2,""],["How many letters did Mar Ivanius write from exile to the believers in Constantinople?",["More than 200","About 70","760","Eight"],0,""],["Golden Mouthed Ivanius expired on",["September 14th 407 A.D.","October 14th 407 A.D.","December 14th 407 A.D.","August 14th 407 A.D."],0,"QP 2017"],["On which Gospels were the main lectures of Mar Ivanius based?",["St. Luke and St. John","St. Mathew and St. John","St. Mathew and St. Mark","St. Mark and St. Luke"],1,""],["Mar Ivanius often explained the connection between the crossing of the Red Sea and what?",["The Holy Qurbana","Marriage","Baptism","Confession"],2,""],["In his letter, Mar Ivanius said 'let her throw me into the sea, I remember ___'.",["Jonah","Stephen","Daniel","Isaiah"],0,"QP 2022"],["In his letter, whose example did Mar Ivanius remember if he were thrown to the wild animals?",["St. Stephen stoned","Jonah in the sea","Isaiah split in two","Daniel in a Lion's den"],3,""],["Whom did Mar Ivanius call the first martyr in his letter?",["St. Stephan","Isaiah","Hananiya","St. John the Baptist"],0,""]]},{"t":"Chapter 24 – St. Koorilose: Cyril of Alexandria","q":[["St. Koorilose was the Patriarch of which place?",["Constantinople","Antioch","Ephesus","Alexandria"],3,""],["Who is known as the \"Scholar in the Creed of Incarnation\"?",["St. Koorilose","Golden Mouthed Ivanius","St. Elias III","Mar Yacoob"],0,"QP 2013, QP 2013 (Kerala), QP 2019, QP 2021"],["In which Diptych is St. Koorilose described as the watchful guardian of true faith?",["1st Diptych","3rd Diptych","5th Diptych","6th Diptych"],2,""],["What did St. Koorilose prove beyond doubt?",["The date of Easter","The canon of the Old Testament","The authorship of the Gospels","The divine and human nature of Jesus Christ"],3,""],["In which year was St. Koorilose born?",["344 A.D.","376 A.D.","444 A.D.","451 A.D."],1,""],["Who consecrated St. Koorilose as a bishop?",["Nestorius","His paternal uncle, Theophilose","Mar Milithius","Emperor Theodosious II"],1,""],["______ was the chairman of the Holy Synod of Ephesus.",["Nestorius","Mar Yacoob","Mor Ivanius","St. Koorilose (Cyril of Alexandria)"],3,"QP 2013, QP 2013 (Kerala), QP 2019"],["Which Emperor convened the Holy Synod of Ephesus?",["Constantine","Nero","Theodosious II","Justinian"],2,""],["Who was the Patriarch of Constantinople who made hostile comments against the Holy Virgin?",["Nestorius","Theophilose","Ivanius","Milithius"],0,""],["According to Nestorius, what should Virgin Mary be called?",["Mother of God","Mother of the Church","Mother of Christ","Queen of Heaven"],2,""],["What did the Holy Synod of Ephesus emphatically declare Virgin Mary to be?",["Mother of the Apostles","A prophetess","Mother of God","Mother of Christ only"],2,""],["Why did Mor Koorilose face persecution?",["Because he refused to become a bishop","Because he opposed the heresy of Nestorius","Because he wrote 760 poems","Because he opposed Queen Eudoxia"],1,""],["Mor Koorilose wrote interpretations of which Gospels?",["St. Mathew and St. Mark","St. Mathew and St. John","St. Mark and St. Luke","St. Luke and St. John"],3,""],["Who wrote the book \"The True Faith Regarding the Incarnation of Our Lord\"?",["Mor Ivanius","Mar Yacoob","Mor Koorilose","Mar Athanasius"],2,"QP 2018"],["On which date did Mor Koorilose pass away?",["14th September 407 AD","15th December 1917","27th June 444 AD","29th November 521 AD"],2,""],["By what other name is St. Koorilose known?",["Jacob of Sarug","Cyril of Alexandria","John of Antioch","Ephraem of Edessa"],1,"QP 2019"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Name the king who attacked Jerusalem in 605 B.C. and carried away many captives, including Daniel, to Babylon.","o":["Nebuchadnezzar","Antiochus Epiphanes","Jeroboam","Herod"],"a":0},{"q":"Which prophecy does not have any complaint against the prophet's own people?","o":["Micah","Amos","Zephaniah","Nahum"],"a":3},{"q":"Who saw the resurrected Jesus first?","o":["The guards at the tomb","St. Peter","Mary Magdalene","Mother Mary"],"a":2},{"q":"Jesus was crucified at the ______ hour.","o":["3rd","6th","9th","12th"],"a":0},{"q":"The Marvahtso (fan) used in the Holy Mass reminds us of","o":["the stone rolled over the tomb","the Holy Spirit coming as a dove","the presence of angels around the Holy Altar","the twelve disciples of Jesus"],"a":2},{"q":"Who is called the \"Flute of the Holy Spirit\"?","o":["Mor Aphrem","Mor Yacoob","Mor Elias III","Mor Daniel"],"a":1}],"name":[{"q":"Name the two Major Prophets who lived during the Babylonian exile.","a":"Daniel and Ezekiel"},{"q":"What does the word 'Micah' mean?","a":"\"Who is similar to God?\""},{"q":"Name the king who beheaded John the Baptist.","a":"Herod Antipas"},{"q":"Who helped Joseph of Arimathea in the burial of Jesus?","a":"Nicodemus"},{"q":"Name the table on which the Evangelion book (Book of Gospel) is kept.","a":"The Pulpit (Evangelion table)"},{"q":"Which Patriarch is buried at St. Stephen's Church, Manjanikara?","a":"H.H. Moran Mor Ignatius Elias III"}],"tf":[{"q":"Daniel and Ezekiel were contemporaries.","a":true},{"q":"From the cross, Jesus entrusted the care of His mother to His disciple Peter.","a":false},{"q":"The 5th order of priesthood is called Kasheeso.","a":false},{"q":"St. Koorilose was the chairman of the Holy Synod of Ephesus.","a":true}],"fill":[{"q":"The meaning of the word 'Jonah' is ______.","a":"dove"},{"q":"The resurrected Jesus appeared ______ times to His disciples and others.","a":"10 (ten)"},{"q":"'Hosanna' is a Hebrew word which literally means '______'.","a":"Save, I pray"},{"q":"The present Supreme Head of the Universal Jacobite Syrian Orthodox Church, the Patriarch of Antioch, is ______.","a":"H.H. Moran Mor Ignatius Aphrem II"},{"q":"Mar Yacoob of Sarug wrote ______ poems.","a":"760"}],"match":{"l":["Golgotha","Zephaniah","Amos","Peter","Mansion of Mark","Kaukbo","St. Koorilose"],"r":["Skull hill","Malcuse","Cyril of Alexandria","Star","Hidden by God","One who carries burden","Passover feast"],"key":[0,4,5,1,6,3,2]},"short":[{"q":"Describe the two questions of Habakkuk and God's reply to them.","a":"Habakkuk's first question was, \"How long shall I cry for help, and you will not listen? Or cry to you 'Violence!' and you will not save?\" (1:1-4). His second question was, \"Why do you look on the treacherous, and are silent when the wicked swallow those more righteous than they?\" (1:12-17). The Lord replied (chapter 2) that the wicked would be destroyed and the righteous saved, for \"The righteous live by their faith.\"","ref":"Class VIII textbook, Chapter 8 – Prophets before the Exile (Habakkuk)"},{"q":"The Jews gave the price of a slave for Jesus. Explain.","a":"The high priests, scribes and elders plotted to arrest Jesus and kill Him. Judas Iscariot, one of His disciples, went to the Chief Priest and agreed to betray Jesus for 30 pieces of silver, which was the price of a slave. Thus the prophecy of Zechariah (11:12) was fulfilled.","ref":"Class VIII textbook, Chapter 13 – The Passion of the Lord (The plot against Jesus)"},{"q":"Write about the candles placed on the Altar.","a":"Thirteen candles are placed on the Altar: the twelve on either side of the cross represent the twelve disciples, who never walked in front of their Guru, and the one in front represents St. John the Baptist, the forerunner. The candle in front is removed when the public celebration of the Holy Mass begins, because John's ministry had ended when Jesus began His public ministry. Like a candle that melts away while spreading light, a Christian should spend his life spreading light in the service of God and men.","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Candles)"},{"q":"How did Jesus gain strength for His passion? Why did the disciples run away when He was arrested?","a":"Jesus gained strength through His prayer to His Father in the garden of Gethsemane, so He could face His arrest calmly. The disciples had slept when they should have been praying; they became lazy, lost their courage and fled in fear. After the Resurrection they were strengthened and later died as martyrs for Jesus.","ref":"Class VIII textbook, Chapter 13 – The Passion of the Lord (Arrest of Jesus)"}],"para":[{"q":"What is Ezekiel's vision about Christ?","a":"Ezekiel presents the Messiah mainly in three ways; The cedar tree planted on a high and lofty mountain (17:22-24): a tender sprout grows into a noble cedar under which every kind of bird lives - this shows the supremacy of the Messiah; The real heir of the Ruler (21:27): \"Until He comes whose right it is, and I will give it to Him\" - the Messiah will come as the real ruler; The True Shepherd (34:11-31): \"I will set up over them one shepherd\"; Israel the flock will be safe under Jesus Christ, the True Shepherd (St. John chapter 10)","ref":"Class VIII textbook, Chapter 6 – Ezekiel (Vision about Christ)"},{"q":"What are the phases in which Jesus faced trial?","a":"Before Annas, the previous High Priest, during the night; Before Caiaphas, the High Priest, with the scribes and elders, informally at night; Before the Sanhedrin, formally, in the morning; Before Pilate, the Governor; Before Herod, the ruler of Galilee; Again before Pilate, who finally handed Him over to be crucified","ref":"Class VIII textbook, Chapter 14 – The Trial of Jesus"},{"q":"Sketch the life of 'Golden Mouthed' Ivanius.","a":"Mar Ivanius was born in Antioch in 344 A.D. and was named John; He studied theology under Mar Milithius and law, philosophy and rhetoric under Libanius; He was ordained priest in 386 A.D., consecrated bishop in 398 A.D. and later became Patriarch of Constantinople; His eloquence earned him the nickname 'Golden Mouthed'; He worked to reform the priesthood and uplift the poor, and taught that excess wealth should be shared with the needy; He opposed Queen Eudoxia and Theophilos, was deposed and banished, wrote more than 200 letters from exile and died on September 14th, 407 A.D.","ref":"Class VIII textbook, Chapter 23 – Golden Mouthed Ivanius"}],"essay":[{"q":"What do we learn from the resurrection of Jesus?","a":"The Resurrection of Jesus is the foundation of Christian belief (1 Cor. 15:14); The most important message of the Resurrection is Peace - it removes fear and gives hope; Those who came back to life before Christ did not rise on their own and returned to the same life - it was not a resurrection to eternity; Through His Resurrection Jesus acquired a glorified body, beyond physical laws - He entered the locked Mansion of Mark without opening the doors; Through the Resurrection Jesus defeated death completely and released man from the slavery of death and Hades; The Resurrection of Jesus is the forerunner of the resurrection of the human race in the future; Jesus rose for the justification of the human race (Rom. 4:25)","ref":"Class VIII textbook, Chapter 16 – Burial, Resurrection and Ascension of Jesus (Facts about the Resurrection)"},{"q":"Explain the censer and its parts with their symbolic meanings.","a":"The censer is used to burn incense during the Holy Mass and other sacraments; It has a base and a lid joined by four chains, each with three bells (twelve bells in all), held by a hook; The base symbolizes the Virgin Mother's womb and the fire, our Lord conceived in her womb; The 1st chain indicates the Holy Father, the 2nd and 3rd the Holy Son and the 4th the Holy Spirit; The twelve bells symbolize the twelve disciples, and the hook holding the chains together shows the unity of the Trinity; The incense is a gum that gives fragrance with fire - our prayers should be holy and sincere to be a pleasing fragrance to God; Another meaning: the lid is heaven, the lower cup the earth, the coal the sinners and the fire the Holy Spirit - sinners are purified in God's presence like glowing coal","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Censer)"}]}},{"no":2,"s":{"mcq":[{"q":"On the banks of which river did Ezekiel receive the gift of prophecy?","o":["Chebar","Gihon","Jordan","Habor"],"a":0},{"q":"Which prophet declared God's commands through his own life experiences?","o":["Hosea","Amos","Habakkuk","Jonah"],"a":0},{"q":"From where did Jesus ascend to heaven?","o":["Mount Olive","Galilee","Gethsemane","Mansion of Mark"],"a":0},{"q":"In how many phases did Jesus face trial?","o":["3","4","6","7"],"a":2},{"q":"What does the base of the censer symbolize?","o":["Virgin Mother's womb","The Trinity","Holy Altar","Holy Son"],"a":0},{"q":"Who is known as the \"Scholar in the Creed of Incarnation\"?","o":["Mor Elias III","Mor Ivanius","Mor Koorilose","Mor Yacoob"],"a":2}],"name":[{"q":"Name any one friend of Daniel (original or new name).","a":"Hananiah, Mishael or Azariah (Shadrach, Meshach or Abednego)"},{"q":"Who is called the prophet of judgement?","a":"Zephaniah"},{"q":"What is the meaning of the word 'Sanhedrin'?","a":"Council"},{"q":"Whom did Jesus instruct to prepare the Passover feast?","a":"Peter and John"},{"q":"What is the title of the 4th order deacon?","a":"Korooyo"},{"q":"What is the nickname of Mar Ivanius?","a":"Golden Mouthed"}],"tf":[{"q":"Amos was a shepherd.","a":true},{"q":"After completing the prayer at Gethsemane, Jesus instituted the Holy Qurbana.","a":false},{"q":"Priests of all ranks wear ceremonial shoes (M'sone) while celebrating the Holy Mass.","a":true},{"q":"H.H. Elias III visited India on the invitation of the Maharaja of Travancore.","a":false}],"fill":[{"q":"The second part of Ezekiel's prophecy (chapters 34-38) mainly speaks of the ______ of Israel.","a":"deliverance"},{"q":"When Jesus became very weak, the soldiers compelled ______ to carry His cross.","a":"Simon of Cyrene"},{"q":"Jesus breathed His last at the ______ hour.","a":"9th (ninth)"},{"q":"______ is the Altar cloth that covers the whole Altar.","a":"Chithol"},{"q":"Golden Mouthed Ivanius died on September 14th, ______ A.D.","a":"407"}],"match":{"l":["Nahum","Habakkuk","Judas Iscariot","Thomas","Eskimo","Kutino","Theodosius II"],"r":["\"My Lord and My God!\"","Small prophecy of three chapters","Convened the Holy Synod of Ephesus","Destruction of Nineveh","Hood worn by monks","White gown (Alb)","Thirty pieces of silver"],"key":[3,1,6,0,4,5,2]},"short":[{"q":"What is the message of the prophecy of Jonah?","a":"The Jews believed that salvation was their right alone, and the book of Jonah is a fitting reply to this narrow-mindedness. Nineveh repented at Jonah's preaching and God saved it, which shows that God's mercy has no boundaries. All people are children of God like the Jews, and God desires to give salvation to all.","ref":"Class VIII textbook, Chapter 7 – Minor Prophets (Jonah)"},{"q":"Why did Pilate send Jesus to Herod? What happened there?","a":"When Pilate heard that Jesus was from Galilee, he sent Him to Herod, the ruler of that province, who was in Jerusalem for the festival. Herod was happy, hoping to see a miracle, and asked Him many questions, but Jesus was silent; Herod and his soldiers mocked Him, put an elegant robe on Him and sent Him back to Pilate. On that day Herod and Pilate, who had been enemies, became friends.","ref":"Class VIII textbook, Chapter 14 – The Trial of Jesus (Before Herod)"},{"q":"What are the two seasons of the liturgical calendar of the church?","a":"The liturgical calendar of the church is divided into two seasons - Kyomtha (Resurrection) and Sleeba. The Kyomtha season is from Easter to the Feast of the Cross on September 14, and its prayers are related to the resurrection of the Lord. The Sleeba season is from September 14 to the next Easter; the prayers of both seasons are given separately in the Qurbana kramam.","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Kyomtha and Sleeba prayers)"},{"q":"Why do we place a cross with an Uraroh on the Altar?","a":"The Uraroh is a long, narrow cloth put on the cross; it stands for the napkin that covered the head and face of Jesus at His burial. Peter and John found this napkin folded and kept separately in the empty tomb, and removal of the napkin from the face is a symbol of resurrection. Jesus and two thieves were crucified but only Jesus came back to life, so we use a cross with an Uraroh to show the resurrection of our Lord.","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (The Cross – Uraroh)"}],"para":[{"q":"Write in brief about Daniel's vision of Christ.","a":"A stone touched by none shattered the huge statue of gold, silver, bronze, iron and clay; the stone is the Messiah and the statue the colonialist forces - at the right time the Messiah will remove them and rule the world (2:31-35, 44); The Son of Man received absolute dominion and kingship so that all peoples, nations and languages should serve Him, and His dominion is everlasting (7:13-14); The cut off anointed prince: an anointed prince would come to rebuild Jerusalem but would be cut off, followed by war and misery (9:25-27); A man clothed with a belt of gold, similar to St. John's vision in Revelation 1:12-16; The essence of the visions: God's side will finally win and the Kingdom of God will be established","ref":"Class VIII textbook, Chapter 5 – Daniel (Vision about Jesus)"},{"q":"What are the sufferings Jesus had to face at the headquarters of Pilate?","a":"The Roman soldiers stripped Jesus of His clothes, put a purple robe around Him and flogged Him; They wove a crown of thorns and put it on His head, and put a reed in His right hand; They knelt before Him and mocked Him, \"Hail, King of the Jews!\"; Jesus came out before the crowd wearing the crown of thorns and dripping blood, and Pilate said, \"Here is the man!\"; The crowd still cried for His crucifixion, so Pilate, not wanting to lose his position, set Barabas free and handed Jesus over to be crucified","ref":"Class VIII textbook, Chapter 14 – The Trial of Jesus (Again before Pilate)"},{"q":"What are the preparations for receiving the Holy Eucharist?","a":"Preparation starts from the previous evening - complete the prayers for the evening and the night; Reach the church early enough to take part in the morning prayers; Confession before the priest is required - its usefulness lasts 40 days, but if any sin is committed in that time, confession is needed again; Even when confession is not required, receive atonement prayers from the priest before the Holy Mass; All the faithful should confess before the priest once in 40 days; Take no food or water after the previous supper (serious patients may get concessions)","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Receiving the Holy Eucharist)"}],"essay":[{"q":"Describe the royal entry of Jesus into Jerusalem.","a":"At the Passover feast Jesus decided to reveal that He is the expected Messiah, the King of the Jews; Starting from Mount Olive, near Bethphage and Bethany, He rode on a young donkey that had never been ridden, fulfilling the prophecy of Zechariah (9:9); A king on a horse came for war and on a donkey for peace - the donkey, a symbol of humility, showed that His Kingdom is not a worldly one; The people spread their cloaks and branches on the road and shouted, \"Hosanna! Blessed is the one who comes in the name of the Lord\"; 'Hosanna' is a Hebrew word meaning 'Save, I pray', and when the jealous Pharisees asked Him to stop the disciples, Jesus said, \"If these were silent, the stones would shout out\"; Seeing the city, Jesus wept, foreseeing its destruction (it was destroyed in A.D. 70); He purified the temple by driving out those who were selling there, fulfilling the prophecy of Malachi; He also cured the blind and the lame, and preached daily in the temple","ref":"Class VIII textbook, Chapter 12 – The Royal Entry of Jesus into Jerusalem"},{"q":"Write a note on Mar Yacoob of Sarug.","a":"Mar Yacoob was born in 451 A.D. at Kurthom on the banks of the river Prosa in Sarug, to a priest in his old age; At the age of three, during the Danaha festival, he went to the sanctuary, bowed before the Altar three times and returned to his mother; He was ordained a priest at 22, later became a Corepiscopa (village bishop) and was consecrated bishop of Batnaed Sarug; Known as 'the flute of the Holy Spirit', he wrote 760 poems, and about 70 people were engaged in copying them; He also wrote two divine Liturgies, a prayer for the kiss of peace at Christmas, a rite for Baptism, the lives of Mor Daniel and Mor Hananiya, and many letters and sermons; His poems are simple and easy for common people, and in wealth of words and ease of expression he ranks next to Ephraem; He died on 29th November 521 A.D.; the inscription at his tomb reads 'Yacoob of Sarug, spiritual scholar and compiler of faith'","ref":"Class VIII textbook, Chapter 22 – Mar Yacoob of Sarug"}]}},{"no":3,"s":{"mcq":[{"q":"In which prophet's book is the birth place of the Messiah clearly stated?","o":["Hosea","Malachi","Nahum","Micah"],"a":3},{"q":"Jesus compared Himself with which prophet?","o":["Ezekiel","Amos","Daniel","Jonah"],"a":3},{"q":"The foundation of Christian belief is the","o":["Resurrection of Jesus","Burial of Jesus","Crucifixion of Jesus","Salvation"],"a":0},{"q":"Which disciples did Jesus take with Him to pray at Gethsemane?","o":["John, Philip and Matthew","Peter, Andrew and Thomas","Jacob, Jude and Simon","Peter, Jacob and John"],"a":3},{"q":"What does the fourth chain of the censer represent?","o":["Holy Spirit","Holy Son","Unity of the Holy Father, Holy Son and Holy Spirit","Holy Father"],"a":0},{"q":"Who wrote the book \"The True Faith Regarding the Incarnation of Our Lord\"?","o":["Mor Ivanius","Mar Yacoob","Mor Elias III","Mor Koorilose"],"a":3}],"name":[{"q":"Name the country where Israel was in exile for 70 years.","a":"Babylonia (Babylon)"},{"q":"Which prophet was also a priest, under whose leadership the elders of Judah offered sacrifices?","a":"Ezekiel"},{"q":"Name the place where the resurrected Jesus appeared to His disciples for the third time.","a":"The Sea of Tiberias"},{"q":"Who was the wife of Pilate?","a":"Claudia Procula"},{"q":"Name the small cushion on the Altar that symbolizes the throne of God.","a":"Gomourto"},{"q":"Where was Mar Yacoob born?","a":"At Kurthom, on the banks of the river Prosa, in Sarug"}],"tf":[{"q":"Jonah went to Nineveh and prophesied, but Nahum prophesied against Nineveh without going there.","a":true},{"q":"Apostle Thomas was with the disciples when the resurrected Jesus first appeared to them.","a":false},{"q":"The centre of the Virikoottam (Thalbestho) is green, symbolizing the Holy church.","a":false},{"q":"Mar Yacoob was ordained as a priest at the age of 22.","a":true}],"fill":[{"q":"Zephaniah consoles the people that God will ______ their sins if they repent.","a":"forgive"},{"q":"After the Passover feast, Jesus went to ______ and prayed.","a":"Gethsemane"},{"q":"Jesus was buried in a new tomb which belonged to ______.","a":"Joseph of Arimathea"},{"q":"The finger bowl used by the priest to mix wine with water and to clean his fingers during the Holy Mass is called ______.","a":"Mshamshanitho"},{"q":"The Holy Synod of Ephesus declared that Virgin Mary is the \"______\".","a":"Mother of God"}],"match":{"l":["Jonah","Daniel","Cock crowed","Herod Antipas","Caso","Hamnikho","H.H. Elias III"],"r":["Man clothed with belt of gold","Peter's denial","Nineveh","Visit to Malankara in 1931","Chalice","Jesus called him 'fox'","Chest armour"],"key":[2,0,1,5,4,6,3]},"short":[{"q":"What are the major thoughts in the book of Daniel?","a":"The book of Daniel has 12 chapters in two parts; chapters 1-6 show the unshakable trust in God of Daniel and his friends Hananiah, Mishael and Azariah. Chapters 7-12 narrate Daniel's visions, which reveal that all powers against God will be destroyed and the Kingdom of God will survive. The reference to the Son of God and the indications about resurrection (12:2-3) make the book noteworthy.","ref":"Class VIII textbook, Chapter 5 – Daniel (Major thoughts)"},{"q":"What duties and authorities did Jesus give His disciples in Galilee?","a":"In Galilee Jesus told the Apostles to make disciples of all nations and to baptize them in the name of the Father, the Son and the Holy Spirit. He also told them to teach the people to obey His commandments. He gave them the great promise, \"I am with you always, to the end of the age.\"","ref":"Class VIII textbook, Chapter 16 – Burial, Resurrection and Ascension of Jesus (Resurrection and Ascension)"},{"q":"Why is the pulpit kept on the north side of the Altar?","a":"The pulpit holds the Book of Gospel, which symbolizes the Holy Son, and Jesus is seated on the right hand side of the Father. We pray facing east and God is believed to sit facing west, so the right hand side of God is the northern side of the church. So the pulpit is kept on the right (north) side of the Altar; St. Stephen saw Jesus standing at the right hand of the Father (Acts 7:54-56).","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Pulpit)"},{"q":"Into how many groups can the Minor Prophets be classified? Name the Minor Prophets who lived before the exile.","a":"The Minor Prophets can be grouped into three: prophets before the exile (before the 6th century B.C.), during the exile (6th century B.C.) and after the exile. The Minor Prophets before the exile are Amos, Jonah and Hosea (8th century B.C.) and Micah, Nahum, Habakkuk and Zephaniah (7th century B.C.).","ref":"Class VIII textbook, Chapter 7 – Minor Prophets"}],"para":[{"q":"Explain the background and message of the prophecy of Hosea and his vision about Christ.","a":"Hosea lived in the 8th century B.C. and declared God's commands through his own life experiences; When Israel forsook the true Lord and worshipped other gods, Hosea, at God's command, married a woman of whoredom, and when she left him Hosea bought her back and accepted her again; Message: God will redeem those who return to Him, even if they have been very unfaithful; The book has 14 chapters - ch. 1-3 his marriage, ch. 4-13 punishments for Israel's sins, ch. 14 a call to repentance and God's endless mercy; Vision about Christ: St. Matthew quotes Hosea 11:1, \"Out of Egypt I called my Son\" (Matt. 2:15) - as Hosea redeemed the woman by paying a price, Jesus redeemed us by paying His Blood","ref":"Class VIII textbook, Chapter 7 – Minor Prophets (Hosea)"},{"q":"Prove that the trial of Jesus was unlawful.","a":"They condemned Jesus to death before questioning Him; False witnesses were produced and He was given no chance for self-defence; The Sanhedrin met at night, which was unlawful; They put Jesus under oath and used His own reply to judge Him; They met at the house of the High Priest instead of their office next to the temple; Judgement was pronounced on the same day of the trial, though by law it could be given only on the next day","ref":"Class VIII textbook, Chapter 14 – The Trial of Jesus (Illegal Trial)"},{"q":"Explain the special vestments of the High Priests.","a":"Eskimo: a hood worn by monks at all times, showing that they give up the pleasures of worldly life, and a bishop designate first becomes a monk (Ramban); Masnaphtso (Seelamudi): a head cover worn by bishops while celebrating the Holy Mass, like the headdress of Moses and the Jewish high priests; It symbolizes the cloth that bound the Lord's head, which St. Peter found in the empty tomb and wore while consecrating priests; Uraroh Raboh (Batrashil): like the hamnikho but extends both to the front and the back - it symbolizes the Ephod worn by Aaron; Batrashil shows that the prelate guards the Holy Church, the true faith and all sacraments, and is the administrator of the Church","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Special vestments of the High Priests)"}],"essay":[{"q":"Describe the crucifixion of Jesus.","a":"Crucifixion was the most cruel punishment, given to rebels, rioters, traitors and slaves who deserted their masters; Jesus was taken outside the city to Golgotha ('skull hill'), and to the weeping women He said, \"Daughters of Jerusalem, do not weep for me, but weep for yourselves and for your children\"; When Jesus became very weak, the soldiers compelled Simon of Cyrene to carry His cross; He tasted the wine mixed with myrrh but refused to drink it, as He wished to die suffering pain; He was crucified between two criminals, with Pilate's inscription 'Jesus of Nazareth, the King of the Jews' (INRI) in Greek, Latin and Hebrew; He promised Paradise to the repentant criminal and entrusted His mother to His disciple John; He was crucified at the 3rd hour, there was darkness from the 6th to the 9th hour, and He breathed His last at the 9th hour - the temple curtain was torn, the earth shook and the gentile centurion believed; A soldier pierced His side and blood and water came out, showing He was complete Man and complete God","ref":"Class VIII textbook, Chapter 15 – Crucifixion"},{"q":"Why was Golden Mouthed Ivanius sent into exile? Write about the letter he wrote to a friend.","a":"Mar Ivanius attacked the misuse of wealth and rebuked lazy clergymen, guilty bishops and oppressors among the rich; He opposed Queen Eudoxia's attempt to erect her own statue near the church and called her Jezeebel, so the queen wanted revenge; He also opposed Theophilos, Patriarch of Alexandria, who called a meeting of his bishops and deposed him; The Emperor banished him, and though he was called back because of earthquakes and fear of a revolt, he was banished again; In his letter to a friend he wrote that being driven out was a trifle, for the earth and all its creations are the Lord's; If split in two he would remember Isaiah, if thrown into the sea Jonah, into the fire Hananiya and the children, and to wild animals Daniel in the lion's den; If stoned he would remember St. Stephen, if beheaded St. John the Baptist, and if robbed - he came naked from his mother's womb and would leave the world naked; From exile he wrote more than 200 letters and died on September 14th, 407 A.D.","ref":"Class VIII textbook, Chapter 23 – Golden Mouthed Ivanius"}]}},{"no":4,"s":{"mcq":[{"q":"Which century is considered as the time of exile?","o":["3rd century B.C.","4th century B.C.","6th century B.C.","7th century B.C."],"a":2},{"q":"How many chapters does the book of Hosea have?","o":["3","7","12","14"],"a":3},{"q":"Jesus' journey into Jerusalem on a young donkey was the fulfilment of the prophecy of","o":["Malachi","Micah","Nahum","Zechariah"],"a":3},{"q":"What did Jesus call Judas when Judas came to betray Him with a kiss?","o":["Disciple","Traitor","Brother","Friend"],"a":3},{"q":"What does the lid of the censer represent?","o":["Heaven","Earth","Sinners","Holy Spirit"],"a":0},{"q":"Which queen did Mar Ivanius oppose when she tried to erect her own statue near the church?","o":["Eudoxia","Claudia Procula","Theodora","Helena"],"a":0}],"name":[{"q":"Which prophet did not give the people any chance for repentance?","a":"Nahum"},{"q":"Jonah's experience in the belly of the sea monster was a hint to what?","a":"The death, burial and resurrection of Jesus"},{"q":"In which festival did the Jews sing the song 'Hosanna'?","a":"The Feast of the Tabernacle"},{"q":"Write the full form of INRI.","a":"Iesus Nazarenus Rex Iudaeorum (Jesus of Nazareth, the King of the Jews)"},{"q":"Which vestment of the High Priest symbolizes the Ephod worn by Aaron?","a":"Uraroh Raboh (Batrashil)"},{"q":"Mar Yacoob was consecrated as the bishop of which place?","a":"Batnaed Sarug"}],"tf":[{"q":"The book of Jonah is read and meditated upon in our church during the Three-Day Lent.","a":true},{"q":"Only St. John has recorded that a soldier pierced the side of Jesus with a spear.","a":true},{"q":"The one candle in front of the cross on the Altar represents St. Mary.","a":false},{"q":"Mar Ivanius was born in Alexandria.","a":false}],"fill":[{"q":"Nineveh was once the capital of ______.","a":"Assyria"},{"q":"Pilate was the Governor of ______.","a":"Judea"},{"q":"The resurrected Jesus gave the Apostles the authority to forgive sins by ______ on them.","a":"breathing"},{"q":"The period from September 14th to the next Easter is the ______ season.","a":"Sleeba"},{"q":"In the wealth of words and ease of expression, Mar Yacoob ranks next to ______.","a":"Ephraem"}],"match":{"l":["Hosea","\"The righteous live by their faith\"","Gabbatha","Barabas","Tabalitho","Shushafo","Libanius"],"r":["God's reply to Habakkuk","Bought back his unfaithful wife","Taught Mar Ivanius law and philosophy","Veil","Altar stone","Prisoner released instead of Jesus","Stone Pavement (Judge's bench)"],"key":[1,0,6,5,4,3,2]},"short":[{"q":"What is the theme of Micah's prophecy? What did he prophesy about the birth of the Messiah?","a":"The book of Micah has seven chapters: one third describes the sin of the people, one third God's punishment and the last part the message of redemption - sinners will be punished, but if they repent God is gracious to forgive (7:18). About 700 years before Jesus was born, Micah clearly stated the birthplace of the Messiah: \"O Bethlehem Ephrathah ... out of you I will bring a ruler for Israel\" (5:2).","ref":"Class VIII textbook, Chapter 8 – Prophets before the Exile (Micah)"},{"q":"How did Jesus teach His disciples the way of humbleness?","a":"During the Passover meal there was a dispute among the disciples as to which of them was the greatest. Jesus washed the feet of the disciples like a servant. Thus He showed them the model of humbleness and service.","ref":"Class VIII textbook, Chapter 13 – The Passion of the Lord (Celebration of the Passover Feast)"},{"q":"What is Qurbanappanam? Why should we not drop money into the offering box during the Holy Mass?","a":"In the early church believers brought wheat and wine as offering; later money was found more convenient, so a small fee is collected to meet the expenses of the Holy Communion - this is Qurbanappanam. We should not drop money into the offering box or pour oil in the lamp during the Mass, because the Holy Communion is the noblest of all sacraments. Doing such unimportant things during the Mass distracts the congregation.","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Qurbanappanam; Offering Box)"},{"q":"Why is Zephaniah called the prophet of judgement? What hope did he give the people?","a":"Zephaniah is called the prophet of judgement because he spoke with very strong words about Israel's sin and idol worship and God's punishment, and warned that a Day of Judgement, the Day of the Lord, would come (1:14-16). Yet he consoled the people that God would forgive their sins if they repented (2:3). He also expected a Saviour of Israel, who is Jesus Christ.","ref":"Class VIII textbook, Chapter 8 – Prophets before the Exile (Zephaniah)"}],"para":[{"q":"What was the mission of Ezekiel? Explain his major thoughts.","a":"Ezekiel, a priest, was taken to Babylonia in Nebuchadnezzar's 2nd invasion (587 B.C.) and received the gift of prophecy on the banks of the river Chebar; His great task was to bring back to God the people who had turned to idol worship and false prophets during the long exile; Chapters 1-33 speak of punishment for the sins of Judah and Jerusalem, and for the nations that oppressed Israel; Chapters 34-38 speak of deliverance - the Lord Himself will feed and rescue His scattered sheep; Israel will be restored: a renewed heart will be given and the new temple will become a fountain of living water; Punishment and salvation are personal too - opposing the 'sour grapes' saying (Ezk. 18:2), he taught that each one gets them by his own deeds","ref":"Class VIII textbook, Chapter 6 – Ezekiel"},{"q":"Describe the burial of Jesus. Why were guards posted at the tomb?","a":"Joseph of Arimathea, a secret disciple, and Nicodemus, a Pharisee - both members of the Sanhedrin - came forward to bury Jesus; Joseph asked Pilate for the body, and Nicodemus brought about a hundred pounds of myrrh and aloes; They wrapped the body with the spices in linen clothes, laid it in Joseph's new tomb in a garden and rolled a large stone to the door; The chief priests and Pharisees told Pilate that Jesus had said He would rise on the third day; They feared the disciples would steal the body at night and say He had risen, so with Pilate's permission they sealed the stone and posted guards","ref":"Class VIII textbook, Chapter 16 – Burial, Resurrection and Ascension of Jesus (The Burial of Jesus)"},{"q":"Write a note on St. Koorilose (Cyril of Alexandria).","a":"St. Koorilose was born in Alexandria (Egypt) in 376 A.D., was consecrated bishop by his uncle Theophilose and later became Patriarch of Alexandria; He proved the divine and human nature of Christ and is called the 'Scholar in the Creed of Incarnation'; He was chairman of the Holy Synod of Ephesus, convened by Emperor Theodosius II to discuss the wrong teaching of Nestorius about the Holy Virgin; The Synod declared that Virgin Mary is the 'Mother of God'; He was persecuted by the followers of Nestorius but would not give up his faith; He wrote interpretations of the Gospels of St. Luke and St. John and the book 'The True Faith Regarding the Incarnation of Our Lord', and died on 27th June 444 A.D.","ref":"Class VIII textbook, Chapter 24 – St. Koorilose: Cyril of Alexandria"}],"essay":[{"q":"Explain the vestments of the priests.","a":"Kameez (cassock): white dress worn in public by priests below the rank of bishop (a bishop wears red), reminding them of their special responsibilities; Black cloak: worn by 4th order deacons and above at every religious service; Kutino (Alb): white gown worn over the black cloak during the Holy Mass; Uraroh: long, narrow embroidered cloth worn over the alb by deacons serving in the sanctuary; Hamnikho: worn by Kasheeso and above - chest armour against the enemy, as a priest's life is a war against the world, flesh and Satan; Zunoro (girdle) shows readiness to fight the enemy, and Zendo (sleeves) readiness to keep God's Law and do works of righteousness; Phaino (Kaappa): sleeveless outer vestment of purity, symbolizing our Lord's seamless robe and Prophet Elijah's robe; M'sone (shoes): worn by priests of all ranks during the Holy Mass, showing readiness to stamp out the enemy","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Vestments of the Priests)"},{"q":"Describe the trial of Jesus before Annas and Caiaphas, and Peter's denial.","a":"Annas, the previous High Priest and father-in-law of Caiaphas, questioned Jesus about His disciples and teaching to show Him as a leader of conspirators against Rome (recorded only by St. John); When a policeman struck Him, Jesus asked, \"If I have spoken rightly, why do you strike me?\", and Annas sent Him bound to Caiaphas; Before Caiaphas and the Sanhedrin, false witnesses were bribed, but their statements contradicted each other; The High Priest put Jesus under oath to say if He was the Messiah, the Son of God; When Jesus declared that He is the Messiah, the High Priest tore his clothes and gave the verdict that He had blasphemed; They spat in His face and struck Him; Meanwhile Peter, warming himself in the courtyard, denied Jesus three times and the cock crowed; Jesus turned and looked at Peter, and Peter went out and wept bitterly in repentance","ref":"Class VIII textbook, Chapter 14 – The Trial of Jesus (Trial before Annas; Before Caiaphas)"}]}},{"no":5,"s":{"mcq":[{"q":"In the original Hebrew version, how many chapters does the book of Daniel have?","o":["12","14","16","18"],"a":0},{"q":"Through which incident did God make the unhappy Jonah realize the truth?","o":["The castor bean plant","The fall of a statue","The burning bush","A great flood"],"a":0},{"q":"Annas was the ______ of Caiaphas.","o":["uncle","father-in-law","son","brother"],"a":1},{"q":"In which three languages was the inscription on the cross of Jesus written?","o":["Greek, Latin and Hebrew","Syriac, Greek and Latin","Latin, Egyptian and Greek","Hebrew, Aramaic and Syriac"],"a":0},{"q":"We use a cross with an Uraroh on the Altar as an indication of","o":["the crown of thorns","the twelve disciples","the resurrection of our Lord","the robe of Elijah"],"a":2},{"q":"Mar Yacoob was raised to the office of Corepiscopa. What does 'Corepiscopa' mean?","o":["Deacon","Patriarch","Village Bishop","Monk"],"a":2}],"name":[{"q":"How does Ezekiel show the supremacy of the Messiah?","a":"As the cedar tree planted on a high and lofty mountain (Ezekiel 17:22-24)"},{"q":"What is the meaning of the name 'Jesus'?","a":"Saviour"},{"q":"Who tore his clothes and gave the verdict that Jesus had blasphemed?","a":"The High Priest (Caiaphas)"},{"q":"Who was the gentile who believed in Jesus after seeing all that happened at His death?","a":"The centurion"},{"q":"Name the two pieces of cloth that cover the chalice and the paten.","a":"Cabalana"},{"q":"Who was the Patriarch of Constantinople whose wrong teaching about the Holy Virgin was discussed at the Synod of Ephesus?","a":"Nestorius"}],"tf":[{"q":"Nebuchadnezzar carried away Ezekiel too, in the second invasion of Jerusalem.","a":true},{"q":"The trial of Jesus before Annas is recorded only in the Gospel of St. John.","a":true},{"q":"The Paten (Peelaso) holds the wine for the Holy Mass.","a":false},{"q":"Mar Yacoob died on 14th September 407 A.D.","a":false}],"fill":[{"q":"Jesus speaks ______ indirectly about Zephaniah.","a":"twice"},{"q":"As Jesus had foretold, Jerusalem was completely destroyed in A.D. ______.","a":"70"},{"q":"Peter later asked to be crucified ______ so that he could kiss the feet of his Master.","a":"upside down"},{"q":"The Tharvodo (spoon) symbolizes the tongs with which the seraph placed live coal on the lips of ______.","a":"Isaiah"},{"q":"From exile, Mar Ivanius wrote more than ______ letters to the believers in Constantinople.","a":"200"}],"match":{"l":["Antiochus Epiphanes","Moresheth","Bethphage and Bethany","Seamless robe","Phaino","Zunoro","Theophilose"],"r":["Young donkey brought to Jesus","Home town of Micah","Religious oppression (167-164 B.C.)","Consecrated St. Koorilose as bishop","Girdle","Kaappa","Soldiers cast lots"],"key":[2,1,0,6,5,4,3]},"short":[{"q":"What is the background and main message of the prophecy of Amos?","a":"Amos, a shepherd, lived at the beginning of the 8th century B.C., when Israel prospered under King Jeroboam; traders sold wheat mixed with chaff and used false measures, judges took bribes, the poor were oppressed and worship became an insincere show. Amos told the people that as the Lord is just, He expects justice and righteousness from His worshippers. His main message is justice, true and sincere worship and care for the weak.","ref":"Class VIII textbook, Chapter 7 – Minor Prophets (Amos)"},{"q":"What is the importance of Golgotha according to the Holy Bible?","a":"Golgotha (Calvary) means 'skull hill'; it was outside Jerusalem, and Jesus was crucified there. In the Holy Bible it is important because the skull of Adam is believed to lie buried there and Melchizedek offered sacrifice there. Abraham built an altar there to sacrifice Isaac, and David offered sacrifices there.","ref":"Class VIII textbook, Chapter 15 – Crucifixion"},{"q":"Why did H.H. Elias III visit Malankara? How did his visit end?","a":"Though a heart patient, H.H. Elias III came to Malankara in 1931, on the invitation of Viceroy Lord Irwin, with an earnest desire to end the schism in the church. At Alwaye he withdrew the suspension of Mor Dionysius VI, but Dionysius obstinately demanded recognition of the Catholicate, which His Holiness refused, so all the talks failed. He reached St. Stephen's Church, Manjanikara on 13th February 1932, died of a heart attack and was buried there; he is remembered in the 5th Diptych.","ref":"Class VIII textbook, Chapter 21 – Malankara Visit of H.H. Elias III"},{"q":"Name the Holy Orders of priesthood in our church.","a":"The holy orders of priesthood are Korooyo (4th order deacon), Youphadyakno (5th order deacon), Msamsono (6th order deacon), Kasheeso (7th order, full priest), Metropolitan (bishop), Catholicose (supreme regional head) and Patriarch (head of the universal Church). The first three ranks of deacons are Mhymno, Maumyono and Msamrono.","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Holy Orders)"}],"para":[{"q":"Why did Nahum prophesy the destruction of Nineveh? How is his prophecy different from that of Jonah?","a":"Nineveh, once the capital of Assyria, repented at Jonah's preaching, but about a century later it turned again to evil deeds and idols and forgot the true God; The people of Nineveh also cruelly tortured the Israelites, so Nahum predicted its utter destruction - nobody would later know where the city stood; Unlike Jonah, Nahum gave the people no chance to repent; Jonah went to Nineveh and prophesied, but Nahum prophesied against Nineveh without going there; Nahum's prophecy has no complaint against his own people","ref":"Class VIII textbook, Chapter 8 – Prophets before the Exile (Nahum)"},{"q":"Describe the Ascension of Jesus.","a":"For 40 days after His resurrection Jesus appeared to His disciples and taught them about the Kingdom of God; He told them to stay in Jerusalem until they received the Holy Spirit; He then took them to Mount Olive and blessed them by raising His hands; As they watched, He was lifted up and a cloud took Him out of their sight; Two men in white robes said, \"This Jesus ... will come in the same way as you saw Him go into heaven\"; The disciples returned to Jerusalem and waited for the Holy Spirit","ref":"Class VIII textbook, Chapter 16 – Burial, Resurrection and Ascension of Jesus (Ascension of Jesus)"},{"q":"What are the Order of Melchizedek and the Order of Aaron in the Thuyobo?","a":"Thuyobo (Syriac for 'preparation') is the preparatory service done behind the veil, with two parts - the Order of Melchizedek and the Order of Aaron; Order of Melchizedek: recalling Melchizedek, who gave bread and wine to Abraham, the priest, still wearing the black cloak, places the bread on the paten and wine mixed with an equal portion of water in the chalice; Order of Aaron: the priest washes his hands, wears the vestments, kneels for a secret prayer for his purification and then ascends the Durgo; Only after Aaron was anointed could priests touch sacrificial blood - so the prayers to prepare the bread and wine to become the body and blood of Christ are called the Order of Aaron; The priest prays for the whole world and remembers the saints, the living and the departed and the names given; He censes the altar in the name of the Father, the Son and the Holy Spirit and completes the Thuyobo by kissing the altar","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Thuyobo)"}],"essay":[{"q":"To whom did the resurrected Jesus appear? How did He confirm the faith of St. Thomas?","a":"The Bible records that the resurrected Jesus appeared 10 times; To Mary Magdalene alone near the tomb, to Mary Magdalene and the other Mary, and to St. Peter alone; To the two disciples going to Emmaus, and to the 10 disciples (without Thomas) at the Mansion of Mark on the evening of the Resurrection; To the 11 disciples with Thomas on the 8th day, and to the disciples at the Sea of Tiberias; To the 11 disciples and 500 brethren, to St. James, and to all gathered at His Ascension (He also appeared to St. Paul - Acts 9); Thomas, who was absent the first time, said he would not believe unless he saw and touched the nail marks and His side; The next Sunday Jesus came though the doors were shut and said to Thomas, \"Put your finger here and look at my hands ... Stop your doubting and believe\"; Thomas declared his faith: \"My Lord and my God!\"","ref":"Class VIII textbook, Chapter 16 – Burial, Resurrection and Ascension of Jesus (Resurrection and Ascension)"},{"q":"What should we keep in mind while entering the church and during the Holy Qurbana?","a":"Before entering the church remove footwear and wash dirty feet, and while entering, bow the head and make the sign of the cross; Bring our offering, since we promise to offer our vows to God; Ensure purity of body, mind and soul and wear clean clothes, and women and girls should cover their hair; Do not remain in the parish office or courtyard during worship; Give the names to be remembered to the priest before the Thuyobo, at least before the Nicene Creed; Do not visit the cemetery or light candles at the tombs during the Holy Communion, and do not drop money in the offering box during the Mass; Parents should keep small children from distracting the congregation; Do not sit except at prescribed times such as the Diptychs (the elderly and sick may sit with the priest's consent), and do not sit while a kalpana is read","ref":"Class VIII textbook, Chapter 17 – Worship – A Study (Worship Guide)"}]}}]},{"c":"IX","sections":[{"n":"Old Testament","units":[{"t":"Chapter 4 – Tabernacle","q":[["The Tabernacle was the temporary place of worship for the Israelites during their long journey of how many years?",["12 years","30 years","40 years","70 years"],2,"QP 2017, QP 2018"],["Under whose leadership was the Tabernacle made?",["Abraham","Joshua","Moses","David"],2,"QP 2021"],["Which tribe was set apart for service at the Tabernacle and for carrying it from place to place?",["The tribe of Judah","The tribe of Reuben","The tribe of Levy","The tribe of Joseph"],2,"QP 2013 (Kerala), QP 2015, QP 2016, QP 2017, QP 2018, QP 2021"],["Where was the model of the Tabernacle revealed to Moses?",["Mount Sinai","Mount Zion","Mount of Olives","Mount Carmel"],0,"QP 2013 (Kerala), QP 2019"],["According to the textbook, the concept of the 'Tent of the Lord's Presence' has its origin among whom?",["The Babylonians","The Levites","The Egyptians","The Gentiles"],3,""],["In the 'Tabernacle of the Congregation', what is meant by the 'Congregation'?",["The coming together of the people for conversing with God","The twelve tribes camping around the court","The priests who carried the Tabernacle","The elders who judged the people"],0,""],["How long was the Tabernacle proper (the sacred tent)?",["4.6 meters","13.7 meters","22.8 meters","45.6 meters"],1,""],["The sacred Tent was made out of how many pieces of fine linen?",["7","10","11","12"],1,""],["The upright frames and curtain posts of the Tabernacle were made of which wood?",["Acacia wood","Cedar wood","Olive wood","Oak wood"],0,""],["On which side of the Tabernacle was the entrance to the tent?",["East","North","South","West"],0,""],["What was the part of the Tabernacle to the west of the veil called?",["The Court","The Tent of Meeting","The Holy Place","The Most Holy Place (Holiest of Holies)"],3,"QP 2022"],["The veil that divided the sacred Tent hung from how many pillars?",["Two","Five","Four","Six"],2,""],["How long was the court surrounding the Tabernacle?",["9.1 meters","13.7 meters","22.8 meters","45.6 meters"],3,""],["How long was the gate on the east side of the court fence?",["2.3 meters","4.6 meters","6.86 meters","9.1 meters"],3,""],["Besides the two stone tablets of the commandments, what was later added to the Covenant Box?",["The brass snake and Moses' rod","A golden jar containing manna and Aaron's staff that sprouted leaves","The bread offered to the Lord","The seven-branched lamp stand"],1,""],["Where was the Mercy Seat kept?",["On top of the Covenant Box","Near the Bronze Basin","On the table for the bread","In the Court near the altar"],0,""],["According to Genesis 3:24, what did God order the Cherubim to do when man was driven out of Eden?",["Carry the Covenant Box","Lead man out of the garden","Build the Tabernacle","Guard the garden with a flaming sword"],3,"QP 2016"],["The high priest entered the Most Holy Place once every year on which day?",["The Festival of Dedication","The Passover","The Day of Atonement","The Sabbath day"],2,""],["In which part of the Holy Place was the table for the bread offered to the Lord placed?",["The southern part","The western part","Outside in the Court","The northern part"],3,""],["How many branches did the golden lamp stand have?",["Seven","Six","Twelve","Three"],0,""],["The decorative flowers on the golden lamp stand were shaped like which blossoms?",["Fig blossoms","Olive blossoms","Almond blossoms","Lily blossoms"],2,""],["How often was sweet-smelling incense burnt on the altar for burning incense?",["Every morning and evening","Once a month","Once a year","Only on the Sabbath"],0,""],["The Altar of Burnt Offerings and its horns were covered with which metal?",["Pure gold","Bronze","Iron","Silver"],1,""],["The Altar of Burnt Offerings was also a refuge for which person?",["One who had killed another person unintentionally","A person who had broken the Sabbath","A priest who had become unclean","A foreigner travelling with Israel"],0,""],["What was the Bronze Basin (Brazen Laver) used for?",["Burning incense","Keeping water for the priests to wash their hands and feet","Storing the manna","Keeping the blood of the sacrifices"],1,""],["One of the outer coverings of the Tabernacle was made of rams' skin dyed in which colour?",["Red","Black","Purple","Blue"],0,""],["When was the Tabernacle erected?",["On the first day of the first month of the second year of the Exodus","On the tenth day of the seventh month of the first year","On the day they reached Canaan","On the day the Israelites left Egypt"],0,""],["When did the Israelites move their camp to another place?",["At the end of every month","Every Sabbath day","Only when the cloud lifted from the Tent","When Moses blew the trumpet"],2,""],["What could the Israelites see over the Tent during the night?",["A pillar of smoke","An angel with a sword","A fire burning above it","A shining star"],2,""],["The Bronze Basin (Brazen Laver) was part of the",["Furnishings at the Holy Place","Furnishings at the Most Holy Place","Tabernacle coverings","Furnishings at the Court"],3,"QP 2021"],["The Altar for Burning Incense was among the furnishings at which part of the Tabernacle complex?",["The Most Holy Place","Outside the camp","The Court","The Holy Place"],3,"QP 2021"],["The Altar of Burnt Offerings was among the furnishings at which part of the Tabernacle complex?",["The Court","The Most Holy Place","Behind the veil","The Holy Place"],0,"QP 2018, QP 2021"],["God came down into the Tabernacle at the Most Holy Place and spoke to Moses from which seat?",["The Seat of Aaron","The Mercy Seat","The Almighty Seat","The Judgement Seat"],1,"QP 2017, QP 2021"],["Which of the following was one of the four furnishings at the Most Holy Place?",["The Golden Lamp Stand","The Bronze Basin","The Table for the bread","The Cherubim"],3,"QP 2013 (Kerala), QP 2021"],["Who are the Cherubim?",["The priests of the tribe of Levy","The prophets of the Old Testament","The guards of the Temple","A group of angels who are very close to Jehovah"],3,"QP 2013 (Kerala), QP 2015"],["The Tabernacle was made by the Israelites based on the model revealed to whom at Sinai?",["Moses","Abraham","Aaron","Elijah"],0,"QP 2016, QP 2018"],["The Golden Lamp Stand was a furnishing at which part of the Tabernacle?",["The Holy Place","The Court","Outside the camp","The Most Holy Place"],0,"QP 2017"],["In which part of the Tabernacle was the Covenant Box placed?",["The Holy Place","The Court","The Most Holy Place","Near the entrance gate"],2,"QP 2018, QP 2019"],["In which part of the Tabernacle was the Table for the bread offered to the Lord placed?",["The Holy Place","The Court","The Most Holy Place","On top of the Covenant Box"],0,"QP 2018"],["'And have them make me a sanctuary, so that I may dwell among them.' Who said this, and to whom?",["Moses to the tribe of Levy","God to Abraham","Moses to Aaron","God to Moses"],3,"QP 2017"],["Into how many portions was the Tabernacle complex divided?",["1","2","3","4"],2,"QP 2022"],["The Tabernacle is also called",["The Tent of the Lord's Presence","The House of Prayer","The Tent of the Elders","The Temple of Solomon"],0,"QP 2022"],["According to the textbook, the Tabernacle is the place where",["The people get revelations from God","The Israelites buried their leaders","The tribes of Israel held their markets","The kings of Israel were crowned"],0,"QP 2013 (Kerala)"]]},{"t":"Chapter 5 – Sacrifices of Israelites","q":[["According to the textbook, what is the greatest sacrifice in the New Testament?",["The sacrifice of Jesus Christ on the Cross","The continual burnt offering","The sacrifice of the Passover lamb","The sacrifice of Abraham"],0,""],["The ancient religions of which places offered sacrifices?",["India and China","Mesopotamia and Canaan","Egypt and Persia","Greece and Rome"],1,""],["Generally, the word 'sacrifices' refers only to what?",["Tithes","First harvest offerings","Offerings burnt at the altar","Gifts given to the poor"],2,""],["What is the other name of the Burnt Offering?",["Repayment offering","Fellowship offering","Sweet savour offering","Thanks Giving Sacrifice"],2,"QP 2013 (Kerala), QP 2016, QP 2017, QP 2019, QP 2021, QP 2022"],["What kind of animal should be offered as a Burnt Offering?",["Any animal of the flock","A young dove only","A female without blemish","A male without blemish"],3,""],["In a Burnt Offering, how much of the offering is burnt upon the altar?",["The whole of it","Half of it","Only the fat","Only a handful"],0,""],["The Meat Offering to the Lord was made of what?",["Honey and leaven","Wine and barley bread","Fine flour, pure olive oil and frankincense","The flesh of a ram"],2,"QP 2019, QP 2022"],["How many kinds of Meat Offerings are mentioned?",["Seven","Five","Three","Two"],1,""],["The 'Thanks Giving Sacrifice' is also called",["Sin Offering","Trespass Offering","Meat Offering","Peace Offering"],3,"QP 2013 (Kerala), QP 2015, QP 2016, QP 2019, QP 2022"],["For what purpose was the Peace Offering offered?",["For the cleansing of the Temple","For a vow that was broken","For a sin done in ignorance","For having fellowship with others"],3,""],["In which offering could only the male members of the priests' family eat the rest of the sacrificial animal?",["Sin Offering","Peace Offering","Burnt Offering","Voluntary Offering"],0,"QP 2021"],["For a trespass in regard to the holy things of the Lord, what animal should be brought?",["A she-goat","A ram without blemish","Two doves","A bullock"],1,""],["In a Trespass Offering, how much extra did the person have to pay besides repaying in full?",["20%","50%","Double the amount","10%"],0,""],["In the Continual Burnt Offering, how many one-year-old lambs were sacrificed every day?",["Four","Seven","One","Two"],3,""],["With the first lamb of the Continual Burnt Offering, how much fine wheat flour was offered?",["Two kilograms","Half a kilogram","One kilogram","Five kilograms"],2,""],["In an offering in fulfillment of a vow, what must be done with anything left over on the third day?",["It must be buried","It must be given to the poor","It must be given to the priest","It must be burnt"],3,""],["A sacrifice offered not for any particular purpose but for the blessings of the Lord is called what?",["Trespass Offering","Continual Burnt Offering","Sin Offering","Voluntary Offering"],3,"QP 2022"],["In which offering is a small portion of one's abundance (from the heap of grains or the spoils of war) offered to the Lord?",["Fellowship Offering","Sin Offering","Wave Offering","Meat Offering"],0,"QP 2021"],["In a Wave Offering, the offering is waved towards what?",["The people","The Mercy Seat","The east gate","The brazen altar"],3,""],["In a Heave Offering, lifting the offering up is a symbol of offering it to whom?",["The poor","The Lord above","The king","The elders of Israel"],1,""],["In a Food Offering, to whom does the rest of the offering belong?",["The king","The priest","The offerer","The Levites' children"],1,""],["The offerings were made with the flesh and blood of which animals or birds?",["A camel, a horse or an eagle","A pig, a goat or a crow","A lion, a bear or a sparrow","A bullock, a ram or a dove"],3,""],["What kind of benefits did the Old Testament sacrifices bring?",["Only temporary benefits","Eternal forgiveness of sin","No benefit at all","Permanent salvation"],0,"QP 2015, QP 2016, QP 2019, QP 2021"],["All the sacrifices in the Old Testament point to the ultimate sacrifice of Jesus Christ at which place?",["Mount Sinai","Bethlehem","Calvary","Mount Carmel"],2,""],["In which offering is the offerer entitled to a portion of his own offering?",["Burnt Offering","Sin Offering","Peace Offering","Trespass Offering"],2,"QP 2021"],["Which were the five main sacrifices (offerings) of the Israelites?",["Burnt, Wave, Heave, Food and Vow Offerings","Peace, Fellowship, Voluntary, Sin and Heave Offerings","Burnt, Meat, Peace, Sin and Trespass Offerings","Continual Burnt, Voluntary, Fellowship, Wave and Food Offerings"],2,"QP 2017, QP 2018, QP 2019"],["In the lesson on the sacrifices of the Israelites, Jesus is described as",["The keeper of the Covenant Box","The High Priest of the Tabernacle","The Lamb of God without any blemish","The ram of the trespass offering"],2,"QP 2019"],["If a person sinned through ignorance in regard to the holy things of the Lord, which offering was he to bring?",["Burnt Offering","Peace Offering","Sin Offering","Trespass Offering"],3,"QP 2013 (Kerala)"]]},{"t":"Chapter 6 – Maccabees","q":[["For about how many years did the Jews remain a free and united nation during the time of the Maccabees?",["About 400 years","About 40 years","About 100 years","About 10 years"],2,""],["The era of the prophets ended with the end of the prophecy of Malachi in which year?",["63 B.C.","167 B.C.","444 B.C.","586 B.C."],2,"QP 2017"],["In which year did John the Baptist appear as a prophet?",["4 B.C.","26 A.D.","33 A.D.","70 A.D."],1,""],["After the death of Alexander the Great, who received the vast area consisting of Syria and Judea?",["Ptolemy","Seleucus I, called Nicator","Pompey","Antiochus Epiphanes"],1,""],["Which Roman General defeated the Greeks in 63 B.C.?",["Felix","Julius","Festus","Pompey"],3,""],["Who was the old priest who started the Maccabean revolt?",["Eleazer","Mattathias","John Hyrcanus","Antipater"],1,""],["In which town did the old priest Mattathias, the father of the Maccabees, live?",["Ashdod","Modein","Ekron","Gaza"],1,"QP 2019, QP 2021, QP 2022"],["How many sons did Mattathias have?",["Twelve","Three","Seven","Five"],3,""],["Which king was ruling Judea during the first generation of the Maccabees, persecuting the Jews and plundering the Temple?",["Antiochus Epiphanes","Herod","Alexander the Great","Seleucus Nicator"],0,"QP 2021"],["The idol of which Greek god was installed in the most holy place of the Temple?",["Zeus","Hermes","Jupiter","Artemis"],2,""],["What did Antiochus Epiphanes force the Jews to sacrifice to idols?",["Bullocks","Swine","Doves","Lambs"],1,""],["What did Mattathias do when the king's officer compelled him to sacrifice to the idol?",["He handed the officer over to the Romans","He obeyed out of fear","He refused and killed the officer","He ran away to Egypt"],2,""],["In which year did the Maccabean revolution start?",["104 B.C.","142 B.C.","167 B.C.","175 B.C."],2,""],["What was the name of the third son of Mattathias, who was elected leader and accepted the name 'Maccabees'?",["Simon","Jonathan","John","Judas"],3,"QP 2013 (Kerala), QP 2015, QP 2016, QP 2017, QP 2018, QP 2021"],["What does the name 'Maccabees' mean?",["Lion","Shield","Sword","Hammer"],3,"QP 2015, QP 2016, QP 2017"],["After how many years of struggle did the revolutionaries capture Jerusalem?",["Five years","Ten years","Eighteen years","Two years"],0,""],["Which festival commemorates the rededication of the Temple by the Maccabees?",["The Passover","The Festival of Tabernacles","The Festival of Dedication","The Pentecost"],2,""],["Where was Judas Maccabees killed in battle?",["Modein","Jerusalem","Elasa","Ptolemias"],2,""],["Where was Jonathan treacherously killed in 142 B.C.?",["Ptolemias","Modein","Elasa","Damascus"],0,""],["Who killed Simon, the son of Mattathias, in 134 B.C.?",["Antiochus Epiphanes","His son-in-law, Ptolemy","His brother Jonathan","Pompey"],1,""],["For how many years did John Hyrcanus reign as high priest?",["9 years","18 years","27 years","30 years"],3,""],["During the rule of Alexander Janneus, which two groups quarreled, leading to a civil war?",["The priests and the Levites","The Greeks and the Persians","The Arabs and the Edomites","The Pharisees and the Sadducees"],3,""],["Who was the lady ruler of the Second Generation of Maccabees?",["Herodias","Ruth","Queen of Sheba","Salomi Alexandra"],3,"QP 2017"],["Which two brothers fought each other for the throne after Salomi Alexandra died?",["John Hyrcanus and Alexander Janneus","Simon and Eleazer","Hyrcanus II and Aristobulus II","Judas and Jonathan"],2,""],["Hyrcanus sent his aide Antipater, an Edomite, to negotiate with whom?",["The Greeks","The Persians","The Romans","The Arabs"],3,""],["Herod, who ruled Judea at the time of the birth of Jesus, was the son of Antipater. Antipater was a",["Edomite (Idumaean)","Roman","Persian","Greek"],0,"QP 2015, QP 2017"],["The Maccabees stood up to preserve the true faith when the Jews were under which rule?",["Egyptian rule","Greek rule","Roman rule","Persian rule"],1,"QP 2015"],["At the time of the birth of Jesus, Judea was under which rule?",["Greek rule","Rule of the Maccabees","Roman rule","Persian rule"],2,"QP 2017"],["After Judas Maccabees was killed in battle at Elasa, which of his brothers took up the leadership?",["Jonathan","Simon","John","Eleazer"],0,"QP 2017"],["After the death of Jonathan, who became the leader of the Maccabees?",["Simon","Eleazar","Judas","John Hyrcanus"],0,"QP 2022"]]}]},{"n":"New Testament","units":[{"t":"Chapter 11 – Activities of St. Peter","q":[["At Lydda, St. Peter cured a paralytic. What was his name?",["Elymas","Publius","Aeneas","Eutychus"],2,"QP 2021, QP 2022"],["Lydda is a village very near to which harbour?",["Caesarea","Seleucia","Joppa","Tyre"],2,""],["Which woman did St. Peter raise while he was in Joppa?",["Eunice","Tabitha","Lydia","Priscilla"],1,"QP 2015, QP 2016, QP 2017, QP 2021"],["With whom did St. Peter stay in Joppa?",["Titus Justus","Simon, a tanner","Jason","A
