ourageous.","a":true},{"q":"James, John and Peter caught nothing though they toiled hard till late night.","a":true}],"fill":[{"q":"Solomon prayed, \"Give to your servant an understanding ______ to judge your people.\" (1 Kings 3:9)","a":"heart"},{"q":"The bear and the monkey teach us that proper ______ management is our responsibility.","a":"waste"},{"q":"In the parable, the five foolish virgins asked for ______ because their lamps were going out.","a":"oil"},{"q":"During the consecration of Holy Mooron, twelve sub-deacons hold lighted ______.","a":"candles"},{"q":"St. Andrew found the boy with five loaves and ______ fishes and gave them to Jesus.","a":"two"}],"match":{"l":["St. Matthew 17:21","Ahasuerus","Sennacherib","Lake Tiberias","Innkeeper","Crosier","St. Ignatius Elias III"],"r":["Killed by his own sons","Sea of Galilee","Prayer and fasting","13th February 1932","Persian king","Two denarii","Authority of a bishop"],"key":[2,4,0,1,5,6,3]},"short":[{"q":"What did God say to Solomon after hearing his prayer?","a":"God said that because Solomon had not asked for long life, riches or the life of his enemies, but for understanding to discern justice, He had done according to his words. He gave Solomon a wise and understanding heart, so that there had been no one like him before and none like him would arise after him.","ref":"Class V textbook, Old Testament Chapter 4 – Wisdom through Prayer"},{"q":"What happened to Haman at Esther's banquet?","a":"Esther told the king that Haman was planning to destroy her people, and the angry king went into the palace garden. When he returned he saw Haman falling across the couch where Esther was, and a courtier told him of the gallows Haman had built for Mordecai. The king said, \"Hang him on it!\"","ref":"Class V textbook, Old Testament Chapter 5 – Esther"},{"q":"What did the ten virgins do at midnight when the cry was heard?","a":"At midnight a cry was heard, \"Behold, the bridegroom is coming; go out to meet him!\" Immediately all the virgins woke up and trimmed their lamps, and five of them found their lamps going out for want of oil.","ref":"Class V textbook, New Testament Chapter 11 – Entry to the Kingdom of Heaven"},{"q":"What are the materials used in Holy Baptism, and which sacraments are given along with it?","a":"The materials used in Holy Baptism are hot water, cold water, olive oil and Holy Mooron. Holy Mooron and the Holy Eucharist (Qurbana) are also given to the receiver along with Holy Baptism.","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"}],"para":[{"q":"Write about St. Geevarghese Mor Gregorios (Parumala Kochu Thirumeni).","a":"St. Geevarghese Mor Gregorios was born in Mulanthuruty near Ernakulam; he was consecrated a bishop at the age of 28 in 1876 by Patriarch Moran Mor Ignatius Peter III at St. Thomas Church, North Paravur; he founded the church and seminary at Parumala; he wrote the travelogue 'Urshalem Yathra Vivaranam' ('A Journey to Jerusalem') after his visit to Jerusalem; he translated the book 'Canon and Laws of Jacobite Syrian Church' by Patriarch Moran Mor Ignatius Peter III into Malayalam; he went to his eternal abode on 2nd November 1902 and is entombed at Parumala Church","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles (Holy Church Fathers)"},{"q":"What are the specialities of Holy Mooron and the purposes of anointing with it?","a":"'Mooron' comes from the Syriac word 'Moor', meaning 'scented oil'; it is the perfumed scent of Messiah, the sign and seal of true faith, and the fulfilment of the good gift of the Holy Spirit; anointing with Holy Mooron is for everlasting life; it gives the permanent mark of soldiers of Messiah; it helps us to become unbeatable in adverse circumstances and to outlive the adverse forces; it helps us to make our journey in this world with God's grace","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"},{"q":"Describe what happened when the disciples went fishing after Jesus' death.","a":"After Jesus' death the fearful disciples went back to fishing at the Sea of Galilee; one evening seven of them started fishing, but worked the whole night and caught nothing; Jesus called from the shore, \"Children, have you any food?\", and they said, \"No\"; he said, \"Cast the net on the right side of the boat, and you will find some\"; they cast the net and caught a multitude of fish – 153 large fishes; the disciples understood that the same Jesus who was with them before the crucifixion had appeared to them","ref":"Class V textbook, New Testament Chapter 10 – Miraculous Fishing"}],"essay":[{"q":"Ethics – God is a righteous judge.","a":"A king built a beautiful palace, but a poor man's hut stood near it; the chief minister wanted the hut demolished for a garden, though the poor man pleaded for his wife and little children; the king said, \"Wait. Do not destroy it\", and came to see it himself; he said visitors would praise the palace for its beauty and the small hut for his ethical concern; he wanted to be known as a king with good ethics and moral concern, so he let the poor family live there peacefully; the minister and all the courtiers were astonished; our Almighty God, who created heaven and earth, is a righteous judge who acts with righteousness and justice; the incident of the sinful lady brought to Jesus (St. John 8:1-11) helps us to see the difference between human justice and divine justice","ref":"Class V textbook, New Testament Chapter 13 – Ethics"},{"q":"St. Andrew and St. James – from the biography of the Holy Apostles.","a":"Jesus went up on the mountain and appointed twelve apostles to be with him, to preach, to heal sicknesses and to cast out demons; St. Andrew, whose name means 'valour', was a disciple of John the Baptist, the brother of Simon Peter and a native of Bethsaida; Andrew stayed with Jesus one night, realized he was the Messiah, and brought his brother Peter to Jesus; at the feeding of the five thousand, Andrew found the boy with five loaves and two fishes; he was crucified on an X-shaped cross, now called 'Saint Andrew's Cross'; St. James and his brother John were sons of Zebedee, a fisherman, and were called the 'Sons of Thunder'; after a night of catching nothing, at Jesus' word they caught so many fish that their net was breaking, and they left everything to follow him; James became the first martyr among the disciples, executed with the sword by King Herod Agrippa","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles"}]}}]},{"c":"VI","sections":[{"n":"Old Testament","units":[{"t":"Chapter 4 – Elijah, the Lamp","q":[["What is the Bible reference for the lesson 'Elijah, the Lamp'?",["Judges Chapters 6 to 8","Ruth Chapters 1 to 4","Exodus Chapter 7","1 Kings Chapters 17 & 18"],3,""],["Complete the Bible verse to learn: \"The prayer of the righteous is ______ and effective.\"",["pure","powerful","patient","peaceful"],1,""],["The Bible verse \"The prayer of the righteous is powerful and effective\" is taken from which book?",["James 5:16","Judith 16:3","Ruth 1:16","Matthew 20:28"],0,""],["According to the lesson, Elijah is known as the intercessor for those who struggle from what?",["Wars","Sickness of the eyes","Poverty","Natural calamities"],3,"QP 2022"],["Who was the king of Israel who forsook the true God and began to worship Baal?",["Ahab","Holofernes","Uzziah","Nebuchadnezzar"],0,"QP 2021, QP 2022"],["Under whose influence did King Ahab start worshipping Baal?",["The widow of Zarephath","His wife Isabel","The prophet Elisha","The priest Eli"],1,""],["Where did Elijah hide himself from the King?",["In the city of Samaria","On Mount Carmel","By the Wadi Cherith, east of the Jordan","At the gate of Bethlehem"],2,"QP 2021, QP 2022"],["Which birds did God command to feed Elijah by the wadi?",["Doves","Eagles","Ravens","Sparrows"],2,""],["What did the ravens bring Elijah in the morning and in the evening?",["Fish and honey","Bread and meat","Fruits and milk","Barley and water"],1,""],["As a punishment from God, for how long was there neither rain nor dew in the land (as given in the lesson)?",["Two years","Seven years","Forty days","Five days"],0,""],["When the wadi dried up, God sent Elijah to which town, where a widow would feed him?",["Emmaus","Joppa","Moab","Zarephath"],3,"QP 2022"],["What was the widow doing when Elijah met her at the gate of the town?",["Drawing water","Gleaning grain","Baking bread","Gathering sticks"],3,""],["On which mountain did the people, the prophets of Baal and the prophets of Asherah gather before Elijah?",["Mount Sinai","Mount Carmel","Mount of Olives","Mount Zion"],1,""],["According to Elijah, how many prophets did Baal have?",["Seventy","Four hundred and fifty","Twelve","Three hundred"],1,""],["What animals did Elijah ask to be brought for the sacrifice on Mount Carmel?",["Two lambs","Two bulls","Two doves","Seven goats"],1,""],["What did the fire of the LORD consume when God answered Elijah?",["The burnt offering, the wood, the stones and the dust, and licked up the water","Only the bull of the prophets of Baal","Only the altar of Baal","The tents of the people"],0,""],["Which saint, when his ship was caught in a storm, interceded to Elijah and later built a church in Elijah's name at Kottayam?",["Mor Jacob Baradaeus","St. Gregorios of Parumala","Mor Ahatallah","Mor Severios"],1,""],["What is the name of the novel about Elijah written by the Brazilian writer Paulo Coelho?",["Fifth Mountain","The Brave Woman","The Alchemist","House of Bread"],0,""],["According to the 'Knowing the Difference' section, who was the disciple and protégé of Elijah?",["Elisha","Elishah","Eli","Elimelech"],0,""],["Who had received the stone tablets written by God through fasting?",["Moses","Jesus","Elisha","Elijah"],0,"QP 2021"],["Who prayed to God in the midst of people with perplexed mindset and nullified their blames by praying with strong faith?",["Elishah (son of Javan)","Eli","Elijah","Elisha"],2,"QP 2021, QP 2022"],["Which prophet, mentioned many times in the New Testament, receives a graceful position in human minds as a 'prophet of miracles'?",["Elisha","Samuel","Jonah","Elijah"],3,"QP 2022"],["According to the 'Wisdom Dots', who had observed lent for 40 days?",["Moses, Elijah and Jesus","Elijah, Elisha and Samuel","Abraham, Isaac and Jacob","Moses, Aaron and Joshua"],0,"QP 2022"]]},{"t":"Chapter 5 – The Brave Woman","q":[["What is the Bible reference for the lesson 'The Brave Woman'?",["Judith Chapters 1 to 6","1 Kings Chapters 17 & 18","Ruth Chapters 1 to 4","Judges Chapters 4 & 5"],0,""],["Complete the Bible verse to learn: \"For the Lord is a God who crushes ______.\"",["idols","wars","kings","sinners"],1,""],["Which French girl of the fifteenth century, who became a martyr at 19, is mentioned at the start of the lesson?",["Joan of Arc","Deborah","Isabel","Orpah"],0,"QP 2022"],["Who was the king who made war against Israel in the twelfth year of his reign?",["Gondophares","Ahab","Nebuchadnezzar","Cheraman Perumal"],2,""],["Who was appointed as the chief general of the Assyrian army?",["Cleopas","Boaz","Holofernes","Uzziah"],2,"QP 2022"],["What did Holofernes seize, causing the Israelites to faint from thirst?",["All the springs of water","Their temple treasures","Their sheep and cattle","Their swords and shields"],0,""],["Who was the leader of the town around whom the Israelites gathered?",["Stephen","Uzziah","Obed","Holofernes"],1,""],["For how many more days did Uzziah ask the people to hold out before surrendering?",["Seven days","Three days","Five days","Forty days"],2,""],["Who wore sackcloth and spent her widowhood in fasting and prayers?",["Naomi","Widow at Zarephath","Judith","Ruth"],2,"QP 2021"],["Whom did Judith send to call the elders of the town?",["Uzziah","Her maid","Her son","A soldier"],1,""],["Uzziah asked Judith to pray so that the Lord would send what to fill their cisterns?",["Soldiers","Rain","Fire","Manna"],1,""],["Judith told Holofernes that every night she would go out into the valley to do what?",["Pray to God","Collect food","Meet the elders","Gather water"],0,""],["On which day did Holofernes invite Judith for a private banquet?",["The seventh day","The first day","The fourth day","The fifth day"],2,""],["What did Judith use to cut off the head of Holofernes?",["A spear","An axe","A stone","Holofernes' own sword"],3,""],["Where did Judith's maid place the head of Holofernes?",["Under her cloak","In her food bag","In a basket of bread","In a clay jar"],1,""],["After Judith's victory, what did the Israelites give to God?",["Two bulls on an altar","A tenth of their harvest","Gold and silver vessels","Peace offering and thanksgiving offering"],3,""],["Which other courageous woman of the Old Testament (Judges chapters 4 & 5) is compared with Judith in the activities?",["Deborah","Orpah","Ruth","Naomi"],0,""],["Name the brave woman who killed Holofernes.",["Ruth","Judith","Deborah","Joan of Arc"],1,"QP 2021, QP 2022"]]},{"t":"Chapter 6 – Ruth","q":[["Complete the Bible verse to learn: \"Your people shall be my people, and your God, ______.\"",["my Saviour","my King","my God","my Lord"],2,""],["What is the aim of the lesson on Ruth?",["To understand the importance of fasting","To learn how to win a war","To understand that salvation is for everyone","To learn that God punishes idol worship"],2,""],["From which town did the family of Elimelech migrate because of famine?",["Joppa","Jerusalem","Zarephath","Bethlehem in Judah"],3,""],["To which country did Elimelech migrate?",["Bethel","Moab","Judah","Hebron"],1,"QP 2022"],["Who was the wife of Elimelech?",["Orpah","Naomi","Judith","Ruth"],1,""],["What were the names of Elimelech's two sons?",["Mahlon and Chilion","Boaz and Obed","Obed and Jesse","Cleopas and Simon"],0,"QP 2021"],["What was the name of the god worshipped by the Moabites?",["Chemosh","Asherah","Yahweh","Baal"],0,"QP 2022"],["Which daughter-in-law kissed Naomi and went back to her own home?",["Judith","Orpah","Ruth","Deborah"],1,"QP 2022"],["What is the meaning of the name 'Bethlehem' given in the lesson?",["Land of Milk","House of Bread","House of Mercy","City of Peace"],1,"QP 2022"],["Which harvest was going on when Naomi and Ruth returned to Bethlehem?",["Grape harvest","Barley harvest","Olive harvest","Wheat harvest"],1,""],["What did Ruth go to do in order to find a livelihood?",["Look after sheep","Draw water at the well","Sell bread in the market","Glean the heads of grain"],3,""],["In whose field did Ruth come to glean?",["Elimelech","Uzziah","Jesse","Boaz"],3,""],["Who was Boaz?",["A servant of Naomi","A prophet of Moab","A judge of Israel","A prominent and rich kinsman of Elimelech"],3,""],["Where did Boaz meet the elders to arrange to redeem Ruth?",["At the well","In the temple","At the city gate","In his field"],2,""],["What was the name of the son born to Boaz and Ruth?",["Mahlon","Jesse","David","Obed"],3,""],["According to the lesson, Jesse was the father of whom?",["Elimelech","Boaz","David","Obed"],2,""],["Name the person who called Ruth a 'virtuous woman'.",["Elimelech","Naomi","Boaz","Obed"],2,"QP 2021, QP 2022"],["Which verse of Jesus, 'The Son of Man came not to be served but to serve...', is quoted in this lesson?",["Matthew 20:28","John 5:6","Acts 11:16","Luke 24:30"],0,""],["Which of these is listed among the qualities in 'Ruth: A Right Model'?",["Beauty","Wealth","Loyalty","Fame"],2,""],["Who came to know more about the true God after marriage?",["Deborah","Ruth","Naomi","Orpah"],1,"QP 2021"]]}]},{"n":"New Testament","units":[{"t":"Chapter 10 – Road to Emmaus","q":[["What is the Bible reference for the lesson 'Road to Emmaus'?",["Acts 6 & 7","St. John 5:2-15","St. Luke 24:13-35","St. Luke 2:40-52"],2,""],["According to the Bible verse to learn, when were the eyes of the two disciples opened?",["When Jesus took bread, blessed and broke it, and gave it to them","When the women told them the news","When they reached the tomb","When Jesus showed them his hands"],0,""],["One aim of this lesson is to realize that Jesus is the ______ God who lives even today.",["Ancient","Silent","Risen","Hidden"],2,""],["On which day were the two people going to Emmaus?",["On the same day of Jesus' resurrection","On the day of Pentecost","On the day of the Last Supper","Forty days after the resurrection"],0,""],["From which city were the two travellers going to Emmaus?",["Caesarea","Jerusalem","Joppa","Bethlehem"],1,""],["What was the name of one of the two travellers to Emmaus?",["Cleopas","Philip","Stephen","Nathaniel"],0,"QP 2022"],["What were the two travellers talking about on the way?",["The vision of Peter","The building of the temple","The feeding of five thousand","The death and resurrection of Jesus"],3,"QP 2022"],["Who came near and walked with the two travellers on the road to Emmaus?",["Jesus","A Roman soldier","Peter","An angel"],0,"QP 2022"],["How did Jesus first speak to them, as given in the conversation?",["Why are you afraid?","Peace be with you.","What are you discussing with each other, looking very sad?","Do you want to be made well?"],2,""],["Who did the travellers say had told them that Jesus had resurrected?",["The soldiers at the tomb","The chief priests","Some women of their group","The eleven disciples"],2,""],["Why did the two travellers ask Jesus to stay with them?",["It was evening and the day was nearly over","It was raining heavily","The road was dangerous","He was tired and hungry"],0,""],["What happened right after the two recognized Jesus?",["He went up to heaven before them","He sat and ate with them till morning","He walked with them to Jerusalem","He vanished from their sight"],3,""],["What did the two say about their hearts while Jesus talked to them on the road?",["Their hearts were full of fear","Their hearts were cold","Their hearts were broken","Their hearts were burning within them"],3,""],["What did the two travellers do after realizing that Jesus had risen?",["They went to the tomb again","They stayed in Emmaus and prayed","They got up immediately and returned to Jerusalem","They went home to sleep"],2,""],["Whom did the two travellers find gathered and praying together in Jerusalem?",["The chief priests","The women at the tomb","The eleven disciples","The seven deacons"],2,""],["In the 'Let us find out' activity, which Gospel event of blessing bread is given with the reference St. Matthew 15:36?",["Bread at Emmaus","The Last Supper","Five loaves of bread","Seven loaves of bread"],3,""],["To which place was Cleopas travelling when he met the risen Jesus?",["Samaria","Joppa","Jerusalem","Emmaus"],3,"QP 2021"]]},{"t":"Chapter 11 – The Great Sheet from the Heaven","q":[["What is the Bible reference for the lesson 'The Great Sheet from the Heaven'?",["St. Luke 24:13-35","Acts of Apostles 11:1-18","Acts 6 & 7","1 Kings 17 & 18"],1,""],["Complete the Bible verse to learn: \"John baptized with water, but you will be baptized with ______.\"",["fire","the blood of the Lamb","the Holy Spirit","living water"],2,"QP 2022"],["What is the aim of the lesson 'The Great Sheet from the Heaven'?",["To realize that Jesus is risen","To learn to fast for forty days","To realize that all are one in Christ","To learn the stages of growth"],2,""],["According to the lesson, what is a 'vision'?",["A song sung in the church","A story told by grandparents","A bad dream at night","An experience of seeing something in a dream through divine spirit"],3,""],["Which Old Testament person heard God call his name twice while sleeping, as mentioned in the lesson?",["Elijah","Boaz","Moses","Samuel"],3,""],["Whose family's destruction did God tell Samuel about?",["Elimelech's family","Holofernes' family","Priest Eli's family","King Ahab's family"],2,""],["How does the lesson describe St. Peter?",["The first martyr","The head of apostles","The apostle of India","A friend of horses"],1,""],["When the early church began to flourish, what was the common thinking among the Jewish Christians?",["Gentiles should rule the church","All should go to Rome","Only the Jewish should be converted to Christianity","No one should be baptized"],2,""],["Why did St. Peter receive great criticism in Jerusalem?",["He denied Jesus three times","He had food together with the Gentiles","He went to Emmaus","He did not pray in the temple"],1,"QP 2021"],["In which city was Peter praying when he saw the vision?",["Samaria","Joppa","Caesarea","Jerusalem"],1,"QP 2021"],["By how many corners was the large sheet lowered from heaven?",["Four","Three","Seven","Two"],0,""],["What did the voice from heaven say to Peter?",["Get up, Peter; kill and eat.","Peter, follow me.","Peter, go to Emmaus.","Peter, feed my sheep."],0,""],["What was Peter's reply to the voice?",["Lord, receive my spirit.","Yes Lord, I will eat.","Lord, who are you?","By no means, Lord; for nothing profane or unclean has ever entered my mouth."],3,""],["How many times did the vision of the sheet happen?",["Twice","Seven times","Three times","Once"],2,""],["From which place were the three men sent to Peter?",["Jerusalem","Caesarea","Emmaus","Bethsaida"],1,""],["What happened as Peter began to speak in the man's house?",["The house shook","They all fell asleep","The Holy Spirit fell upon them","An angel appeared"],2,""],["Which priest from Wayanad, mentioned in the activity, donated one of his kidneys to a Muslim lady?",["Mor Gregorios Yohanna Ibrahim","Rev. Fr. Graham Staines","Rev. Fr. Shibu Kuttiparachel","Archdeacon Geevarghese"],2,""],["What does the vision of the Great Sheet from Heaven signify, according to the lesson?",["That the Jews alone will be saved","That we should not eat animals","The proclamation of Christ's Gospel to everyone irrespective of religion or caste","That Peter should leave Jerusalem"],2,"QP 2022"],["Who had seen the vision of the great sheet from heaven?",["St. Paul","St. Peter","St. James","St. John"],1,"QP 2021"],["Which of these is given in the lesson as one of the special qualities of St. Peter?",["He never denied Jesus","He wrote the Book of Acts","He was the first martyr","He was willing to die for Jesus"],3,"QP 2021"],["What did St. Peter see in the large sheet that came down from heaven?",["Loaves of bread and fishes","Gold, frankincense and myrrh","Twelve baskets of fruits","Four-footed animals, beasts of prey, reptiles and birds of the air"],3,"QP 2022"]]},{"t":"Chapter 12 – Be Courageous","q":[["What is the Bible reference for the lesson 'Be Courageous'?",["Acts 11:1-18","St. Luke 6:22-23","St. John 14:3-4","Acts 6 & 7"],3,""],["The Bible verse to learn in 'Be Courageous' is taken from where?",["James 5:16","St. Luke 2:52","Acts 11:16","St. Luke 6:22 & 23"],3,""],["Complete the Bible verse: \"Rejoice in that day and leap for joy, for surely your reward is great in ______.\"",["heaven","the world","Jerusalem","the church"],0,""],["Who was the first martyr of the Christian Church?",["St. George","St. James","St. Stephen","St. Paul"],2,"QP 2021, QP 2022"],["Who complained against the Hebrews because their widows were neglected in the daily distribution of food?",["The Samaritans","The Greeks (Hellenists)","The Moabites","The Romans"],1,""],["How many men did the apostles select to solve the problem of food distribution?",["Twelve","Seven","Three","Five"],1,""],["How were the chosen men appointed as servants of God?",["By anointing with oil","By washing their feet","By giving them a staff","By laying hands on them"],3,""],["What false allegation was made against Stephen?",["That he had eaten with Gentiles","That he had stolen the temple money","That he had blasphemed against God and Moses","That he had killed a soldier"],2,""],["What was Stephen's face like when he was filled with the Holy Spirit?",["Like an angel","Like a lion","Like a lamb","Like the sun"],0,"QP 2021"],["What did Stephen say when he gazed into heaven?",["I see a large sheet coming down from heaven.","I see the heavens opened and the Son of Man standing at the right hand of God!","I see angels at the tomb.","I see the fire of the Lord falling."],1,""],["How was Stephen put to death?",["He was burnt in a fire","He was stoned outside the city","He was thrown into the sea","He was stabbed with a spear"],1,""],["Which prayer did Stephen say while he was being stoned?",["Lord, have mercy on me, a sinner.","Lord Jesus, receive my spirit.","My help comes from the Lord.","Answer me, O Lord."],1,""],["Complete Stephen's prayer: \"Lord, do not hold this ______ against them.\"",["sin","anger","stone","trial"],0,"QP 2021, QP 2022"],["Stephen's prayer for his persecutors is similar to Jesus' prayer found in which Bible passage?",["St. Matthew 26:26","St. Luke 23:34","St. John 14:6","St. Luke 24:30"],1,""],["Which Syriac Orthodox Archbishop is mentioned in the news as abducted by terrorists?",["Mor Jacob Baradaeus","Mor Severios","Mor Ahatallah","Mor Gregorios Yohanna Ibrahim"],3,""],["Which Australian missionary, burnt alive with his children, is given as an example of forgiveness through his wife's words?",["Aleixo de Menezes","Graham Staines","Shibu Kuttiparachel","Vasco Da Gama"],1,""],["Who is the author of the Book of Acts?",["St. Luke","St. Paul","St. Stephen","St. Peter"],0,"QP 2021, QP 2022"]]},{"t":"Chapter 13 – Moral Lesson: Integral Growth","q":[["What is the Bible reference for the lesson 'Integral Growth'?",["St. Luke 24:13-35","St. Luke 2:40-52","St. Luke 12:16-21","St. John 5:2-15"],1,""],["Complete the Bible verse to learn: \"And Jesus increased in wisdom and stature, and in favour with ______.\"",["God and men","the teachers","the angels","his parents"],0,""],["According to the lesson, what is partial growth like?",["A seed","Cancer","A tree","A river"],1,""],["According to the lesson, growing in knowledge, age and wealth, but forgetting God is like what?",["A lamp without oil","A house without doors","Getting cancer","A tree without fruit"],2,""],["In the girl's story, why do ants walk in lines and birds fly one after another?",["They are looking for food","They are tired","They are afraid of enemies","They have good obedience and discipline"],3,""],["Which branch did the tree name after hearing the story of the ants and the birds?",["Old age","Young age","Childhood","Adolescence"],2,""],["In the story, what did the crow have in her beak?",["A piece of cheese","A grain of rice","A fruit","A loaf of bread"],3,""],["What lesson did the crow learn?",["Do not trust flatterers","Fly with other birds","Always share your food","Sing every morning"],0,""],["Which branch did the tree name after the story of the crow and the fox?",["Young age","Childhood","Old age","Adolescence"],3,""],["Who came and shared the story of the lazy young men on the tree's branch?",["A crow and a fox","Two parrots","Two old men","A boy and a girl"],1,""],["How many sons did the farmer have?",["Seven","Three","Two","Four"],3,""],["What was the real 'treasure' the farmer wanted his sons to find?",["Gold buried under a tree","A box of silver coins","A hidden well","The crops from their hard work in the field"],3,""],["Which branch did the tree name after the story of the farmer's lazy sons?",["Childhood","Adolescence","Old age","Young age"],3,""],["In the old men's story, what was the young man searching for?",["A hidden treasure","His lost sheep","A wise king","The secret of happiness"],3,""],["What did the wise man give the young man to carry around the palace?",["A loaf of bread","A cup of water","A teaspoon holding two drops of oil","A lamp with oil"],2,""],["According to the wise man, what does one need to have?",["Both physical growth and spiritual enrichment","Only physical strength","Only a beautiful palace","Only great wealth"],0,""],["Which branch did the tree name after the story of the secret of happiness?",["Young age","Childhood","Old age","Adolescence"],2,""],["For the essay 'Partial growth is dangerous', which parable of Jesus are students asked to read?",["St. Luke 2:40-52","St. Luke 24:13-35","St. Luke 15:4-7","St. Luke 12:16-21"],3,""]]}]},{"n":"Church History","units":[{"t":"3. Malankara Church","q":[["In which year did Apostle St. Thomas reach Kerala?",["AD 36","AD 325","AD 52","AD 345"],2,"QP 2021"],["In which year did the Syrian Migration take place?",["AD 52","AD 1599","AD 345","AD 1498"],2,"QP 2021, QP 2022"],["Which bishop came to Kerala in the Syrian Migration?",["Mor Abraham","Mor Ahatallah","Aleixo de Menezes","Bishop Joseph of Edessa"],3,""],["Under whose leadership did the bishop, priests and Christian families from Syria travel to Kerala?",["Archdeacon Geevarghese","Thomas of Cana, a businessman","Vasco Da Gama","Cheraman Perumal"],1,""],["At which port city did the Syrian migrants arrive?",["Kodungalloor","Mylapore","Cochin","Calicut"],0,"QP 2022"],["To which ruler did Thomas of Cana present gifts and inform about the needs of Christians?",["Ahab","Gondophares","Cheraman Perumal","Nebuchadnezzar"],2,""],["What were the special statuses carved on copper plates and granted to Christians called?",["Enyono","Tubden","Bovooso","Chepped"],3,""],["What are the successors of Thomas of Cana called?",["Knananites","Moabites","Hellenists","Chalcedonians"],0,"QP 2021, QP 2022"],["Why did the Christians in Kerala come to be known as 'Syrian Christians'?",["They used the liturgy in the Syriac language","They were all born in Syria","They lived near the river Syria","They traded only with Syria"],0,""],["In which year did the Portuguese arrive, when Vasco Da Gama reached Calicut?",["AD 1498","AD 1599","AD 1653","AD 1597"],0,""],["Who were the administrators of the Malankara Church until the 16th century?",["Roman cardinals","Kings","Archdeacons","Portuguese governors"],2,"QP 2021"],["From which renowned family were Archdeacons ordained?",["Edessa","Kuttiparachel","Pakalomattom","Parumala"],2,"QP 2022"],["What was the peculiarity of the Archdeacons?",["A long beard","A golden staff","Pointed headgear","A red robe"],2,""],["Where are the first metropolitan Mor Thoma and Archdeacon Geevarghese entombed?",["St. Mary's Jacobite Soonoro Cathedral, Angamali","A church at Mylapore","Mattancherry church","A church at Kottayam"],0,""],["Who was the Roman Catholic Archbishop of Goa who took control over the Archdeacons?",["Vasco Da Gama","Thomas of Cana","Menezes","Mor Ahatallah"],2,""],["On which date was the Synod of Diamper (Udayamperoor) convened?",["3 June 1653","3 July 1599","20 June 1599","20 June 1498"],2,""],["Where was the metropolitan Mor Ahatallah imprisoned by the Portuguese?",["Kodungalloor","Cochin","Goa","Mylapore (Chennai)"],3,"QP 2022"],["How was Mor Ahatallah Bava killed by the Portuguese?",["He was drowned in the sea with a big rock tied to his neck","He was stoned outside the city","He was stabbed with a spear","He was burnt alive"],0,""],["At which church did the faithful take the Oath at the Bent Cross (Coonan Cross Oath)?",["Udayamperoor church","Mattancherry church","Soonoro Cathedral, Angamali","Kodungalloor church"],1,"QP 2013 (Kerala)"],["Why is the oath of 1653 called 'the Oath at the Bent Cross'?",["The stone cross bent as thousands held tightly on the rope tied to it","The people bent down before the cross","The cross was made bent by the Portuguese","A storm bent the cross that day"],0,""],["In which year was the Oath at the Bent Cross held?",["AD 1653","AD 345","AD 52","AD 1599"],0,"QP 2021"],["The Synod of Diamper (Udayamperoor) was summoned to bring the Malankara Church under what?",["The rule of Cheraman Perumal","The Patriarch of Antioch","The supremacy of the Roman Catholic Church","The Archdeacons of Pakalomattom"],2,"QP 2021"]]},{"t":"4. From the History of Blessed Apostles (St. Philip and St. Thomas)","q":[["What does the name 'Philip' mean?",["Twin","House of Bread","Rock","Friend of horses"],3,"QP 2022"],["What is the birthplace of St. Philip?",["Emmaus","Bethsaida","Bethlehem","Joppa"],1,"QP 2021, QP 2022"],["Bethsaida, the city of Philip, was also the city of which apostles?",["St. Stephen and St. Paul","St. James and St. John","St. Thomas and St. Matthew","St. Peter and St. Andrew"],3,"QP 2021"],["Philip went to the banks of the Jordan River to listen to whom?",["Stephen","Thomas","Elijah","John the Baptist"],3,""],["What did Jesus tell Philip when he met him?",["Follow me","Peace be with you","Do you want to be made well?","Get up and eat"],0,""],["Whom did Philip invite to Jesus after receiving his call?",["Cleopas","His friend Nathaniel","His brother Andrew","Stephen"],1,""],["What did Philip realize from the reply of Jesus?",["Jesus would go back to Galilee","He should become a fisherman again","To see and know Jesus, one has to observe and follow him","He should stay in Bethsaida"],2,""],["To whom did Philip introduce the salvific act of Jesus Christ?",["The Egyptians","The Romans","The Moabites","The Greeks"],3,""],["After the death of St. Stephen in AD 36, where did Philip go to preach the gospel?",["Edessa","India","Samaria","Rome"],2,""],["What does the name 'Thomas' mean?",["Twin","Friend of horses","Gift of God","Brave"],0,"QP 2021, QP 2022"],["By what title is St. Thomas known?",["Apostle of India","Friend of horses","Head of apostles","First martyr"],0,""],["Where were the disciples when Jesus said, \"If I go and prepare a place for you, I will come again\"?",["At the banks of Jordan","On the road to Emmaus","On Mount Carmel","At the Mansion of Jerusalem during the Last Supper"],3,""],["Which Bible verse records the question Thomas asked Jesus about knowing the way?",["St. John 20:28","St. John 1:46","St. John 14:5","St. John 14:8"],2,""],["Thomas said he would not believe that the Lord had risen without what?",["A sign from heaven","Clear evidence","A dream","The word of Peter"],1,""],["In St. John 20:28, how did Thomas accept Jesus?",["As his Lord and God","As a great prophet","As the King of the Jews","As a good teacher"],0,""],["Where did St. Thomas go from Kerala and enter martyrdom?",["Edessa","Punjab","Mylapore (Tamil Nadu)","Samaria"],2,""],["How was St. Thomas martyred?",["He was crucified upside down","He was drowned","He was stabbed with a spear","He was stoned"],2,""],["To which place were the relics of St. Thomas taken?",["Antioch","Jerusalem","Goa","Edessa (Uraha)"],3,"QP 2021"],["When does the Church commemorate the 'Dukrono' of St. Thomas?",["July 3","January 8","June 30","November 28"],0,"QP 2021"],["In the propagated story, which king invited St. Thomas to India to construct a palace?",["Cheraman Perumal","Gondophares, King of Punjab","Nebuchadnezzar","Ahab"],1,""],["In which year did St. Stephen die, after which Philip went to preach in Samaria?",["AD 36","AD 325","AD 345","AD 52"],0,"QP 2021"],["What evidences did the risen Lord give to Thomas (St. John 20:27)?",["To eat bread and fish with Him","To touch the crown of thorns","To see the empty tomb and the linen cloths","To put his finger to see His hands and put his hand into His side"],3,"QP 2022"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Who had received the stone tablets written by God through fasting?","o":["Moses","Elijah","Elisha","Jesus"],"a":0},{"q":"To which country did Elimelech migrate?","o":["Hebron","Moab","Bethel","Judah"],"a":1},{"q":"To which place was Cleopas travelling when he met the risen Jesus?","o":["Samaria","Joppa","Emmaus","Caesarea"],"a":2},{"q":"In the story told by the tree, what lesson did the crow learn?","o":["Always share your food","Sing every morning","Never fly alone","Do not trust flatterers"],"a":3},{"q":"Who were the administrators of the Malankara Church until the 16th century?","o":["Roman cardinals","Archdeacons","Kings","Portuguese governors"],"a":1},{"q":"What does the name 'Philip' mean?","o":["Twin","Rock","House of Bread","Friend of horses"],"a":3}],"name":[{"q":"The place where Elijah hid himself from the King.","a":"By the Wadi Cherith, east of the Jordan"},{"q":"The brave woman who killed Holofernes.","a":"Judith"},{"q":"The first martyr of the Christian Church.","a":"St. Stephen"},{"q":"The city where St. Peter was praying when he saw the vision of the great sheet.","a":"Joppa"},{"q":"The Roman Catholic Archbishop of Goa who presided over the Synod of Diamper.","a":"Aleixo de Menezes"},{"q":"The birthplace of St. Philip.","a":"Bethsaida"}],"tf":[{"q":"Moses, Elijah and Jesus had observed lent for 40 days.","a":true},{"q":"When the famine was over, Naomi took both Ruth and Orpah and went back to Bethlehem.","a":false},{"q":"The two travellers recognised Jesus as soon as he started walking with them on the road.","a":false},{"q":"The Portuguese arrived in Kerala when Vasco Da Gama reached Calicut in AD 1498.","a":true}],"fill":[{"q":"\"The prayer of the righteous is ______ and effective.\" (James 5:16)","a":"powerful"},{"q":"The Moabites worshipped their god ______.","a":"Chemosh"},{"q":"Filled with the Holy Spirit, Stephen's face was shining like an ______.","a":"angel"},{"q":"Growing in knowledge, age and wealth, but forgetting God, is exactly like getting ______.","a":"cancer"},{"q":"The successors of Thomas of Cana are called the ______.","a":"Knananites"}],"match":{"l":["Ahab","Holofernes","Obed","Joan of Arc","Syrian Migration","Synod of Diamper","Nathaniel"],"r":["AD 1599","French army","Friend of Philip","Son of Ruth and Boaz","AD 345","Assyrian general","King of Israel"],"key":[6,5,3,1,4,0,2]},"short":[{"q":"When the people wanted to surrender the town to Holofernes, what did Uzziah tell them?","a":"Uzziah said, \"Courage, my brothers and sisters! Let us hold out for five days more.\" He promised that if those days passed and no help came from the Lord God, he would do as they said.","ref":"Class VI textbook, Chapter 5 – The Brave Woman"},{"q":"What was the topic discussed by the two people on their way to Emmaus? Who accompanied them on the way?","a":"They were talking about the death and resurrection of Jesus. While they were travelling and discussing, Jesus himself came near and went with them, but they did not recognise him.","ref":"Class VI textbook, Chapter 10 – Road to Emmaus"},{"q":"Name the four stages of growth (branches) in the story told by the tree in 'Integral Growth'.","a":"The tree named its branches childhood, adolescence, young age and old age. Each branch was named after a story it heard: obedience and discipline, \"Do not trust flatterers\", the treasure of hard work, and the secret of happiness.","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"},{"q":"Why did the Christians in Kerala come to be known as 'Syrian Christians'?","a":"The bishop and priests who came with Thomas of Cana were admirers of the Throne of Antioch, so Syrian liturgy and tradition flourished in Kerala. As the Christians in Kerala started to use the liturgy in the Syriac language, they came to be known as 'Syrian Christians'.","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"para":[{"q":"What did God say to Elijah during the time of famine? Who gave shelter to Elijah at Zarephath?","a":"As a punishment from God there was neither rain nor dew in the land for two years; God told Elijah, \"Go from Samaria and turn eastward and hide yourself by the Wadi Cherith, which is east of the Jordan\"; He would drink from the wadi, and God had commanded the ravens to bring him bread and meat in the morning and in the evening; When the wadi Cherith dried up, God said, \"Go now to Zarephath and live there; for I have commanded a widow there to feed you\"; At the gate of the town Elijah met the widow gathering sticks, and she fed him; Though the people of Zarephath were in great misery because of no rain, Elijah helped them to get out of their distress","ref":"Class VI textbook, Chapter 4 – Elijah, the Lamp"},{"q":"Describe the vision of the great sheet that St. Peter saw. What does it signify?","a":"Peter was praying in the city of Joppa and in a trance saw a large sheet coming down from heaven, lowered by its four corners; In it were four-footed animals, beasts of prey, reptiles and birds of the air; A voice said, \"Get up, Peter; kill and eat,\" but Peter replied, \"By no means, Lord; for nothing profane or unclean has ever entered my mouth\"; The voice answered, \"What God has made clean, you must not call profane,\" and this happened three times; Then three men from Caesarea came, and as Peter spoke in that house the Holy Spirit fell upon them; The vision signifies the proclamation of Christ's Gospel to everyone irrespective of their religion or caste","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"Write a note on the Oath at the Bent Cross (Coonan Cross Oath).","a":"Metropolitan Mor Ahatallah, a delegate from the Throne of Antioch, was imprisoned by the Portuguese at Mylapore and drowned in the sea with a big rock tied on his neck; The desperate faithful gathered at Mattancherry church on June 03, 1653; They tied a rope on the stone cross in front of the church and, holding that rope, took an oath that they would never accept the Roman supremacy; As thousands held tightly on the rope, the cross bent towards that side, so it is called \"the Oath at the Bent Cross\"; Thus the Malankara Syrian Church, under Roman dominance for half a century, regained its Syrian tradition","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"essay":[{"q":"How did Judith save Israel from the attack of the Assyrian king Nebuchadnezzar?","a":"In the twelfth year of his reign, Nebuchadnezzar made war against Israel with Holofernes as chief general of his army; Holofernes seized all the springs of water, the people fainted because of thirst and famine and wanted to surrender, but Uzziah asked them to hold out for five days more; Judith, a God-fearing widow spending her widowhood in fasting, told the elders not to put God to the test but to call upon Him for help; She went to Holofernes with her maid, telling him she had left the Hebrews and would go out every night into the valley to pray; On the fourth day, at a private banquet, Holofernes drank much wine and became dead drunk; Judith prayed, strengthened herself, took his sword that was hung there and cut off his head, and her maid put it in her food bag; They returned to the Israelites, who realised they were saved from Nebuchadnezzar and offered peace and thanksgiving offerings to God; Judith's fame spread and she came to be known as the 'brave woman'","ref":"Class VI textbook, Chapter 5 – The Brave Woman"},{"q":"St. Thomas, the Apostle of India","a":"The name 'Thomas' means 'twin'; He reached Kerala in AD 52 with the Holy Gospel and is known as the 'Apostle of India'; At the Last Supper in the Mansion of Jerusalem, when Jesus spoke of the place where He was going, Thomas asked Him how they could know the way (St. John 14:5); This shows that Thomas had the desire and conviction to know the truth; He said he would not believe that the Lord had risen without clear evidence, and the Lord Himself gave him evidences (St. John 20:27); Without examining the evidences, Thomas accepted Jesus as his Lord and God (St. John 20:28), giving evidence for those who do not believe in the incarnation and resurrection of Jesus; He went from Kerala to Mylapore (Tamil Nadu), where he was stabbed with a spear and entered martyrdom; His relics were taken to Edessa (Uraha), and the Church commemorates his 'Dukrono' on July 3rd","ref":"Class VI textbook, Church History, Lesson 4 – From the History of Blessed Apostles (St. Thomas)"}]}},{"no":2,"s":{"mcq":[{"q":"Who prayed to God in the midst of people with perplexed mindset?","o":["Elijah","Elisha","Eli","Elishah (son of Javan)"],"a":0},{"q":"Who wore sackcloth and spent her widowhood in fasting and prayers?","o":["The widow of Zarephath","Ruth","Judith","Naomi"],"a":2},{"q":"Who had seen the vision of the great sheet from heaven?","o":["St. James","St. John","St. Peter","St. Paul"],"a":2},{"q":"How many men did the apostles select to solve the problem of the daily distribution of food?","o":["Twelve","Three","Seven","Five"],"a":2},{"q":"In which year did St. Thomas reach Kerala?","o":["AD 1498","AD 36","AD 345","AD 52"],"a":3},{"q":"Which bishop came to Kerala in the Syrian Migration?","o":["Bishop Joseph of Edessa","Aleixo de Menezes","Mor Ahatallah","Mor Thoma"],"a":0}],"name":[{"q":"The meaning of the name 'Bethlehem'.","a":"House of Bread"},{"q":"The novel about Elijah written by the Brazilian writer Paulo Coelho.","a":"Fifth Mountain"},{"q":"The Australian missionary who was burnt alive along with his children.","a":"Graham Staines"},{"q":"The branch the tree named after hearing the story of the farmer's lazy sons.","a":"Young age"},{"q":"The port city where the Syrian migrants arrived in AD 345.","a":"Kodungalloor"},{"q":"The meaning of the name 'Thomas'.","a":"Twin"}],"tf":[{"q":"Elijah is known as the intercessor for those who struggle from natural calamities.","a":true},{"q":"Orpah kissed her mother-in-law and went back home, but Ruth clung to Naomi.","a":true},{"q":"St. Stephen was stoned inside the temple in Jerusalem.","a":false},{"q":"The Synod of Diamper was presided over by Mor Ahatallah.","a":false}],"fill":[{"q":"\"Your people shall be my people, and your God, ______.\" (Ruth 1:16)","a":"my God"},{"q":"As a punishment from God, there was neither rain nor ______ in the land for two years.","a":"dew"},{"q":"\"John baptized with water, but you will be baptized with ______.\" (Acts 11:16)","a":"the Holy Spirit"},{"q":"\"And Jesus increased in wisdom and ______, and in favour with God and men.\" (St. Luke 2:52)","a":"stature"},{"q":"The special statuses carved on copper plates and granted to the Christians are called ______.","a":"Chepped"}],"match":{"l":["Isabel","Uzziah","Boaz","Fr. Shibu Kuttiparachel","Mor Gregorios Yohanna Ibrahim","Thomas of Cana","Cheraman Perumal"],"r":["Redeemer of Ruth","Leader of the town","Businessman","Donated a kidney","Wife of Ahab","Abducted Archbishop","Ruler of the State"],"key":[4,1,0,3,5,2,6]},"short":[{"q":"Why did the Israelites want to surrender their town to Holofernes?","a":"Holofernes took possession of all the springs of water and seized the Israelites' entire water supply. The people started to faint because of thirst and famine, so they cried out to Uzziah and the judges to surrender the town to Holofernes.","ref":"Class VI textbook, Chapter 5 – The Brave Woman"},{"q":"What was the common thinking among the Jewish Christians when the early church began to flourish? Why was St. Peter criticised in Jerusalem?","a":"When the early church began to flourish, the common thinking was that only the Jewish should be converted to Christianity. St. Peter received great criticism in Jerusalem because he had food together with the Gentiles (non-Jewish people).","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"What did the wise man teach the young man about the secret of happiness?","a":"The wise man asked him to walk around the palace carrying a teaspoon that held two drops of oil, without spilling it. He taught that the secret of happiness is to see all the marvels of the world and never to forget the drops of oil on the spoon; one needs both physical growth and spiritual enrichment.","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"},{"q":"What happened to Mor Ahatallah?","a":"Mor Ahatallah, a metropolitan and delegate from the Throne of Antioch, was captured and imprisoned by the Portuguese at Mylapore (Chennai). When he was being brought to Cochin by ship, nearly 25,000 Syrian Christians tried to rescue him, but the Portuguese murdered him by tying a big rock on his neck and drowning him in the sea.","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"para":[{"q":"How did Elijah prove on Mount Carmel that the LORD is the true God?","a":"Elijah told Ahab to summon the people of all Israel and the prophets of Baal and Asherah to Mount Carmel; Elijah said he was the only prophet of the LORD left, but Baal had four hundred and fifty prophets; Two bulls were brought, one for the prophets of Baal to sacrifice to their god and one for Elijah's burnt offering to God; After placing the bull on the altar, Elijah prayed to \"the Lord, the God of Abraham, Isaac and Israel\" (1 Kings 18:36,37); The fire of the LORD fell and consumed the burnt offering, the wood, the stones and the dust, and even licked up the water in the trench; When all the people saw this, they fell on their faces (1 Kings 18:39): Elijah prayed with strong faith and God answered him","ref":"Class VI textbook, Chapter 4 – Elijah, the Lamp"},{"q":"Describe how the two travellers to Emmaus recognised the risen Jesus and what they did afterwards.","a":"As they neared their house in the evening, they asked Jesus to stay with them, and he went in; When he was at the table with them, he took bread, blessed and broke it, and gave it to them; Then their eyes were opened and they recognised him, and he vanished from their sight; They said to each other, \"Were not our hearts burning within us while he was talking to us on the road?\"; They immediately returned to Jerusalem and told everything to the eleven disciples gathered there praying together; The disciples also believed in the risen Lord","ref":"Class VI textbook, Chapter 10 – Road to Emmaus"},{"q":"Write a short note on the Synod of Diamper (Udayamperoor).","a":"The Portuguese arrived in AD 1498, when Vasco Da Gama reached Calicut, intending to bring the Malankara Church under the custom of the Roman Church; In AD 1597, after the demise of Mor Abraham, Menezes, the Roman Catholic Archbishop of Goa, took control over the Archdeacons; He summoned a Synod at Diamper (Udayamperoor), convened on 20 June 1599 under his presidentship; He himself wrote the decisions and forcefully pushed everyone to accept them; He enforced Catholic liturgy in the parishes and appointed one of his admirers as Archdeacon; Thus the Malankara Church was subjugated under the dominion of the Roman Church","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"essay":[{"q":"Ruth – a right model for us","a":"Ruth was a Moabite woman who married Mahlon, son of Elimelech and Naomi, and came to know the True God; When Naomi lost her husband and sons, Orpah went back home but Ruth clung to Naomi; Ruth said, \"Your people shall be my people, and your God, my God\" – a deep confession of faith in the True God; She went with Naomi to Bethlehem and, to find their livelihood, went gleaning grain in the field of Boaz; Boaz blessed her for all she had done for her mother-in-law and for coming to a people she did not know; Boaz became her redeemer, married her and admired her as a 'virtuous woman'; Their son Obed was the father of Jesse, the father of David, in whose genealogy Jesus was born; Ruth is a right model of faith, bravery, obedience, love, loyalty and hard work, and shows that salvation is for everyone","ref":"Class VI textbook, Chapter 6 – Ruth"},{"q":"St. Stephen, the first martyr of the Church","a":"When the disciples increased in number, the Greeks (Hellenists) complained that their widows were neglected in the daily distribution of food; The apostles selected seven men full of faith and the Holy Spirit and laid their hands on them; Stephen, one of them, was full of grace and power and did great wonders and signs; Some jealous people falsely alleged that he had blasphemed against God and Moses, and he was brought before the council with false witnesses; In his reply he described the miraculous deeds of God and criticised the Jews who stood against the Holy Spirit and crucified the Son of Man; Filled with the Holy Spirit, his face shone like an angel and he said, \"I see the heavens opened and the Son of Man standing at the right hand of God!\"; They dragged him out of the city and stoned him while he prayed, \"Lord Jesus, receive my spirit\" and \"Lord, do not hold this sin against them\"; He is the first martyr of the Church, teaching us to be courageous and forgiving by the power of the Holy Spirit","ref":"Class VI textbook, Chapter 12 – Be Courageous"}]}},{"no":3,"s":{"mcq":[{"q":"Which birds did God command to feed Elijah by the Wadi Cherith?","o":["Sparrows","Eagles","Ravens","Doves"],"a":2},{"q":"Who came to know more about the true God after her marriage?","o":["Ruth","Deborah","Orpah","Naomi"],"a":0},{"q":"Who is the author of the Book of Acts?","o":["St. Luke","St. Matthew","St. Mark","St. Paul"],"a":0},{"q":"What did the voice from heaven say to Peter in his vision?","o":["Peter, feed my sheep.","Get up, Peter; kill and eat.","Peter, go to Emmaus.","Peter, follow me."],"a":1},{"q":"What was the peculiarity of the Archdeacons of the Malankara Church?","o":["A long beard","A red robe","A golden staff","Pointed headgear"],"a":3},{"q":"When does the Church commemorate the 'Dukrono' of St. Thomas?","o":["July 3","November 28","January 8","June 30"],"a":0}],"name":[{"q":"The Assyrian king who made war against Israel in the twelfth year of his reign.","a":"Nebuchadnezzar"},{"q":"The person who called Ruth a 'virtuous woman'.","a":"Boaz"},{"q":"The disciple and protégé of Elijah.","a":"Elisha"},{"q":"The city from which three men were sent to Peter.","a":"Caesarea"},{"q":"The Bible reference of the moral lesson 'Integral Growth'.","a":"St. Luke 2:40-52"},{"q":"The church where the first metropolitan Mor Thoma and Archdeacon Geevarghese are entombed.","a":"St. Mary's Jacobite Soonoro Cathedral, Angamali"}],"tf":[{"q":"Judith defeated the great army of the Midianites with the help of three hundred Israelites.","a":false},{"q":"Boaz allowed Ruth to glean and even to drink water from the vessels of his young men.","a":true},{"q":"The vision of St. Peter showed that the Gospel of Christ is only for the Jews.","a":false},{"q":"Thomas of Cana was a businessman who led the Syrian Migration.","a":true}],"fill":[{"q":"\"For the Lord is a God who crushes ______.\" (Judith 16:3)","a":"wars"},{"q":"When Naomi and Ruth reached Bethlehem, it was the time of the ______ harvest.","a":"barley"},{"q":"\"Lord, do not hold this ______ against them.\"","a":"sin"},{"q":"In the girl's story, the ants walk in straight lines because they have good obedience and ______.","a":"discipline"},{"q":"The relics of St. Thomas were taken to ______.","a":"Edessa (Uraha)"}],"match":{"l":["Mahlon and Chilion","Jesse","Deborah","St. Peter","Samuel","Gondophares","Four corners"],"r":["Head of the apostles","Judges chapters 4 & 5","King of Punjab","Sons of Elimelech","Father of David","Heard God call him while sleeping","Great sheet from heaven"],"key":[3,4,1,0,5,2,6]},"short":[{"q":"What did Judith say to the elders of the town?","a":"Judith told the elders that it was not right to swear to surrender the town unless the Lord helped them within so many days, and asked, \"Who are you to put God to the test today?\" She told them not to anger the Lord but to call upon Him while waiting for His deliverance, and to give thanks, because the Lord scourges those who are close to Him in order to admonish them.","ref":"Class VI textbook, Chapter 5 – The Brave Woman"},{"q":"Write any four special qualities of St. Peter given in the lesson.","a":"St. Peter was innocent, loved Jesus very much, and was brave and courageous. He was willing to die for Jesus and was a good leader; though he denied Jesus three times, he repented and cried.","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"What did the farmer's four lazy sons learn about the 'treasure' in their field?","a":"The sons dug every portion of their field hunting for the treasure but found nothing. On a friend's suggestion they sowed seeds, and the fields rewarded their labour with abundant crops; they realised, \"This is the treasure our father wanted us to find.\"","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"},{"q":"What are the evidences given to Thomas by Jesus? What did Thomas say?","a":"Thomas had said that without clear evidence he would not believe that the Lord had risen, so the Lord Himself gave him evidences (St. John 20:27). But without examining the evidences, Thomas accepted Jesus as his Lord and God, saying, \"My Lord and my God!\" (St. John 20:28).","ref":"Class VI textbook, Church History, Lesson 4 – From the History of Blessed Apostles (St. Thomas)"}],"para":[{"q":"Why did Elimelech's family go to Moab, and what happened to them there?","a":"In the days when the judges ruled Israel there was a famine in the land; So Elimelech, his wife Naomi and their sons Mahlon and Chilion migrated from Bethlehem in Judah to the country of Moab; The Moabites worshipped their god Chemosh and did not know the True God Yahweh, yet the family settled there as immigrants; Mahlon and Chilion married Moabite women, Ruth and Orpah respectively; The family faced very difficult situations, and Naomi lost her husband as well as her sons; Naomi asked both daughters-in-law to go back to their people: Orpah went home, but Ruth clung to Naomi","ref":"Class VI textbook, Chapter 6 – Ruth"},{"q":"Why did the apostles choose seven men? Write about Stephen, one of them.","a":"As the disciples increased in number, the Greeks (Hellenists) complained against the Hebrews that their widows were neglected in the daily distribution of food; To resolve this, the apostles selected seven men full of faith and the Holy Spirit; They appointed them as servants of God by laying their hands on them; Stephen, one of them, was full of grace and power and did great wonders and signs among the people; Being jealous, some made a false allegation that he had blasphemed against God and Moses; He was seized and brought before the council, where many stood against him as false witnesses","ref":"Class VI textbook, Chapter 12 – Be Courageous"},{"q":"Write about St. Philip, the apostle.","a":"The name 'Philip' means 'friend of horses', and he was from Bethsaida, the city of St. Peter and St. Andrew; He was a fisherman and went to the banks of the Jordan with Peter, Andrew and the sons of Zebedee to listen to John the Baptist, where Jesus met him and said, \"Follow me\"; After receiving the call, Philip invited his friend Nathaniel to Jesus; From Jesus' reply to his desire (St. John 14:8), Philip realised that to see and know Jesus one has to observe and follow Him, and he started to propagate the gospel; He introduced the salvific act of Jesus Christ to the Greeks; After the death of St. Stephen in AD 36, he went to Samaria and preached the gospel of Christ there","ref":"Class VI textbook, Church History, Lesson 4 – From the History of Blessed Apostles (St. Philip)"}],"essay":[{"q":"Prayer – with the example of the prophet Elijah","a":"Elijah was a prophet who prayed even in the midst of difficult circumstances and received answers from God; During the famine he obeyed God and hid by the Wadi Cherith, where God commanded the ravens to feed him; When the wadi dried up, Elijah prayed to God and God answered him by sending him to a widow at Zarephath; On Mount Carmel, in the midst of people with a perplexed mind, he prayed and the fire of the LORD fell and consumed his burnt offering; Though he had to face many blames and criticisms, he overcame them by praying with strong faith; Elijah is the intercessor for those who struggle from natural calamities: when St. Gregorios of Parumala's ship was caught in a storm, he interceded to Elijah and the sea calmed; \"The prayer of the righteous is powerful and effective\" (James 5:16) – there is an answer for every prayer in any distress; Like Elijah, let us have the courage to pray faithfully that God will answer us","ref":"Class VI textbook, Chapter 4 – Elijah, the Lamp"},{"q":"Integral growth – 'Partial growth is dangerous'","a":"It is natural to grow as per one's age, but unilateral (partial) growth is dangerous – partial growth is like cancer; Growing in knowledge, age and wealth but forgetting God is exactly like getting cancer; Jesus \"increased in wisdom and stature, and in favour with God and men\" (St. Luke 2:52); Childhood: like the ants and the birds, we need good obedience and discipline; Adolescence: like the crow and the fox, we must not trust flatterers; Young age: like the farmer's sons, hard work brings the real treasure; Old age: the secret of happiness is to see the marvels of the world and never forget the drops of oil – one needs both physical growth and spiritual enrichment; The parable in St. Luke 12:16-21 warns against acquiring wealth and forgetting to become rich in God, so like the tree we must grow without losing our spirit, aiming to reach heaven","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"}]}},{"no":4,"s":{"mcq":[{"q":"Under whose influence did King Ahab start worshipping Baal?","o":["The priest Eli","His wife Isabel","The prophet Elisha","The widow of Zarephath"],"a":1},{"q":"Uzziah asked Judith to pray so that the Lord would send what to fill their cisterns?","o":["Fire","Rain","Manna","Soldiers"],"a":1},{"q":"Which of these is listed among the qualities in 'Ruth: A Right Model'?","o":["Wealth","Beauty","Fame","Loyalty"],"a":3},{"q":"Whom did the two travellers find gathered and praying together when they returned to Jerusalem?","o":["The eleven disciples","The seven deacons","The chief priests","The women at the tomb"],"a":0},{"q":"At which church did the faithful take the Oath at the Bent Cross?","o":["Mattancherry church","Udayamperoor church","Soonoro Cathedral, Angamali","Kodungalloor church"],"a":0},{"q":"Where did St. Thomas enter martyrdom?","o":["Samaria","Edessa","Kodungalloor","Mylapore (Tamil Nadu)"],"a":3}],"name":[{"q":"The prophet who is known as the 'prophet of miracles'.","a":"Elijah"},{"q":"The Bible reference of Jesus' words, \"The Son of Man came not to be served but to serve...\", quoted in the lesson on Ruth.","a":"St. Matthew 20:28"},{"q":"The daughter-in-law who kissed Naomi and went back to her own home.","a":"Orpah"},{"q":"Stephen's prayer for his persecutors is similar to the prayer of Jesus found in this Bible passage.","a":"St. Luke 23:34"},{"q":"The person consecrated by Mor Ahatallah in prison as the successor of Archdeacon Geevarghese.","a":"Thomas"},{"q":"The port to which the Portuguese were bringing Mor Ahatallah by ship.","a":"Cochin"}],"tf":[{"q":"During the famine, God sent Elijah to live with a rich king at Zarephath.","a":false},{"q":"Holofernes invited Judith for a private banquet on the fourth day.","a":true},{"q":"Jesus vanished from their sight as soon as the two travellers recognised him at Emmaus.","a":true},{"q":"People from any family could be ordained as Archdeacons in the Malankara Church.","a":false}],"fill":[{"q":"St. Gregorios of Parumala built a church in the name of Elijah at ______.","a":"Kottayam"},{"q":"Judith's maid placed the head of Holofernes in her ______.","a":"food bag"},{"q":"\"Were not our ______ burning within us while he was talking to us on the road?\"","a":"hearts"},{"q":"In the great sheet Peter saw four-footed animals, beasts of prey, reptiles and ______ of the air.","a":"birds"},{"q":"People only from the renowned family of ______ were ordained as Archdeacons.","a":"Pakalomattom"}],"match":{"l":["Elishah","Eli","Naomi","Gentiles","St. Stephen","Acts 6 & 7","Prophets of Asherah"],"r":["AD 36","Be Courageous","Non-Jewish people","Priest and judge of Israel","Wife of Elimelech","Gathered on Mount Carmel","Son of Javan"],"key":[6,3,4,2,0,1,5]},"short":[{"q":"How did Judith get permission to stay in the camp of Holofernes?","a":"Judith lied to Holofernes that they had left the Hebrews because the Hebrews were about to sin against God and would then be handed over to him. She said she would remain with him but go out every night into the valley to pray, and would tell him when God revealed that they had sinned; he was pleased and let her do so.","ref":"Class VI textbook, Chapter 5 – The Brave Woman"},{"q":"What did the two travellers do after realising that Jesus had risen?","a":"They immediately got up and returned to Jerusalem. They found the eleven disciples gathered there praying together and told them everything that had happened, and the disciples also believed in the risen Lord.","ref":"Class VI textbook, Chapter 10 – Road to Emmaus"},{"q":"What is a vision? Name two persons of the Old Testament who had visions, as mentioned in the lesson.","a":"An experience of seeing something in a dream through the divine spirit is called a vision. Samuel, while sleeping, heard God call him and tell him about the hardships to happen in Israel and the destruction of Priest Eli's family; Joseph was shown a vision in his dream when he was a boy.","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"What did St. Thomas ask Jesus at the Last Supper? What does it show about him?","a":"When Jesus said, \"You know the way to the place where I am going,\" the disciples were quiet, but Thomas asked Jesus how they could know the way (St. John 14:5). It shows that Thomas had the desire and conviction to know the truth.","ref":"Class VI textbook, Church History, Lesson 4 – From the History of Blessed Apostles (St. Thomas)"}],"para":[{"q":"How did Boaz show kindness to Ruth? How did Ruth come into the genealogy of Jesus?","a":"Ruth went gleaning and came to the part of the field belonging to Boaz, a prominent and rich kinsman of Elimelech; Boaz allowed her not only to glean and gather the sheaves but also to drink water from the vessels of his young men; He blessed her for all she had done for her mother-in-law and for coming to a people she did not know before; He went to the city gate, met the elders and became her redeemer in the presence of the elders and all the people; Boaz married Ruth according to the religious rite of Israel, and God blessed them with a son, Obed; Obed was the father of Jesse, the father of David, and in this genealogy Jesus was born, so Ruth has a significant place in the genealogy of Jesus","ref":"Class VI textbook, Chapter 6 – Ruth"},{"q":"Explain the story of the crow and the fox and the story of the ants, and the lessons they teach.","a":"A girl told her friend her grandmother's story: ants walk in straight lines and birds fly one after the other because they have good obedience and discipline; If anyone goes away, it will not reach the destination, so we must have good obedience and discipline – the tree named this branch 'childhood'; Later a crow sat on the tree with a loaf of bread, and a hungry fox flattered her, calling her beautiful and asking her to sing; When the crow opened her mouth to caw, the bread fell and the fox snapped it up; The crow learned the lesson, \"Do not trust flatterers,\" and the tree named this branch 'adolescence'","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"},{"q":"Explain the Syrian Migration (AD 345).","a":"In AD 345 bishop Joseph of Edessa, some priests and Christian families from Syria travelled by ship under the leadership of a businessman, Thomas of Cana, and reached the port city of Kodungalloor; The Christians in Kerala, who had no proper leadership or unified liturgy, welcomed them gladly and got a new awakening; Thomas of Cana presented gifts to the ruler Cheraman Perumal, who granted special statuses carved on copper plates ('Chepped') and tax-exempted land; In gratitude for help in a battle, the ruler also gifted wealth and slaves to the Christians; The successors of Thomas of Cana are called the 'Knananites'; As the bishop and priests were admirers of the Throne of Antioch, Syrian liturgy flourished and the Christians came to be known as 'Syrian Christians'","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"essay":[{"q":"The Road to Emmaus – Jesus, the risen Lord, walks with us","a":"On the day of Jesus' resurrection, two people, one of them Cleopas, were going from Jerusalem to a village called Emmaus; They were talking about the death and resurrection of Jesus, and Jesus came near and went with them, but they did not recognise him; They told him that Jesus of Nazareth, a prophet mighty in deed and word, had been crucified, and that some women said he had risen; Jesus said, \"Was it not necessary that the Messiah should suffer these things and then enter into his glory?\"; As it was evening, they asked him to stay, and at the table he took bread, blessed and broke it, their eyes were opened and he vanished from their sight; They said their hearts were burning within them while he talked to them on the road; They returned to Jerusalem and told the eleven disciples, who also believed in the risen Lord; This teaches that Jesus is the risen God who lives even today, and walks along with us, loving and caring for us","ref":"Class VI textbook, Chapter 10 – Road to Emmaus"},{"q":"A glimpse of the history of the Malankara Church from AD 52 to AD 1653","a":"AD 52: Apostle St. Thomas reached Kerala and led many to Christian faith, so Christianity began here; AD 345: In the Syrian Migration, bishop Joseph of Edessa and Thomas of Cana arrived, and the Malankara Christians accepted the Syrian liturgy and the spiritual leadership of Antioch; Until the 16th century the Church was administered by Archdeacons from the Pakalomattom family under the Antiochene prelates; AD 1498: The Portuguese arrived when Vasco Da Gama reached Calicut and tried to bring the Church under Rome; AD 1599: Menezes, Archbishop of Goa, held the Synod of Diamper and enforced the supremacy and tradition of the Roman Catholic Church; The Portuguese murdered Mor Ahatallah, a metropolitan from the Throne of Antioch, by drowning him in the sea; AD 1653: Through the Oath of the Bent Cross at Mattancherry, the Syrian Christians denied the yoke of Roman supremacy; Thus, after half a century under Roman dominance, the Malankara Church regained its Syrian tradition","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}]}},{"no":5,"s":{"mcq":[{"q":"When the wadi dried up, God sent Elijah to which town, where a widow would feed him?","o":["Moab","Emmaus","Joppa","Zarephath"],"a":3},{"q":"For how many more days did Uzziah ask the people to hold out before surrendering the town?","o":["Forty days","Three days","Seven days","Five days"],"a":3},{"q":"What did Ruth go to do in order to find a livelihood in Bethlehem?","o":["Sell bread in the market","Look after sheep","Draw water at the well","Glean the heads of grain"],"a":3},{"q":"Which prayer did Stephen say while he was being stoned?","o":["Lord Jesus, receive my spirit.","Answer me, O Lord.","Lord, have mercy on me.","My help comes from the Lord."],"a":0},{"q":"Which event of AD 345 paved the way for a proper church structure (ecclesiastical structure) in Kerala?","o":["The Synod of Diamper","The Syrian Migration","The Oath at the Bent Cross","The arrival of the Portuguese"],"a":1},{"q":"Whom did Philip invite to Jesus after receiving his call?","o":["Stephen","Cleopas","His friend Nathaniel","His brother Andrew"],"a":2}],"name":[{"q":"The mountain where Elijah faced the prophets of Baal.","a":"Mount Carmel"},{"q":"The person whom Judith sent to call the elders of the town.","a":"Her maid"},{"q":"The person who said \"Go, my daughter\" when Ruth wanted to go for gleaning.","a":"Naomi"},{"q":"The one of the two travellers to Emmaus whose name is given in the lesson.","a":"Cleopas"},{"q":"The place where, during the Last Supper, Jesus said, \"I will come again and will take you to myself.\"","a":"The Mansion of Jerusalem"},{"q":"About how long the Malankara Church was under the clutches of Roman dominance before the Oath at the Bent Cross.","a":"Half a century (about 50 years)"}],"tf":[{"q":"When the Jews observe the Passover (Pesaha), they leave an empty chair for Elijah.","a":true},{"q":"Ruth was an Israelite woman from Bethlehem.","a":false},{"q":"The Greeks (Hellenists) complained that their widows were neglected in the daily distribution of food.","a":true},{"q":"Menezes allowed the Malankara Church to keep its Syrian liturgy.","a":false}],"fill":[{"q":"The fire of the LORD fell and consumed the burnt offering, the wood, the stones and the dust, and even licked up the ______ in the trench.","a":"water"},{"q":"Having prayed to God, Judith took Holofernes' ______ that was hung there and cut off his head.","a":"sword"},{"q":"\"Rejoice in that day and leap for joy, for surely your reward is great in ______.\" (St. Luke 6:23)","a":"heaven"},{"q":"The wise man gave the young man a teaspoon that held two drops of ______.","a":"oil"},{"q":"The Synod of Diamper was convened on 20 June 1599 at Diamper, also called ______.","a":"Udayamperoor"}],"match":{"l":["Malachi 4:5,6","Bethlehem in Judah","St. Luke 24:13-35","Two parrots","St. Luke 12:16-21","Jordan River","St. Thomas"],"r":["Story of the lazy sons","Home town of Elimelech","Prophecy of Elijah's return","Apostle of India","Road to Emmaus","Partial growth is dangerous","John the Baptist"],"key":[2,1,4,0,5,6,3]},"short":[{"q":"What did Ruth say to Naomi when Naomi asked her to go back to her people?","a":"Ruth clung to Naomi and said, \"Entreat me not to leave you... wherever you go, I will go; and wherever you lodge, I will lodge; your people shall be my people, and your God, my God.\" From these words we realise the depth of her confession of faith in the True God.","ref":"Class VI textbook, Chapter 6 – Ruth"},{"q":"What did Stephen see and say when he gazed into heaven? How did the people react?","a":"Filled with the Holy Spirit, Stephen gazed into heaven and said, \"I see the heavens opened and the Son of Man standing at the right hand of God!\" The people rushed together against him, dragged him out of the city and began to stone him.","ref":"Class VI textbook, Chapter 12 – Be Courageous"},{"q":"What did Rev. Fr. Shibu Kuttiparachel do? What does his example teach us?","a":"Rev. Fr. Shibu Kuttiparachel from Wayanad donated one of his kidneys to a Muslim lady, saying, \"My life is not only for myself, but for others too.\" His example teaches us to pour the love of Jesus upon everyone irrespective of religion or caste.","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"What did St. Philip realise from Jesus' reply? Where did he preach after the death of Stephen?","a":"From Jesus' reply, Philip realised that in order to see and know Jesus, one has to observe and follow Him, and he started to propagate the gospel. After the death of St. Stephen in AD 36, Philip went to Samaria and preached the gospel of Christ there.","ref":"Class VI textbook, Church History, Lesson 4 – From the History of Blessed Apostles (St. Philip)"}],"para":[{"q":"Who was Elijah? Why did God appoint him?","a":"Elijah was a great prophet whom God appointed to strengthen and sustain His people when the Israelites were struggling with difficulties; He is mentioned many times in the New Testament and is known as a prophet of miracles; Ahab, king of Israel, influenced by his wife Isabel, forsook the true God and started to worship Baal; Ahab persecuted the Israelites, and gradually many of them became devotees of Baal; God appointed Elijah to stop this movement and lead the Israelites on the right path; Elijah is also known as the intercessor for those who struggle from natural calamities","ref":"Class VI textbook, Chapter 4 – Elijah, the Lamp"},{"q":"Explain the story of the tree's 'old age' branch – the secret of happiness.","a":"Two old men sat under the tree, and one told the story of a young man searching for the 'secret of happiness'; A wise man in a beautiful castle asked him to look around the palace for two hours, carrying a teaspoon with two drops of oil without spilling it; Keeping his eyes fixed on the spoon, the boy observed nothing of the palace; Sent back to observe the marvels, he saw everything, but the oil was gone; The wise man said the secret of happiness is to see all the marvels of the world and never forget the drops of oil on the spoon – one needs both physical growth and spiritual enrichment; The tree named this branch 'old age'","ref":"Class VI textbook, Chapter 13 – Moral Lesson: Integral Growth"},{"q":"Who were the Archdeacons? How did the Portuguese take control over them?","a":"Until the 16th century, the Malankara Church was administered by Archdeacons under the spiritual leadership of the Antiochene prelates; They had their own soldiers, yet they were not bishops, and pointed headgear was their peculiarity; Only people from the renowned Pakalomattom family were ordained as Archdeacons, and Archdeacon Geevarghese was the leader at that time; The Portuguese, who arrived in AD 1498, wanted to bring the Malankara Church under the custom of the Roman Church; In AD 1597, after the demise of Mor Abraham, Menezes, the Roman Catholic Archbishop of Goa, took control over the Archdeacons; He then summoned the Synod of Diamper (1599) and appointed one of his own admirers as Archdeacon","ref":"Class VI textbook, Church History, Lesson 3 – Malankara Church"}],"essay":[{"q":"All are one in Christ – the message of St. Peter's vision","a":"St. Peter, the head of the apostles, was innocent, brave and courageous, loved Jesus very much and was a good leader; When the early church began to flourish, many thought only the Jewish should be converted, and Peter was criticised for eating with the Gentiles; He explained his vision at Joppa: a large sheet let down from heaven by its four corners, with four-footed animals, beasts of prey, reptiles and birds; A voice said, \"Get up, Peter; kill and eat,\" and when he refused it said, \"What God has made clean, you must not call profane\" – three times; Three men came from Caesarea, and the Spirit told Peter to go with them and not to make a distinction between them and us; As Peter spoke, the Holy Spirit fell upon the Gentiles just as it had upon the apostles; Through this vision the gospel was preached throughout the world and non-Jewish people could become followers of Christ; Like Fr. Shibu Kuttiparachel, we must pour the love of Jesus on everyone irrespective of religion or caste and be witnesses for Christ","ref":"Class VI textbook, Chapter 11 – The Great Sheet from the Heaven"},{"q":"Courage through faith in God – Judith and Joan of Arc","a":"Joan of Arc, a French girl of the fifteenth century, courageously took over the leadership of the French army with strong faith in God and became a martyr at 19; She proved that depending on God's power relieves the fear of failure more than depending on one's own ability; Long before her, when Holofernes seized Israel's water supply, the people wanted to surrender the town; Judith, a God-fearing widow, told the elders not to put God to the test but to call upon Him and give thanks; Trusting God, she went with her maid to the camp of Holofernes; After praying and strengthening herself, she cut off the head of the drunken Holofernes with his own sword and returned to Israel; The Israelites were saved, and Judith came to be known as the 'brave woman'; Both teach us: \"Be fearful to God; then God will be gracious,\" and depend upon God during trials and tribulations","ref":"Class VI textbook, Chapter 5 – The Brave Woman"}]}}]},{"c":"VII","sections":[{"n":"Old Testament","units":[{"t":"Chapter 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God","q":[["Who declared liberation for the Jews from the captivity in Babylon?",["Ahasuerus","Cyrus","Darius","Artaxerxes"],1,"QP 2013 (Kerala), QP 2018, QP 2019, QP 2021"],["What did Cyrus ask the Jews who did not want to go back to Jerusalem to do?",["Pay a special tax to the king","Donate gold, silver, cattle etc. for building God's temple","Join the Persian army","Build a wall around Babylon"],1,""],["Who was the leader of the group who first returned to Jerusalem?",["Nehemiah","Artaxerxes","Serubabel"
