/* ---------- PAPERS ---------- */
function pattern(c) {
  const n = ROMAN.indexOf(c);
  if (n <= 3) return { time: '1 hour', marks: 40, secs: [
    ['mcq', 'Choose the correct answer from the options given: (1 mark each)', 4], ['name', 'Name the following: (1 mark each)', 4],
    ['tf', 'State whether the following statements are True or False: (1 mark each)', 4], ['fill', 'Fill in the blanks (1 mark each)', 4],
    ['short', 'Answer the following in one or two sentences (1 mark each)', 3], ['detail', 'Answer the following in detail (Any 2) (3 marks each)', 6],
    ['song', 'Complete the following song (Oral)', 5], ['prayer', 'Complete the following prayer (oral)', 5], ['speech', 'Speech (Choose any 1)', 5]] };
  if (n <= 9) return { time: '1.5 hours', marks: 60, secs: [
    ['mcq', 'Choose the correct answer from the options given: (1 mark each)', 6], ['name', 'Name the following: (1 mark each)', 6],
    ['tf', 'State whether the following statements are True or False: (1 mark each)', 4], ['fill', 'Fill in the blanks (1 mark each)', 5],
    ['match', 'Match the following (1 mark each)', 7], ['short', 'Answer the following in two or three sentences (2 marks each)', 8],
    ['para', 'Write the answer in a paragraph (choose any two, 4 marks each)', 8], ['song', 'Complete the following song', 5],
    ['prayer', 'Complete the following prayer (oral)', 6], ['essay', 'Write an essay on the following topic (choose any one)', 5]] };
  return { time: '2.5 hours', marks: 100, secs: [
    ['mcq', 'Choose the correct answer from the options given: (1 mark each)', 10], ['name', 'Name the following: (1 mark each)', 10],
    ['tf', 'State whether the following statements are True or False: (1 mark each)', 10], ['fill', 'Fill in the blanks (1 mark each)', 10],
    ['match', 'Match the following (1 mark each)', 10], ['who', 'Who said to whom (2 marks each)', 6],
    ['short', 'Write the answer in two or three sentences (2 marks each)', 8], ['para', 'Write the answer in a paragraph (any three - 4 marks each)', 12],
    ['song', 'Complete the following song', 6], ['prayer', 'Complete the following prayer', 8], ['essay', 'Write an essay on the following topic (choose any two - 5 marks each)', 10]] };
}
const A = (show, html) => show ? `<div class="ans"><b>Answer:</b>${html}</div>` : '';
const LONG = new Set(['short', 'detail', 'para', 'essay', 'speech', 'who']);
const pts = a => { const p = String(a || '').split(/;\s+/).filter(Boolean); return p.length > 1 ? `<ul class="pts">${p.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ' ' + esc(a); };
const LA = (show, q) => show ? `<div class="ans"><b>Answer:</b>${pts(q.a)}${q.ref ? `<div class="ref">Textbook: ${esc(q.ref)}</div>` : ''}</div>` : '';
const REFNOTE = '<div class="refnote"><b>Note:</b> These answers are short guides taken from the textbook. Read the chapter in your textbook for the detailed answer, and expand your answer as given in the textbook to score full marks.</div>';
function paperBody(c, p, show) {
  const pat = pattern(c); const s = p.s;
  return pat.secs.map(([t, title, mk], i) => {
    const items = s[t]; let body = '';
    if (t === 'mcq') body = items.map((q, j) => `<div class="pq"><span class="no">${j + 1})</span><span>${esc(q.q)}</span><div class="po">${q.o.map((o, k) => `<span>${'abcd'[k]}. ${esc(o)}</span>`).join('')}</div>${A(show, ` ${'abcd'[q.a]}. ${esc(q.o[q.a])}`)}</div>`).join('');
    else if (t === 'tf') body = items.map((q, j) => `<div class="pq"><span class="no">${j + 1})</span><span>${esc(q.q)}</span>${A(show, q.a ? ' True' : ' False')}</div>`).join('');
    else if (t === 'match') body = `<div style="overflow-x:auto"><table class="mt"><thead><tr><th>Column A</th><th>Column B</th>${show ? '<th>Answer</th>' : ''}</tr></thead><tbody>${items.l.map((l, j) => `<tr><td>${j + 1}) ${esc(l)}</td><td>${'abcdefghij'[j]}) ${esc(items.r[j])}</td>${show ? `<td style="color:var(--ok);font-weight:600">${j + 1} – ${'abcdefghij'[items.key[j]]}<br><span style="font-weight:400;color:var(--ink)">${esc(items.r[items.key[j]])}</span></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    else if (t === 'song' || t === 'prayer') body = `<p class="placeholder">${t === 'song' ? 'Song' : 'Prayer'} to be set by the Sunday School (oral).</p>`;
    else if (t === 'speech' || t === 'essay') body = (items || []).map((q, j) => `${j ? '<p style="margin:6px 0 0;font-weight:700;font-style:italic">OR</p>' : ''}<div class="pq"><span class="no">${j + 1})</span><span>${esc(q.q)}</span>${LA(show, q)}</div>`).join('');
    else body = (items || []).map((q, j) => `<div class="pq"><span class="no">${j + 1})</span><span>${esc(q.q)}</span>${LONG.has(t) ? LA(show, q) : A(show, ' ' + esc(q.a))}</div>`).join('');
    return `<section class="psec"><div class="psec-h"><span>${ROMAN[i + 1]}.</span><span>${esc(title)}</span><span class="mk">${mk} marks</span></div>${body}</section>`;
  }).join('');
}
function keyBody(c, p) {
  const pat = pattern(c); const s = p.s;
  return `<div class="keylist">${pat.secs.map(([t, title], i) => {
    const items = s[t]; let inner = '';
    const short = title.replace(/\s*\(.*$/, '').replace(/:$/, '');
    if (t === 'mcq') inner = `<ol>${items.map(q => `<li>${'abcd'[q.a]}. ${esc(q.o[q.a])}</li>`).join('')}</ol>`;
    else if (t === 'tf') inner = `<div class="inline-key">${items.map((q, j) => `<span>${j + 1}) ${q.a ? 'True' : 'False'}</span>`).join('')}</div>`;
    else if (t === 'match') inner = `<div class="inline-key">${items.l.map((l, j) => `<span>${j + 1} – ${'abcdefghij'[items.key[j]]}</span>`).join('')}</div>`;
    else if (t === 'song' || t === 'prayer') inner = `<p class="placeholder" style="margin:0">Oral – assessed by the teacher</p>`;
    else if (LONG.has(t)) inner = `<ol>${(items || []).map(q => `<li>${pts(q.a)}${q.ref ? `<div class="ref">Textbook: ${esc(q.ref)}</div>` : ''}</li>`).join('')}</ol>`;
    else inner = `<ol>${(items || []).map(q => `<li>${esc(q.a)}</li>`).join('')}</ol>`;
    return `<div class="keyblock"><h4>${ROMAN[i + 1]}. ${esc(short)}</h4>${inner}</div>`;
  }).join('')}</div>`;
}
function showPaper(c, set, view) {
  setLast({ screen: 'paper', c, set, view });
  const d = clsData(c); const p = d.papers.find(x => x.no === set); const pat = pattern(c);
  $app.innerHTML = topbar(`Sample paper · Set ${set}`, `Class ${c} · ${pat.marks} marks · ${pat.time}`, () => showHub(c, 'sp')) + `
  <main class="wrap stack" style="padding-bottom:16px">
    <div class="seg" role="tablist">
      <button role="tab" data-v="paper" aria-selected="${view === 'paper'}">Question paper</button>
      <button role="tab" data-v="ans" aria-selected="${view === 'ans'}">With answers</button>
      <button role="tab" data-v="key" aria-selected="${view === 'key'}">Answer key</button>
    </div>
    <article class="paper">
      <div class="paper-h"><img src="${LOGO}" alt=""><span class="org">Malankara Jacobite Syrian<br>Sunday School Association</span><span class="note">Bangalore Diocese</span><span class="exam">Annual Examination - 2026</span></div>
      <div class="paper-meta"><span>Time: ${pat.time}</span><span>Sample question paper – Set ${set}</span><span>Total Marks: ${pat.marks}</span></div>
      <div class="paper-cls">CLASS – ${c}</div>
      ${view !== 'paper' ? REFNOTE : ''}
      ${view === 'key' ? keyBody(c, p) : paperBody(c, p, view === 'ans')}
    </article>
  </main>
  <nav class="bottom"><div class="wrap">
    <button class="btn btn-ghost" id="p-prev" ${set === 1 ? 'disabled' : ''}>← ${set > 1 ? 'Set ' + (set - 1) : 'Previous set'}</button>
    <button class="btn btn-primary" id="p-next" ${set === d.papers.length ? 'disabled' : ''}>${set < d.papers.length ? 'Set ' + (set + 1) : 'Next set'} →</button>
  </div></nav>`;
  wireTop(() => showHub(c, 'sp'));
  $app.querySelectorAll('.seg button').forEach(b => b.onclick = () => showPaper(c, set, b.dataset.v));
  document.getElementById('p-prev').onclick = () => showPaper(c, set - 1, view);
  document.getElementById('p-next').onclick = () => showPaper(c, set + 1, view);
  scrollTo(0, 0);
}

showWelcome();
