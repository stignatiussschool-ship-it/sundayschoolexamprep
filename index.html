d Manoah","Elijah and Jehu","Priest Zadok and Prophet Nathan"],"a":3},{"q":"What was the name of Lazarus' village?","o":["Bethany","Galilee","Jerusalem","Jericho"],"a":0},{"q":"Name the Pharisee who invited Jesus to his house for a feast.","o":["Simon","Lazarus","Ahab","Elijah"],"a":0},{"q":"Who is the first Christian martyr?","o":["St. Peter","Mor Behanam","St. Stephen","St. Thomas"],"a":2}],"name":[{"q":"Name the first plague God sent upon Egypt.","a":"Water turned to blood"},{"q":"Name the wife of King Ahab.","a":"Jezebel"},{"q":"Who was Samson's lady love who cheated him for a bribe?","a":"Delilah"},{"q":"Name the sisters of Lazarus.","a":"Martha and Mary"},{"q":"Name the man in the Bible whom God called 'righteous', whose life was a mixture of happiness and sadness.","a":"Job"},{"q":"Name the island to which St. John the Apostle was exiled.","a":"Patmos"}],"tf":[{"q":"King Pharaoh had become disgusted because of the plagues.","a":true},{"q":"Solomon asked God for wealth and a long life.","a":false},{"q":"St. John the Apostle was crucified upside down.","a":false},{"q":"When we share our happiness, it will increase twice.","a":true}],"fill":[{"q":"\"Your sins are ______; your faith has saved you; go in peace.\"","a":"forgiven"},{"q":"______ requested King David to let her son Solomon be the next king.","a":"Bathsheba"},{"q":"Naboth was stoned to death on the false charge that he had cursed God and the ______.","a":"king"},{"q":"Samson tore apart a young lion with his bare hands near the vineyards of ______.","a":"Timnah"},{"q":"St. John the Apostle gave ______ a shelter in his house.","a":"St. Mary"}],"match":{"l":["Ahab","Naboth","Manoah","Dagon","Minikutty","Lazarus","Job"],"r":["King of Israel","Four days in the tomb","God of the Philistines","Blessed twice as much","Vineyard near the palace","Sad in Molly Teacher's class","Father of Samson"],"key":[0,4,6,2,5,1,3]},"short":[{"q":"After the ten plagues, what did Pharaoh say to Moses and Aaron?","a":"King Pharaoh had become disgusted because of the plagues, so he called Moses and Aaron. He told them, \"Rise up, go away from my people, both you and the Israelites! Go, worship the Lord, as He said to you. And bring a blessing on me too.\"","ref":"Class IV textbook, Chapter 3 – Ten Plagues"},{"q":"Write any two examples of the divine power given to Samson.","a":"God gave Samson great strength: near the vineyards of Timnah he tore apart a young lion with his bare hands. On another occasion he killed a thousand Philistines with the jawbone of a donkey. (Other examples: he set three hundred foxes with torches into the Philistines' grain; God gave him water from a hollow place.)","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"Jesus told his disciples that he was glad he was not in Bethany when Lazarus died. Why?","a":"Jesus told the disciples plainly, \"Lazarus is dead. For your sake I am glad I was not there, so that you may believe.\" He wanted them to believe by seeing the glory of God when Lazarus was raised.","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"},{"q":"Why do we observe Sunday as the day of worship?","a":"Our Lord Jesus Christ rose from the dead on Sunday, the first day of the week, and it was mostly on Sundays that he appeared to his disciples. The day of Pentecost, when the Holy Spirit came on the apostles, was also a Sunday. So the Church teaches us to observe Sunday as the Lord's Day.","ref":"Class IV textbook, True Faith – Holy Qurbano"}],"para":[{"q":"What was the reason for Samson's defeat?","a":"Samson forgot God and lived his life in wicked ways; he married women from other castes, and they cheated him; Delilah, his lady love in the valley of Sorek, took a bribe from the Philistines; she tried various ways and at last he told her the secret of his power; she let him sleep on her lap and shaved off the seven locks of his hair; God forsook him and he lost his divine power","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"How did the sinful woman treat Jesus in Simon's house?","a":"She came to Simon's house with an alabaster jar full of costly ointment of nard; weeping deeply for her sins, she sat at Jesus' feet; she bathed his feet with her tears and dried them with her long hair; she kept on kissing his feet; she opened the jar and anointed his feet with the ointment; Jesus forgave her sins and said, \"Your faith has saved you, go in peace\"","ref":"Class IV textbook, Chapter 11 – Forgiveness to a Sinful Woman"},{"q":"Why did God become angry with Solomon in his last days?","a":"Being the richest and most powerful king, Solomon slowly forgot God and lived in cosy ways; he violated God's commands and sinned against Him; he built temples for other gods and worshipped them; he put heavy taxes on the people, so they began to hate their king; he married women of different religions and castes; so God's anger came on him – he died at the age of 60 and his kingdom was divided","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"}],"essay":[{"q":"The ten plagues: list them and explain why God sent them.","a":"God decided to rescue the Israelites from the bondage of Pharaoh; He sent Moses and Aaron to tell His command to Pharaoh; God said, \"I will send ten plagues to Pharaoh, to his people and to his entire land\"; the first plagues were water turned to blood, frogs, gnats, flies and disease on the animals; then came boils, thunder and hail, locusts, darkness and the death of the firstborn; God sent them to change Pharaoh's mind and turn him towards God; He wanted to free the Israelites so that they would worship Him alone; disgusted by the plagues, Pharaoh told Moses and Aaron, \"Rise up, go away from my people… Go, worship the Lord\"","ref":"Class IV textbook, Chapter 3 – Ten Plagues"},{"q":"The story of Naboth's vineyard – \"The wages of sin is death\".","a":"Ahab, king of Israel, lived away from God doing idol worship, and his wife Jezebel killed many prophets of God; Ahab wanted Naboth's vineyard near his palace for a vegetable garden; Naboth refused: \"This land is my ancestral inheritance. The Lord forbids me giving it to you\"; Jezebel made the elders and nobles give false witness that Naboth had cursed God and the king, and he was stoned to death; when the king took the vineyard, Elijah warned that dogs would lick up Ahab's blood where they had licked Naboth's; Ahab was killed in the battle against the Arameans and dogs licked up his blood in his chariot; by King Jehu's command Jezebel was thrown down from the palace and dogs ate her flesh; this shows that \"The wages of sin is death\" (Romans 6:23)","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"}]}},{"no":2,"s":{"mcq":[{"q":"What was the last (tenth) plague?","o":["Boils","Death of the firstborn","Darkness","Locusts"],"a":1},{"q":"With what did Samson kill a thousand Philistines?","o":["The jawbone of a donkey","A stone","A sword","A spear"],"a":0},{"q":"Who is known as the wisest of the wise men?","o":["Jacob","Noah","Isaac","Solomon"],"a":3},{"q":"When Jesus reached Bethany, how many days had Lazarus been in the tomb?","o":["Four","Seven","Two","Three"],"a":0},{"q":"With what did the sinful woman dry Jesus' feet?","o":["Her long hair","Her veil","A cloth","A towel"],"a":0},{"q":"Which apostle is known as the 'Apostle of Love'?","o":["St. Thomas","St. Paul","St. Peter","St. John"],"a":3}],"name":[{"q":"Who was the king of Egypt to whom God sent the ten plagues?","a":"Pharaoh"},{"q":"Name the father of Samson.","a":"Manoah"},{"q":"Name the prophet whom God sent to warn King Ahab.","a":"Elijah"},{"q":"How many debtors were there in the story Jesus told Simon?","a":"Two"},{"q":"Name the flower Molly Teacher used to show that our life has both joy and sorrow.","a":"Rose"},{"q":"Name the apostle who was the first among the apostles and established the Holy Throne at Antioch.","a":"St. Peter"}],"tf":[{"q":"Solomon died at the age of 60 and his kingdom got divided.","a":true},{"q":"Simon the Pharisee washed Jesus' feet and anointed him with oil.","a":false},{"q":"Jesus wept when he saw Mary and the people weeping.","a":true},{"q":"The day of Pentecost, when the Holy Spirit came on the apostles, was a Saturday.","a":false}],"fill":[{"q":"God entrusted Moses and ______ to tell His command to Pharaoh.","a":"Aaron"},{"q":"Samson hid himself for a long time in a cleft of the rock of ______.","a":"Etam"},{"q":"Hiram, the king of ______, provided the wood for the House of the Lord.","a":"Tyre"},{"q":"\"The wages of sin is ______.\" (Romans 6:23)","a":"death"},{"q":"\"The Lord gave, and the Lord has ______; blessed be the name of the Lord.\"","a":"taken away"}],"match":{"l":["Jezebel","Jehu","Delilah","Solomon","Simon","Kepha","Robin"],"r":["Pharisee","Ecclesiastes","Spoiled by bad friendship","Rock","Valley of Sorek","Ruled Israel after Ahab","Queen"],"key":[6,5,4,1,0,3,2]},"short":[{"q":"How did Naboth reply when King Ahab asked for his vineyard?","a":"Naboth replied, \"This land is my ancestral inheritance. The Lord forbids me giving it to you.\" Hearing this, the king went home resentful and sullen.","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"},{"q":"What did Solomon ask God for? How did God respond?","a":"Solomon asked God for an understanding mind to govern His people and to discern between good and evil – a wise and discerning heart. Since he did not ask for wealth or long life, God was pleased and granted him every other blessing too.","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"},{"q":"When Jesus said, \"Let us go to Judea again,\" what did the disciples say, and how did Jesus reply?","a":"The disciples said, \"Rabbi, the Jews were just now trying to stone you, and are you going there again?\" Jesus replied that those who walk during the day do not stumble because they see the light of this world, but those who walk at night stumble because the light is not in them.","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"},{"q":"Write any two things St. John did for Jesus and His mother.","a":"St. John witnessed the crucifixion of Jesus. He also gave St. Mary, the mother of Jesus, a shelter in his house.","ref":"Class IV textbook, True Faith – Saint Apostles (St. John, the Apostle)"}],"para":[{"q":"Describe the end of Samson's life.","a":"The Philistines seized Samson, bound him with bronze shackles and gouged out both his eyes; they tied him to a pillar in the temple of their god Dagon; Samson remembered God and pleaded for his strength back one more time; God had mercy and the divine power came back to him; he grasped the two middle pillars and leaned his weight against them, and the temple fell; three thousand Philistines were crushed under it, and Samson also died with them","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"How did Jezebel get Naboth's vineyard for King Ahab?","a":"When Naboth refused, King Ahab lay on his bed, turned away his face and would not eat; Jezebel asked why he was so depressed and promised to give him what he wanted; she played a wicked trick and organised the elders and nobles; they gave false witness in the king's court that Naboth had cursed God and the king; no one spoke for Naboth and he was stoned to death; then the king took possession of the vineyard","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"},{"q":"What do we learn from the life of Job about happiness and sadness?","a":"Job's life was a mixture of happiness and sadness, and God called him 'righteous'; he had plenty of servants and wealth, but his animal wealth was carried off by robbers; in his loss he said, \"Naked I came from my mother's womb, and naked shall I return there, the Lord gave, and the Lord has taken away, blessed be the name of the Lord\"; he praised God both in his happiness and in his sadness; as a reward, the Lord gave Job everything twice as much as he had before; we too should praise Jesus, our true friend, in happiness and in sadness","ref":"Class IV textbook, Chapter 13 – Happiness and Sadness"}],"essay":[{"q":"Jesus raises Lazarus to life.","a":"Lazarus of Bethany, whom Jesus loved, was very sick, and his sisters Martha and Mary sent word to Jesus; Jesus said, \"This illness does not lead to death, rather it is for God's glory\"; when Jesus reached Bethany, Lazarus had already been in the tomb for four days; Martha said, \"Lord, if you had been here, my brother would not have died\"; Jesus said, \"I am the resurrection and the life\", and Martha believed he was the Messiah, the Son of God; seeing Mary and the people weeping, Jesus wept and came to the tomb, a cave with a stone against it; he asked them to take away the stone, thanked the Father, and cried with a loud voice, \"Lazarus, come out!\"; Lazarus came out bound with strips of cloth, Jesus said, \"Unbind him, and let him go\", and everyone believed in Jesus","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"},{"q":"How can we use the wisdom and power God gives us? (Learn from Samson and Solomon.)","a":"God gave Samson unhuman strength – he tore a lion apart, burnt the Philistines' grain with three hundred foxes and killed a thousand Philistines with a donkey's jawbone; God gave Solomon a wise and discerning heart and every other blessing; Solomon used his God-given wisdom and wealth to build the Jerusalem Temple, his father David's dream; but Samson forgot God, kept wicked company and lost his power when his hair was shaved; Solomon too forgot God, worshipped other gods, and his kingdom was divided; wisdom, knowledge and power are gifts of God, and we must use them only according to His will and for His glory; we must get away from sins and bad friendship and be dependent on God","ref":"Class IV textbook, Chapter 4 – The Brave Judge; Chapter 5 – Wisest of the Wise Men"}]}},{"no":3,"s":{"mcq":[{"q":"Which plague came right after 'Water turned to blood'?","o":["Frogs","Flies","Boils","Gnats"],"a":0},{"q":"How many foxes did Samson catch to burn the grain of the Philistines?","o":["Three thousand","One hundred","One thousand","Three hundred"],"a":3},{"q":"Solomon wrote about ______ from the cedar in Lebanon to the hyssop that grows in the walls.","o":["rivers","kings","wars","trees"],"a":3},{"q":"For how many years did King Ahab rule Israel?","o":["7 years","12 years","22 years","40 years"],"a":2},{"q":"What was in the sinful woman's alabaster jar?","o":["Water","Wine","Costly ointment of nard","Honey"],"a":2},{"q":"What reward did God give Job, who praised Him in happiness and in sadness?","o":["Three times as much as before","Everything twice as much as he had before","Half of what he had before","A great kingdom"],"a":1}],"name":[{"q":"How many plagues did God send upon Egypt?","a":"Ten"},{"q":"Who was the successor of King David?","a":"Solomon"},{"q":"King Ahab was killed in a battle against which people?","a":"The Arameans"},{"q":"Who said to Jesus, \"But even now I know that God will give you whatever you ask of Him\"?","a":"Martha"},{"q":"Who is the true friend always with us, in happiness and in sadness?","a":"Jesus Christ"},{"q":"Name the brother of St. Peter.","a":"Andrew"}],"tf":[{"q":"God sent the plagues so that Israel would be freed and worship Him alone.","a":true},{"q":"Samson's divine power rested on the seven locks of his hair.","a":true},{"q":"Naboth happily gave his vineyard to King Ahab.","a":false},{"q":"Jesus said that Lazarus' illness would lead to death.","a":false}],"fill":[{"q":"Samson was a judge of Israel for ______ years.","a":"twenty"},{"q":"\"The fear of the Lord is the beginning of ______.\"","a":"wisdom"},{"q":"Jesus said to Martha, \"I am the ______ and the life.\"","a":"resurrection"},{"q":"Simon thought, \"If this man was a ______, he would have known what kind of woman is touching him.\"","a":"prophet"},{"q":"St. Peter was persecuted by the Roman Emperor ______.","a":"Nero"}],"match":{"l":["Anjali Mariyam Mathew","Philistines","Zadok","Naboth","Lazarus","St. Peter","St. John"],"r":["Crucified upside down","Saved by prayer","Priest","Raised from the dead","Apostle whom Jesus loved most","Israelite","Enemies of Israel"],"key":[1,6,2,5,3,0,4]},"short":[{"q":"Why did God send the plagues upon Egypt?","a":"God sent the plagues to change the mind of Pharaoh and turn him towards God. Through them He wanted to free the Israelites from Pharaoh's bondage, so that they would worship Him alone.","ref":"Class IV textbook, Chapter 3 – Ten Plagues"},{"q":"What did the angel tell Samson's mother before he was born?","a":"The angel told Samson's mother not to drink wine or strong drink or eat anything unclean, because she would bear a son. No razor was to come on his head, for he would be a nazirite (one separated) to God, and he would begin to deliver Israel from the Philistines.","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"What did Jesus say to Simon about the sinful woman?","a":"Jesus said, \"Simon, you gave me no water for my feet, no kiss and no oil for my head; but she has bathed my feet with her tears, dried them with her hair, kissed them and anointed them with ointment.\" So her sins, which were many, were forgiven, because she had shown great love and repentance.","ref":"Class IV textbook, Chapter 11 – Forgiveness to a Sinful Woman"},{"q":"What reward did God give Job, and why?","a":"The Lord gave Job everything twice as much as he had before. This was because Job praised God both in his happiness and in his sadness, saying, \"The Lord gave, and the Lord has taken away; blessed be the name of the Lord.\"","ref":"Class IV textbook, Chapter 13 – Happiness and Sadness"}],"para":[{"q":"How did Solomon become the king of Israel?","a":"When King David was very old, he prayed to God for a successor; by Prophet Nathan's instruction, Bathsheba asked David to let her son Solomon be the next king, and he agreed; obeying the king, Priest Zadok and Prophet Nathan took the horn of oil from the Tent and anointed Solomon king of Israel; Solomon prayed humbly, \"I am only a little child, I do not know how to go out or come in\"; he asked God for an understanding mind to govern His people and to discern between good and evil","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"},{"q":"What was Elijah's warning to King Ahab, and how was it fulfilled?","a":"Elijah warned Ahab, \"As you have done against the Will of God, in the place where dogs licked up the blood of Naboth, dogs will also lick up your blood\"; after some years Ahab was killed in the battle against the Arameans; he died in his chariot and dogs licked up his blood; by order of King Jehu, Jezebel was thrown down from the upper room of the palace and died; dogs came and ate her flesh; thus the Will of God and the prophecy of Elijah were fulfilled","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"},{"q":"Describe what happened when Martha met Jesus near Bethany.","a":"Hearing that Jesus was coming, Martha ran to him and said, \"Lord, if you had been here, my brother would not have died\"; she added, \"But even now I know that God will give you whatever you ask of Him\"; Jesus said, \"Your brother will rise again\", and Martha said he would rise in the resurrection on the last day; Jesus said, \"I am the resurrection and the life, those who believe in me, even though they die, will live\"; Martha confessed, \"Yes, Lord, I believe that you are the Messiah, the Son of God\"","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"}],"essay":[{"q":"Samson – the brave judge.","a":"Samson was born in the tribe of Dan to Manoah after long years of waiting; an angel said he would be a nazirite to God, no razor would touch his head, and he would begin to deliver Israel from the Philistines; he was a judge of Israel for twenty years, and the Lord's spirit was with him; he tore apart a lion, burnt the Philistines' grain with three hundred foxes and killed a thousand Philistines with a donkey's jawbone; his divine power rested on the seven locks of his hair; he forgot God and lived in wicked ways, and Delilah took a bribe and shaved off his hair, so God forsook him; the Philistines bound him, gouged out his eyes and tied him in the temple of Dagon; he prayed, got his power back, pulled down the temple and died with three thousand Philistines – so we should never forget God or keep bad company","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"Sunday – the Lord's Day.","a":"Our Lord and Saviour Jesus Christ was resurrected on Sunday; Sunday is the first day of the week; it was mostly on Sundays that Jesus appeared to his disciples; the day of Pentecost was a Sunday; on that day the Holy Spirit descended on the apostles who were waiting for it; for these reasons the Church teaches us to observe Sunday as the Lord's Day, our day of worship","ref":"Class IV textbook, True Faith – Holy Qurbano"}]}},{"no":4,"s":{"mcq":[{"q":"What is the Bible reference for the chapter 'Ten Plagues'?","o":["Exodus 7 – 12","Judges 13 – 14","Genesis 11","1 Kings 21"],"a":0},{"q":"What did the Philistines do to Samson after his hair was shaved?","o":["They made him their king","They gave him gold","They gouged out his eyes and tied him to a pillar","They sent him back to his father"],"a":2},{"q":"Building the Jerusalem Temple was the lifelong dream of whom?","o":["King Saul","Moses","King David","Samuel"],"a":2},{"q":"Why did King Ahab want Naboth's vineyard?","o":["To build a temple","To keep his horses","To give it to Elijah","To make a vegetable garden near his house"],"a":3},{"q":"What did Jesus first tell his disciples about Lazarus?","o":["Our friend Lazarus has fallen asleep","Lazarus has gone to Judea","Lazarus is very rich","Lazarus is coming to meet us"],"a":0},{"q":"Why was Minikutty sad in Molly Teacher's class?","o":["Her friend left the school","She was ill","She lost her book","Her elder sister failed in the Year 10 exam"],"a":3}],"name":[{"q":"Which plague came just before the death of the firstborn?","a":"Darkness"},{"q":"How many Philistines were crushed when Samson pulled down the temple?","a":"Three thousand"},{"q":"Name any one book of the Bible written by Solomon.","a":"Proverbs"},{"q":"\"Your sins are forgiven.\" Whose sins did Jesus forgive in Simon's house?","a":"The sinful woman's"},{"q":"Which apostle wrote the Book of Revelation?","a":"St. John the Apostle"},{"q":"Who is known as Kothamangalam Bava?","a":"St. Yeldho Mor Baselios"}],"tf":[{"q":"Naboth's vineyard was near the palace of King Ahab.","a":true},{"q":"Solomon married only women who worshipped the true God.","a":false},{"q":"Martha said, \"Lord, already there is a stench because he has been dead four days.\"","a":true},{"q":"Job stopped praising God when he lost his wealth.","a":false}],"fill":[{"q":"The angel said Samson would be a ______ (one separated) to God from birth.","a":"nazirite"},{"q":"The Tabernacle of God was placed at the ______ in the Jerusalem Temple.","a":"Holy of Holies"},{"q":"\"Christ is the Lord of both the dead and the ______.\" (Romans 14:9)","a":"living"},{"q":"When we share our sorrows, they will ______ by half.","a":"decrease"},{"q":"St. Peter established the Holy Throne at Antioch in AD ______.","a":"37"}],"match":{"l":["Pharaoh","Gideon","Bathsheba","Elijah","Achen","Job","St. Paul"],"r":["Mother of Solomon","Called righteous by God","Earlier called Saul","King of Egypt","Vicar","A judge of Israel","Prophet"],"key":[3,5,0,6,4,1,2]},"short":[{"q":"What happened to Anjali Mariyam Mathew? What does her story teach us?","a":"Anjali Mariyam Mathew reached the door of death, but in a vision God told her that thousands of hearts on earth were praying for her, so she came back to life. Science and human capabilities had failed, but God gifted her life because of continuous prayer. It teaches us to pray first when problems and struggles come.","ref":"Class IV textbook, Chapter 3 – Ten Plagues"},{"q":"How did Delilah cheat Samson?","a":"Delilah, Samson's lady love in the valley of Sorek, took a bribe from the Philistines and tried various ways to know the secret of his power. At last he told her; she let him fall asleep on her lap and shaved off the seven locks of his hair, so God forsook him and he lost his power.","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"What did Jesus do at the tomb of Lazarus?","a":"Jesus told them to take away the stone, looked upward and thanked the Father for hearing him. Then he cried with a loud voice, \"Lazarus, come out!\" When Lazarus came out bound with strips of cloth, Jesus said, \"Unbind him, and let him go.\"","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"},{"q":"How did the Jews welcome their guests in Jesus' time?","a":"In Jesus' time, the Jews welcomed their guests by washing their feet and anointing them with fragrant oil. They also hugged and kissed their guests.","ref":"Class IV textbook, Chapter 11 – Forgiveness to a Sinful Woman"}],"para":[{"q":"Explain the three parts of the Jerusalem Temple and how it was built.","a":"Building the Jerusalem Temple was Solomon's most significant work and the lifelong dream of his father, King David; Hiram, the king of Tyre, provided all the wood for the House of the Lord; 1,53,500 labourers worked for seven years to complete it; it had three parts – the Holy of Holies, the Holy Place and the Outer Court; the Tabernacle of God was placed at the Holy of Holies; every material was finished at the quarry itself so that no sound of hammer, axe or iron tool was heard at the holy place","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"},{"q":"What lessons do we learn from the story of Naboth's vineyard?","a":"God punishes those who live against His will and persecute His prophets and the poor; greed for another's property led to false witness and murder; \"The wages of sin is death\" (Romans 6:23) – God destroys the greedy; we should never hurt our friends or grab their things; like a businessman who counts his profit and loss, we should think about the profit and loss of our spirit every night before going to bed","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"},{"q":"What did Molly Teacher teach the children about happiness and sadness?","a":"Our life is a mixture of happiness and sadness; there is a night for a day and a valley for a hill; the rose is beautiful and smells enchanting, but its stem has thorns; when we have small sorrows we should not be too depressed and sad; when we have delightful moments we should not be overwhelmed and prideful; Minikutty's sister, who could not write her Hindi exam because of a fractured arm, could still pass by writing the SAY exam","ref":"Class IV textbook, Chapter 13 – Happiness and Sadness"}],"essay":[{"q":"Solomon – the wisest of the wise men.","a":"When King David was old, Priest Zadok and Prophet Nathan anointed Bathsheba's son Solomon as king of Israel; Solomon humbly asked God not for wealth or long life but for a wise and discerning heart; God was pleased and granted him every other blessing too; his fame spread around the world – he wrote about trees, birds, animals, reptiles and fish; people came from all nations with valuable gifts to hear his wisdom; he built the Jerusalem Temple with wood from Hiram of Tyre, and 1,53,500 labourers worked on it for seven years; later, being rich and powerful, he forgot God, worshipped other gods, overtaxed his people and married women of other religions; God's anger came on him – he died at 60 and his kingdom was divided","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"},{"q":"Forgiveness to a sinful woman.","a":"Simon the Pharisee invited Jesus to his house for a feast, but did not wash his feet, kiss him or anoint him; a sinful woman came with an alabaster jar of costly ointment of nard and sat weeping at Jesus' feet; she bathed his feet with her tears, dried them with her hair, kissed them and anointed them; Simon thought, \"If this man was a prophet, he would have known what kind of woman is touching him\"; reading his mind, Jesus told him the story of a creditor who had two debtors; Jesus said her many sins were forgiven because she had shown great love and repentance; he told her, \"Your sins are forgiven, your faith has saved you, go in peace\"; she went back with a joyful and grateful heart – Jesus forgives a truly repentant heart","ref":"Class IV textbook, Chapter 11 – Forgiveness to a Sinful Woman"}]}},{"no":5,"s":{"mcq":[{"q":"Which of these was one of the ten plagues?","o":["Earthquake","Flood","Locusts","Fire from heaven"],"a":2},{"q":"In how many locks was Samson's hair arranged?","o":["Seven","Three","Five","Twelve"],"a":0},{"q":"Why was every material for the Jerusalem Temple finished at the quarry itself?","o":["To save money","So that no sound of hammer or iron tool would be heard at the holy place","Because there were no workers in Jerusalem","Because Hiram asked for it"],"a":1},{"q":"How was Naboth killed?","o":["He was killed with a sword","He was thrown into a river","He was burnt","He was stoned to death"],"a":3},{"q":"Martha said to Jesus, \"I believe that you are the ______, the Son of God.\"","o":["Prophet","Teacher","King of Israel","Messiah"],"a":3},{"q":"Who baptized Jesus in the river Jordan?","o":["St. Paul","St. Thomas","St. John the Baptist","St. Peter"],"a":2}],"name":[{"q":"Name the people whom God wanted to rescue from the bondage of Pharaoh.","a":"The Israelites"},{"q":"With what did the Philistines bind Samson?","a":"Bronze shackles"},{"q":"Name the king who built the Jerusalem Temple.","a":"Solomon"},{"q":"Whom did Jezebel use to give false witness against Naboth?","a":"The elders and nobles"},{"q":"When Lazarus came out of the tomb, what did Jesus tell the people to do?","a":"\"Unbind him, and let him go.\""},{"q":"Which saint is lovingly called the Valiya Thirumeni of Aluva?","a":"St. Paulose Mor Athanasius"}],"tf":[{"q":"Pharaoh let the Israelites go as soon as the first plague came.","a":false},{"q":"Delilah received a bribe from the Philistines.","a":true},{"q":"King Ahab died in his chariot and dogs licked up his blood.","a":true},{"q":"When Jesus came to Bethany, Lazarus had been in the tomb for only two days.","a":false}],"fill":[{"q":"\"There is salvation in no one else, for there is no other ______ under heaven given to men by which we must be saved.\" (Acts 4:12)","a":"name"},{"q":"The labourers worked for ______ years to complete the Jerusalem Temple.","a":"seven"},{"q":"After Naboth refused, King Ahab lay down on his bed, turned away his face and would not ______.","a":"eat"},{"q":"The sinful woman bathed Jesus' feet with her ______.","a":"tears"},{"q":"The Holy Spirit came on the apostles on the day of ______, which was a Sunday.","a":"Pentecost"}],"match":{"l":["Egypt","Samson","Solomon","Jezebel","Mary","Simon","Mor Behanam"],"r":["Sister Sarah","Knelt at Jesus' feet","Wise and discerning heart","Land of the ten plagues","The brave judge","Gave Jesus no water for his feet","Thrown down from the upper room"],"key":[3,4,2,6,1,5,0]},"short":[{"q":"What did God tell Moses and Aaron when He decided to send the plagues?","a":"God told Moses and Aaron, \"Now you know that I am the Lord. I will send ten plagues to Pharaoh, to his people and to his entire land.\" He said He had decided to save His people Israel so that they would worship Him alone.","ref":"Class IV textbook, Chapter 3 – Ten Plagues"},{"q":"What did King Ahab wish to get? Why?","a":"King Ahab wanted the vineyard of Naboth, which was near his palace. He wanted to make it a vegetable garden because it was near his house.","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"},{"q":"Why did people come from all nations to Solomon?","a":"God gave Solomon great wisdom, and his fame spread throughout the world; he wrote about trees, from the cedar of Lebanon to the hyssop, and about birds, animals, reptiles and fish. So people came from all the nations, even with valuable gifts, to hear the wisdom of Solomon.","ref":"Class IV textbook, Chapter 5 – Wisest of the Wise Men"},{"q":"When Jesus heard that Lazarus was sick, what did he say?","a":"Jesus said, \"His illness does not lead to death; rather it is for God's glory, so that the Son of God may be glorified through it.\" Then he told his disciples, \"Come, let us go to Judea again.\"","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"}],"para":[{"q":"What lesson do we learn about bad friendship from the story of Samson?","a":"Robin was a good, loving boy, but his bad friends made him a drug addict and he was arrested; likewise Samson had great power from God but forsook the Lord and got into a group of wicked men; he married women from other castes and they cheated him; Delilah took a bribe from the Philistines and shaved off his hair, so he lost his power and his eyes; his drastic end came because he forgot God and lived in evil ways; so we should never get involved in bad friendship, but get away from sins and be dependent on God","ref":"Class IV textbook, Chapter 4 – The Brave Judge"},{"q":"How did Jesus raise Lazarus to life?","a":"Jesus came to Bethany when Lazarus had been in the tomb for four days; Martha and Mary met him, and seeing them weep, Jesus also wept; at the tomb, a cave with a stone against it, he said, \"Take away the stone\"; he looked upward and thanked the Father for hearing him; he cried with a loud voice, \"Lazarus, come out!\", and Lazarus came out with his hands and feet bound in cloth; Jesus said, \"Unbind him, and let him go\", and everyone was amazed and believed in Jesus","ref":"Class IV textbook, Chapter 9 – Jesus Raises Lazarus to Life"},{"q":"How did King Ahab and Jezebel sin against God?","a":"Ahab ruled Israel for 22 years but lived away from God, doing idol worship and evil things; his wife Jezebel was a wicked lady who killed many prophets of God; Ahab greedily wanted Naboth's ancestral vineyard; Jezebel arranged the elders and nobles to give false witness that Naboth had cursed God and the king; Naboth was stoned to death and Ahab took his vineyard; so God sent Prophet Elijah to warn Ahab of His punishment","ref":"Class IV textbook, Chapter 6 – Naboth's Vineyard"}],"essay":[{"q":"Happiness and sadness – lessons from the life of Job.","a":"Our life is a mixture of happiness and sadness, like a rose that has thorns on its stem; Job was a man whom God called 'righteous', and his life was a mixture of happiness and sadness; he was blessed with plenty of servants and wealth; then sadness came – his animal wealth was carried off by robbers; yet Job said, \"Naked I came from my mother's womb, and naked shall I return there, the Lord gave, and the Lord has taken away, blessed be the name of the Lord\"; he praised God in his happiness and in his sadness; the Lord rewarded him by giving him everything twice as much as before; when we share our happiness it increases twice and when we share our sorrows they decrease by half – so let us share our sorrows with Jesus, our true friend","ref":"Class IV textbook, Chapter 13 – Happiness and Sadness"},{"q":"St. John, the Apostle.","a":"St. John was the apostle whom Jesus loved the most; he is known as the 'apostle of love'; he witnessed the crucifixion of Jesus; he gave St. Mary a shelter in his house; he was exiled to the island of Patmos; he wrote the Book of Revelation; he was the only apostle to have a natural death","ref":"Class IV textbook, True Faith – Saint Apostles (St. John, the Apostle)"}]}}]},{"c":"V","sections":[{"n":"Old Testament","units":[{"t":"Chapter 4 – Wisdom through Prayer","q":[["What is the Bible reference for the lesson 'Wisdom through Prayer'?",["1 Kings 3:4-10","1 Chronicles 3:4-10","1 Kings 8:1-10","2 Samuel 7:1-10"],0,""],["Which is the reference of the Bible verse to learn, \"Give to your servant an understanding heart to judge your people, that I may discern between good and evil\"?",["Proverbs 9:10","1 Kings 3:4","Psalms 23:1","1 Kings 3:9"],3,""],["Solomon was the ______ king of Israel.",["Second","First","Third","Fourth"],2,"QP 2021"],["Who were the parents of Solomon?",["Saul and Hannah","Jesse and Hannah","David and Bathsheba","Tobiel and Hannah"],2,""],["What is the meaning of the name 'Solomon'?",["Justice","Peace","Beloved of the Lord","Faith"],1,"QP 2021, QP 2022"],["What was the other name of Solomon?",["Nathan","Tobiah","Absalom","Jedidiah"],3,"QP 2021, QP 2022"],["What is the meaning of the name 'Jedidiah'?",["Beloved of the Lord","Peace","God is great","Wise among the wise"],0,""],["Name the king whose era of reign was known as the 'Golden Age of Israel'.",["Saul","Ahasuerus","David","Solomon"],3,"QP 2021, QP 2022"],["Among the plenty of Solomon's constructions, which was the most important one?",["The walls of Jericho","The Jerusalem Temple","The palace of Nineveh","The palace at Gibeon"],1,""],["In which Old Testament books is the history of Solomon described?",["Kings and Chronicles","Exodus and Numbers","Job and Psalms","Tobit and Esther"],0,""],["Solomon was also known as the ______.",["Sweet singer of Israel","Wise among the wise men","Strongest among the warriors","Father of all nations"],1,""],["How many burnt offerings did Solomon offer on the altar at Gibeon?",["A hundred","Seven","A thousand","Twelve"],2,""],["How did God appear to Solomon that night?",["In a pillar of fire","Through an angel at the gate","In a burning bush","In a dream"],3,""],["What did God say to Solomon when He appeared to him?",["\"Do not be afraid, I am with you.\"","\"Go and do likewise.\"","\"Follow me.\"","\"Ask! What shall I give you?\""],3,""],["What did Solomon ask God for?",["The life of his enemies","A long life for himself","An understanding heart to judge God's people","Riches for himself"],2,""],["In his prayer, what did Solomon realize as the reason for his own blessings?",["His own strength","His large army","The goodness of his father","His great riches"],2,""],["\"The fear of the Lord is the beginning of wisdom\" is taken from which Bible reference given in the lesson?",["Psalms 23:1","1 Kings 3:9","Proverbs 9:10","St. Matthew 17:21"],2,""],["Complete: \"______ is the beginning of wisdom.\"",["Trust in God","Fear of God","Praying to God","Faith in God"],1,"QP 2021"],["One day, King ______ went to Gibeon and offered a thousand burnt offerings on the altar as a sacrifice to God.",["Saul","Solomon","David","Ahasuerus"],1,"QP 2021"]]},{"t":"Chapter 5 – Esther","q":[["What is the Bible reference given for the lesson 'Esther'?",["1 Kings 3:4","Esther 4:16","Esther 1:1","Tobit 1:1"],1,""],["Complete the Bible verse: \"Put your sword in its place, for all who take the sword will perish by the ______.\"",["Famine","Sword","Spear","Fire"],1,"QP 2021"],["Which holy father is shown kneeling down and praying in the lesson 'Esther'?",["Patriarch St. Ignatius Elias III","St. Yeldho Mor Baselios","St. Geevarghese Mor Gregorios","His Beatitude Mor Baselios Thomas I Catholicose"],3,""],["His Beatitude Mor Baselios Thomas I Catholicose is called the ______.",["Kochu Thirumeni","Manjanikkara Bava","Jacob Baradaeus of Malankara","Kothamangalam Bava"],2,""],["Name the Babylonian king who attacked Jerusalem in 606 BC.",["Nebuchadnezzar","Cyrus","Sennacherib","Ahasuerus"],0,"QP 2021"],["For how many years did the Jews live as slaves in Babylon?",["12 years","40 years","50 years","70 years"],3,""],["Which Persian king declared the release of the Jews?",["Shalmaneser","Nebuchadnezzar","Cyrus","Ahasuerus"],2,""],["Who nurtured Esther after the death of her parents?",["Ahasuerus","Mordecai","Haman","Nebuchadnezzar"],1,"QP 2021"],["Mordecai was not the father of Esther. How was Mordecai related to her?",["He was her mother's brother","He was the son of her father's brother","He was her elder brother","He was her grandfather"],1,"QP 2021"],["Which Persian king made a great feast at his palace?",["Ahasuerus","Cyrus","Sennacherib","Nebuchadnezzar"],0,""],["Esther was made queen by replacing whom?",["Vasthi","Raphael","Sheba","Jezebel"],0,"QP 2022"],["Why did King Ahasuerus dethrone Queen Vasthi?",["She left the palace without permission","She tried to kill the king","She worshipped idols","She refused to come to the king's court wearing the royal crown"],3,""],["How did Mordecai show his loyalty to the king?",["He told Esther about two courtiers who planned to kill the king","He gave great gifts to the king","He built a gallows for the king's enemies","He fought in the king's army"],0,""],["To which post was Haman appointed by the king?",["Principal minister","Commander of the army","Keeper of the king's gate","Steward of the palace"],0,""],["Why did Haman become angry with Mordecai?",["Mordecai insulted the king","Mordecai stole from the palace","Mordecai refused to pay taxes","Mordecai refused to bow down to him"],3,""],["What did Haman build to hang Mordecai?",["A fiery furnace","A tower","A gallows","A prison"],2,""],["For how many days did Esther and all the Jews fast and pray?",["Fifty days","Forty days","Seven days","Three days"],3,""],["What did Esther prepare for the king, to which Haman was also invited?",["A royal hunt","A wedding","A banquet","A festival in the temple"],2,""],["Mordecai was appointed as the principal minister instead of ______ by the Persian King Ahasuerus.",["Daniel","Haman","Tobit","Nehemiah"],1,"QP 2021"],["Haman wanted to kill ______, who refused to bow down to him.",["Queen Vasthi","King Cyrus","Mordecai","King Ahasuerus"],2,"QP 2022"]]},{"t":"Chapter 6 – Never Fading Lamp","q":[["What is the Bible reference for the lesson 'Never Fading Lamp'?",["Book of Job Chapters 1 to 42","Book of Tobit Chapters 1 to 14","Book of Esther Chapters 1 to 10","1 Kings Chapter 3"],1,""],["Which is one of the aims of the lesson 'Never Fading Lamp'?",["Learn to become a rich person","Learn to win over enemies","Learn to lead a good family life","Learn to become a great king"],2,""],["In the story, which animals dug pits to bury the dead animals?",["A bear and a monkey","A lion and a tiger","An elephant and a deer","A fox and a rabbit"],0,""],["In the story, which animal said that the work of the bear and the monkey was right?",["The fox","The lion","The elephant","The deer"],2,""],["What lesson do we learn from the story of the bear and the monkey?",["Proper waste management is our responsibility","We should not help others","The strongest animal should rule the forest","We should stay away from the forest"],0,""],["Tobit was the son of ______.",["Tobiel","Tobiah","Mordecai","Raphael"],0,""],["To which tribe did Tobit belong?",["Levi","Benjamin","Naphtali","Judah"],2,"QP 2021, QP 2022"],["What did Tobit's kindred start worshipping when they went away from God?",["The statue of the king","The river Jordan","The golden calf of Baal","The sun and the moon"],2,""],["Who was the wife of Tobit?",["Esther","Vasthi","Hannah","Bathsheba"],2,""],["Who was the father of Tobias (Tobiah)?",["Gabriel","Gideon","Tobiel","Tobit"],3,"QP 2022"],["To which place were Tobit and his people carried away as captives?",["Egypt","Gibeon","Nineveh","Jericho"],2,""],["Which mighty king of Nineveh gave Tobit a job in his palace?",["Sennacherib","Nebuchadnezzar","Ahasuerus","Shalmaneser"],3,""],["Which cruel king threw the dead bodies of captives behind the wall of Nineveh?",["Cyrus","Shalmaneser","Ahasuerus","Sennacherib"],3,""],["What good work did Tobit do secretly for the dead captives?",["He hid them in the temple","He buried them with all the rites","He sent them back to Jerusalem","He gave them to their kings"],1,""],["Within how many days was Sennacherib killed by his sons?",["Seventy days","Forty days","Three days","Fifty days"],3,""],["At what age did Tobit become blind?",["Fifty-eight","Seventy","Fifty","One hundred and two"],0,""],["Which angel instructed Tobiah to put medicine in his father's eyes?",["Angel Raphael","Angel Michael","Angel Gabriel","Angel Uriel"],0,"QP 2021"],["At what age did Tobit start his eternal journey?",["58","70","102","120"],2,""],["Among which books of the Bible is the Book of Tobit included?",["The Books of Kings","The Gospels","The Psalms","The Apocryphal Books"],3,"QP 2021"],["Which of these was one of the advices Tobit gave to his son?",["Not to forget his mother","To build a temple at Nineveh","To go back to Babylon","To become a soldier of the king"],0,"QP 2022"]]}]},{"n":"New Testament","units":[{"t":"Chapter 10 – Miraculous Fishing","q":[["What is the Bible reference for the lesson 'Miraculous Fishing'?",["St. Matthew 25:1-13","St. Luke 10:29-37","St. John 21:1-14","St. Matthew 4:18-19"],2,""],["Which is the Bible verse to learn in the lesson 'Miraculous Fishing'?",["\"Cast the net on the right side of the boat, and you will find some.\"","\"Launch out into the deep and let down your nets for a catch.\"","\"Go and do likewise.\"","\"Follow me, and I will make you fishers of men.\""],0,""],["What is one of the aims of the lesson 'Miraculous Fishing'?",["To learn how to make a fishing net","To understand that efforts without God will be in vain","To understand that hard work alone is enough","To learn the names of all the seas"],1,""],["What is the Sea of Galilee?",["A river","An ocean","A salt sea","A freshwater lake"],3,""],["By what other name is the Sea of Galilee known?",["Lake Gennesaret","Lake Jordan","The Red Sea","The Dead Sea"],0,""],["What is the size of the Sea of Galilee as given in the lesson?",["About 13 miles long and 7 miles wide","About 50 miles long and 20 miles wide","About 100 miles long and 13 miles wide","About 7 miles long and 3 miles wide"],0,""],["Which river flows from north to south through the Sea of Galilee?",["Tigris","Nile","Euphrates","Jordan"],3,""],["Which of these villages was situated on the coast of the Sea of Galilee?",["Gibeon","Capernaum","Nineveh","Jericho"],1,""],["What was the reward Jesus promised to the fishermen who e serpent made by Moses and the staff of Aaron which became a serpent"],3,""],["What happens through the intercessory prayers of the saints?",["Our sins are written down","Our prayers are stopped","Our prayers are offered to God by them","We do not need to pray"],2,""],["Which Bible verse shows that the prayers of the righteous are powerful?",["\"For the eyes of the Lord are on the righteous, and His ears are open to their prayers.\" (1 Peter 3:12)","\"Go and do likewise.\" (St. Luke 10:37)","\"The Lord is my shepherd.\" (Psalms 23:1)","\"Put your sword in its place.\" (St. Matthew 26:52)"],0,""],["Parents give the name 'Basil' to their children in memory of which saint?",["St. Peter","St. Matthew","St. George","St. Yeldho Mor Baselios"],3,""]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Who was the father of Tobias (Tobiah)?","o":["Tobit","Tobiel","Gabriel","Gideon"],"a":0},{"q":"What is the meaning of the name 'Solomon'?","o":["Beloved of the Lord","Peace","Faith","Justice"],"a":1},{"q":"Esther was made queen in place of whom?","o":["Bathsheba","Hannah","Vasthi","Delilah"],"a":2},{"q":"How many fishes were there in the net when the disciples cast it on the right side of the boat?","o":["70","100","120","153"],"a":3},{"q":"In the parable of the ten virgins, what does the oil symbolize?","o":["Food","Money","Faith","Light of the sun"],"a":2},{"q":"Who was the brother of St. Andrew?","o":["Matthew","John","Simon Peter","Paul"],"a":2}],"name":[{"q":"Name the Babylonian king who attacked Jerusalem in 606 BC.","a":"Nebuchadnezzar"},{"q":"Name the angel who told Tobiah to put medicine in his father's eyes.","a":"Angel Raphael"},{"q":"Name the river that flows from north to south through the Sea of Galilee.","a":"River Jordan"},{"q":"In the lesson 'Ethics', who ordered the poor man to demolish his hut?","a":"The king's chief minister"},{"q":"Name the current Patriarch of Antioch (Syriac Orthodox Church).","a":"His Holiness Moran Mor Ignatius Aphrem II"},{"q":"Who was the first martyr among the disciples?","a":"St. James"}],"tf":[{"q":"Mordecai was the father of Esther.","a":false},{"q":"The Samaritans and the Jews were enemies.","a":true},{"q":"Holy Mooron is made by mixing twelve different spices with olive oil.","a":false},{"q":"St. Ignatius Elias III became the 119th Patriarch of Antioch.","a":true}],"fill":[{"q":"Esther's parents had decided to stay back in ______.","a":"Babylon"},{"q":"Tobit became blind at the age of ______.","a":"fifty-eight (58)"},{"q":"In the parable of the ten virgins, the arrival of the groom symbolizes the ______ of Christ.","a":"Second Coming"},{"q":"The term 'Koodasha' is derived from the Syriac term ______.","a":"Kadhesh"},{"q":"St. Andrew was a native of the city of ______.","a":"Bethsaida"}],"match":{"l":["Groom","Proverbs 9:10","Tobit","Haman","Sea of Galilee","Mooron","Parumala Kochu Thirumeni"],"r":["St. Geevarghese Mor Gregorios","Christ","Miraculous Fishing","Built a gallows","The fear of the Lord is the beginning of wisdom","Tribe of Naphtali","Scented oil"],"key":[1,4,5,3,2,6,0]},"short":[{"q":"What does the crosier symbolize?","a":"The crosier is the staff seen in a bishop's hand. It symbolizes the authority and responsibility of a bishop over the faithful. Our prelates use two types of crosiers – the bronze serpent made by Moses and the staff of Aaron which became a serpent.","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles (Crosier)"},{"q":"In the parable of the Good Samaritan, who passed by the wounded man without helping him?","a":"A priest came down that road, saw the wounded man and passed by on the other side. Likewise a Levite came to the place, looked at him and passed by on the other side.","ref":"Class V textbook, New Testament Chapter 12 – Good Friend"},{"q":"What advice did Tobit give to his son?","a":"When Tobit became blind and prayed for his death, he called his son Tobiah and gave him the advice a father gives his son. He told him to bury him according to the religious rites, not to forget his mother, and to worship God the Almighty forever.","ref":"Class V textbook, Old Testament Chapter 6 – Never Fading Lamp"},{"q":"What did the king in the lesson 'Ethics' finally decide about the poor man's hut? Why?","a":"The king ordered that no one should touch the hut and that the poor family should live there peacefully. He said visitors would praise his palace for its beauty and the small hut for his ethical concern, and he wanted to be known as a king with good ethics and moral concern.","ref":"Class V textbook, New Testament Chapter 13 – Ethics"}],"para":[{"q":"Write about St. Yeldho Mor Baselios.","a":"St. Yeldho Mor Baselios is known as Kothamangalam Bava; his birthplace was Mosul in Iraq; he came to India to rescue the faithful from the forceful attempts of the Portuguese to convert the Syrian Christians to the Catholic Church; he went to his eternal abode on 3rd October 1685; he is entombed at Kothamangalam Mar Thoman Church; the Church considers him a saint and remembers him in the 5th Tubden of the Holy Qurbana","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles (Holy Church Fathers)"},{"q":"How did Esther save the Jews?","a":"Haman was angry with Mordecai and planned to destroy all the Jews, so Mordecai asked Queen Esther to rescue them; though afraid to enter the king's court without permission, she gained courage to plead for her people; she asked all the Jews to fast and pray for three days, and Mordecai, the queen and her maids fasted with them; God was pleased, and the king was happy with the queen and promised to do as she wished; at her banquet Esther told the king that Haman was planning to destroy her people; Haman was hanged on the gallows he had built for Mordecai, and the Jews were saved","ref":"Class V textbook, Old Testament Chapter 5 – Esther"},{"q":"What did the disciples learn from the Miraculous Fishing?","a":"Jesus is the forgiving love, who invites with food everyone who toils hard for food; though we go away from Jesus, he still waits for us and provides us with everything; the disciples understood that the same Jesus who was with them before the crucifixion had appeared to them now; not only their stomach but their entire boat would be filled with Jesus' presence; Jesus' presence made Peter courageous; efforts without God are in vain, and nothing is impossible to God","ref":"Class V textbook, New Testament Chapter 10 – Miraculous Fishing"}],"essay":[{"q":"The Holy Sacraments: what are they? Write about Holy Baptism and Holy Mooron.","a":"Our Church has seven Holy Sacraments (Koodhashakal), and 'koodhasha' comes from the Syriac term 'Kadhesh', meaning 'that which purifies'; a faithful receives the gift of God's grace through them; they are performed by the priest, the minister of Christ, and the receiver needs faith and preparation; Holy Baptism was instituted by Jesus Christ, and through it one becomes a member of the Church – no other sacrament can be received without it; its gifts are acceptance as children of God, forgiveness of sin, gift of the Holy Spirit and membership of the Church; the materials for Baptism are hot water, cold water, olive oil and Holy Mooron; 'Mooron' comes from the Syriac word 'Moor', meaning 'scented oil' – it is the perfumed scent of Messiah and the sign and seal of true faith; the Holy Spirit is received through the Sacrament of Holy Mooron","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"},{"q":"Solomon's prayer for wisdom.","a":"Solomon, the third king of Israel, was the son of David and Bathsheba; one day he went to Gibeon and offered a thousand burnt offerings to God; that night God appeared to him in a dream and said, \"Ask! What shall I give you?\"; Solomon prayed, \"Give to your servant an understanding heart to judge your people, that I may discern between good and evil\"; in his prayer he remembered his father and his goodness, thanked God for making him king and humbly submitted his shortcomings; his prayer pleased the Lord, because he had not asked for long life, riches or the life of his enemies; God gave him a wise and understanding heart, so that no one like him was before him or would arise after him; we too should pray humbly for wisdom, for \"the fear of the Lord is the beginning of wisdom\"","ref":"Class V textbook, Old Testament Chapter 4 – Wisdom through Prayer"}]}},{"no":2,"s":{"mcq":[{"q":"Solomon was the ______ king of Israel.","o":["First","Third","Second","Fourth"],"a":1},{"q":"Who nurtured Esther after the death of her parents?","o":["Ahasuerus","Haman","Nebuchadnezzar","Mordecai"],"a":3},{"q":"In the story of the bear and the monkey, which animal said that their work was right?","o":["The deer","The lion","The fox","The elephant"],"a":3},{"q":"What does the fishing net signify in the Miraculous Fishing?","o":["The world","The sea","The Church","The disciples' work"],"a":2},{"q":"From where to where was the man in the parable of the Good Samaritan travelling?","o":["Jericho to Bethlehem","Jerusalem to Jericho","Galilee to Jerusalem","Bethany to Jerusalem"],"a":1},{"q":"Who receives the gift of God's grace through the Holy Sacraments?","o":["The faithful","The needy","The strong","The rich"],"a":0}],"name":[{"q":"Name the king whose reign was known as the 'Golden Age of Israel'.","a":"Solomon"},{"q":"Name the Persian king who declared the release of the Jews from Babylon.","a":"Cyrus"},{"q":"What did Tobit's kindred start worshipping when they went away from God?","a":"The golden calf of Baal"},{"q":"What did Jesus ask the disciples from the shore?","a":"\"Children, have you any food?\""},{"q":"What is the meaning of the name 'Andrew'?","a":"Valour"},{"q":"Name the Patriarch entombed at Manjanikkara Dayara.","a":"Patriarch St. Ignatius Elias III"}],"tf":[{"q":"St. James and St. John were known as the 'Sons of Thunder'.","a":true},{"q":"Tobit refused to bury the bodies of the dead captives.","a":false},{"q":"In the parable, the bride symbolizes the Church.","a":true},{"q":"Infant baptism is never performed in our Church.","a":false}],"fill":[{"q":"Mordecai was appointed as the principal minister instead of ______ by King Ahasuerus.","a":"Haman"},{"q":"Within ______ days, Sennacherib was killed by his own sons.","a":"fifty"},{"q":"Dragging of the net to the land denotes the special authority entrusted to St. ______.","a":"Peter"},{"q":"Our Almighty God, who created the heaven and the earth, is a righteous ______ who acts with righteousness and justice.","a":"judge"},{"q":"Holy Mooron and ______ are also given to a receiver along with Holy Baptism.","a":"Holy Eucharist (Holy Qurbana)"}],"match":{"l":["Bride","Solomon","Esther","Raphael","Levite","Koodasha","St. Yeldho Mor Baselios"],"r":["Angel","Church","Kothamangalam","Passed by on the other side","That which purifies","Queen of Ahasuerus","Peace"],"key":[1,6,5,0,3,4,2]},"short":[{"q":"What did God say to Solomon when he appeared to him in a dream, and what did Solomon ask?","a":"God appeared to Solomon in a dream at Gibeon and said, \"Ask! What shall I give you?\" Solomon asked for an understanding heart to judge God's people, so that he could discern between good and evil.","ref":"Class V textbook, Old Testament Chapter 4 – Wisdom through Prayer"},{"q":"In the parable of the ten virgins, what did the foolish virgins ask, and what happened to them?","a":"They said to the other virgins, \"Give us some of your oil, for our lamps are going out.\" While they went to buy oil, the bridegroom came and the door was shut. When they returned and cried, \"Lord, Lord, open to us!\", the bridegroom said, \"Assuredly, I say to you, I do not know you.\"","ref":"Class V textbook, New Testament Chapter 11 – Entry to the Kingdom of Heaven"},{"q":"What did the Good Samaritan do for the wounded man?","a":"The Samaritan had compassion on the man; he bandaged his wounds, pouring on oil and wine, set him on his own animal, brought him to an inn and took care of him. The next day he gave two denarii to the innkeeper and said, \"Take care of him; and whatever more you spend, when I come again, I will repay you.\"","ref":"Class V textbook, New Testament Chapter 12 – Good Friend"},{"q":"Who were the 'Sons of Thunder'? What was their father's profession?","a":"James and John, the disciples of Jesus, were known as the 'Sons of Thunder'. They were the sons of Zebedee, who was a fisherman.","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles"}],"para":[{"q":"Describe the consecration of the Holy Mooron.","a":"The consecration of Holy Mooron is performed by His Holiness the Patriarch, or by His Beatitude the Catholicos authorised by the Patriarch; twelve priests wearing the holy vestments and carrying censers take part; twelve full-deacons carry marvahsas (fans) and twelve sub-deacons hold lighted candles; the oil for Mooron is made by mixing ten different spices with pure olive oil; the oil is placed on the holy altar; it is sanctified by reciting all the sacramental prayers and by the invocation of the Holy Spirit","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"},{"q":"Write the story of the king and the poor man's hut from the lesson 'Ethics'.","a":"A king built a huge palace with the help of architects from different countries; a poor man's hut stood near the palace, and the chief minister ordered him to demolish it; the poor man pleaded that he lived there with his wife and little children and had nowhere to go; the king said, \"Wait. Do not destroy it. Let me come and see it, and take a decision\"; after seeing the palace, he said visitors would praise the palace for its beauty and the small hut for his ethical concern; he ordered that no one should touch the hut and let the poor family live there peacefully, and the minister and courtiers were astonished","ref":"Class V textbook, New Testament Chapter 13 – Ethics"},{"q":"How did Tobit get back his sight?","a":"Tobit became blind at the age of fifty-eight and prayed for his death; he called his son Tobiah and gave him a father's advice; the angel Raphael came to Tobit in disguise along with Tobiah; the angel told Tobiah to put a medicine in his father's eyes, and he did so; Tobit got the light of his eyes back and glorified God the Almighty; then Raphael disclosed his identity and returned to God","ref":"Class V textbook, Old Testament Chapter 6 – Never Fading Lamp"}],"essay":[{"q":"Esther – victory through fasting and prayer.","a":"In 606 BC Nebuchadnezzar attacked Jerusalem, and the Jews were taken to Babylon as slaves for 70 years; Esther's parents stayed back in Babylon and died when she was young, so Mordecai, the son of her father's brother, nurtured her; King Ahasuerus dethroned Queen Vasthi and made Esther queen, and Mordecai became a steward in the palace; Mordecai saved the king by revealing, through Esther, a plot of two courtiers to kill him; Haman, the principal minister, ordered all to bow down to him, but Mordecai bowed only to God, so Haman planned to kill him and destroy all the Jews; though afraid, Esther asked all the Jews to fast and pray for three days before she pleaded with the king; at her banquet she exposed Haman's plot, and Haman was hanged on the gallows he had built for Mordecai; Mordecai was made principal minister and the Jews were saved – God changes trials through fasting and prayer","ref":"Class V textbook, Old Testament Chapter 5 – Esther"},{"q":"The Miraculous Fishing – the story and its symbolism.","a":"After Jesus' death the disciples became fearful and went back to fishing at the Sea of Galilee; one evening seven of them went fishing, but worked the whole night without catching a single fish; Jesus called from the shore, \"Children, have you any food?\", and they answered, \"No\"; he told them, \"Cast the net on the right side of the boat, and you will find some\", and they caught a multitude of fish; the 153 large fishes symbolize the various religious beliefs of the world, all invited to Christianity; the fishing net signifies the Church; Peter dragging the net to land denotes the special authority entrusted to St. Peter; the lesson is that efforts without God are in vain, and nothing is impossible to God","ref":"Class V textbook, New Testament Chapter 10 – Miraculous Fishing"}]}},{"no":3,"s":{"mcq":[{"q":"What is the meaning of the name 'Jedidiah'?","o":["Wise among the wise","Beloved of the Lord","Peace","God is great"],"a":1},{"q":"Why did Haman become angry with Mordecai?","o":["Mordecai left Babylon","Mordecai became the king","Mordecai stole from the king","Mordecai refused to bow down to him"],"a":3},{"q":"Which mighty king of Nineveh gave Tobit a job in his palace?","o":["Shalmaneser","Ahasuerus","Cyrus","Sennacherib"],"a":0},{"q":"On which side of the boat did Jesus tell the disciples to cast the net?","o":["Back","Front","Left side","Right side"],"a":3},{"q":"In a Jewish wedding, who is accompanied by ten virgin bridesmaids?","o":["The father","The groom","The bride","The king"],"a":2},{"q":"How many Holy Sacraments are there in our Church?","o":["Three","Seven","Twelve","Five"],"a":1}],"name":[{"q":"Name the most important of Solomon's constructions.","a":"The Jerusalem Temple"},{"q":"For how many days did Esther and the Jews fast and pray?","a":"Three days"},{"q":"Name the place to which Tobit and his people were carried away as captives.","a":"Nineveh"},{"q":"How many disciples started fishing on the Sea of Galilee that evening?","a":"Seven"},{"q":"Which holy sacrament makes a person a member of the Church?","a":"Holy Baptism"},{"q":"By whom was St. James executed with the sword?","a":"King Herod Agrippa"}],"tf":[{"q":"During Solomon's reign, Israel was enriched with peace and prosperity.","a":true},{"q":"Queen Vasthi gladly came to the king's court wearing the royal crown.","a":false},{"q":"The Sea of Galilee is a freshwater lake.","a":true},{"q":"St. Andrew was the brother of St. John.","a":false}],"fill":[{"q":"Solomon was also known as the 'wise among the ______'.","a":"wise men"},{"q":"The Jews lived as slaves in Babylon for ______ years.","a":"seventy (70)"},{"q":"The fishermen are always hardworking, courageous and ______.","a":"committed"},{"q":"The good Samaritan gave two ______ to the innkeeper.","a":"denarii"},{"q":"St. Geevarghese Mor Gregorios was consecrated a bishop at the age of ______.","a":"28"}],"match":{"l":["Wise virgins","Gibeon","Mordecai","Hannah","153 fishes","Godparents","Zebedee"],"r":["Fisherman","Bowed only to God","Faithful who have prepared for Christ","Various religious beliefs","Wife of Tobit","Forsake Satan and accept Messiah","Thousand burnt offerings"],"key":[2,6,1,4,3,5,0]},"short":[{"q":"Why could the disciples not catch any fish that night, and what happened when Jesus came?","a":"They worked the whole night and caught nothing, though Peter was an expert in fishing; it was because Jesus was not with them. When Jesus told them, \"Cast the net on the right side of the boat,\" they caught a multitude of fish.","ref":"Class V textbook, New Testament Chapter 10 – Miraculous Fishing"},{"q":"Why did Haman want to destroy Mordecai and all the Jews?","a":"Haman, the principal minister, ordered all the king's servants to bow down to him, but Mordecai refused and said he would bow down only to God. Angered by this, Haman built a gallows to hang Mordecai and planned to destroy all the Jews.","ref":"Class V textbook, Old Testament Chapter 5 – Esther"},{"q":"What question did the lawyer ask Jesus, and what did Jesus finally tell him?","a":"A lawyer stood up to test Jesus and asked, \"Who is my real friend or neighbour?\" After the parable, the lawyer said the true neighbour was \"He who showed mercy on him,\" and Jesus told him, \"Go and do likewise.\"","ref":"Class V textbook, New Testament Chapter 12 – Good Friend"},{"q":"Where was Patriarch St. Ignatius Elias III born, and who invited him to India?","a":"Patriarch St. Ignatius Elias III was born in the city of Mardin in Turkey. He came to India on the invitation of Lord Irwin, the then Viceroy of India.","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles (Holy Church Fathers)"}],"para":[{"q":"What are the gifts of benediction obtained through Holy Baptism?","a":"Holy Baptism is one of the sacraments instituted by Jesus Christ; through it we receive acceptance as children of God; we receive forgiveness of sin; we receive the gift of the Holy Spirit; we receive membership of the Church of Christ; one should not receive the other sacraments without baptism","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"},{"q":"Write about St. Andrew.","a":"The name Andrew means 'valour'; he was a disciple of John the Baptist, the brother of Simon Peter and a native of Bethsaida; Andrew and John stayed with Jesus one night and realized he was the Messiah, the Saviour of the world; Andrew told his brother Peter and influenced him to follow Jesus; at the feeding of the five thousand, Andrew found the boy with five loaves and two fishes and gave them to Jesus; he was crucified on an X-shaped cross, now known as 'Saint Andrew's Cross'","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles"},{"q":"What do we learn from Solomon's prayer about how we should pray?","a":"Solomon remembered his father and his goodness; he realized his father's goodness was the reason for his own blessings; he thanked God for making him king and humbly submitted his shortcomings before God; he asked for wisdom to discern good and evil, knowing he was helpless without it; likewise we should remember our parents, acknowledge their goodness and give thanks to God; we should pray humbly for knowledge and wisdom, for \"the fear of the Lord is the beginning of wisdom\"","ref":"Class V textbook, Old Testament Chapter 4 – Wisdom through Prayer"}],"essay":[{"q":"The parable of the ten virgins and its symbolic meaning.","a":"Jesus told the parable of ten virgins, the bridesmaids who wait with lights for the bridegroom at a Jewish wedding, which takes place at night; as the bridegroom was late, they all slept; at midnight a cry was heard, \"Behold, the bridegroom is coming, go out to meet him!\", and they all trimmed their lamps; five said, \"Give us some of your oil, for our lamps are going out\", but the others told them to go and buy for themselves; while they went to buy, the bridegroom came, those who were ready went in with him to the wedding, and the door was shut; when the five returned crying, \"Lord, Lord, open to us!\", he said, \"I do not know you\"; symbolism: the groom is Christ, the bride is the Church, the arrival of the groom is the Second Coming of Christ, and the oil is faith; the wise virgins are the faithful who are prepared for Christ, the foolish are the unprepared, and the burning lights are holiness and deeds – so we must be ready, for the Son of Man is coming at an hour we do not expect","ref":"Class V textbook, New Testament Chapter 11 – Entry to the Kingdom of Heaven"},{"q":"Tobit – a never fading lamp.","a":"Tobit was the son of Tobiel of the tribe of Naphtali; when his kindred worshipped the golden calf of Baal, he alone worshipped God and went to the Jerusalem Temple for festivals; doing charity was his passion, and he married Hannah and had a son, Tobiah; he was carried captive to Nineveh, and King Shalmaneser gave him a job in his palace; when the cruel King Sennacherib threw out the dead bodies of captives, Tobit secretly buried them with all the rites, though he was mocked and had to run away; he became blind at fifty-eight and gave his son good advice; the angel Raphael came with Tobiah, who put medicine in his eyes, and Tobit got his sight back and glorified God; he fought for justice and righteousness and died at the age of 102, having lived for truth and righteousness all his life","ref":"Class V textbook, Old Testament Chapter 6 – Never Fading Lamp"}]}},{"no":4,"s":{"mcq":[{"q":"Who were the parents of Solomon?","o":["Saul and Hannah","Tobiel and Hannah","David and Bathsheba","Jesse and Hannah"],"a":2},{"q":"Why did King Ahasuerus dethrone Queen Vasthi?","o":["She left the palace","She refused to come to the king's court wearing the royal crown","She plotted to kill the king","She did not fast"],"a":1},{"q":"What good work did Tobit do secretly for the dead captives?","o":["He sent them to Jerusalem","He buried them with all the rites","He took their money","He burnt their bodies"],"a":1},{"q":"By what other name is the Sea of Galilee known?","o":["Red Sea","Lake Gennesaret","Dead Sea","Sea of Jericho"],"a":1},{"q":"Who came down the road first and passed by the wounded man?","o":["A priest","A lawyer","A Samaritan","A Levite"],"a":0},{"q":"Who performs the consecration of Holy Mooron?","o":["The godparents","A deacon","Any priest","His Holiness the Patriarch, or the Catholicos authorised by him"],"a":3}],"name":[{"q":"What is Solomon's other name?","a":"Jedidiah"},{"q":"What did Esther prepare for the king, to which Haman was also invited?","a":"A banquet"},{"q":"Which cruel king threw the dead bodies of captives behind the wall of Nineveh?","a":"Sennacherib"},{"q":"Which commandment did Jesus call the first and greatest?","a":"\"Love the Lord your God with all your heart and with all your soul and with all your mind.\""},{"q":"In the parable of the ten virgins, what do the burning lights symbolize?","a":"Holiness and deeds"},{"q":"Who wrote the travelogue 'Urshalem Yathra Vivaranam' (A Journey to Jerusalem)?","a":"St. Geevarghese Mor Gregorios (Parumala Kochu Thirumeni)"}],"tf":[{"q":"The history of Solomon is described in the books of Kings and Chronicles.","a":true},{"q":"Esther entered the king's court without any fear.","a":false},{"q":"Tobit started his eternal journey at the age of 102.","a":true},{"q":"The term 'Mooron' means 'that which purifies'.","a":false}],"fill":[{"q":"\"Put your sword in its place, for all who take the sword will perish by the ______.\"","a":"sword"},{"q":"The Book of Tobit is included in the Bible among the ______ Books.","a":"Apocryphal"},{"q":"\"Follow me, and I will make you ______ of men.\"","a":"fishers"},{"q":"\"Therefore you also be ready, for the Son of Man is coming at an ______ you do not expect.\"","a":"hour"},{"q":"St. Yeldho Mor Baselios came to India to rescue the faithful from the forceful attempts of the ______.","a":"Portuguese"}],"match":{"l":["Foolish virgins","Nebuchadnezzar","Tobiel","Capernaum","Samaritan","Marvahsas","St. James"],"r":["King of Babylon","Unprepared faithful","Father of Tobit","Village on the coast of the Sea of Galilee","Showed mercy","Fans carried by full-deacons","First martyr among the disciples"],"key":[1,0,2,3,4,5,6]},"short":[{"q":"Who was Tobit? (Give his father, tribe, wife and son.)","a":"Tobit was the son of Tobiel, of the tribe of Naphtali. In his youth he married Hannah, and they had a son named Tobiah (Tobias).","ref":"Class V textbook, Old Testament Chapter 6 – Never Fading Lamp"},{"q":"Write a short note on the Sea of Galilee.","a":"The Sea of Galilee is a freshwater lake in the northern side of Palestine, about 13 miles long and 7 miles wide, also known as Lake Tiberias or Lake Gennesaret. The river Jordan flows through it from north to south. The villages of Capernaum, Bethsaida, Magdalene and Tiberias are on its coast.","ref":"Class V textbook, New Testament Chapter 10 – Miraculous Fishing"},{"q":"What did the king in the lesson 'Ethics' say when the minister first asked to demolish the hut?","a":"The king said, \"Wait. Do not destroy it. Let me come and see it; and take a decision.\" No one could speak against the king's words, so the minister stepped back.","ref":"Class V textbook, New Testament Chapter 13 – Ethics"},{"q":"What does 'Koodasha' mean? How many Holy Sacraments are there?","a":"'Koodhasha' comes from the Syriac term 'Kadhesh', which means 'that which purifies'. There are seven Holy Sacraments in our Church, and through them a faithful receives the gift of God's grace.","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"}],"para":[{"q":"Christians should be the lights of the world. What should we do to be lights and to enter the Kingdom of Heaven?","a":"Christians should be the lights, and we can be lights by avoiding bad habits; by helping others and doing charity; to enter the Kingdom of Heaven we must be wise, strong in faith and wise spiritually; we must love one another; like the wise virgins, we must keep the oil of faith and the burning lights of holiness and good deeds; we must always be ready, for the Son of Man is coming at an hour we do not expect","ref":"Class V textbook, New Testament Chapter 11 – Entry to the Kingdom of Heaven"},{"q":"How did Mordecai show his loyalty to the king, and how was he finally honoured?","a":"While sitting at the king's gate, Mordecai heard two courtiers planning to kill the king; being loyal, he told Queen Esther, and she informed the king in Mordecai's name; an inquiry confirmed it and both courtiers were hanged on a gallows; thus Mordecai was considered faithful to the king; after Haman was hanged, Mordecai was appointed principal minister in Haman's place","ref":"Class V textbook, Old Testament Chapter 5 – Esther"},{"q":"What are the constituents of the Holy Sacraments?","a":"The performer – the person responsible to perform the Holy Sacraments (the priest, the minister of Christ); the materials or objects – the materials required for performing the sacraments; the images of performance – the prayers and processes joined together as commanded by the Church; the receiver – the one who receives the sacrament with faith and reverence","ref":"Class V textbook, True Faith Chapter 2 – Holy Sacraments"}],"essay":[{"q":"The parable of the Good Samaritan – who is my neighbour?","a":"A lawyer stood up to test Jesus and asked, \"Who is my real friend or neighbour?\"; Jesus told a parable of a man going from Jerusalem to Jericho who fell among thieves, who stripped him, wounded him and left him half dead; a priest came by, saw him and passed by on the other side, and a Levite also looked and passed by; but a Samaritan, though Samaritans and Jews were enemies, had compassion on him; he bandaged his wounds pouring on oil and wine, set him on his own animal, brought him to an inn and took care of him; the next day he gave two denarii to the innkeeper and promised to repay any more expense; the lawyer said the true neighbour was \"He who showed mercy on him\", and Jesus said, \"Go and do likewise\"; Jesus taught us to love even our enemies, to help those in distress and to know our true friend","ref":"Class V textbook, New Testament Chapter 12 – Good Friend"},{"q":"Holy Church fathers who followed the paths of the Apostles.","a":"St. Ignatius Elias III (Manjanikkara Bava) was born in Mardin in Turkey and became the 119th Patriarch of Antioch in 1917; he came to India at the invitation of Lord Irwin, the Viceroy, worked for peace in the Malankara Church, died on 13th February 1932 and was entombed at Manjanikkara Dayara; St. Yeldho Mor Baselios (Kothamangalam Bava) was born in Mosul in Iraq; he came to India to rescue the faithful from the Portuguese attempts to convert the Syrian Christians to the Catholic Church, died on 3rd October 1685 and was entombed at Kothamangalam Mar Thoman Church; St. Geevarghese Mor Gregorios (Parumala Kochu Thirumeni) was born in Mulanthuruty and consecrated bishop at 28 in 1876 by Patriarch Moran Mor Ignatius Peter III; he founded the church and seminary at Parumala, wrote 'Urshalem Yathra Vivaranam', and died on 2nd November 1902; the Church considers these three fathers saints, and their tombs are founts of blessings; they are remembered in the 5th Tubden of the Holy Qurbana, and we should follow their devotion, spirituality, compassion and generosity","ref":"Class V textbook, Church History Chapter 2 – From the Biography of the Holy Apostles (Holy Church Fathers)"}]}},{"no":5,"s":{"mcq":[{"q":"How did God appear to Solomon at Gibeon?","o":["In a burning bush","As an angel at the gate","In a pillar of cloud","In a dream"],"a":3},{"q":"How was Mordecai related to Esther?","o":["Her teacher","Her father","Son of her father's brother","Her husband"],"a":2},{"q":"In the story at the beginning of 'Never Fading Lamp', which animals dug pits to bury dead animals?","o":["A bear and a monkey","An elephant and a deer","A lion and a tiger","A fox and a rabbit"],"a":0},{"q":"After Jesus' death, what did the fearful disciples go back to?","o":["Their old job of fishing","Making tents","Farming","Tax collecting"],"a":0},{"q":"Which of these is a gift of benediction obtained through Holy Baptism?","o":["Long life","Good marks","Wealth","Forgiveness of sin"],"a":3},{"q":"Parents give the name 'Basil' to their children in memory of which saint?","o":["St. Peter","St. George","St. Matthew","St. Yeldho Mor Baselios"],"a":3}],"name":[{"q":"Name the holy father shown kneeling in prayer in the lesson 'Esther', called the 'Jacob Baradaeus of Malankara'.","a":"His Beatitude Mor Baselios Thomas I Catholicos"},{"q":"Who said, \"At your word, I will let down the net\"?","a":"Simon Peter"},{"q":"What was the reply of the lawyer when Jesus asked who was the true neighbour?","a":"\"He who showed mercy on him.\""},{"q":"Name the Syriac word from which 'Mooron' is derived.","a":"Moor"},{"q":"In which Tubden of the Holy Qurbana are St. Ignatius Elias III, St. Yeldho Mor Baselios and St. Geevarghese Mor Gregorios remembered?","a":"The 5th Tubden"},{"q":"Where is St. Geevarghese Mor Gregorios (Parumala Kochu Thirumeni) entombed?","a":"Parumala Church"}],"tf":[{"q":"Esther's parents returned to Jerusalem when King Cyrus released the Jews.","a":false},{"q":"Mordecai agreed to bow down to Haman.","a":false},{"q":"Jesus' presence made Peter c
