nd prays regularly; a good friend does not use bad words, lie or fight with friends.","ref":"Class II textbook, Chapter 12 – Good Friend"},{"q":"How did Jesus feed the five thousand people?","a":"A large crowd came to Jesus on the mountain, and Jesus asked Philip, \"Where are we to buy bread for these people to eat?\"; Andrew said there was a boy with five barley loaves and two fish; Jesus made the people sit down – about five thousand in all; Jesus blessed the bread and fish and gave them as much as they wanted, and the leftovers were gathered up.","ref":"Class II textbook, Chapter 10 – Jesus Feeding the Hungry"},{"q":"How did our Lord Jesus Christ reveal His love towards us?","a":"Our Lord Jesus Christ gave even the last drop of his blood at Calvary; he did this to redeem us from sins and to reveal his love towards us; he gave the commandment, \"Love one another, as I have loved you\"; God is Love, so we also need to grow in love and share God's love.","ref":"Class II textbook, Chapter 13 – Boundless Love"}],"speech":[{"q":"Jesus will come again","a":"The Son of God became a man to save us from our sins; yes, Jesus the Messiah will come to the world again; He will come to join with Him those who live according to His will; His Second Coming will be from the east; that is why the Church instructs us to stand facing east while praying; so we should live every day according to His will.","ref":"Class II textbook, True Faith, Questions 5, 6 and 8"},{"q":"Moses at the burning bush","a":"Moses fled from Egypt to the land of Midian and looked after the sheep of his father-in-law Jethro; at Mount Horeb, the Mountain of God, he saw a bush on fire that was not burning up; God said, \"Remove the sandals from your feet, for the place on which you are standing is holy ground\"; God gave him the responsibility to liberate the Israelites from Pharaoh; Moses said he stammered, so God said his brother Aaron would speak for him; Moses knelt and said, \"I will act according to Your will, my Lord\" – God hears the cry of His people.","ref":"Class II textbook, Chapter 4 – Moses at the Burning Bush"}]}}]},{"c":"III","sections":[{"n":"Old Testament","units":[{"t":"Chapter 3 – The Prime Minister of Egypt","q":[["To whom did Joseph's brothers sell him?",["Pharaoh's magicians","Canaanite farmers","Egyptian soldiers","Midianite traders"],3,""],["To whom did the Midianite traders sell Joseph?",["Potiphar","Pharaoh","The chief cupbearer","The chief baker"],0,"QP 2013 (Kerala), QP 2018, QP 2021"],["Why did Potiphar put Joseph in prison?",["Joseph ran away from his house","He believed his wife's lies about Joseph","Joseph did not obey Pharaoh","Joseph stole his money"],1,""],["Which two officials of Pharaoh were in prison with Joseph?",["The chief cupbearer and the chief baker","The captain and the soldier","The magician and the wise man","The priest and the farmer"],0,"QP 2018, QP 2019"],["When the officials could not understand their dreams, what did Joseph say interpretations belong to?",["God","The magicians","The wise men of Egypt","Pharaoh"],0,""],["Who remembered Joseph when no one could explain Pharaoh's dreams?",["Joseph's brothers","The chief baker","Potiphar","The chief cupbearer"],3,""],["In Pharaoh's dream, what did the seven ugly cows mean?",["Seven kings of Egypt","Seven years of famine","Seven years of great harvest","Seven brothers of Joseph"],1,"QP 2019"],["How did Pharaoh honour Joseph after he interpreted his dream?",["Chief baker","Prime Minister of Egypt","Captain of the guard","Chief cupbearer"],1,"QP 2019, QP 2022"],["What did Pharaoh take from his own hand and put on Joseph's hand?",["A crown","His signet ring","A staff","A gold chain"],1,""],["What is the Bible verse to learn in this lesson?",["\"My heart shall rejoice in your salvation.\"","\"Here am I, send me.\"","\"Nothing will be impossible with God.\"","\"Humble yourselves before the Lord, and He will lift you up.\""],3,""],["Who got his job back in Pharaoh's palace?",["King's chief barber","King's chief cupbearer","King's chief cook","King's chief baker"],1,"QP 2019, QP 2021"],["Who was Pharaoh?",["The chief cupbearer","The captain of the guard","A Midianite trader","The ruler (king) of Egypt"],3,"QP 2021"],["What was Pharaoh's dream?",["Seven ugly cows eating up seven good cows, and seven thin ears of grain swallowing seven good ears","Eleven stars and the sun and moon bowing down to him","A ladder reaching up to heaven with angels on it","Three branches of a vine and three baskets of bread"],0,"QP 2019, QP 2021"],["Who interpreted the dream of Pharaoh?",["Jacob","Potiphar","Samuel","Joseph"],3,"QP 2018"],["Joseph, who interpreted dreams, was the son of …",["Jacob","Potiphar","Pharaoh","Moses"],0,"QP 2019"]]},{"t":"Chapter 4 – Moses: The Leader of Israel","q":[["Where did God appear to Moses?",["In a big boat","In the river Nile","On a high tower","In a burning bush"],3,"QP 2022"],["Why did the Israelites cry aloud and pray to God?",["They lost their way in the forest","The Egyptians made them do forced labour","They wanted a new king","They had no boat to cross the sea"],1,""],["“I have never been eloquent; I am slow of speech and slow of tongue.” Who said to whom?",["Isaiah to God","Aaron to Pharaoh","Moses to God","Joseph to Pharaoh"],2,"QP 2018"],["Whom did God tell Moses to take along to speak for him?",["His son Elias","His brother Aaron","Prophet Isaiah","His friend Joseph"],1,""],["Why did Pharaoh allow the Israelites to go from Egypt?",["The river Nile dried up","Every Egyptian family was struck with the death of the firstborn","The sun did not rise","All the cows ran away"],1,"QP 2019, QP 2022"],["Which was the place where God gave the Ten Commandments to Moses?",["Mount Tabor","Mount Moriah","Mount Nebo","Mount Sinai"],3,"QP 2019, QP 2021"],["What was written on the two stone tablets?",["The dreams of Pharaoh","The Ten Commandments","A map to Canaan","The names of the Israelites"],1,"QP 2013 (Kerala)"],["Which commandment says, \"Remember the Sabbath day, and keep it holy\"?",["The sixth commandment","The fourth commandment","The tenth commandment","The first commandment"],1,"QP 2019, QP 2022"],["What is the Bible verse to learn in this lesson?",["\"The fear of the Lord is the beginning of wisdom.\"","\"Humble yourselves before the Lord, and He will lift you up.\"","\"For to me, living is Christ and dying is gain.\"","\"I can do great things through Him who strengthens me.\""],3,""],["Name the brother of Moses.",["Aaron","Jethro","John","Paul"],0,"QP 2018, QP 2021"],["The Ten Commandments on the stone tablets were written with the … of God.",["sword","voice","staff","fingers"],3,"QP 2018"],["Where did Moses lead the Israelites after delivering them from Pharaoh?",["Damascus","Egypt","Canaan","Sinai"],2,"QP 2019, QP 2022"],["How did Pharaoh feel when he let the Israelites leave Egypt?",["Very happy","Proud and joyful","Very sad and afraid of God","Angry with Joseph"],2,"QP 2022"],["Whom did God choose as the leader of Israel to free the Israelites from Pharaoh?",["Isaiah","Aaron","Joseph","Moses"],3,"QP 2013 (Kerala)"]]},{"t":"Chapter 5 – God Providing Water from the Rock","q":[["Through which wilderness were the Israelites travelling?",["Damascus","Red Sea","Sinai","Canaan"],2,"QP 2019, QP 2022"],["How did God help the Israelites in their journey?",["As a dove flying in front of them","As a pillar of cloud by day and a pillar of fire by night","As an angel riding a chariot","As a bright star in the sky"],1,"QP 2018, QP 2019, QP 2021"],["Which sea was divided into two when Moses stretched his hand over it?",["The Lake of Galilee","The Dead Sea","The river Nile","The Red Sea"],3,"QP 2022"],["What was the food given to the Israelites by God from heaven?",["Fish","Bread from Egypt","Quail","Manna"],3,"QP 2018, QP 2021"],["God provided the Israelites with ___ for meat.",["Quail","Lambs","Doves","Fish"],0,"QP 2021, QP 2022"],["Where did Moses strike for water?",["In the Red Sea","On two stones","On the rock","On the sand"],2,"QP 2019"],["For how many years did God protect His people in the wilderness on their journey to Canaan?",["Forty years","Three years","Seven years","Twelve years"],0,"QP 2018"],["Pilgrims walk to Manjanikkara to visit the tomb of which Patriarch?",["St. Paulose Mor Athanasius","Aboon Mor Baselious Thomas I","Moran Mor Ignatius Aphrem II","Moran Mor Ignatius Elias III"],3,""],["What is the Bible verse to learn in this lesson?",["\"I can do great things through Him who strengthens me.\"","\"Here am I, send me.\"","\"Nothing will be impossible with God.\"","\"My heart shall rejoice in your salvation.\""],3,""],["___ is the Promised Land assured by God to the Israelites.",["Jerusalem","Haran","Canaan","Egypt"],2,"QP 2022"]]},{"t":"Chapter 6 – Vision of Isaiah","q":[["___ was the father of prophet Isaiah.",["Moses","Aaron","Amos","Daniel"],2,"QP 2021, QP 2022"],["Where was Isaiah born?",["In a palace","In a boat","In the desert","In a prison"],0,""],["In his vision, where did Isaiah see the Lord sitting?",["On a rock in the desert","In a boat on the lake","On a throne, high and lofty","Under a tree"],2,"QP 2021, QP 2022"],["In the vision that Isaiah saw, how many wings did the angel Seraphs have?",["Six","Two","Four","Eight"],0,"QP 2019, QP 2021"],["What did the Seraphs sing to praise God?",["\"Saul, Saul, why do you persecute me?\"","\"Here am I, send me\"","\"Holy, Holy, Holy is the Lord of hosts\"","\"Peace! Be still!\""],2,""],["How did the Seraph make the prophet Isaiah pure?",["He touched his mouth with a live coal taken from the altar","He touched him with a green leaf","He gave him a golden ring","He poured water on his head"],0,"QP 2019, QP 2022"],["What did Isaiah hear the voice of God saying?",["\"Why are you afraid, you of little faith?\"","\"Strike the rock with your staff.\"","\"Whom shall I send, and who will go for us?\"","\"Solomon, ask me what I should give you.\""],2,""],["Who advise the Will of God to us today?",["Kings and soldiers","Metropolitans and Priests","Traders and farmers","Magicians and wise men"],1,""],["What is the Bible verse to learn in this lesson?",["\"The fear of the Lord is the beginning of wisdom.\"","\"Humble yourselves before the Lord, and He will lift you up.\"","\"My heart shall rejoice in your salvation.\"","\"Here am I, send me.\""],3,""],["Isaiah was a …",["Prophet","Priest","Disciple","Apostle"],0,"QP 2019"],["Like the prophet Isaiah, how could we show God to others?",["By talking only about ourselves","By staying away from church","By sharing the love of God with friends and living a good life","By keeping away from everyone"],2,"QP 2019"]]}]},{"n":"New Testament","units":[{"t":"Chapter 10 – Jesus Calms the Storm","q":[["Which was the lake Jesus was travelling across when He calmed the storm?",["The Red Sea","The River Jordan","The Lake of Galilee","The Dead Sea"],2,"QP 2013 (Kerala), QP 2021, QP 2022"],["Where was Jesus sleeping in the boat?",["On a cushion in the stern (back of the boat)","On the roof of the boat","On the shore","In the water"],0,"QP 2019"],["What did the disciples shout when they woke Jesus?",["\"Here am I, send me!\"","\"Master, Master, don't you care that we are perishing?\"","\"Who are you, Lord?\"","\"Lord, give us food to eat!\""],1,""],["What did Jesus say to the wind and the waves?",["\"Stand up and walk!\"","\"Go away from here!\"","\"Peace! Be still!\"","\"Bring me a sword!\""],2,""],["What happened when Jesus rebuked the wind and the waves?",["The boat sank to the bottom","The storm became stronger","The wind ceased, but the waves still raged","The wind ceased and there was a dead calm in the sea"],3,"QP 2019, QP 2021"],["Whom did Jesus call “You of little faith”?",["The soldiers","The disciples","The fishermen","The Pharisees"],1,"QP 2013 (Kerala), QP 2019, QP 2022"],["What did the disciples realize about Jesus after the storm?",["He is a prophet like Isaiah","He is the king of Egypt","He is a good fisherman","He is the creator and controller of everything"],3,"QP 2022"],["Where should children cross the road safely?",["Behind a bus","In the middle of the road","Anywhere they like","At the Zebra line"],3,""],["When we are afraid, what does God say to us?",["\"Go back home.\"","\"Do not be afraid, I am with you.\"","\"Strike the rock.\"","\"Keep left.\""],1,""],["What is the Bible verse to learn in this lesson?",["\"For to me, living is Christ and dying is gain.\"","\"Here am I, send me.\"","\"I can do great things through Him who strengthens me.\"","\"Nothing will be impossible with God.\""],3,""],["What should we do to get rid of fear from our minds?",["Stay awake all night","Keep quiet and not tell anyone","Run away from danger","Pray to Jesus in strong faith"],3,"QP 2022"]]},{"t":"Chapter 11 – Repentance of Saul","q":[["To which city was Saul going to bring Christians as captives?",["Egypt","Antioch","Damascus","Canaan"],2,"QP 2022"],["Who is the first martyr of the Church?",["Paul","Lazarus","Peter","St. Stephen"],3,"QP 2013 (Kerala), QP 2018, QP 2021"],["What voice did Saul hear when he fell to the ground?",["\"Whom shall I send?\"","\"Peace! Be still!\"","\"Stand up and walk.\"","\"Saul, Saul, why do you persecute me?\""],3,"QP 2019, QP 2022"],["What happened to Saul's eyes after the bright light?",["He lost his eyesight","He saw angels","He could see very far","His eyes became red"],0,""],["The Lord commanded … to go and meet Saul in Damascus.",["Judas","Ananias","Stephen","Aaron"],1,"QP 2018, QP 2019, QP 2021"],["What fell from Saul's eyes when his sight came back?",["Drops of water","Something like scales of fish","Pieces of coal","Tears of joy"],1,""],["What was the name of Saul after his conversion (baptism)?",["Simon","John","Samuel","Paul"],3,"QP 2018, QP 2019, QP 2021"],["Which emperor killed St. Paul by sword in AD 67?",["Solomon","Pharaoh","Nero","Potiphar"],2,""],["On which date does the Church celebrate the commemoration of St. Paul and St. Peter every year?",["June 29","July 3","December 25","February 22"],0,"QP 2021"],["What is the Bible verse to learn in this lesson?",["\"My heart shall rejoice in your salvation.\"","\"Nothing will be impossible with God.\"","\"Here am I, send me.\"","\"For to me, living is Christ and dying is gain.\""],3,""],["In which year was St. Paul martyred?",["AD 52","AD 37","AD 70","AD 67"],3,"QP 2021"],["What did Saul do when Stephen, the first martyr, was stoned?",["He ran away to Damascus","He prayed for Stephen","He tried to save Stephen","He kept the clothes of those who stoned Stephen"],3,"QP 2018"],["How did Saul become a believer of Jesus Christ?",["The high priests asked him to follow Jesus","He realized his sins, repented, accepted Jesus as Lord and Saviour and was baptized","Stephen taught him before he died","He read about Jesus in a book in Jerusalem"],1,"QP 2018"],["In whose house did Saul stay for three days in Damascus?",["Stephen","Ananias","Joseph","Judas"],3,"QP 2019"],["Who laid his hands on Saul's head and prayed for him?",["Stephen","Ananias","Judas","Peter"],1,"QP 2013 (Kerala), QP 2022"],["\"Who are you, Lord?\" Who said this, and to whom?",["Ananias to Jesus","Isaiah to God","Saul to Jesus","Moses to God"],2,"QP 2013 (Kerala)"]]},{"t":"Chapter 12 – Disciples Receiving the Holy Spirit","q":[["On which day does the Church celebrate the Feast of Pentecost?",["25th day after Christmas","25th day after Easter","50th day after Christmas","50th day after Easter"],3,"QP 2019, QP 2021"],["The Jews celebrated Pentecost to remember what?",["Noah coming out of the ark","Moses receiving the Ten Commandments at Mount Sinai","Joseph becoming Prime Minister","Crossing the Red Sea"],1,""],["Where did the Holy Spirit descend on the apostles?",["In the house of Judas","In the House of Mark (Sehiyon Malika)","In Pharaoh's palace","In a boat on the lake"],1,"QP 2019"],["What sound came from heaven on the day of Pentecost?",["A sound like a crying baby","A sound like the rush of a violent wind","A sound like a trumpet","A sound like a bell"],1,""],["The Spirit of God descended on the apostles in the form of divided … tongues.",["golden","fire","water","silver"],1,"QP 2019, QP 2021"],["What happened to the apostles after receiving the Holy Spirit?",["They became bold to preach about Christ openly","They left Jerusalem secretly","They went back to fishing","They hid in the upper room out of fear"],0,"QP 2021"],["Through which sacraments did the Holy Spirit come upon us?",["Holy Ordination and Holy Matrimony","Holy Baptism and Holy Mooron","Holy Confession and Holy Anointing","Holy Matrimony and Holy Ordination"],1,"QP 2013 (Kerala), QP 2022"],["What did St. Peter say to the crippled beggar?",["\"In the name of Jesus Christ of Nazareth, stand up and walk.\"","\"Do not be afraid, I am with you.\"","\"Peace! Be still!\"","\"Here am I, send me.\""],0,""],["According to this lesson, which sins will not be forgiven?",["Sins of children","Sins of the past","Sins told in confession","Sins against the Holy Spirit"],3,""],["What is the Bible verse to learn in this lesson?",["\"Humble yourselves before the Lord, and He will lift you up.\"","\"The fear of the Lord is the beginning of wisdom.\"","\"Nothing will be impossible with God.\"","\"Do you know that you are God's temple and that God's Spirit dwells in you?\""],3,""],["Which major festival of the Jews was celebrated in remembrance of Moses receiving the Ten Commandments?",["Feast of Lights","Feast of Passover","Feast of Pentecost","Feast of Tabernacles"],2,"QP 2019"],["Which quality should a person who has received the Holy Spirit have?",["Mercy and compassion to everyone","Jealousy","Disobedience","Anger towards others"],0,"QP 2019"]]},{"t":"Chapter 13 – Education is the Richest Wealth","q":[["How did Solomon become wise?",["By travelling","By learning under teachers","By asking God","By reading books"],2,"QP 2021"],["God said He would give Solomon wisdom like what?",["The water in the sea","The stars in the sky","The sands of the seashore","The leaves on a tree"],2,""],["How many proverbs did Solomon say?",["Ten thousand","One thousand and five","Three thousand","Seven hundred"],2,""],["How many songs of praise did Solomon write?",["Three thousand","Five hundred","Twelve","One thousand and five"],3,""],["Why did two women come to King Solomon?",["They wanted gold","They wanted to learn songs","Both said the same living baby was theirs","They lost their house"],2,""],["What did Solomon ask the guard to bring?",["A lamp","A crown","A sword","A cup of water"],2,""],["How did Solomon know who the true mother was?",["She came first","She was older","She begged him not to kill the baby","She cried loudly"],2,"QP 2019"],["What helped Solomon to do justice?",["His army","His money","His palace","God's wisdom"],3,"QP 2022"],["Which of these helps us gain Divine Wisdom, according to the lesson?",["Newspaper","Computer","Television","Sunday School learning"],3,""],["What is the Bible verse to learn in this lesson?",["\"Here am I, send me.\"","\"Do you know that you are God's temple?\"","\"My heart shall rejoice in your salvation.\"","\"The fear of the Lord is the beginning of wisdom.\""],3,""],["Which king is known for his wisdom?",["David","Saul","Pharaoh","Solomon"],3,"QP 2022"]]}]},{"n":"Church History","units":[{"t":"Questions 5 – 11","q":[["Who was called to the group of apostles?",["Moses","Stephen","St. Paul","Ananias"],2,"QP 2019"],["Why is St. Peter called the 'Head of the Apostles'?",["He was the oldest apostle","He was a king","Christ Himself entrusted him to administer the Church","He wrote all the Gospels"],2,""],["Who preached the Gospel in India?",["St. Thomas","St. Peter","St. Jude","St. John"],0,"QP 2013 (Kerala), QP 2018, QP 2021"],["Where did St. Peter establish the Holy Throne of Apostolic Succession?",["Antioch","Damascus","Jerusalem","Rome"],0,"QP 2021"],["In which year did St. Peter establish the Holy Apostolic Throne?",["A.D. 37","A.D. 67","A.D. 50","A.D. 29"],0,""],["The successors of St. Peter are known as the Patriarch of Antioch and ___?",["All of Kerala","All of Egypt","All the West","All the East"],3,""],["The successors of St. Peter are called His Holiness Moran Mor ___.",["Thoma","Athanasius","Baselios","Ignatius"],3,""],["On which date does the Church celebrate the establishment of the Holy Apostolic Throne in Antioch?",["August 15","December 25","February 22","June 29"],2,""],["Who is the present Catholicos of our Church?",["His Holiness Moran Mor Ignatius Aphrem II","St. Paulose Mor Athanasius","Moran Mor Ignatius Elias III","His Beatitude Aboon Mor Baselios Joseph I"],3,"QP 2013 (Kerala), QP 2021"],["Who is called the 'Head of the Apostles'?",["St. Paul","St. John","St. Thomas","St. Peter"],3,"QP 2021"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Name the apostle who preached the Gospel in India.","o":["St. Jude","St. Peter","St. Thomas","St. John"],"a":2},{"q":"How many proverbs did Solomon say?","o":["Two thousand","Five thousand","One thousand","Three thousand"],"a":3},{"q":"Where did God give the Ten Commandments to Moses?","o":["Mount Sinai","Mount Moriah","Mount Nebo","Mount Tabor"],"a":0},{"q":"On which day does the Church celebrate the Feast of Pentecost?","o":["25th day after Christmas","25th day after Easter","50th day after Christmas","50th day after Easter"],"a":3}],"name":[{"q":"Whom did Pharaoh first call to explain his dreams?","a":"All the magicians and wise men of Egypt"},{"q":"Name the brother of Moses.","a":"Aaron"},{"q":"What name did Saul receive after his baptism?","a":"Paul"},{"q":"Which emperor killed St. Paul by the sword?","a":"Emperor Nero"}],"tf":[{"q":"When Moses stretched out his hand over the Red Sea, the waters stood like a wall on the right and on the left.","a":true},{"q":"After receiving the Holy Spirit, the apostles became bold to preach about Christ openly.","a":true},{"q":"Potiphar put Joseph in prison because Joseph stole his money.","a":false},{"q":"The men travelling with Saul saw Jesus clearly.","a":false}],"fill":[{"q":"The present Catholicos of our Church is His Beatitude Aboon Mor Baselios ______.","a":"Joseph I"},{"q":"\"My heart shall rejoice in your ______.\" (Psalm 13:5)","a":"salvation"},{"q":"God gave Solomon wisdom and broadmindedness like the ______ of the seashore.","a":"sands"},{"q":"\"Nothing will be ______ with God.\" (St. Luke 1:37)","a":"impossible"}],"short":[{"q":"How did Pharaoh honour Joseph after he interpreted the dream?","a":"Pharaoh made Joseph the Prime Minister of Egypt, put his signet ring on Joseph's hand, dressed him in garments of fine linen, put a gold chain around his neck and let him ride in his chariot.","ref":"Class III textbook, Chapter 3 – The Prime Minister of Egypt"},{"q":"What happened when Jesus rebuked the wind and the waves?","a":"When Jesus rebuked the wind and the raging waves, the wind ceased and there was a dead calm in the sea.","ref":"Class III textbook, Chapter 10 – Jesus Calms the Storm"},{"q":"Why is St. Peter called the 'Head of the Apostles'?","a":"St. Peter is called the 'Head of the Apostles' because Christ Himself entrusted him to administer the Church for Jesus Christ.","ref":"Class III textbook, Church History, Question 6"}],"detail":[{"q":"Explain the vision seen by prophet Isaiah.","a":"Isaiah saw the Lord sitting on a throne, high and lofty, and the hem of His robe filled the temple; Seraphs with six wings praised Him, singing, \"Holy, Holy, Holy is the Lord of hosts; the whole earth is full of His glory\"; Isaiah said, \"I am a sinful person\", and a Seraph touched his mouth with a live coal from the altar and his sins were blotted out; God asked, \"Whom shall I send?\" and Isaiah replied, \"Here am I; send me!\"","ref":"Class III textbook, Chapter 6 – Vision of Isaiah"},{"q":"Write any three of the Ten Commandments.","a":"I am the Lord your God, you shall have no other gods before me; remember the Sabbath day, and keep it holy; honour your father and your mother; you shall not murder; you shall not steal (any three).","ref":"Class III textbook, Chapter 4 – Moses: The Leader of Israel"},{"q":"What qualities should a person who has received the Holy Spirit have?","a":"Live our life witnessing Christ; behave with everyone properly in love; have mercy, compassion and patience towards everyone; do not commit sins against the Holy Spirit, and keep away from every evil with the power of the Holy Spirit.","ref":"Class III textbook, Chapter 12 – Disciples Receiving the Holy Spirit"}],"speech":[{"q":"The journey of the Israelites from Egypt to Canaan","a":"God chose Moses to lead the Israelites out of Egypt, and he led them towards the Promised Land of Canaan; by day God covered the sun with a pillar of cloud, and by night He went before them in a pillar of fire; at the Red Sea, Moses stretched out his hand and the waters divided, and Israel crossed on dry land while Pharaoh's army was drowned; in the wilderness God gave them manna from heaven and quail for meat; when they were thirsty, Moses struck the rock with his staff and water flowed out; God protected His people in the wilderness for forty years – God is always caring about His people.","ref":"Class III textbook, Chapter 5 – God Providing Water from the Rock"},{"q":"The wisdom of Solomon to do justice","a":"God appeared to King Solomon in a dream, and Solomon asked for a heart of wisdom to govern his people justly; two women came to Solomon, each saying the living baby was hers; Solomon asked for a sword and ordered the living baby to be divided into two; the first woman pleaded, \"Please do not kill my living baby. Let her have the child\", but the second said, \"Divide it\"; Solomon gave the baby to the first woman, saying no mother lets her child be killed; it was God's wisdom that helped Solomon to do justice – \"The fear of the Lord is the beginning of wisdom.\"","ref":"Class III textbook, Chapter 13 – Education is the Richest Wealth"}]}},{"no":2,"s":{"mcq":[{"q":"On which date does the Church celebrate the establishment of the Holy Apostolic Throne in Antioch?","o":["February 22","August 15","June 29","December 25"],"a":0},{"q":"Which two officials of Pharaoh were in prison with Joseph?","o":["The chief cook and the chief barber","The chief soldier and the chief judge","The chief cupbearer and the chief baker","The chief priest and the chief magician"],"a":2},{"q":"Where was prophet Isaiah born?","o":["In a prison","In a boat","In a palace","In a desert"],"a":2},{"q":"Where did the Holy Spirit descend on the apostles?","o":["In the Temple at Jerusalem","In the House of Mark (Sehiyon Malika)","By the Lake of Galilee","On Mount Sinai"],"a":1}],"name":[{"q":"Who was called to the group of apostles?","a":"St. Paul"},{"q":"Name the sea which was divided into two when Moses stretched out his hand over it.","a":"The Red Sea"},{"q":"What did Pharaoh take from his own hand and put on Joseph's hand?","a":"His signet ring"},{"q":"Who laid his hands on Saul's head and prayed for him?","a":"Ananias"}],"tf":[{"q":"St. Peter established the Holy Apostolic Throne in Antioch in A.D. 37.","a":true},{"q":"Pharaoh let the Israelites leave Egypt very happily.","a":false},{"q":"Solomon wrote three hundred songs of praise.","a":false},{"q":"Saul lost his eyesight after the light from heaven flashed around him.","a":true}],"fill":[{"q":"Obeying God, Moses lifted up his ______ and stretched out his hand over the sea.","a":"staff"},{"q":"Jesus rebuked the wind and the waves, saying, \"______! Be still!\"","a":"Peace"},{"q":"Hearing the apostles preach, many people believed in Christ, and the apostles ______ them.","a":"baptized"},{"q":"The Ten Commandments on the stone tablets were written with the ______ of God.","a":"fingers"}],"short":[{"q":"What was the voice heard by Saul when he fell to the ground?","a":"Saul heard a voice saying, \"Saul, Saul, why do you persecute me?\" – it was Jesus, whom he was persecuting.","ref":"Class III textbook, Chapter 11 – Repentance of Saul"},{"q":"How did God help the Israelites in their journey?","a":"God covered the sun by day with a pillar of cloud and went in front of them by night in a pillar of fire to give them light and protect them from the cold.","ref":"Class III textbook, Chapter 5 – God Providing Water from the Rock"},{"q":"How did the Seraph make the prophet Isaiah pure?","a":"A Seraph flew down with a live coal taken from the altar with a pair of tongs and touched Isaiah's mouth with it, and his sins were blotted out.","ref":"Class III textbook, Chapter 6 – Vision of Isaiah"}],"detail":[{"q":"What was Pharaoh's dream and what did it mean?","a":"Pharaoh dreamt of seven good cows and seven ugly cows; Joseph prayed to God and explained the dream; the seven good cows are seven good years with great harvest, and the seven ugly cows are seven years of famine; if food is stored properly in the good years, it will be a reserve for the years of famine.","ref":"Class III textbook, Chapter 3 – The Prime Minister of Egypt"},{"q":"What did Solomon ask God, and what did God give him?","a":"One night God appeared to King Solomon in a dream and asked what He should give him; Solomon asked for a heart of wisdom to govern his people justly, discerning good and evil; because he did not ask for wealth or riches, God gave him great wisdom and broadmindedness like the sands of the seashore; Solomon then said three thousand proverbs and wrote one thousand and five songs of praise.","ref":"Class III textbook, Chapter 13 – Education is the Richest Wealth"},{"q":"What are the things to be done to get rid of fear from our minds?","a":"Pray to Jesus in strong faith, and the fear in our mind will go away; walk faithfully with Jesus, holding His hands; remember that God says, \"Do not be afraid, I am with you\"; no danger will come to us if Jesus is with us.","ref":"Class III textbook, Chapter 10 – Jesus Calms the Storm"}],"speech":[{"q":"The evils which destroy us","a":"Smoking, drinking, jealousy, disobedience and anger are evils which destroy us; we are God's temple and God's Spirit dwells in us (1 Corinthians 3:16); we received the Holy Spirit through Holy Baptism and Holy Mooron; sins against the Holy Spirit will not be forgiven; with the power of the Holy Spirit we must abstain from every evil; we should live witnessing Christ, with love, mercy and patience.","ref":"Class III textbook, Chapter 12 – Disciples Receiving the Holy Spirit"},{"q":"Moses – a good leader","a":"God chose Moses, who was obedient and God-fearing, as the leader of Israel; God appeared to him in a burning bush and sent him to bring the Israelites out of Egypt; though Moses was slow of speech, he obeyed, and God sent his brother Aaron with him; Moses led the people out of Egypt to Canaan; on Mount Sinai God gave him the Ten Commandments on two tablets of stone; a good leader has humility, meekness, fear of God, obedience and sacrifice – \"I can do great things through Him who strengthens me.\"","ref":"Class III textbook, Chapter 4 – Moses: The Leader of Israel"}]}},{"no":3,"s":{"mcq":[{"q":"Which commandment says, \"Remember the Sabbath day, and keep it holy\"?","o":["The second commandment","The fourth commandment","The tenth commandment","The first commandment"],"a":1},{"q":"Across which lake was Jesus travelling when he calmed the storm?","o":["The Dead Sea","The Red Sea","The Lake of Galilee","The river Jordan"],"a":2},{"q":"Who is the first martyr of the Church?","o":["St. Stephen","St. Paul","Lazarus","St. Peter"],"a":0},{"q":"Which king is known for his wisdom?","o":["Pharaoh","Solomon","Saul","David"],"a":1}],"name":[{"q":"In his vision, where did Isaiah see the Lord sitting?","a":"On a throne, high and lofty"},{"q":"Who healed the crippled beggar, saying, \"In the name of Jesus Christ of Nazareth, stand up and walk\"?","a":"St. Peter"},{"q":"Who interpreted the dreams of Pharaoh?","a":"Joseph"},{"q":"In Isaiah's vision, what filled the temple?","a":"The hem of the Lord's robe"}],"tf":[{"q":"St. John is called the 'Head of the Apostles'.","a":false},{"q":"The angel Seraphs had six wings.","a":true},{"q":"Moses struck the rock with his staff and water flowed out of it.","a":true},{"q":"Solomon asked God for great wealth and riches.","a":false}],"fill":[{"q":"The successors of St. Peter are called His Holiness Moran Mor ______.","a":"Ignatius"},{"q":"\"I can do great things through Him who ______ me.\" (Philippians 4:13)","a":"strengthens"},{"q":"\"For to me, living is ______ and dying is gain.\" (Philippians 1:21)","a":"Christ"},{"q":"On the day of Pentecost, there came from heaven a sound like the rush of a violent ______.","a":"wind"}],"short":[{"q":"Why did Pharaoh allow the Israelites to go from Egypt?","a":"Because Pharaoh did not obey God, his elder son and every firstborn in Egypt died, and Pharaoh, afraid of God, told Moses and the Israelites to go.","ref":"Class III textbook, Chapter 4 – Moses: The Leader of Israel"},{"q":"When did we receive the Holy Spirit?","a":"We received the Holy Spirit through Holy Baptism and Holy Mooron.","ref":"Class III textbook, Chapter 12 – Disciples Receiving the Holy Spirit"},{"q":"Name any three ways by which we can gain divine wisdom.","a":"We gain divine wisdom through the Bible, prayer, worshipping God, Sunday School learning, Bible conventions, doing good things and the fear of God (any three).","ref":"Class III textbook, Chapter 13 – Education is the Richest Wealth"}],"detail":[{"q":"How did St. Paul become a believer of Jesus Christ?","a":"Saul persecuted Christians, and on his way to Damascus a light from heaven flashed and Jesus said, \"Saul, Saul, why do you persecute me?\"; he lost his sight and stayed three days in the house of Judas, praying without food or drink; Ananias laid his hands on him and prayed, and something like scales of fish fell from his eyes and his sight was restored; Saul repented, accepted Jesus as his Lord and Saviour, was baptized and received the name 'Paul'.","ref":"Class III textbook, Chapter 11 – Repentance of Saul"},{"q":"Tell what happened to the chief cupbearer and the chief baker in the prison with Joseph.","a":"The chief cupbearer and the chief baker both had dreams and were sad because no one could interpret them; Joseph said, \"Don't all interpretations belong to God?\"; he prayed and explained that the baker would be hanged and the cupbearer would get his job back within three days; on the third day it happened just as Joseph had said.","ref":"Class III textbook, Chapter 3 – The Prime Minister of Egypt"},{"q":"How did God save the Israelites at the Red Sea?","a":"Pharaoh's army chased the Israelites, and at the Red Sea they wept in great anxiety; obeying God, Moses lifted his staff and stretched out his hand over the sea; the waters divided like a wall on the right and the left, and Israel crossed on dry land; when Pharaoh's army entered, the waters came back and covered them, and not one escaped.","ref":"Class III textbook, Chapter 5 – God Providing Water from the Rock"}],"speech":[{"q":"\"Do not be afraid, I am with you\" – Jesus calms the storm","a":"Jesus and his disciples were crossing the Lake of Galilee in a boat, and Jesus fell asleep on a cushion in the stern; a windstorm came and the boat was filling with water; the frightened disciples woke him, crying, \"Master, Master, don't you care that we are perishing?\"; Jesus rebuked the wind and the waves, \"Peace! Be still!\", and there was a dead calm; he asked, \"Why are you afraid, you of little faith?\", and they realised Jesus is the creator and controller of everything; God says, \"Do not be afraid, I am with you\" – when we pray with strong faith, our fear goes away.","ref":"Class III textbook, Chapter 10 – Jesus Calms the Storm"},{"q":"\"Here am I, send me\" – how we can show God to others","a":"God called Isaiah, asking, \"Whom shall I send?\", and he answered, \"Here am I; send me!\"; Isaiah told the Israelites the will of God and led them in the paths of the Lord; like Isaiah we can show God to others by sharing the love of God with our friends; by helping those who are struggling; by keeping away from bad habits and encouraging others to get out of their bad habits; by living a good model life.","ref":"Class III textbook, Chapter 6 – Vision of Isaiah"}]}},{"no":4,"s":{"mcq":[{"q":"Where did St. Peter establish the Holy Throne of Apostolic Succession?","o":["Damascus","Jerusalem","Antioch","Rome"],"a":2},{"q":"In Pharaoh's dream, what did the seven ugly cows mean?","o":["Seven rivers of Egypt","Seven years of good harvest","Seven years of famine","Seven kings of Egypt"],"a":2},{"q":"On which date does the Church commemorate St. Peter and St. Paul every year?","o":["December 25","February 22","June 29","January 6"],"a":2},{"q":"Who were leading the Israelites through the wilderness?","o":["Joseph and Jacob","Saul and Samuel","Moses and Aaron","Peter and Paul"],"a":2}],"name":[{"q":"To which land did Moses lead the Israelites after freeing them from Pharaoh?","a":"Canaan"},{"q":"How did God appear to King Solomon?","a":"In a dream (at night)"},{"q":"To whom did the Midianite traders sell Joseph?","a":"Potiphar"},{"q":"Who advise the Will of God to us today?","a":"Metropolitans and priests (the clergy)"}],"tf":[{"q":"God gave the Israelites manna from heaven to eat.","a":true},{"q":"When Moses first asked, Pharaoh agreed at once to let the Israelites go.","a":false},{"q":"In Damascus, Saul stayed in the house of Ananias for three days.","a":false},{"q":"Sins against the Holy Spirit will not be forgiven.","a":true}],"fill":[{"q":"The successors of St. Peter are known as the Patriarch of Antioch and All the ______.","a":"East"},{"q":"In the boat, Jesus fell asleep on a ______ in the stern.","a":"cushion"},{"q":"God provided the Israelites with ______ for meat.","a":"quail"},{"q":"God said, \"Whom shall I ______, and who will go for us?\"","a":"send"}],"short":[{"q":"Whom did Jesus call \"You of little faith\"? Why?","a":"Jesus called his disciples 'you of little faith' because they were afraid during the storm and did not have faith.","ref":"Class III textbook, Chapter 10 – Jesus Calms the Storm"},{"q":"Why did Potiphar put Joseph in prison?","a":"Potiphar believed his wife's lies about Joseph and put him in prison.","ref":"Class III textbook, Chapter 3 – The Prime Minister of Egypt"},{"q":"Where is the tomb of the Patriarch Moran Mor Ignatius Elias III? Why do pilgrims go there?","a":"The tomb of Patriarch Moran Mor Ignatius Elias III is at Manjanikkara, and pilgrims go there to visit his tomb and seek his intercession and blessings.","ref":"Class III textbook, Chapter 5 – God Providing Water from the Rock"}],"detail":[{"q":"How could we show God to others, like prophet Isaiah?","a":"By sharing the love of God with our friends; by helping those who are struggling; by keeping away from bad habits and encouraging others to get out of their bad habits; by living a good model life.","ref":"Class III textbook, Chapter 6 – Vision of Isaiah"},{"q":"What happened on the day of Pentecost?","a":"On the day of Pentecost the disciples were praying together in the House of Mark (Sehiyon Malika); suddenly a sound like the rush of a violent wind came from heaven and filled the house; divided tongues, as of fire, rested on each of them – it was the Holy Spirit; their fear was gone, and they preached Christ, baptized many and healed the sick.","ref":"Class III textbook, Chapter 12 – Disciples Receiving the Holy Spirit"},{"q":"When God sent Moses to Pharaoh, what did Moses say, and how did God help him?","a":"God appeared to Moses in a burning bush and said He would send him to Pharaoh to bring the Israelites out of Egypt; Moses said, \"Who am I that I should go to Pharaoh? I am slow of speech and slow of tongue\"; God said, \"I will be with your mouth and teach you what you are to speak\"; God told him to take his brother Aaron to speak for him to the people.","ref":"Class III textbook, Chapter 4 – Moses: The Leader of Israel"}],"speech":[{"q":"Jesus is my Saviour – the story of St. Paul","a":"Saul was a Roman citizen who persecuted Christians and kept the clothes of those who stoned Stephen; on the way to Damascus Jesus spoke to him, \"Saul, Saul, why do you persecute me?\"; Ananias prayed for him, his sight came back, and he repented and accepted Jesus Christ as his Lord and Saviour; he was baptized, received the name Paul and became an apostle – the persecutor became the nourisher of the Church; he preached the gospel in different parts of the earth and was martyred by Emperor Nero in AD 67; \"For to me, living is Christ and dying is gain\" (Philippians 1:21).","ref":"Class III textbook, Chapter 11 – Repentance of Saul"},{"q":"Divine wisdom – \"The fear of the Lord is the beginning of wisdom\"","a":"\"The fear of the Lord is the beginning of wisdom\" (Proverbs 1:7); Solomon asked God only for wisdom, not wealth, and God gave him great wisdom; with God's wisdom Solomon did justice for the two women and the baby; worldly knowledge comes from education, good books, newspapers, the library and computers; divine wisdom comes from the Bible, prayer, worshipping God, Sunday School learning and doing good things; let us pray for God's grace to live according to His will, discerning good and evil.","ref":"Class III textbook, Chapter 13 – Education is the Richest Wealth"}]}},{"no":5,"s":{"mcq":[{"q":"Why did the Israelites cry aloud and pray to God in Egypt?","o":["Their king had died","They had no water to drink","They had lost their way","The Egyptians made them do forced labour"],"a":3},{"q":"To whom did Joseph's brothers sell him?","o":["Pharaoh","Egyptian soldiers","Potiphar","Midianite traders"],"a":3},{"q":"______ was the father of prophet Isaiah.","o":["Aaron","Amos","Moses","Daniel"],"a":1},{"q":"In which year was St. Paul martyred?","o":["AD 33","AD 37","AD 67","AD 100"],"a":2}],"name":[{"q":"Who is the present Patriarch of Antioch and All the East?","a":"His Holiness Moran Mor Ignatius Aphrem II"},{"q":"Name the major festival of the Jews celebrated in remembrance of Moses receiving the Ten Commandments.","a":"The Feast of Pentecost"},{"q":"On what were the Ten Commandments written?","a":"On two tablets of stone"},{"q":"What did King Solomon ask the guard to bring when the two women came to him?","a":"A sword"}],"tf":[{"q":"Saul kept the clothes of those who stoned Stephen.","a":true},{"q":"Joseph was set free from the prison as soon as the cupbearer got his job back.","a":false},{"q":"Children should cross the road at the Zebra line.","a":true},{"q":"Prophet Isaiah was born in a poor shepherd's hut.","a":false}],"fill":[{"q":"Joseph, who interpreted dreams, was the son of ______.","a":"Jacob"},{"q":"The disciples realised that Jesus is the creator and ______ of everything.","a":"controller"},{"q":"\"The fear of the Lord is the beginning of ______.\" (Proverbs 1:7)","a":"wisdom"},{"q":"In ancient times, God made His will known to His people through ______ like Isaiah.","a":"prophets"}],"short":[{"q":"How did Saul get his eyesight back?","a":"Ananias came to the house of Judas, laid his hands on Saul and prayed, and immediately something like scales of fish fell from his eyes and his sight was restored.","ref":"Class III textbook, Chapter 11 – Repentance of Saul"},{"q":"What did Isaiah say when he saw the glory of God?","a":"Isaiah said, \"Oh! I am a sinful person; yet my eyes have seen the King, the Lord of hosts!\"","ref":"Class III textbook, Chapter 6 – Vision of Isaiah"},{"q":"What did Solomon do after receiving divine wisdom?","a":"Solomon said three thousand proverbs, wrote one thousand and five songs of praise and described plants, trees, birds, animals, reptiles and fishes, so people from around the world came to learn his wisdom.","ref":"Class III textbook, Chapter 13 – Education is the Richest Wealth"}],"detail":[{"q":"What happened when Jesus and his disciples were crossing the Lake of Galilee?","a":"Jesus fell asleep on a cushion in the stern of the boat, and a windstorm came and the boat was filling with water; the disciples woke him, shouting, \"Master, Master, don't you care that we are perishing?\"; Jesus rebuked the wind and the waves, \"Peace! Be still!\", and there was a dead calm; he said, \"Why are you afraid, you of little faith?\", and the disciples realised he is the creator and controller of everything.","ref":"Class III textbook, Chapter 10 – Jesus Calms the Storm"},{"q":"Write about St. Peter and the Holy Apostolic Throne of Antioch.","a":"St. Peter is the Head of the Apostles because Christ entrusted him to administer the Church; he established the Holy Throne of Apostolic Succession in Antioch in A.D. 37; the Church celebrates its establishment on February 22; his successors are known as His Holiness Moran Mor Ignatius, Patriarch of Antioch and All the East – now H.H. Moran Mor Ignatius Aphrem II.","ref":"Class III textbook, Church History, Questions 6, 8, 9 and 10"},{"q":"How did God give food and water to the Israelites in the wilderness?","a":"When the Israelites had no food, they complained and Moses prayed to God; God gave them manna from heaven to eat and quail for meat; when they were thirsty, God told Moses, \"Strike the rock with the staff in your hand\", and water flowed out of the rock; so God protected His people in the wilderness for forty years.","ref":"Class III textbook, Chapter 5 – God Providing Water from the Rock"}],"speech":[{"q":"\"Humble yourselves before the Lord, and He will lift you up\" – Joseph","a":"Joseph was sold to Potiphar in Egypt and put in prison because of lies, though he was innocent; in prison he said, \"Don't all interpretations belong to God?\" and explained the dreams of the cupbearer and the baker; later he prayed and interpreted Pharaoh's dream of the seven good and seven ugly cows; Pharaoh made him Prime Minister of Egypt and gave him his signet ring, fine linen, a gold chain and his chariot; God lifted him up from a prison to a Prime Minister because of his obedience, brotherly love, fear of God, humbleness and good conduct; God will lift up in honour those who are God-fearing and good in character – \"Humble yourselves before the Lord, and He will lift you up.\"","ref":"Class III textbook, Chapter 3 – The Prime Minister of Egypt"},{"q":"The Holy Spirit dwells in us","a":"On the day of Pentecost the Holy Spirit came on the apostles in the form of divided tongues of fire; their fear went away and they preached about Christ with the power of the Holy Spirit; we received the Holy Spirit through Holy Baptism and Holy Mooron; \"Do you know that you are God's temple and that God's Spirit dwells in you?\" (1 Corinthians 3:16); we should live witnessing Christ, with love, mercy, compassion and patience; we must not commit sins against the Holy Spirit, because they will not be forgiven.","ref":"Class III textbook, Chapter 12 – Disciples Receiving the Holy Spirit"}]}}]},{"c":"IV","sections":[{"n":"Old Testament","units":[{"t":"Chapter 3 – Ten Plagues","q":[["What is the Bible reference for the chapter 'Ten Plagues'?",["Exodus 7 – 12","1 Kings 21","Genesis 11: 1-9","Judges 13 – 14"],0,""],["Complete the Bible verse to learn: \"There is salvation in no one else, for there is no other ______ under heaven given to men by which we must be saved.\"",["name","temple","law","king"],0,""],["Where is the Bible verse \"There is salvation in no one else...\" taken from?",["Proverbs 9:10","Romans 6:23","Romans 14:9","Acts 4:12"],3,""],["How many plagues did God send upon Egypt?",["Five","Ten","Twelve","Seven"],1,"QP 2021"],["God sent the plagues upon the people of which land?",["Egypt","Babylon","Canaan","Philistia"],0,""],["Whom did God entrust to tell His command to Pharaoh?",["Moses and Aaron","Nathan and Zadok","Elijah and Jehu","Samson and Manoah"],0,""],["What was the first plague God sent upon Egypt?",["Frogs","Darkness","Water turned to blood","Locusts"],2,"QP 2021, QP ","They gouged out both his eyes and bound him with bronze shackles"],3,""],["Samson was tied to a pillar in the temple of which god?",["Molech","Dagon","Baal","Asherah"],1,"QP 2022"],["How many Philistines were crushed when Samson pulled down the temple?",["Thirty","One thousand","Three thousand","Three hundred"],2,""],["What was the reason for Samson's defeat?",["He lost his sword","He forgot God and lived in wicked ways","He was too old to fight","He had no strength from birth"],1,"QP 2022"],["Which of these is shown in the book as another judge of Israel?",["Gideon","Elijah","Nathan","Solomon"],0,""],["Where did the divine power of Samson rest?",["On the seven locks of his hair","In his eyes","In his sword","In his hands"],0,"QP 2021"]]},{"t":"Chapter 5 – Wisest of the Wise Men","q":[["What is the Bible reference for 'Wisest of the Wise Men'?",["1 Kings 1 - 12","Judges 13 – 14","Exodus 7 – 12","1 Kings 21"],0,""],["Complete the Bible verse to learn: \"The knowledge of the Holy One is ______.\" (Proverbs 9:10)",["wealth","prudence","power","glory"],1,""],["Who is known as the wisest of the wise men?",["Solomon","Isaac","Jacob","Noah"],0,"QP 2021, QP 2022"],["Who was the father of Solomon?",["Jehu","Isaac","King David","Manoah"],2,""],["Who was Solomon's mother who asked King David to make him king?",["Elizabeth","Delilah","Bathsheba","Jezebel"],2,"QP 2022"],["Who anointed Solomon as the new king of Israel?",["Moses and Aaron","Prophet Elijah","Priest Zadok and Prophet Nathan","Samuel and Gideon"],2,""],["Since Solomon asked only for wisdom, what did God do?",["He took away his kingdom","He was pleased and granted him every other blessing too","He made him a prophet","He gave him nothing more"],1,""],["Solomon wrote about trees from the cedar in Lebanon to the ______ that grows in the walls.",["vine","hyssop","olive","fig"],1,""],["Which is the Proverb of Solomon about wisdom given in the book?",["Your faith has saved you.","The fear of the Lord is the beginning of Wisdom.","The wages of sin is death.","Unless the Lord builds the house, those who build it labour in vain."],1,""],["Who built the Jerusalem Temple?",["King David","King Ahab","King Solomon","Hiram, the king of Tyre"],2,"QP 2013 (Kerala), QP 2021"],["Who provided all the wood for the House of the Lord?",["Jehu, the king of Israel","Hiram, the king of Tyre","Ahab, the king of Israel","Pharaoh, the king of Egypt"],1,""],["How many years did it take to build the Jerusalem Temple?",["3","5","7","9"],2,"QP 2022"],["Into how many parts was the Jerusalem Temple divided?",["Seven","Three","Four","Two"],1,"QP 2021, QP 2022"],["Where was the Tabernacle of God placed in the Temple?",["In the Holy of Holies","At the gate","In the king's palace","In the Outer Court"],0,""],["Why was every material finished at the quarry before bringing it to Jerusalem?",["So that it would be ready in one day","So that no sound of hammer, axe or iron tool would be heard there","So that it would cost less","So that the king could check it"],1,""],["Building the Jerusalem Temple was the lifelong dream of whom?",["Hiram","Bathsheba","King David","Prophet Nathan"],2,""],["At what age did Solomon die?",["40","60","92","120"],1,""],["What happened to Solomon's kingdom after his death?",["It was given to Hiram","It got divided","It was ruled by Philistines","It became the largest kingdom"],1,"QP 2022"],["Which of these was a reason for God's anger on Solomon?",["He built the Jerusalem Temple","He wrote about birds and animals","He built temples for other gods and worshipped them","He asked God for wisdom"],2,""],["Which king of Israel asked God only for a wise and discerning heart?",["Solomon","David","Jehu","Ahab"],0,"QP 2021, QP 2022"],["Who succeeded King David as the king of Israel?",["Ahab","Solomon","Nathan","Samson"],1,"QP 2022"],["Which book of the Bible is matched with Solomon as its author?",["Judges","Ecclesiastes","Genesis","Psalms"],1,"QP 2022"],["The Jerusalem Temple had three parts: the Holy of Holies, the Holy Place and the ______.",["Outer Court","Royal Palace","Upper Room","Watch Tower"],0,"QP 2022"]]},{"t":"Chapter 6 – Naboth's Vineyard","q":[["What is the Bible reference for 'Naboth's Vineyard'?",["1 Kings 21","Exodus 7 – 12","1 Kings 1 - 12","St. Luke 7: 36-50"],0,""],["Complete the Bible verse to learn: \"The wages of sin is ______.\" (Romans 6:23)",["sickness","poverty","sorrow","death"],3,""],["Who was the king of Israel in this story?",["Ahab","Solomon","David","Jehu"],0,"QP 2021"],["For how many years did King Ahab rule Israel?",["7 years","20 years","22 years","40 years"],2,""],["Who was the wife of King Ahab?",["Martha","Bathsheba","Jezebel","Delilah"],2,"QP 2021, QP 2022"],["Where was Naboth's vineyard?",["In the valley of Sorek","Near the palace of King Ahab","Near the river Jordan","In Bethany"],1,""],["Why did King Ahab want Naboth's vineyard?",["To build a temple","To make a vegetable garden because it was near his house","To give it to the prophets","To plant olive trees"],1,"QP 2022"],["Why did Naboth refuse to give his vineyard to the king?",["It was his ancestral inheritance, and the Lord forbade giving it","He wanted to sell it to someone else","He was going to build a house there","The king offered too little money"],0,""],["What did King Ahab do after Naboth refused?",["He went to war with the Philistines","He gave Naboth a better vineyard","He lay on his bed, turned his face away and would not eat","He went to the temple to pray"],2,"QP 2022"],["What false charge was made against Naboth?",["That he had killed a prophet","That he had burned the king's fields","That he had cursed God and the king","That he had stolen the king's horse"],2,""],["How was Naboth killed?",["He was stoned to death","He was killed by a lion","He was killed in battle","He was thrown from a window"],0,""],["Which prophet did God send to warn King Ahab?",["Moses","Elijah","Samuel","Nathan"],1,"QP 2021, QP 2022"],["What did Elijah say would happen to
