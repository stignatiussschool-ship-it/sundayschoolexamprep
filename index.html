y","Nizeebeen","Siz in Antioch"],1,""],["At what age did Bar Ebraya migrate to Antioch?",["17 years","20 years","24 years","38 years"],0,""],["At what age was Bar Ebraya ordained a Metropolitan?",["17","20","24","38"],1,""],["At what age was Bar Ebraya installed as Catholicose of the East?",["20","24","38","40"],2,""],["Where was the seat of the Catholicose in Bar Ebraya's time?",["Mosul","Tigris","Aleppo","Antioch"],1,""],["How many metropolitans did Bar Ebraya ordain?",["3","7","12","20"],2,""],["Into which language was the world history written by Bar Ebraya in Syriac translated?",["Malayalam","Arabic","Greek","Latin"],1,""],["Bar Ebraya wrote interpretations on the Old and New Testament except which book?",["Revelations","Genesis","Psalms","St Mathew"],0,""],["Which of these is a book composed by Bar Ebraya relating to ascetic life?",["The Magna Carta","The Padiyola","Dove","The Thubden"],2,""],["Who wrote the Hudaya Canon, the approved canon of the holy church?",["Mathews Mor Athanasius","Mor Simeon Desthuno","Mor Aprem","Bar Ebraya"],3,"QP 2013 (Kerala), QP 2017, QP 2018, QP 2021, QP 2022"],["In which languages are the compositions of Bar Ebraya?",["Syriac and Arabic","Greek and Latin","Hebrew and Arabic","Syriac and Greek"],0,"QP 2016"],["Bar Ebraya is known as",["Sea of Knowledge","Harp of the Holy Ghost","Sea of Spirit","Sea of Literature"],0,"QP 2013 (Kerala), QP 2016, QP 2017, QP 2018, QP 2022"],["When did Bar Ebraya expire?",["1 January 1226","17 July 459","30 July 1286","373 AD"],2,""],["Where is Bar Ebraya entombed?",["In the big church in Antioch","In the monastery of Mor Mathew in Mosul","In Malattia","In Tigris"],1,""],["Which of these subjects did Bar Ebraya write books on?",["Astronomy","Medicine for animals","Fishing","Farming"],0,"QP 2017"]]}]}],"papers":[{"no":1,"s":{"mcq":[{"q":"Who was the leader of the group who first returned to Jerusalem?","o":["Serubabel","Nehemiah","Artaxerxes","Esra"],"a":0},{"q":"What did King Ahasuerus do when Esther came before him uninvited?","o":["Held out his sword","Held out his hand","Held out his golden scepter","Held out his crown"],"a":2},{"q":"How did the rich young man address Jesus?","o":["Lord","King","Prophet","Teacher"],"a":3},{"q":"In whose house was Peter living while he was in Joppa?","o":["Philemon","Cornelius","Simon the tanner","Titus"],"a":2},{"q":"In which part of the church do the majority of the faithful stand while praying?","o":["Prakaram","Madbaha","Sepulchre","Bezgaza room"],"a":0},{"q":"Who is called the 'Harp of the Holy Ghost'?","o":["Mor Aprem","Mor Simeon","Mathews Mor Athanasius","Bar Ebraya"],"a":0}],"name":[{"q":"Who felt jealous of the chaste life and prosperity of Job and prepared to ruin him?","a":"Satan"},{"q":"The Persian king who declared liberation for the Jews from the captivity in Babylon.","a":"Cyrus"},{"q":"The silver coin of that time mentioned in the parable of the lost coin.","a":"Susa (Drahma)"},{"q":"The Syriac word for 'camel', which also means a thick rope.","a":"Gemlo"},{"q":"The small room under the Thronos where the cross is entombed on Good Friday.","a":"Sepulchre (Tomb)"},{"q":"The person who caused the formation of the Marthoma Church.","a":"Palakkunnathu Abraham Malpan"}],"tf":[{"q":"Job was a Jew.","a":false},{"q":"Esther was brought up by her own parents in Babylon.","a":false},{"q":"The Portico (Mondalam) is the place for the gentiles to participate in the worship.","a":true},{"q":"The Hudaya Canon written by Bar Ebraya is the approved canon of the holy church.","a":true}],"fill":[{"q":"\"What God has made ______, you must not call profane.\"","a":"clean"},{"q":"______ feast is celebrated by the Jews on the 13th and 15th day of the month of Adar.","a":"Pureem (Purim)"},{"q":"______ got the name 'Stylite' (Desthuno) since he used to pray from the top of a pillar.","a":"Mor Simeon"},{"q":"\"Truly I tell you, it will be hard for a rich person to enter the ______.\"","a":"kingdom of heaven"},{"q":"The place in between the Prakaram and the Sanctuary is known as the ______.","a":"chancel (Kesthruma)"}],"match":{"l":["Evangelion","Romans 13:1","Eliphaz, Teman and Bildad","Job 1:1","Cornelius","Nizeebeen","H.H. Elias II"],"r":["Birthplace of Mor Aprem","Gospel","Governing authorities","Upright, God-fearing man","Ordained Mathews Mor Athanasius","Centurion","Friends of Job"],"key":[1,2,6,3,5,0,4]},"short":[{"q":"What are the important contributions of Nehemiah to the people of Jerusalem?","a":"Nehemiah, a Jewish chieftain and assistant of king Artaxerxes, sought the king's permission and reached Jerusalem in B.C. 455. Seeing Jerusalem lying in ruins with its gates burnt, he led the people to rebuild the wall and make the city safe, and when enemies rose up he encouraged them to remember the Lord.","ref":"Class VII textbook, Lesson 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God"},{"q":"What are the two instances of miraculous fishing recorded in the gospels?","a":"The first is when Jesus called Simon, James and John as disciples. The second is when Jesus appeared to the disciples for the third time after His resurrection; both happened on the shore of the Sea of Tiberias.","ref":"Class VII textbook, Lesson 14 – Miraculous Fishing"},{"q":"Write briefly on the qualities of Mor Aprem.","a":"Mor Aprem was a worthy monk, celibate and ascetic, whose main duties were prayer, meditation and writing books. He slept on the floor, ate barley bread and leafy vegetables, drank only water and prayed from dusk till dawn. He was humble: he disappeared when there was talk of making him a metropolitan and did not wish to be buried inside the church.","ref":"Class VII textbook, Church History, Lesson 23 – Mor Aprem"},{"q":"Explain how the church resembles Paradise.","a":"In Paradise there is the presence of God, the tree of life and the host of holy men who died in the Lord. Likewise in the church there is the cross of victory at the centre of the altar representing the tree of life, the Holy Eucharist as the fruit of life, and the host of priests signifying the holy men.","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"para":[{"q":"How did Haman's hostility towards Mordecai end in his own downfall?","a":"Haman, son of Hammedatha, was made Prime Minister and wanted all except the king to kneel before him; Mordecai refused, saying he could kneel down and worship only God, so Haman grew hostile and prepared a gallows to hang him; When the king decided to honour Mordecai for saving his life, Haman himself had to do everything to honour him, and his hostility increased; Haman made the king believe that the Jews were against him and obtained an order to destroy all the Jews; At Esther's second banquet the queen told the king that it was Haman who had devised the plan to destroy her people; The furious king had Haman hanged on the very gallows made for Mordecai, and Mordecai was made Prime Minister in his place","ref":"Class VII textbook, Lesson 6 – Esther: Strength of Fasting"},{"q":"Write briefly the parable of the prodigal son and its moral.","a":"The younger son kept away from his father's presence and led an extravagant life satisfying his worldly desires; At last he got the meanest work of feeding pigs and did not even get the husks to satisfy his hunger; In this fallen state he became sensible, repented and resolved to return, planning to call him \"my father\", confess his sin and ask to be treated as a servant; His father saw him while he was still far away, felt mercy, gave him the status of son and celebrated with joy; The elder son, who represents the Pharisees, would not accept his brother, and the father entreated him to join the celebration; Moral: God wants that nobody should be lost, rejoices when sinners return, and accepts unconditionally any sinner who repents and comes back","ref":"Class VII textbook, Lesson 12 – Repenting Sinner"},{"q":"Write about H.H. Moran Mor Ignatius Pathrose III and his service to the Malankara Church.","a":"Moran Mor Pathrose III was installed as Patriarch of the Holy See of Antioch in 1872 and was determined to defeat the reform movement and retain the true faith in Malankara; He visited Queen Victoria, who was ruling over India, convinced her of the matter and informed the Secretary of India; As a result the earlier royal proclamations were cancelled, Mor Athanasius was weakened and Mor Dionysius V took over the administration; He prevented the Malankara Church from becoming the modernised Marthomites; He convened the Mulanthuruthy Synod in 1876 and gave shape to the Mulanthuruthy Padiyola, the 'Magna Carta' of Malankara; He ended the single leadership of the Malankara Metropolitan and formed seven dioceses under seven Metropolitans","ref":"Class VII textbook, Church History, Lesson 22 – Mathews Mor Athanasius Metropolitan (Palakkunnathu)"}],"essay":[{"q":"Compare the Christian churches with the Old Testament house of the Lord.","a":"Solomon built the temple according to the resemblance shown by the Lord to Moses on Mount Sinai, and the early Christian churches were built imitating that temple; The temple had three parts – the Oracle (outer court), the Sanctuary (inner court) and the Most Holy place – and our churches also have three: Prakaram, Haikala and Sanctuary (Madbaha); As the Most Holy place and the Sanctuary were separated by a beautiful curtain, the Madbaha and the chancel are separated by a beautiful curtain; Just as the outer court and the inner court were separated, railings separate the Prakaram and the Haikala in many of our churches; In place of the manna there is the Holy Qurbana, in place of the tables of covenant the Evangelion (Gospel) book, and in place of Aaron's budded stick the cross of victory; Burning candles take the place of the Cherubim covering the seat of mercy, and there is a censer like the golden censer in the temple; Our churches are built in the east-west direction so that the faithful pray facing east and God faces them from the east and blesses them; As God was always present in the temple in Jerusalem, there is always the intercession of the saints in whose names our churches are established","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"},{"q":"The authority and importance of St. Peter","a":"From the very beginning Peter had the first position among the disciples, and his name is recorded first wherever the apostles are listed; He was among the three taken with Jesus when Yayiros' daughter was raised, at the Transfiguration and in Gethsemane, and among the two sent to prepare the Passover; The Lord authorised him to pay tax on His behalf and entrusted him with strengthening the brethren after His departure (St. Luke 22:32); After the miraculous fishing, Jesus asked him three times, \"Do you love me?\" and said, \"Feed my lambs\", \"Tend my sheep\" and \"Feed my sheep\" – that is, to lead the church on His behalf; Just as God changed Abram's name to Abraham, the Lord gave Simon the name Peter (Cephas), and gave only him the keys of the kingdom of heaven, the symbol of authority; After the resurrection the Lord gave him authority over the whole church in the presence of the other disciples; Peter led the selection of a person in place of Judas, added 3000 Jews to the church, and through his vision the Gentiles were admitted; At the Synod of Jerusalem his speech helped reach a decision, so Peter functioned as superior and the other disciples co-operated with him","ref":"Class VII textbook, Lesson 15 – The Authority of St Peter"}]}},{"no":2,"s":{"mcq":[{"q":"Who was the king who dispatched Esra to Jerusalem?","o":["Herod","Artaxerxes","Darius","Cyrus"],"a":1},{"q":"What was the sin of Job?","o":["Self justification","Disobedience","Anger","Ego"],"a":0},{"q":"Who first recognised Jesus on the shore of the Sea of Tiberias?","o":["St. John","St. James","St. Peter","St. Andrew"],"a":0},{"q":"Whose name is recorded first wherever the names of the apostles are mentioned?","o":["Andrew","Peter","Thomas","John"],"a":1},{"q":"In our churches, what is kept in the place of the budded staff of Aaron?","o":["Candles","The Gospel Book","The cross","The censor"],"a":2},{"q":"Bar Ebraya is known as the","o":["Sea of Literature","Sea of Knowledge","Sea of Spirit","Harp of the Holy Ghost"],"a":1}],"name":[{"q":"The friend who rebuked Job.","a":"Elihu"},{"q":"The person who brought up Esther after her parents died.","a":"Mordecai"},{"q":"The number of big fish in the unbroken net.","a":"153 (a hundred and fifty three)"},{"q":"Another name for the altar.","a":"Thronos"},{"q":"The Malankara Metropolitan who appealed to the Holy See of Antioch to depute a Metropolitan to Malankara.","a":"Mor Dionysius IV (Cheppad Philipose)"},{"q":"The year in which St. Ephraim (Mor Aprem) passed away.","a":"AD 373"}],"tf":[{"q":"King Artaxerxes granted freedom to the Jews after the captivity in Babylon.","a":false},{"q":"The rich young man told Jesus that he had kept all the commandments.","a":true},{"q":"Christian churches are built in the east-west direction.","a":true},{"q":"The compositions of Mor Aprem were written in Latin.","a":false}],"fill":[{"q":"Esra was a scholar in the laws of ______.","a":"Moses"},{"q":"Queen Esther declared fasting for ______ days for the blessing of God.","a":"three"},{"q":"\"Simon son of John, do you love me more than these?\" ... \"Feed my ______.\"","a":"lambs"},{"q":"The ______ were carrying the Tabernacle and the Ark of the Covenant.","a":"Levites"},{"q":"The Mulanthuruthy Padiyola is referred to as the ______ of Malankara.","a":"Magna Carta"}],"match":{"l":["Cherubim","Vashti","Madbaha","Mor Aprem","Eunuchs","Hegai","Mosul"],"r":["Diocese held by Mor Athanasius for one year","Plot to kill the king","Queen removed by Ahasuerus","Sanctuary","Periodic (Yama) prayers","Keeper of the inner house","Candles"],"key":[6,2,3,4,1,5,0]},"short":[{"q":"What was the advice given by Job to his wife?","a":"When his wife said, \"Do you still persist in your integrity? Curse God, and die,\" Job replied that she spoke as a foolish woman would: \"Shall we receive the good at the hand of God, and not receive the bad?\" He advised her that we should praise the Lord when good as well as bad events occur.","ref":"Class VII textbook, Lesson 7 – Job: The Tested Faith"},{"q":"What are the two important interpretations of 'a camel going through the eye of a needle'?","a":"In Syriac the word for camel, 'gemlo', also means a thick rope, and it is very difficult to pull a rope through the eye of a needle. There was also a small door in Jerusalem called the 'eye of needle', through which a camel could pass only when its load was removed and it knelt down – so a rich man must remove the desire for wealth, the load of sin, to enter everlasting life.","ref":"Class VII textbook, Lesson 13 – Rich Youth and Everlasting Life"},{"q":"What were the modernisation ideas spread by Palakkunnathu Abraham Malpan?","a":"Palakkunnathu Abraham Malpan led ideas such as changing the Taksa for the Holy Qurbana, avoiding the prayer to the mother of God and the saints for intercession, and doing away with the prayer for the departed souls. These ideas, injected by the CMS missionaries, led to the formation of the Marthoma Church.","ref":"Class VII textbook, Church History, Lesson 22 – Mathews Mor Athanasius Metropolitan (Palakkunnathu)"},{"q":"What is the Bezgaza room? Where is it?","a":"The Bezgaza room is meant for keeping things necessary for the church service but not permitted to be kept in the sanctuary. It is attached to the northern wall at the eastern end of the chancel, and it can be used for making dough (Ameera) and as a change room for the assistants of the holy service.","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"para":[{"q":"Write a paragraph on building the wall of Jerusalem under the leadership of Nehemiah.","a":"Nehemiah, a Jewish chieftain and assistant of king Artaxerxes, reached Jerusalem in B.C. 455 with the king's permission; He went around the city secretly and told the chiefs and elders, \"Come, let us rebuild the wall of Jerusalem, so that we may no longer suffer disgrace,\" and they started building; Sanballah of Horon, Tobiah of Ammon and Gosem of Arabia joined with the Asthodians to block the work; Nehemiah encouraged the frightened people: \"Do not be afraid of them. Remember the Lord, who is great and awesome, and fight for your kin\"; Relying on the Lord, they worked with one hand and held arms in the other, with a sword bound at the waist; When the enemies complained against him, a royal order came in favour of Nehemiah, the enemies were ashamed, and the people celebrated a big feast for God","ref":"Class VII textbook, Lesson 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God"},{"q":"What was the vision that Peter had before he went to the house of Cornelius?","a":"While staying in Joppa, Peter went upstairs for prayer at the 6th hour (12 noon), felt hungry and fell into a trance; He saw heaven opened and something like a large sheet lowered to the ground by its four corners, with all kinds of four-footed creatures, reptiles and birds of the air; A voice said, \"Get up, Peter; kill and eat,\" but Peter said, \"By no means, Lord; for I have never eaten anything that is profane or unclean\"; The voice said, \"What God has made clean, you must not call profane\" – this was heard thrice and the vessel was taken up into heaven; While Peter wondered what it meant, the men sent by Cornelius arrived, and the Holy Spirit told him to go with them without doubting; God thus prepared the way for taking the Gentiles into the church","ref":"Class VII textbook, Lesson 16 – The Vision to Peter"},{"q":"Explain how the church resembles Mount Sinai.","a":"On the way to Canaan the Israelites camped in the valley of Mount Sinai, and Moses went up the mountain at God's command; The people stayed in the valley praying after purifying themselves, and this place is represented by the Nave (Prakaram); The place between the people and the mountain is represented by the Haikala (Kesthruma), inside the railing; The smoke rising from the censer, the candles burning with dazzling light, and the sounds of hand bells and Marvahsa bring to memory the lightning, thunder, sound of the bugle and smoke on Mount Sinai; Hence the church resembles and is compared to Mount Sinai","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"essay":[{"q":"Describe the life of Mor Simeon Desthuno (Simeon the Stylite).","a":"Simeon was born in the village of Siz in Antioch and was a shepherd in his boyhood; While grazing his sheep he had a vision of being led to a huge mountain, building an altar, going to the place of the body of Timothy, disciple of St. Paul, and entering the house of God; He distributed all his earnings to the devotees of God, the poor and the destitute, and started life in the monastery, immersed in prayer and fasting; He built a pillar (Desthuno), 3 metres at first and later 20 metres, and spent 40 years on it – so he is called the first Desthuno, and his followers are the Esthanoye; During lent he took no food for 40 days, and angels, Moses and Elijah appeared to him, the sick were cured and famine and drought were removed by his prayers; Though sores erupted on his leg and Emperor Theodosius sent three metropolitans asking him to come down, he remained fasting and praying and was cured; He died in AD 459 and was buried in the big church in Antioch, and a fort with four churches was built around his pillar near Aleppo; The church celebrates his feast on July 17","ref":"Class VII textbook, Church History, Lesson 24 – Mor Simeon Stylites (Desthuno)"},{"q":"\"There is joy in heaven over one sinner who repents\" – explain with the parables Jesus told.","a":"The Pharisees and scribes were provoked because Jesus received tax collectors and sinners and dined with them, so He told three parables; Lost sheep: a shepherd leaves the ninety-nine in the wilderness, searches until he finds the lost one, carries it on his shoulders and shares his joy with friends and neighbours; Jesus is the good shepherd who came to bring back sinners with love, and there is more joy in heaven over one sinner who repents; Lost coin: a woman who loses one of her ten silver coins (susa) sweeps the whole house carefully and shares her joy when she finds it, like the joy in heaven over repenting sinners; Prodigal son: the father sees his repentant son from a distance, feels mercy, restores him as son and shares his happiness with all, showing God awaiting the sinner's return; The morals: God wants that nobody should be lost, and God who searches for the sinners is happy when they return; God accepts unconditionally any sinner who repents and comes back; \"Draw near to God, and he will draw near to you\" (James 4:8)","ref":"Class VII textbook, Lesson 12 – Repenting Sinner"}]}},{"no":3,"s":{"mcq":[{"q":"From which land was Job?","o":["Moab","Babylon","Persia","Uz"],"a":3},{"q":"Which king of Babylon captured Jerusalem in B.C. 606?","o":["Cyrus","Darius","Nebuchadnezzar","Ahasuerus"],"a":2},{"q":"Who drew the unbroken net full of fish ashore at the Sea of Tiberias?","o":["James","Simon Peter","John","Jesus"],"a":1},{"q":"In the miraculous fishing, what does the net signify?","o":["Heaven","The apostles","The church","The world"],"a":2},{"q":"To whom did God show the plan (resemblance) of the temple of God on Mount Sinai?","o":["Joshua","David","Solomon","Moses"],"a":3},{"q":"In which thubden (diptych) does the holy church remember Mor Aprem?","o":["The 1st thubden","The 5th thubden","The 3rd thubden","The 6th thubden"],"a":1}],"name":[{"q":"The Prime Minister who cunningly obtained an order from the king to destroy the Jews.","a":"Haman"},{"q":"The person who took the leadership for building the wall of Jerusalem.","a":"Nehemiah"},{"q":"The apostle who preached to the Jews and added 3000 of them to the church.","a":"St. Peter"},{"q":"The Bible reference of the verse \"Draw near to God, and he will draw near to you.\"","a":"James 4:8"},{"q":"The king who built the temple of God for the first time.","a":"King Solomon"},{"q":"The village where Mor Simeon Desthuno was born.","a":"Siz in Antioch"}],"tf":[{"q":"Satan was able to make Job deviate from his faith in God.","a":false},{"q":"The 153 big fish signify the various races in the world.","a":true},{"q":"Women are permitted to enter the sanctuary (Madbaha).","a":false},{"q":"Mor Simeon spent 40 years on the pillar in prayer.","a":true}],"fill":[{"q":"While building the wall, the people worked with one hand and held ______ in the other.","a":"arms"},{"q":"God who searches for the ______ is happy when they return.","a":"sinners (lost)"},{"q":"\"Never depend on wealth because it does not give hope. That will clap its wing and fly away like the ______ in the sky.\" (Sirach 38:20)","a":"birds"},{"q":"The word 'Thronos' means ______.","a":"throne (seat)"},{"q":"The Roman Catholic Church proclaimed Mor Aprem as 'Doctor of the church' in the year ______.","a":"1920"}],"match":{"l":["Darius","Sanballah of Horon","Ninety-nine","Yayiros","Mondalam","Prakaram","Yuyakkim Mor Coorilos"],"r":["Tried to block the wall","Wall, fort","Successor of Cyrus","Sheep left in the wilderness","Portico","Inquired about Mor Athanasius","Daughter raised to life"],"key":[2,0,3,6,4,1,5]},"short":[{"q":"How did Esther become the queen of King Ahasuerus?","a":"Queen Vashti refused the king's command to come to his feast, so he removed her from her position. Many beautiful virgins were brought from all the 127 provinces and kept under Hegai, the keeper of the inner house; from among them the king liked Esther the most and made her queen in the place of Vashti.","ref":"Class VII textbook, Lesson 6 – Esther: Strength of Fasting"},{"q":"What did Jesus tell the rich young man to do to be perfect? Why did he go away sad?","a":"Jesus told him, \"If you wish to be perfect, go, sell your possessions, and give the money to the poor, and you will have treasure in heaven; then come, follow me.\" He went back worried and sorrowful because he had great possessions and considered his wealth more precious than everlasting life.","ref":"Class VII textbook, Lesson 13 – Rich Youth and Everlasting Life"},{"q":"What was the wish of Mor Aprem about his burial? When does the church celebrate his feast?","a":"Mor Aprem said, \"An unholy person like me is not eligible to lie in holy places; I am not to be buried inside the church. I am not worthy of that glory,\" so he was buried elsewhere. The holy church celebrates his feast on the first Saturday of the lent.","ref":"Class VII textbook, Church History, Lesson 23 – Mor Aprem"},{"q":"Why did God not allow King David to build the temple of God?","a":"God did not allow David because the sin of arranging the death of his servant Ooria without any reason was outstanding against him. Accepting David's repentance, the Lord forgave him and promised that his son would build the house of the Lord.","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"para":[{"q":"Explain the role of Esra in making the Jews morally strong after the captivity.","a":"Esra, a scholar in the laws of Moses and a favourite of king Artaxerxes, was authorised by the king to look after the affairs of Jerusalem; At his request the king gave money for the temple, returned the vessels, exempted the priests and Levites from taxes and supplied wheat, oil, wine, gold and silver; The Jews with him arrived in Jerusalem in B.C. 457; Esra submitted more to God's authority than to the king, and he and his allies prayed with fasting for three days; He condemned the Jews for their evil doings, made them promise to live by God's laws, and guided them as administrator for 13 years; Later he read the law of God to them again and convinced them that calamities came because they disobeyed, and the people swore to obey the laws","ref":"Class VII textbook, Lesson 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God"},{"q":"Who was Cornelius? How did he receive Peter, and what happened in his house?","a":"Cornelius was a centurion (head of 100 soldiers) of the Italiaci band in Caesarea, a God-fearing, devoted man with the habit of praying and alms giving; At the prayer of the 9th hour an angel told him to send men to Joppa for Simon who is called Peter; He gathered his relatives and friends, and when Peter came in he fell at his feet, but Peter took him up saying, \"Stand up; I am only a mortal\"; Peter preached about the public ministry of Jesus and that God shows no partiality, but in every nation anyone who fears Him and does what is right is acceptable to Him; While Peter was preaching, the Holy Spirit came upon all who were listening, and they were baptized; Cornelius and his allies were the first Gentiles to come to the church","ref":"Class VII textbook, Lesson 16 – The Vision to Peter"},{"q":"Write briefly about the service of Bar Ebraya to the church.","a":"Mor Gregorios Yoohanon Bar Ebraya was born in 1226 at Malattia in Turkey, and he became a Metropolitan at 20 and Catholicose of the East at 38, and ordained 12 metropolitans; He built churches, monasteries and houses for metropolitans; He wrote books on science, astronomy, philosophy, law, grammar, Syriac and history, and his world history in Syriac was translated into Arabic; He wrote many books on theology and interpretations of the Old and New Testaments except Revelation, and books like Dove, Book of Lights and The Canon; The Hudaya Canon written by him is the approved canon of the holy church; Known as the 'sea of knowledge', he died on 30 July 1286 and is entombed in the monastery of Mor Mathew in Mosul","ref":"Class VII textbook, Church History, Lesson 25 – Mor Gregorios Yoohanon Bar Ebraya"}],"essay":[{"q":"Job – the tested faith","a":"Job was from the land of Uz, not a Jew, and was an upright, God-fearing man; Satan, jealous of his chaste life and prosperity, was permitted by God to tempt him: his animals were stolen, his servants killed, his house collapsed and his children were killed; Job did not sin but said, \"The Lord gave, and the Lord has taken away; blessed be the name of the Lord\"; Struck with sore boils, he sat in ashes and said nothing against God, and he told his wife that we should accept both good and bad from God; His friends Eliphaz, Teman and Bildad said his sufferings were due to his sins, but Job justified himself; Elihu advised him to keep silent and consider the wondrous works of God, and when God spoke, Job realised his sin of self-justification; Job admitted his mistake and prayed for his friends, and God doubled his wealth, cured him, gave back his children, and he lived 140 years; The message: man cannot understand all God's plans, and God protects and blesses those who have deep faith and submit to His will","ref":"Class VII textbook, Lesson 7 – Job: The Tested Faith"},{"q":"The important parts of our church","a":"Sanctuary (Madbaha): equal to the holiest of holy place, and only priests and assistants doing service may enter, and women have no sanction to enter; Altar (Thronos): at the eastern end of the sanctuary, at least three feet from the eastern wall, and Thronos means throne, as the presence of God the Father is always there; Sepulchre (Tomb): a small room under the Thronos where the cross is entombed on Good Friday, used for nothing else; Chancel (Kesthruma/Haikala): between the prakaram and the sanctuary, the place for priests to stand praying and for marriages; Prakaram (outer court): the largest part, where the faithful pray – women on the right (southern) side and men on the left (northern) side; Portico (Mondalam): on the western side with the big elephant door, the place for the gentiles to take part in worship; Courtyard: open space around the church for the purity of the house of God; Baptismal room and Bezgaza room: the baptismal tub is fixed in a separate room at the eastern end, and the Bezgaza room keeps things needed for the service and is used for making Ameera","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}]}},{"no":4,"s":{"mcq":[{"q":"Whom did King Artaxerxes depute as the administrator of Jerusalem?","o":["Serubabel","Esra","Nehemiah","Tobiah"],"a":1},{"q":"What did Job use to scratch himself while sitting in the ashes?","o":["A stone","A piece of cloth","A broken piece of pot","A stick"],"a":2},{"q":"Whom does the elder son represent in the parable of the prodigal son?","o":["The sinners","The Gentiles","The Pharisees","The heavenly Father"],"a":2},{"q":"In the vision that Peter had, the four-footed creatures, reptiles and birds signified","o":["All the faithful","The angels","The Gentiles","The Jews"],"a":2},{"q":"In the Madbaha, what is kept in the place of the tables of covenant?","o":["The Holy Qurbana","The Evangelion (Gospel) Book","The censor","Candles"],"a":1},{"q":"Where is Bar Ebraya entombed?","o":["In Nizeebeen","In the big church in Antioch","In Tigris","In the monastery of Mor Mathew in Mosul"],"a":3}],"name":[{"q":"The number of years Job lived.","a":"140 years"},{"q":"The hour at which Peter went upstairs to pray when he had his vision.","a":"The 6th hour (12 o'clock noon)"},{"q":"The name the Lord gave Simon, just as God changed Abram's name to Abraham.","a":"Peter (Cephas)"},{"q":"The big main door of the church, opening from the Mondalam.","a":"Elephant door"},{"q":"The emperor who sent a letter and three metropolitans requesting Simeon to come down from the pillar.","a":"Emperor Theodosius"},{"q":"The number of dioceses into which Patriarch Pathrose III reorganised the Malankara Church.","a":"Seven"}],"tf":[{"q":"Haman was made Prime Minister in the place of Mordecai.","a":false},{"q":"In the parable of the lost coin, the woman had ten silver coins.","a":true},{"q":"The altar should be built touching the eastern wall of the Madbaha.","a":false},{"q":"During the period of lent, Mor Simeon took no food for 40 days.","a":true}],"fill":[{"q":"Job's wife said, \"Do you still persist in your integrity? Curse God, and ______.\"","a":"die"},{"q":"The Jews who went with Esra arrived in Jerusalem in B.C. ______.","a":"457"},{"q":"Jesus said, \"Cast the net to the ______ side of the boat, and you will find some.\"","a":"right"},{"q":"Jesus discourages those who trust in ______ more than God.","a":"wealth"},{"q":"In the temple of the Lord, the Sanctuary and the Most Holy place were separated by a very beautiful ______.","a":"screen (curtain)"}],"match":{"l":["Hammedatha","Tobiah of Ammon","Adar","Caesarea","Psalms 28:8","Courtyard","AD 459"],"r":["Enemy of Nehemiah","Purity of the house of God","Father of Haman","City of Cornelius","The Lord is the strength of his people","Death of Mor Simeon","Twelfth month"],"key":[2,0,6,3,4,1,5]},"short":[{"q":"What did Job's friends tell him? What did Elihu advise him?","a":"His friends Eliphaz, Teman and Bildad advised that the cause of his sufferings was his sins and that he should seek God's blessings. Elihu told him he was not right to contend against God, who is greater than any mortal, and advised him to keep silent and consider the wondrous works of God.","ref":"Class VII textbook, Lesson 7 – Job: The Tested Faith"},{"q":"Write the three questions Jesus asked Peter and the replies given.","a":"Jesus asked three times, \"Simon son of John, do you love me?\" (the first time, \"more than these\"), and Peter answered, \"Yes, Lord; you know that I love you\"; the third time he was grieved and said, \"Lord, you know everything; you know that I love you.\" Jesus replied, \"Feed my lambs\", \"Tend my sheep\" and \"Feed my sheep\".","ref":"Class VII textbook, Lesson 15 – The Authority of St Peter"},{"q":"What was the vision Simeon had in his boyhood? What did he do after it?","a":"While grazing his sheep, Simeon saw in a vision that he was led to a huge mountain, built an altar, went to the place where the body of Timothy, the disciple of St. Paul, was kept, and then entered the house of God. After this he distributed all his earnings to the devotees of God, the poor and the destitute, and started life in the monastery.","ref":"Class VII textbook, Church History, Lesson 24 – Mor Simeon Stylites (Desthuno)"},{"q":"What is the Sepulchre in the church? What is it used for?","a":"The Sepulchre (Tomb) is a small room under the Thronos with its door in the eastern wall of the Thronos. The cross representing the dead body of the Lord is entombed here at the close of the prayers on Good Friday; it is used only for this, and nothing else should ever be kept in it.","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"para":[{"q":"Describe how the Jews returned from Babylon and rebuilt the temple of the Lord.","a":"After the captivity in Babylon, Cyrus, the Persian king, granted freedom to the Jews; According to a vision he had, Cyrus ordered the Jews to go back to Jerusalem and build a temple for the Lord; He commanded the Jews not interested in going back to donate gold, silver, cattle etc. for building God's temple; The first batch set out for Jerusalem in B.C. 534 with priests, musicians and servants, led by Serubabel; They started building the temple in Jerusalem; In the period of king Darius, the successor of Cyrus, the temple was completed and dedicated to the Lord","ref":"Class VII textbook, Lesson 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God"},{"q":"Describe the miraculous fishing at the Sea of Tiberias and the lessons we learn from it.","a":"After the resurrection, Peter and some disciples fished all night in the Sea of Tiberias but caught nothing; In the morning Jesus told them to cast the net on the right side, and they could not pull it back because of the multitude of fish; John said, \"It is the Lord,\" and Peter jumped into the sea and swam to Jesus; On the shore there was a fire of coals with fish and bread, and Peter drew the net ashore with 153 big fish, yet the net did not tear; Efforts without God are fruitless, but when we obey the command of Jesus, blessings come in abundance, and He takes care of His own; The meal points to the Holy Eucharist, the 153 fish signify the races of the world, the unbroken net the strength of the church, and Peter drawing the net his special authority","ref":"Class VII textbook, Lesson 14 – Miraculous Fishing"},{"q":"How did deacon Mathews become Mathews Mor Athanasius? Why did the Malankara Church oppose him?","a":"When Mor Dionysius IV asked the Holy See of Antioch for a Metropolitan, Abraham Malpan, without the knowledge and approval of the church, sent his brother's son, deacon Mathews, with the help of the missionaries; H.H. Elias II ordained him in 1842, when he was only 24, as Mathews Mor Athanasius; The Malankara Church did not recognise him, because he was selected without its consent and the Patriarch had been misinformed; Though excommunicated, he stood unbeaten with the support of the CMS missionaries and the British resident; He played a double role – publicly submitting to the Patriarch while secretly encouraging the missionaries; So the Church elected Father Joseph Pulikkottil, who was ordained as Mor Dionysius V in 1865","ref":"Class VII textbook, Church History, Lesson 22 – Mathews Mor Athanasius Metropolitan (Palakkunnathu)"}],"essay":[{"q":"Esther – the strength of fasting","a":"Esther, whose parents died in her childhood, was brought up in Babylon by Mordecai, the son of her father's brother, and became queen of King Ahasuerus in place of Vashti; Haman, the proud Prime Minister, hated Mordecai for not kneeling before him and obtained an order from the king to destroy all the Jews; Mordecai asked Esther to save her people, though anyone going to the king without permission could be put to death; Esther decided to go, not afraid to give her life, and declared three days of fasting for God's blessing, asking the Jews of Susa to pray for her; After the fast she went before the king uninvited, and he held out the scepter towards her, so her life was saved; At her second banquet she revealed Haman's plan, and Haman was hanged on the gallows he had made for Mordecai; Mordecai was made Prime Minister, the Jews were saved, and the Jews celebrate the feast of Pureem to remember it; Lesson: God will remove any adversity through prayer and fasting","ref":"Class VII textbook, Lesson 6 – Esther: Strength of Fasting"},{"q":"Mor Aprem (St. Ephraim) – the Harp of the Holy Ghost","a":"Mor Aprem was born at the beginning of the 4th century in a Christian family in the city of Nizeebeen, and is remembered in the 5th thubden as the 'harp of the Holy Ghost'; He was a worthy monk with sound theological knowledge, and as a deacon he was the chief master of the school of theology for 38 years; He interpreted the whole Bible from Genesis to Revelation and wrote on the divinity and humanity of Christ, the church, apostles, martyrs and resurrection; He wrote a large part of the periodic prayers of the church, sweet songs for worship and sonnets against heretics, about 3 million lines in Syriac; He taught that the chastity of the mother of God should be remembered with devotion and respect; He slept on the floor, ate barley bread and leafy vegetables, drank only water and prayed from dusk till dawn, and disappeared when they wanted to make him a metropolitan; He died in AD 373 and, as he wished, was not buried inside the church; The Roman Catholic Church proclaimed him 'Doctor of the church' in 1920, and his feast is on the first Saturday of the lent","ref":"Class VII textbook, Church History, Lesson 23 – Mor Aprem"}]}},{"no":5,"s":{"mcq":[{"q":"How many provinces were there in the kingdom of King Ahasuerus?","o":["27","70","127","153"],"a":2},{"q":"After Job's sufferings, what did God do to his wealth?","o":["Took it all away","Kept it the same","Gave it to his friends","Doubled it"],"a":3},{"q":"In the parable of the lost sheep, how does the shepherd bring back the lost sheep?","o":["Sending his dog after it","Carrying it on his shoulders","Leading it with a rope","Calling it from far away"],"a":1},{"q":"What did Peter do when he heard John say, \"It is the Lord\"?","o":["He ran away to Jerusalem","He stayed in the boat and prayed","He wrapped his outer garment round him, jumped into the sea and swam to Jesus","He pulled the net into the boat"],"a":2},{"q":"On which side of the Prakaram is the Mondalam (portico) built?","o":["Northern side","Eastern side","Western side","Southern side"],"a":2},{"q":"What did Mor Aprem do when there was a discussion about making him a metropolitan?","o":["He accepted it gladly","He went to Rome","He disappeared","He wrote a letter to the Patriarch"],"a":2}],"name":[{"q":"The Persian king whose queen was Esther.","a":"Ahasuerus"},{"q":"The number of years Esra was the administrator of Jerusalem.","a":"13 years"},{"q":"The work that the prodigal son finally got, showing his complete fall.","a":"Feeding the pigs"},{"q":"The Bible reference of the verse for memorising in 'The Vision to Peter'.","a":"Amos 8:11"},{"q":"What is kept in the Madbaha in the place of the manna?","a":"The Holy Qurbana"},{"q":"The priest elected by the Malankara Church and ordained as Mor Dionysius V in 1865.","a":"Father Joseph Pulikkottil"}],"tf":[{"q":"Mordecai refused to kneel before Haman, saying that he would kneel down and worship only God.","a":true},{"q":"The Pharisees were happy that Jesus received sinners and dined with them.","a":false},{"q":"At marriage, the bridegroom should stand on the southern side and the bride on the northern side.","a":false},{"q":"Even after being ex-communicated, Mathews Mor Athanasius stood unbeaten because of the support of the C.M.S. missionaries and the British resident.","a":true}],"fill":[{"q":"\"Naked I came from my mother's womb, and naked shall I return there; the Lord gave, and the Lord has ______; blessed be the name of the Lord.\"","a":"taken away"},{"q":"Nehemiah said, \"Come, let us rebuild the ______ of Jerusalem, so that we may no longer suffer disgrace.\"","a":"wall"},{"q":"The unbroken net indicates the ______ of the church.","a":"strength"},{"q":"The altar (Thronos) is located at the ______ end of the sanctuary.","a":"eastern"},{"q":"The holy church celebrates the feast of Mor Aprem on the first ______ of the lent.","a":"Saturday"}],"match":{"l":["Artaxerxes","Sore boils","Italiaci band","Fire of coals","Baptismal tub","Dove","Queen Victoria"],"r":["Book by Bar Ebraya","Army band from Italy","Temptation of Job","Baptismal room","Assumed charge after Darius","Patriarch Pathrose III","Fish and bread on the shore"],"key":[4,2,1,6,3,0,5]},"short":[{"q":"What is the message that we get from the book of Job?","a":"Man is unable to understand all the plans of God, but there is a definite reason behind all the divine plans. God does not tempt anyone without reason; He protects those who have deep faith in Him and blesses the one who accepts His will and submits.","ref":"Class VII textbook, Lesson 7 – Job: The Tested Faith"},{"q":"How did the father console the elder son in the parable of the prodigal son?","a":"The father came out and entreated him, saying, \"Son, you are always with me, and all that is mine is yours. But we had to celebrate and rejoice, because this brother of yours was dead and has come to life; he was lost and has been found.\" He invited him to take part in the merry making.","ref":"Class VII textbook, Lesson 12 – Repenting Sinner"},{"q":"Write about the early life of Bar Ebraya.","a":"Mor Gregorios Yoohanon Bar Ebraya was born in 1226 at Malattia in Turkey. He migrated to Antioch at 17, took to asceticism the next year, was ordained a Metropolitan at 20 and was installed as Catholicose of the East at 38, with his seat in Tigris.","ref":"Class VII textbook, Church History, Lesson 25 – Mor Gregorios Yoohanon Bar Ebraya"},{"q":"Why should we not come to the house of God empty handed?","a":"All who enter the house of God say the prayer, \"With reverence do I enter thy house and make my offerings unto thee.\" This prayer shows that we should not come to the house of God empty handed, so everyone should give offerings according to one's capacity.","ref":"Class VII textbook, True Faith, Lesson 18 – Worship: A Study"}],"para":[{"q":"How did Mordecai save the life of the king, and how was he honoured?","a":"Mordecai, Esther's foster father, accepted the duty of steward of the king's inner house; He learned that the eunuchs, the king's door keepers, had secretly planned to assassinate the king, and told Queen Esther; It was found true on investigation, the eunuchs were executed, and the king wrote this in his diary; Later the king asked Haman, \"What shall be done unto the man whom the King delighteth to honour?\" and Haman, hoping it was himself, described the honour in detail; The king commanded Haman to do all of it to honour Mordecai; Finally the king made Mordecai Prime Minister in place of Haman","ref":"Class VII textbook, Lesson 6 – Esther: Strength of Fasting"},{"q":"On which occasions during His public ministry did Jesus give prominence to Peter?","a":"From the very beginning Peter received the first position among the disciples, and his name is recorded first wherever the apostles are named; He was one of the three disciples taken with Jesus when the daughter of Yayiros was raised; He was with Jesus at the Transfiguration and at the prayer in Gethsemane; He was one of the two disciples sent to prepare the Passover; The Lord authorised Peter to pay tax on His behalf; The Lord entrusted Peter with strengthening the brethren after His departure (St. Luke 22:32)","ref":"Class VII textbook, Lesson 15 – The Authority of St Peter"},{"q":"Write about Mor Simeon's life on the pillar and his last days.","a":"Simeon built a pillar (Desthuno) for himself, 3 metres at first and later 20 metres, and spent 40 years on it with prayer and ascetic performances; During lent he took no food for 40 days, and angels, Moses and Elijah appeared to him; Many sick people were cured, and famine, drought and destruction were removed by his prayers; He prayed that he might finish his life on the pillar he had entered in obedience to God's command; Sores erupted on his leg and he suffered for about nine months, but even when Emperor Theodosius sent three metropolitans asking him to come down, he did not yield, and was cured; He died in AD 459, was buried in the big church in Antioch, and his feast is celebrated on July 17","ref":"Class VII textbook, Church History, Lesson 24 – Mor Simeon Stylites (Desthuno)"}],"essay":[{"q":"Esra and Nehemiah – leadership with sensible dependence on God","a":"After the captivity, Cyrus, the Persian king, granted freedom to the Jews, and the first batch returned in B.C. 534 under Serubabel, and the temple was completed in the time of king Darius; Esra, a scholar in the laws of Moses and a favourite of king Artaxerxes, came to Jerusalem in B.C. 457 with the king's help for the temple; Esra submitted more to God's authority than to the king: he and his allies prayed with fasting for three days; He condemned the evil doings of the Jews, made them promise to live by God's laws and guided them for 13 years; Nehemiah, the king's assistant, reached Jerusalem in B.C. 455 and led the people to rebuild the wall of Jerusalem; When Sanballah, Tobiah and Gosem tried to stop the work, Nehemiah told the people, \"Remember the Lord,\" and they worked with one hand and held arms in the other; A royal order came in Nehemiah's favour, the wall was built, and Esra read the law again and the people swore to obey it; Lesson: purification of heart is necessary for God to live in us, and each one should work according to his ability for the growth of the church","ref":"Class VII textbook, Lesson 5 – Esra-Nehemiah: Leadership with Sensible Dependence on God"},{"q":"The rich youth and everlasting life","a":"A rich young man asked Jesus, \"Teacher, what good deed must I do to have eternal life?\" and Jesus told him to observe the commandments; The young man said he had kept them all and asked what he still lacked; Jesus said, \"If you wish to be perfect, go, sell your possessions, and give the money to the poor... then come, follow me\"; He went back sorrowful, for he had great possessions and considered his wealth more precious than everlasting life; Jesus said it is easier for a camel to go through the eye of a needle than for a rich person to enter the kingdom of God, but \"for God all things are possible\"; 'Camel' in Syriac (gemlo) also means a thick rope, and the 'eye of needle' was also a small door in Jerusalem through which a camel passed only after its load was removed; The Lord does not find fault with being rich, but we should not become slaves to wealth; Nothing – wealth, knowledge, beauty or capabilities – should stand in the way of our entrance to the kingdom of God","ref":"Class VII textbook, Lesson 13 – Rich Youth and Everlasting Life"}]}}]},{"c":"VIII","sections":[{"n":"Old Testament","units":[{"t":"Chapter 5 – Daniel (The prophet of Exile)","q":[["In which century did Prophet Daniel live, during the Babylonian exile?",["5th Century B.C.","6th Century B.C.","7th Century B.C.","8th Century B.C."],1,"QP 2017, QP 2018"],["During which period did Daniel live?",["The Exodus from Egypt","The time of the Judges","The reign of King David","The Babylonian exile"],3,""],["Name the king who attacked Jerusalem in 605 BC and carried away many captives (including Daniel) to Babylon.",["Jeroboam","Antiochus Epiphanes","Nebuchadnezzar","Herod"],2,"QP 2018, QP 2021"],["In which year did Nebuchadnezzar first attack Jerusalem and take Daniel and his friends to Babylon?",["167 BC","587 BC","605 BC","700 BC"],2,""],["In which invasion of Jerusalem did Nebuchadnezzar carry away the prophet Ezekiel as a slave?",["The first invasion, in 605 B.C.","The second invasion, in 587 B.C.","He never carried away Ezekiel","The invasion of Antiochus Epiphanes, in 167 B.C."],1,"QP 2019"],["According to some, the book of Daniel was written during the religious oppression of which ruler?",["Jeroboam","Antiochus Epiphanes","Herod Antipas","Nebuchadnezzar"],1,""],["In the original Hebrew version, the book of Daniel has how many chapters?",["12","14","16","18"],0,"QP 2019"],["How many chapters does the book of Daniel have in the Greek version?",["10","12","14","16"],2,""],["What do chapters 1-6 of the book of Daniel mainly contain?",["The unshakable trust in God shown by Daniel and his friends","The visions of Daniel","The punishment of Nineveh","Songs of praise to the Lord"],0,"QP 2019"],["What are chapters 7-12 of the book of Daniel?",["Laws for the priests","The story of Daniel's childhood","Lamentations over Jerusalem","A narration of the visions of Daniel"],3,""],["Name the three friends of Daniel (original and new names).",["Peter, Jacob and John (Simon, James, Boanerges)","Annas, Caiaphas and Herod (Pilate, Barabas, Malcuse)","Hananiah, Mishael and Azariah (Shadrach, Meshach, Abednego)","Amos, Hosea and Jonah (Micah, Nahum, Habakkuk)"],2,"QP 2015"],["Which reference in Daniel 12:2-3 makes the book different from others?",["The birth place of the Messiah","Indications about resurrection","The fall of Nineveh","The Three-Day Lent"],1,""],["In Daniel's vision, the huge statue was made up of gold, silver, bronze, iron and what else?",["Clay","Wood","Stone","Glass"],0,""],["In Daniel's vision, what shattered the huge statue?",["A stone touched by none","A great flood","Fire from heaven","A lion"],0,""],["What does the 'stone touched by none' in Daniel's vision stand for?",["The Messiah","The kingdom of Babylon","The temple","Prophet Daniel"],0,""],["What does the huge statue in Daniel's vision stand for?",["Many colonialist forces","The temple of Jerusalem","The twelve tribes of Israel","The prop
